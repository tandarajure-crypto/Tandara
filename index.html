<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Tandara Family Tree</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e7c191;
    overflow: hidden;
}

/* Layout */
.container {
    display: flex;
    height: 100vh;
}

/* Left menu */
.menu {
    width: 260px;
    background: #5a3e1b;
    color: white;
    padding-top: 20px;
    box-sizing: border-box;
}

.menu-item {
    padding: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
}

.menu-item:hover {
    background: #7a5325;
}

.flag {
    width: 40px;
    margin-right: 10px;
}

.menu-text {
    font-size: 18px;
}

/* Right content */
.content {
    flex-grow: 1;
    position: relative;
    text-align: center;
}

/* Pages */
.page {
    display: none;
    width: 100%;
    height: 100%;
}

/* PDF viewer */
.pdf-viewer {
    width: 100%;
    height: calc(100% - 70px);
    border: none;
}

/* Family tree image */
#home img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Hotspots */
.hs {
    position: absolute;
    cursor: pointer;
    border: 3px solid red !important;
    background-color: rgba(255, 0, 0, 0.25) !important;
}

/* Jurina – SAVRŠENO, NE DIRAMO */
.hs-jurina {
    top: 27%;
    left: 6%;
    width: 18%;
    height: 9%;
}

/* Petrova – pomaknuta lijevo */
.hs-petrova {
    top: 23%;
    left: 48%;
    width: 18%;
    height: 9%;
}

/* Antina – SAVRŠENO, NE DIRAMO */
.hs-antina {
    top: 42%;
    left: 6%;
    width: 18%;
    height: 9%;
}

/* Matina – pomaknuta lijevo */
.hs-matina {
    top: 42%;
    left: 48%;
    width: 18%;
    height: 9%;
}
</style>

<script>
function showPage(pageId, el) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.getElementById(pageId).style.display = 'block';
}
</script>

</head>
<body>

<div class="container">

    <!-- LEFT MENU -->
    <div class="menu">

        <!-- HR PDF -->
        <div id="hr" class="page">
    <div onclick="showPage('home')" style="cursor:pointer; margin:15px;">
        <img src="home.png" style="width:40px;">
    </div>
    <iframe class="pdf-viewer" src="tandararod.pdf"></iframe>
</div>

        <!-- EN PDF -->
<div id="en" class="page">
    <div onclick="showPage('home')" style="cursor:pointer; margin:15px;">
        <img src="home.png" style="width:40px;">
    </div>
    <iframe class="pdf-viewer" src="genealogy.pdf"></iframe>
</div>

    <!-- RIGHT CONTENT -->
    <div class="content">

        <!-- HOME PAGE -->
        <div id="home" class="page" style="display:block;">
            <img src="family-tree.png">

            <!-- Hotspots -->
            <div class="hs hs-jurina" onclick="window.location.href='jurina.html'"></div>
            <div class="hs hs-petrova" onclick="window.location.href='petrova.html'"></div>
            <div class="hs hs-antina" onclick="window.location.href='antina.html'"></div>
            <div class="hs hs-matina" onclick="window.location.href='matina.html'"></div>
        </div>

        <!-- HR PDF PAGE -->
        <div id="hr" class="page">
            <div onclick="showPage('home')" style="cursor:pointer; margin:15px;">
                <img src="home.png" style="width:40px;">
            </div>
            <iframe class="pdf-viewer" src="tandararod.pdf"></iframe>
        </div>

        <!-- EN PDF PAGE -->
        <div id="en" class="page">
            <div onclick="showPage('home')" style="cursor:pointer; margin:15px;">
                <img src="home.png" style="width:40px;">
            </div>
            <iframe class="pdf-viewer" src="genealogy.pdf"></iframe>
        </div>

    </div>
</div>

</body>
</html>
