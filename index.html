<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obiteljsko stablo Tandara</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#e7c191;
}

.container{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:302px;
    background:#ddb274;
    border-right:4px solid #7a7a7a;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:10px;
}

.menu-item{
    text-align:center;
    cursor:pointer;
    padding:5px;
    font-size:20px;
}

.menu-item:hover{
    background:#cfa86a;
    border-radius:8px;
}

/* CONTENT */
.content{
    flex:1;
    padding:0;
    margin:0;
}

.full-img{
    width:100%;
    height:auto;
    display:block;
}

/* HOTSPOTOVI – nevidljivi, samo klikabilni */
.hs{
    position:absolute;
    cursor:pointer;
    background:rgba(0,0,0,0);
}

.hs-jurina{ top:26.5%; left:6%; width:18%; height:9%; }
.hs-petrova{ top:26.5%; left:32%; width:18%; height:9%; }
.hs-antina{ top:42.5%; left:6%; width:18%; height:9%; }
.hs-matina{ top:42.5%; left:32%; width:18%; height:9%; }

</style>

</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="menu-item" onclick="window.location.href='index.html'">
            <img src="home.png" alt="Početna" style="width:80px;">
        </div>

        <div class="menu-item" onclick="window.location.href='hr.html'">HR</div>
        <div class="menu-item" onclick="window.location.href='en.html'">EN</div>

        <div class="menu-item" onclick="window.location.href='jurinagrana.html'">Jurina grana</div>
        <div class="menu-item" onclick="window.location.href='petrovagrana.html'">Petrova grana</div>
        <div class="menu-item" onclick="window.location.href='antinagrana.html'">Antina grana</div>
        <div class="menu-item" onclick="window.location.href='matinagrana.html'">Matina grana</div>
        <div class="menu-item" onclick="window.location.href='povijest.html'">Povijest roda</div>

        <div class="visitor-box">
            <h4>Posjetitelji</h4>
            <a href="https://info.flagcounter.com/OyvA">
                <img src="https://s01.flagcounter.com/countxl/OyvA/bg_FFFFFF/txt_000000/border_CCCCCC/columns_4/maxflags_50/viewers_0/labels_1/pageviews_0/flags_1/percent_0/"
                     alt="Flag Counter">
            </a>
        </div>

    </div>

    <!-- CONTENT -->
    <div class="content" style="position:relative;">
        <img src="family-tree.png?v=1" class="full-img">

        <!-- NEVIDLJIVI KLIKABILNI OKVIRI -->
        <div class="hs hs-jurina" onclick="window.location.href='jurinagrana.html'"></div>
        <div class="hs hs-petrova" onclick="window.location.href='petrovagrana.html'"></div>
        <div class="hs hs-antina" onclick="window.location.href='antinagrana.html'"></div>
        <div class="hs hs-matina" onclick="window.location.href='matinagrana.html'"></div>

    </div>

</div>

</body>
</html>
