<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obiteljsko stablo Tandara</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#e7c191;
}

.container{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:300px;
    background:#ddb274;
    border-right:4px solid #7a7a7a;
    padding:20px;
    box-sizing:border-box;
}

.sidebar h3{
    text-align:center;
    margin-bottom:10px;
    font-size:28px;
    font-weight:bold;
}

.menu-item{
    text-align:center;
    margin-bottom:25px;
    cursor:pointer;
    padding:10px;
    border-radius:8px;
}

.menu-item:hover{
    background:#cfa86a;
}

.menu-item.active{
    background:#b98f4f;
    color:white;
}

.menu-text{
    margin-top:10px;
    font-size:22px;
    font-weight:bold;
}

.separator{
    height:8px;
    background:#bfbfbf;
    border-radius:4px;
    margin:30px 0;
}

.flag{
    width:60px;
}

/* CONTENT */
.content{
    flex:1;
    padding:20px;
    display:block;
    max-width: calc(100% - 300px);
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.pdf-viewer{
    width:100%;
    height:90vh;
    border:none;
}

/* HOTSPOTOVI */
.hs {
    position:absolute;
    cursor:pointer;
    border: 3px solid red !important;
    background-color: rgba(255, 0, 0, 0.25) !important;
}

/* POZICIJE – PC */
.hs-jurina { top: 26.5%; left: 6%; width: 18%; height: 9%; }
.hs-petrova { top: 26.5%; left: 32%; width: 18%; height: 9%; }
.hs-antina { top: 42.5%; left: 6%; width: 18%; height: 9%; }
.hs-matina { top: 42.5%; left: 32%; width: 18%; height: 9%; }

/* MOBITEL – sidebar gore */
@media(max-width:900px){

    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:4px solid #7a7a7a;
    }

    .content{
        max-width:100%;
        width:100%;
        padding:10px;
    }
}

/* MOBITEL – hotspotovi manji i zbijeni */
@media(max-width:600px){

    #home img{
        width:100%;
        max-width:100%;
    }

    .hs{
        border-width:2px !important;
        background-color: rgba(255,0,0,0.18) !important;
    }

    .hs-jurina{ top: 23.5%; left: 5%; width: 40%; height: 10%; }
    .hs-petrova{ top: 23.5%; left: 55%; width: 40%; height: 10%; }
    .hs-antina{ top: 41.5%; left: 5%; width: 40%; height: 10%; }
    .hs-matina{ top: 41.5%; left: 55%; width: 40%; height: 10%; }
}
</style>

<script>
function showPage(id, el){
    document.querySelectorAll('.page').forEach(page=>{
        page.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.menu-item').forEach(item=>{
        item.classList.remove('active');
    });
    if(el){
        el.classList.add('active');
    }
}

window.onload = function(){
    showPage('home');
}
</script>
</head>

<body>

<div class="container">

    <div class="sidebar">
        <h3>Sadržaj</h3>
        <div class="separator"></div>

        <div class="menu-item" onclick="showPage('home', this)">
            <img src="home.png" alt="Home" style="width:80px;">
        </div>

        <div class="menu-item" onclick="showPage('home', this)">
            <div class="menu-text">početna</div>
        </div>

        <div class="menu-item" onclick="window.location.href='tandararod.pdf'">
            <img src="flag-hr.png" class="flag" alt="Hrvatski">
            <div class="menu-text">Rodoslovlje prezimena Tandara</div>
        </div>

        <div class="separator"></div>

        <div class="menu-item" onclick="window.location.href='genealogy.pdf'">
            <img src="flag-uk.png" class="flag" alt="English">
            <div class="menu-text">Genealogy of the Tandara surname</div>
        </div>

        <div class="separator"></div>
    </div>

    <div class="content">

        <!-- POČETNA -->
        <div id="home" class="page" style="position:relative;">
            <img src="family-tree.png?v=1" style="width:100%; display:block;">

            <div class="hs hs-jurina" onclick="window.location.href='jurinagrana.html'"></div>
            <div class="hs hs-petrova" onclick="window.location.href='petrovagrana.html'"></div>
            <div class="hs hs-antina" onclick="window.location.href='antinagrana.html'"></div>
            <div class="hs hs-matina" onclick="window.location.href='matinagrana.html'"></div>
        </div>

        <!-- HR PDF -->
        <div id="hr" class="page">
            <iframe class="pdf-viewer" src="tandararod.pdf"></iframe>
        </div>

        <!-- EN PDF -->
        <div id="en" class="page">
            <iframe class="pdf-viewer" src="genealogy.pdf"></iframe>
        </div>

    </div>

</div>

</body>
</html>
