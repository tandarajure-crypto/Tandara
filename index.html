<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obiteljsko stablo Tandara</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#e7c191;
}

.container{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:300px;
    background:#ddb274;
    border-right:4px solid #7a7a7a;
    padding:20px;
    box-sizing:border-box;
}

.sidebar h3{
    text-align:center;
    margin-bottom:30px;
}

.menu-item{
    text-align:center;
    margin-bottom:25px;
    cursor:pointer;
    padding:10px;
    border-radius:8px;
}

.menu-item:hover{
    background:#cfa86a;
}

.menu-item.active{
    background:#b98f4f;
    color:white;
}

.menu-text{
    margin-top:10px;
    font-size:22px;
    font-weight:bold;
}

.separator{
    height:8px;
    background:#bfbfbf;
    border-radius:4px;
    margin:30px 0;
}

.flag{
    width:60px;
}

.content{
    flex:1;
    padding:20px;
    display:block;
    max-width: calc(100% - 300px);
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.pdf-viewer{
    width:100%;
    height:90vh;
    border:none;
}

@media(max-width:900px){
    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:4px solid #7a7a7a;
    }

    .content {
        max-width: 100%;
        width: 100%;
        padding: 10px;
    }

    .pdf-viewer{
        height:80vh;
    }
}
</style>

<script>
function showPage(id, el){
    document.querySelectorAll('.page').forEach(page=>{
        page.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.menu-item').forEach(item=>{
        item.classList.remove('active');
    });
    if(el){
        el.classList.add('active');
    }
}

window.onload = function(){
    showPage('home');
}
</script>
</head>

<body>

<div class="container">

    <div class="sidebar">
        <h3>Sadržaj</h3>

        <div class="menu-item" onclick="showPage('home', this)">
            <img src="home.png" alt="Home">
            <div class="menu-text">početna</div>
        </div>

        <div class="menu-item" onclick="showPage('hr', this)">
            <img src="flag-hr.png" class="flag" alt="Hrvatski">
            <div class="menu-text">Rodoslovlje prezimena Tandara</div>
        </div>

        <div class="separator"></div>

        <div class="menu-item" onclick="showPage('en', this)">
            <img src="flag-uk.png" class="flag" alt="English">
            <div class="menu-text">Genealogy of the Tandara surname</div>
        </div>

        <div class="separator"></div>

        <div class="menu-item" onclick="showPage('mr1', this)">
            <div class="menu-text">MR1</div>
        </div>

        <div class="menu-item" onclick="showPage('mr2', this)">
            <div class="menu-text">MR2</div>
        </div>

        <div class="menu-item" onclick="showPage('mr3', this)">
            <div class="menu-text">MR3</div>
        </div>

        <div class="menu-item" onclick="showPage('mr4', this)">
            <div class="menu-text">MR4</div>
        </div>

    </div>

    <div class="content">

        <div id="home" class="page">
            <h2>Dobrodošli</h2>
            <p>Odaberite sadržaj iz izbornika.</p>
        </div>

        <div id="hr" class="page">
            <iframe class="pdf-viewer" src="MR1.pdf"></iframe>
        </div>

        <div id="en" class="page">
            <iframe class="pdf-viewer" src="MR2.pdf"></iframe>
        </div>

        <div id="mr1" class="page">
            <iframe class="pdf-viewer" src="MR1.pdf"></iframe>
        </div>

        <div id="mr2" class="page">
            <iframe class="pdf-viewer" src="MR2.pdf"></iframe>
        </div>

        <div id="mr3" class="page">
            <iframe class="pdf-viewer" src="MR3.pdf"></iframe>
        </div>

        <div id="mr4" class="page">
            <iframe class="pdf-viewer" src="MR4.pdf"></iframe>
        </div>

    </div>

</div>

</body>
</html>
