<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obiteljsko stablo Tandara</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#e7c191;
}

.container{
    display:flex;
    min-height:100vh;
}

/* LIJEVI IZBORNIK */

.sidebar{
    width:300px;
    background:#ddb274;
    border-right:4px solid #7a7a7a;
    padding:20px;
    box-sizing:border-box;
}

.sidebar h3{
    text-align:center;
    margin-bottom:30px;
}

.menu-item{
    text-align:center;
    margin-bottom:25px;
    cursor:pointer;
    padding:10px;
    border-radius:8px;
}

.menu-item:hover{
    background:#cfa86a;
}

.menu-item.active{
    background:#b98f4f;
    color:white;
}

.menu-text{
    margin-top:10px;
    font-size:22px;
    font-weight:bold;
}

.separator{
    height:8px;
    background:#bfbfbf;
    border-radius:4px;
    margin:30px 0;
}

.flag{
    width:60px;
}

.content{
    flex:1;
    padding:20px;
    display:block;
    max-width: calc(100% - 300px);
}

/* JEDNA SLIKA */

.tree-wrapper{
    position:relative;
    max-width:100%;
    margin:0 auto;
}

.tree-wrapper img{
    width:100%;
    height:auto;
    display:block;
}

/* HOTSPOTI */

.hotspot{
    position:absolute;
    cursor:pointer;
    z-index:10;
    border:2px solid red; /* makni kad završimo */
    box-sizing:border-box;
}

/* PRIVREMENE POZICIJE – SAMO DA RADI */
#hs-jurina {
    top: 28%;
    left: 7%;
    width: 32%;
    height: 12%;
}

#hs-petrova {
    top: 28%;
    left: 55%;
    width: 32%;
    height: 12%;
}

#hs-antina {
    top: 55%;
    left: 7%;
    width: 32%;
    height: 12%;
}

#hs-matina {
    top: 55%;
    left: 55%;
    width: 32%;
    height: 12%;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

@media(max-width:900px){
    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:4px solid #7a7a7a;
    }

    .content {
        max-width: 100%;
        width: 100%;
        padding: 10px;
    }
}
</style>

<script>
function showPage(id, el){
    document.querySelectorAll('.page').forEach(page=>{
        page.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.menu-item').forEach(item=>{
        item.classList.remove('active');
    });
    if(el){
        el.classList.add('active');
    }
}

window.onload = function(){
    showPage('home');
}
</script>
</head>

<body>

<div class="container">

    <div class="sidebar">
        <h3>Sadržaj</h3>

        <div class="menu-item" onclick="showPage('home', this)">
            <img src="home.png" alt="Home">
            <div class="menu-text">početna</div>
        </div>

        <div class="menu-item" onclick="showPage('hr', this)">
            <img src="flag-hr.png" class="flag" alt="Hrvatski">
            <div class="menu-text">Rodoslovlje prezimena Tandara</div>
        </div>

        <div class="separator"></div>

        <div class="menu-item" onclick="showPage('en', this)">
            <img src="flag-uk.png" class="flag" alt="English">
            <div class="menu-text">Genealogy of the Tandara surname</div>
        </div>

        <div class="separator"></div>
    </div>

    <div class="content">

        <!-- POČETNA – JEDNA SLIKA -->

        <div id="home" class="page">
            <div class="tree-wrapper">
                <img src="family-tree.png?v=1" alt="Family Tree Tandara">

                <div id="hs-jurina"  class="hotspot" onclick="showPage('jurina')"></div>
                <div id="hs-petrova" class="hotspot" onclick="showPage('petrova')"></div>
                <div id="hs-antina"  class="hotspot" onclick="showPage('antina')"></div>
                <div id="hs-matina"  class="hotspot" onclick="showPage('matina')"></div>
            </div>
        </div>

        <!-- OSTALO -->

        <div id="hr" class="page">
            <h2>Hrvatski sadržaj</h2>
        </div>

        <div id="en" class="page">
            <h2>English content</h2>
        </div>

        <div id="jurina" class="page">
            <h2>Jurina grana</h2>
        </div>

        <div id="petrova" class="page">
            <h2>Petrova grana</h2>
        </div>

        <div id="antina" class="page">
            <h2>Antina grana</h2>
        </div>

        <div id="matina" class="page">
            <h2>Matina grana</h2>
        </div>

    </div>

</div>

</body>
</html>
