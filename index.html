<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tandara Genealogy</title>

<style>
    body {
        margin: 0;
        font-family: Calibri, Arial, sans-serif;
        display: flex;
    }

    /* Lijevi stupac */
    #left {
        width: 280px;
        background: #f2f2f2;
        padding: 20px;
        overflow-y: auto;
        border-right: 1px solid #ccc;
        box-sizing: border-box;
        text-align: center;
    }

    /* Ikona kućice */
    #homeicon {
        width: 60px;
        cursor: pointer;
        margin-bottom: 20px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }

    /* Desni stupac */
    #right {
        flex: 1;
        background-image: url("Family tree Tandara.png");
        background-size: contain;
        background-position: top center;
        background-repeat: no-repeat;
        background-color: #fff;
        padding: 20px 40px 40px 40px;
        overflow-y: auto;
        box-sizing: border-box;
        position: relative;
        min-height: 100vh;
    }

    /* Tvoja slika – pomiče se sa sadržajem */
    .portrait {
        width: 180px;
        float: right;
        margin-left: 20px;
        margin-bottom: 20px;
        border-radius: 8px;
        box-shadow: 0 0 8px rgba(0,0,0,0.4);
    }

    /* Poluprozirna kutija */
    .box {
        background: rgba(255, 248, 230, 0.92);
        padding: 40px;
        width: 85%;
        margin-top: 40px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .flag {
        width: 40px;
        margin-bottom: 10px;
        display: block;
    }

    .menu-item {
        cursor: pointer;
        padding: 6px 0;
        font-size: 17px;
        color: #333;
        text-align: left;
    }

    .menu-item:hover {
        color: #0066cc;
    }

    .section {
        display: none;
        position: relative;
    }

    h1, h2, h3, p {
        margin-bottom: 18px;
    }
</style>

<script>
function showSection(id) {
    document.querySelectorAll(".section").forEach(sec => sec.style.display = "none");
    const el = document.getElementById(id);
    if (el) el.style.display = "block";
}
</script>

</head>
<body>

<!-- LIJEVI STUPAC -->
<div id="left">

    <!-- HOME IKONA -->
    <img src="home.png" id="homeicon" onclick="showSection('home')" alt="Home">

    <img src="flag-hr.png" class="flag" alt="Hrvatska zastava">
    <div class="menu-item" onclick="showSection('uvod')">
        Rodoslovlje prezimena Tandara
    </div>

    <hr style="margin:20px 0;">

    <img src="flag-uk.png" class="flag" alt="UK zastava">
    <div class="menu-item" onclick="showSection('intro')">
        Tandara Family Genealogy
    </div>

</div>

<!-- DESNI STUPAC -->
<div id="right">

    <!-- HOME SEKCIJA — SAMO POZADINSKA SLIKA -->
    <div id="home" class="section" style="display:block;"></div>

    <!-- HRVATSKI UVOD -->
    <div id="uvod" class="section">

        <div class="box">

            <!-- TVOJA SLIKA KOJA SE POMIČE SA SADRŽAJEM -->
            <img src="jure.png" class="portrait" alt="Jure Tandara">

            <h1>RODOSLOVLJE PREZIMENA TANDARA</h1>
            <h2>Uvod</h2>

            <!-- OVDJE UBACITI 1. HR DIO -->
            <p><strong>UBACITI 1. HR DIO</strong></p>

            <!-- OVDJE UBACITI 2. HR DIO -->
            <p><strong>UBACITI 2. HR DIO</strong></p>

            <!-- OVDJE UBACITI 3. HR DIO -->
            <p><strong>UBACITI 3. HR DIO</strong></p>

            <!-- OVDJE UBACITI 4. HR DIO -->
            <p><strong>UBACITI 4. HR DIO</strong></p>

        </div>
    </div>

    <!-- ENGLESKI UVOD -->
    <div id="intro" class="section">

        <div class="box">

            <!-- TVOJA SLIKA I OVDJE (ako želiš) -->
            <img src="jure.png" class="portrait" alt="Jure Tandara">

            <h1>TANDARA FAMILY GENEALOGY</h1>
            <h2>Introduction</h2>

            <!-- OVDJE UBACITI 1. ENG DIO -->
            <p><strong>UBACITI 1. ENG DIO</strong></p>

            <!-- OVDJE UBACITI 2. ENG DIO -->
            <p><strong>UBACITI 2. ENG DIO</strong></p>

            <!-- OVDJE UBACITI 3. ENG DIO -->
            <p><strong>UBACITI 3. ENG DIO</strong></p>

            <!-- OVDJE UBACITI 4. ENG DIO -->
            <p><strong>UBACITI 4. ENG DIO</strong></p>

        </div>
    </div>

</div>

</body>
</html>
