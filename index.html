<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obiteljsko stablo Tandara</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#e7c191;
}

.container{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:300px;
    background:#ddb274;
    border-right:4px solid #7a7a7a;
    padding:20px;
    box-sizing:border-box;
}

.sidebar h3{
    text-align:center;
    margin-bottom:10px;
    font-size:28px;
    font-weight:bold;
}

.menu-item{
    text-align:center;
    margin-bottom:25px;
    cursor:pointer;
    padding:10px;
    border-radius:8px;
}

.menu-item:hover{
    background:#cfa86a;
}

.menu-item.active{
    background:#b98f4f;
    color:white;
}

.menu-text{
    margin-top:10px;
    font-size:22px;
    font-weight:bold;
}

.separator{
    height:8px;
    background:#bfbfbf;
    border-radius:4px;
    margin:30px 0;
}

.flag{
    width:60px;
}

/* CONTENT */
.content{
    flex:1;
    padding:20px;
    max-width: calc(100% - 300px);
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* PDF toolbar */
.pdf-toolbar{
    text-align:left;
    margin-bottom:2px;
    line-height:0;
}

.pdf-home-btn{
    width:55px;
    cursor:pointer;
    transition:transform .2s;
}

.pdf-home-btn:hover{
    transform:scale(1.08);
}

/* PDF */
.pdf-viewer{
    width:100%;
    height:90vh;
    border:none;
}

/* HOTSPOTI */
.hs{
    position:absolute;
    cursor:pointer;
    border:3px solid red !important;
    background-color:rgba(255,0,0,0.25) !important;
}

.hs-jurina{ top:26.5%; left:6%; width:18%; height:9%; }
.hs-petrova{ top:26.5%; left:32%; width:18%; height:9%; }
.hs-antina{ top:42.5%; left:6%; width:18%; height:9%; }
.hs-matina{ top:42.5%; left:32%; width:18%; height:9%; }

/* MOBILE */
@media(max-width:900px){
    .container{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:4px solid #7a7a7a; }
    .content{ max-width:100%; padding:10px; }
}

@media(max-width:600px){
    #home{ height:100vh; position:relative; overflow:hidden; }

    #home img{
        height:100vh;
        width:auto;
        transform:rotate(-90deg);
        position:absolute;
        left:50%;
        top:50%;
        translate:-50% -50%;
    }

    .hs{
        transform:rotate(-90deg);
        border-width:2px !important;
        background-color:rgba(255,0,0,0.18) !important;
    }
}

/* FULLSCREEN PDF */
.pdf-fullscreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background:#000;
    z-index:99999;
    display:none;
}

.pdf-fullscreen.active{
    display:block;
}

.pdf-fullscreen iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}

.pdf-close-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:50px;
    cursor:pointer;
    z-index:100000;
}
</style>

<script>
function showPage(id, el){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active'));
    if(el) el.classList.add('active');
}

function openPdf(file){
    document.getElementById('pdfFrame').src = file;
    document.getElementById('pdfOverlay').classList.add('active');
}

function closePdf(){
    document.getElementById('pdfOverlay').classList.remove('active');
    document.getElementById('pdfFrame').src = '';
}

window.onload = function(){
    showPage('home');
}
</script>
</head>

<body>

<div class="container">

    <div class="sidebar">
        <h3>Sadržaj</h3>
        <div class="separator"></div>

        <div class="menu-item" onclick="showPage('home', this)">
            <img src="home.png" style="width:80px;">
        </div>

        <div class="separator"></div>

        <div class="menu-item" onclick="showPage('hr', this)">
            <img src="flag-hr.png" class="flag">
            <div class="menu-text">Rodoslovlje Tandara</div>
        </div>

        <div class="separator"></div>

        <div class="menu-item" onclick="showPage('en', this)">
            <img src="flag-uk.png" class="flag">
            <div class="menu-text">Genealogy Tandara</div>
        </div>
    </div>

    <div class="content">

        <!-- HOME -->
        <div id="home" class="page" style="position:relative;">
            <img src="family-tree.png" style="width:100%;">
        </div>

        <!-- HR -->
        <div id="hr" class="page">
            <div class="pdf-toolbar">
                <img src="home.png" class="pdf-home-btn" onclick="showPage('home')">
            </div>
            <iframe class="pdf-viewer" src="tandararod.pdf"></iframe>
        </div>

        <!-- EN -->
        <div id="en" class="page">
            <div class="pdf-toolbar">
                <img src="home.png" class="pdf-home-btn" onclick="showPage('home')">
            </div>
            <iframe class="pdf-viewer" src="genealogy.pdf"></iframe>
        </div>

    </div>
</div>

<!-- FULLSCREEN PDF OVERLAY -->
<div id="pdfOverlay" class="pdf-fullscreen">
    <img src="home.png" class="pdf-close-btn" onclick="closePdf(); showPage('home');">
    <iframe id="pdfFrame"></iframe>
</div>

</body>
</html>
