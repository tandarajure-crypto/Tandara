<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obiteljsko stablo Tandara</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#e7c191;
}

.container{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:300px;
    background:#ddb274;
    border-right:4px solid #7a7a7a;
    padding:20px;
    box-sizing:border-box;
}

.sidebar h3{
    text-align:center;
    margin-bottom:10px;
    font-size:28px;
    font-weight:bold;
}

.menu-item{
    text-align:center;
    margin-bottom:5px;
    cursor:pointer;
    padding:5px;
    border-radius:8px;
}

.menu-item:hover{
    background:#cfa86a;
}

.menu-item.active{
    background:#b98f4f;
    color:white;
}

.menu-text{
    margin-top:10px;
    font-size:22px;
    font-weight:bold;
}

.separator{
    height:8px;
    background:#bfbfbf;
    border-radius:4px;
    margin:10px 0;
}

.flag{
    width:60px;
}

/* CONTENT */
.content{
    flex:1;
    padding:20px;
    display:block;
    max-width: calc(100% - 300px);
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.pdf-toolbar{
    text-align:left;
    margin-bottom:2px;
    padding:0;
    line-height:0;
}

.pdf-home-btn{
    width:48px;
    cursor:pointer;
    transition:transform .2s;
    filter:drop-shadow(1px 1px 2px rgba(0,0,0,.25));
}

.pdf-home-btn:hover{
    transform:scale(1.08);
}

.pdf-viewer{
    width:100%;
    height:90vh;
    border:none;
}

/* HOTSPOTOVI */
.hs{
    position:absolute;
    cursor:pointer;
    border:3px solid red !important;
    background-color:rgba(255,0,0,0.25) !important;
}

/* POZICIJE – PC */
.hs-jurina{ top:26.5%; left:6%; width:18%; height:9%; }
.hs-petrova{ top:26.5%; left:32%; width:18%; height:9%; }
.hs-antina{ top:42.5%; left:6%; width:18%; height:9%; }
.hs-matina{ top:42.5%; left:32%; width:18%; height:9%; }

/* MOBITEL – sidebar gore */
@media(max-width:900px){
    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:4px solid #7a7a7a;
    }

    .content{
        max-width:100%;
        width:100%;
        padding:10px;
    }
}

/* MOBITEL – HOTSPOTI + ROTACIJA */
@media(max-width:600px){

    #home{
        overflow:hidden;
        height:100vh;
        position:relative;
    }

    #home img{
        width:auto;
        height:100vh;
        transform:rotate(-90deg);
        transform-origin:center;
        position:absolute;
        left:50%;
        top:50%;
        translate:-50% -50%;
    }

    .hs{
        border-width:2px !important;
        background-color:rgba(255,0,0,0.18) !important;
        transform:rotate(-90deg);
        transform-origin:center;
    }

    .hs-jurina{ top:23.5%; left:5%; width:40%; height:10%; }
    .hs-petrova{ top:23.5%; left:55%; width:40%; height:10%; }
    .hs-antina{ top:41.5%; left:5%; width:40%; height:10%; }
    .hs-matina{ top:41.5%; left:55%; width:40%; height:10%; }

    .pdf-home-btn{
        width:55px;
    }
}
.pdf-fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: #000;
    z-index: 99999;
    display: none;
    flex-direction: column;
}

.pdf-fullscreen.active {
    display: flex;
}

.pdf-fullscreen iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: white;
}

.pdf-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 45px;
    cursor: pointer;
    z-index: 100000;
}    
</style>

<script>
function showPage(id, el){

    document.querySelectorAll('.page').forEach(page=>{
        page.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.menu-item').forEach(item=>{
        item.classList.remove('active');
    });

    if(el){
        el.classList.add('active');
    }
}

window.onload=function(){
    showPage('home');
}
</script>
<!-- Google tag (gtag.js) -->

<script async src="https://www.googletagmanager.com/gtag/js?id=G-S33NBEJQFD"></script>

<script>

window.dataLayer = window.dataLayer || [];

function gtag(){dataLayer.push(arguments);}

gtag('js', new Date());

gtag('config', 'G-S33NBEJQFD');

</script>
    
</head>

<body>

<div class="container">

    <div class="sidebar">

        <h3>Sadržaj</h3>

        <div class="separator"></div>

        <!-- HOME -->
        <div class="menu-item" onclick="showPage('home', this)">
            <img src="home.png" alt="Početna" style="width:80px;">
        </div>

        <div class="separator"></div>

        <!-- HR PDF -->
        <div class="menu-item" onclick="showPage('hr', this)">
            <img src="flag-hr.png" class="flag" alt="Hrvatski">
            <div class="menu-text">Rodoslovlje prezimena Tandara</div>
        </div>

        <div class="separator"></div>

        <!-- EN PDF -->
        <div class="menu-item" onclick="showPage('en', this)">
            <img src="flag-uk.png" class="flag" alt="English">
            <div class="menu-text">Genealogy of the Tandara surname</div>
        </div>

        <div class="separator"></div>

        <!-- REZERVIRANO -->
        <div class="menu-item">
            <div class="menu-text">[naslov 1]</div>
        </div>

        <div class="separator"></div>

        <div class="menu-item">
            <div class="menu-text">[naslov 2]</div> 
        </div>
        <div class="separator"></div>

        <div class="menu-item">
        </div>
        
<div style="text-align:center; padding:25px 15px; background:#f3e2c3; margin:0 0 0 -30px; width:calc(100% + 30px); box-sizing:border-box;">
    
        <div style="font-size:16px; font-weight:bold; margin-bottom:8px;">
        Posjetitelji
    </div>

  <a href="https://info.flagcounter.com/OyvA">
<img src="https://s01.flagcounter.com/countxl/OyvA/bg_FFFFFF/txt_000000/border_CCCCCC/columns_4/maxflags_50/viewers_0/labels_1/pageviews_1/flags_0/percent_0/"
     alt="Flag Counter"
     border="0"
     style="width:100%; max-width:420px; height:auto; display:block; margin:0 auto;">
</a> 

</div>
        <div class="separator"></div>

    </div>

    <div class="content">

        <!-- POČETNA -->
        <div id="home" class="page" style="position:relative;">

            <img src="family-tree.png?v=1" style="width:100%; display:block;">

            <div class="hs hs-jurina" onclick="window.location.href='jurinagrana.html'"></div>
            <div class="hs hs-petrova" onclick="window.location.href='petrovagrana.html'"></div>
            <div class="hs hs-antina" onclick="window.location.href='antinagrana.html'"></div>
            <div class="hs hs-matina" onclick="window.location.href='matinagrana.html'"></div>

        </div>

        <!-- HR PDF -->
        <div id="hr" class="page">

            <div class="pdf-toolbar">
                <img src="home.png"
                     class="pdf-home-btn"
                     alt="Početna"
                     title="Povratak na početnu stranicu"
                     onclick="showPage('home');">
            </div>

<iframe class="pdf-viewer" src="tandararod.pdf" onclick="openPdf('tandararod.pdf')"></iframe>
        </div>

        <!-- EN PDF -->
        <div id="en" class="page">

            <div class="pdf-toolbar">
                <img src="home.png"
                     class="pdf-home-btn"
                     alt="Home"
                     title="Return to home page"
                     onclick="showPage('home');">
            </div>

<iframe class="pdf-viewer" src="genealogy.pdf" onclick="openPdf('genealogy.pdf')"></iframe>
        </div>

    </div>

</div>
<!-- FULLSCREEN PDF VIEWER -->
<div id="pdfOverlay" class="pdf-fullscreen">

    <img src="home.png"
         class="pdf-home-btn"
         style="position:absolute; top:10px; left:10px;"
         onclick="closePdf()">

    <img src="close.png"
         class="pdf-close"
         onclick="closePdf()">

    <iframe id="pdfFrame" src=""></iframe>
</div>
    
</body>
</html>
