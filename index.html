<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obiteljsko stablo Tandara</title>

<style>
<script>
function showPage(id, el){

    document.querySelectorAll('.page').forEach(page=>{
        page.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.menu-item').forEach(item=>{
        item.classList.remove('active');
    });

    if(el){
        el.classList.add('active');
    }
}

window.onload = function(){
    showPage('home');
}
</script>




</head>

<body>

<div class="container">

    <!-- LIJEVI STUPAC -->

<div class="sidebar">

    <h3>Sadržaj</h3>

    <div class="menu-item" onclick="showPage('home', this)">
        <img src="home.png" alt="Home">
        <div class="menu-text">početna</div>
    </div>

    <div class="separator"></div>

    <div class="menu-item" onclick="showPage('hr', this)">
        <img src="flag-hr.png" class="flag" alt="Hrvatski">
        <div class="menu-text">Rodoslovlje prezimena Tandara</div>
    </div>

    <div class="separator"></div>

    <div class="menu-item" onclick="showPage('en', this)">
        <img src="flag-uk.png" class="flag" alt="English">
        <div class="menu-text">Genealogy of the Tandara surname</div>
    </div>

    <div class="separator"></div>

</div>


    <!-- DESNI STUPAC -->

    <div class="content">

        <!-- POČETNA -->

        <div id="home" class="page">

            <img src="Family tree Tandara.png"
                 alt="Family Tree Tandara">

        </div>

        <!-- HRVATSKI -->

        <div id="hr" class="page">

            <div class="text-content">

                <h1>Rodoslovlje prezimena Tandara</h1>

                <p>
                Ovdje dolazi hrvatski sadržaj.
                </p>

                <ul>
                    <li>Jurina grana</li>
                    <li>Petrova grana</li>
                    <li>Antina grana</li>
                    <li>Matina grana</li>
                </ul>

            </div>

        </div>

        <!-- ENGLESKI -->

        <div id="en" class="page">

            <div class="text-content">

                <h1>Genealogy of the Tandara surname</h1>

                <p>
                English version of the genealogy.
                </p>

                <ul>
                    <li>Jurina branch</li>
                    <li>Petrova branch</li>
                    <li>Antina branch</li>
                    <li>Matina branch</li>
                </ul>

            </div>

        </div>

    </div>

</div>

</body>
</html>
