<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filipova loza — interaktivni rodoslovni dijagram</title>
<meta name="description" content="Interaktivni klikabilni rodoslovni dijagram Filipove, livanjske grane roda Tandara.">
<style>
:root{
  --bg:#f3efe6;--paper:#fffdf8;--ink:#2b2925;--muted:#6f685f;--line:#9f8f79;
  --accent:#7b2f2f;--accent2:#b7894c;--shadow:0 10px 28px rgba(52,38,24,.14);
  --node-w:230px;--gap-x:58px;--gap-y:18px;--scale:1;
}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:linear-gradient(135deg,#eee6d7,#f8f5ee 55%,#ece2d2);color:var(--ink)}
header{position:sticky;top:0;z-index:30;background:rgba(255,253,248,.94);backdrop-filter:blur(8px);border-bottom:1px solid #d8ccba;padding:14px 18px;box-shadow:0 3px 14px rgba(52,38,24,.08)}
.header-row{max-width:1500px;margin:auto;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand h1{font-size:clamp(1.1rem,2.2vw,1.75rem);margin:0;color:#5b2323}.brand p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit}
.tool{border:1px solid #cbbca8;background:#fffaf1;color:#3b342d;border-radius:9px;padding:8px 11px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.tool:hover{background:#f3e7d6}
main{max-width:1800px;margin:auto;padding:18px}
.intro{background:rgba(255,253,248,.88);border:1px solid #d8ccba;border-left:5px solid var(--accent2);border-radius:12px;padding:13px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.intro strong{color:#5b2323}.intro span{color:var(--muted)}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.canvas-wrap{background:rgba(255,253,248,.78);border:1px solid #d8ccba;border-radius:14px;min-height:72vh;overflow:auto;box-shadow:var(--shadow);padding:28px;position:relative}
.canvas{transform:scale(var(--scale));transform-origin:top left;width:max-content;min-width:100%;padding:10px 30px 50px 10px}
.branch{display:flex;align-items:center;position:relative;min-height:88px}
.branch>.node-wrap{position:relative;flex:0 0 var(--node-w)}
.children{display:flex;flex-direction:column;gap:var(--gap-y);margin-left:var(--gap-x);position:relative;padding:5px 0}
.children:before{content:"";position:absolute;left:calc(var(--gap-x) * -0.52);top:50%;width:calc(var(--gap-x) * .52);border-top:2px solid var(--line)}
.children>.branch:before{content:"";position:absolute;left:calc(var(--gap-x) * -0.52);top:50%;width:calc(var(--gap-x) * .52);border-top:2px solid var(--line)}
.children>.branch:not(:only-child):after{content:"";position:absolute;left:calc(var(--gap-x) * -0.52);width:2px;background:var(--line)}
.children>.branch:first-child:not(:only-child):after{top:50%;bottom:-9px}
.children>.branch:last-child:not(:only-child):after{top:-9px;bottom:50%}
.children>.branch:not(:first-child):not(:last-child):after{top:-9px;bottom:-9px}
.node{width:var(--node-w);min-height:76px;background:linear-gradient(180deg,#fffefb,#f6efe3);border:2px solid #bca98d;border-radius:12px;padding:10px 38px 10px 12px;cursor:pointer;text-align:left;box-shadow:0 5px 12px rgba(60,42,25,.11);transition:.18s ease;position:relative}
.node:hover{transform:translateY(-2px);border-color:var(--accent2);box-shadow:0 9px 18px rgba(60,42,25,.16)}
.node.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(123,47,47,.16),0 9px 18px rgba(60,42,25,.16)}
.node-code{font:700 .74rem/1.1 Arial,sans-serif;color:var(--accent);letter-spacing:.03em}.node-name{font-weight:700;font-size:1rem;line-height:1.18;margin-top:4px}.node-hint{font:italic .74rem/1.2 Arial,sans-serif;color:#756955;margin-top:5px}
.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:25px;height:25px;border-radius:50%;border:1px solid #b9a789;background:#fff8eb;color:#653434;cursor:pointer;font:700 17px/22px Arial,sans-serif;padding:0;text-align:center}.toggle:hover{background:#ecdcc2}.leaf .toggle{display:none}
.children.collapsed{display:none}.branch.collapsed-branch>.node-wrap:after{content:"";position:absolute;right:-12px;top:50%;width:12px;border-top:2px dotted var(--line)}
.panel{position:sticky;top:92px;background:var(--paper);border:1px solid #d8ccba;border-radius:14px;box-shadow:var(--shadow);padding:18px;max-height:calc(100vh - 112px);overflow:auto}
.panel.empty{color:var(--muted);font-style:italic}.panel h2{font-size:1.35rem;color:#5b2323;margin:0 0 6px}.panel .code{font:700 .82rem Arial,sans-serif;color:var(--accent);margin-bottom:6px}.panel p{line-height:1.56;margin:0 0 12px}.panel .close{display:none}
.legend{font:12px Arial,sans-serif;color:#746b60;margin-top:10px}
.search{min-width:230px;border:1px solid #cbbca8;border-radius:9px;padding:8px 10px;background:#fffdf8;font:14px Arial,sans-serif}
.search:focus{outline:2px solid rgba(123,47,47,.18);border-color:var(--accent)}
.search-status{font:12px Arial,sans-serif;color:#746b60;margin-top:8px;min-height:16px}
@media(max-width:1000px){.workspace{grid-template-columns:1fr}.panel{position:fixed;z-index:50;left:12px;right:12px;bottom:12px;top:auto;max-height:58vh;display:none}.panel.open{display:block}.panel .close{display:block;position:absolute;right:10px;top:10px;border:0;background:#eee2d0;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:18px}.canvas-wrap{min-height:75vh}.search{min-width:180px}}
@media(max-width:600px){header{padding:10px}.brand p{display:none}main{padding:10px}.canvas-wrap{padding:18px}.tool{padding:7px 9px}.search{width:100%;order:3}.controls{width:100%}:root{--node-w:205px;--gap-x:45px}}
@media print{header,.intro,.panel{display:none!important}.workspace{display:block}.canvas-wrap{overflow:visible;border:0;box-shadow:none}.canvas{transform:none!important}.node{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="brand"><h1>Filipova loza — interaktivni rodoslovni dijagram</h1><p>Kliknite osobu za podatke. Znak +/− otvara i zatvara potomke.</p></div>
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="Pretraži osobu ili oznaku…" aria-label="Pretraži osobu ili oznaku">
      <button class="tool" id="expandAll" type="button">Otvori sve</button>
      <button class="tool" id="collapseAll" type="button">Sažmi grane</button>
      <button class="tool" id="zoomOut" type="button" aria-label="Smanji">−</button>
      <button class="tool" id="zoomReset" type="button">100%</button>
      <button class="tool" id="zoomIn" type="button" aria-label="Povećaj">+</button>
      <button class="tool" id="printBtn" type="button">Ispis / PDF</button>
    </div>
  </div>
</header>
<main>
  <div class="intro"><strong>Peta grana roda Tandara — Filipova livanjska loza</strong><br><span>Dijagram obuhvaća sve osobe i obiteljske veze navedene u dostavljenom tekstu.</span></div>
  <div class="workspace">
    <section class="canvas-wrap" id="canvasWrap" aria-label="Interaktivni rodoslovni dijagram Filipove grane">
      <div class="canvas" id="tree"></div>
    </section>
    <aside class="panel" id="panel"><button class="close" id="closePanel" type="button" aria-label="Zatvori">×</button><div id="panelContent"></div><div class="search-status" id="searchStatus"></div></aside>
  </div>
</main>
<script>
const DATA = [{"id":"5.0","parent":null,"name":"Filip Tandara","details":["Filip Tandara smatra se začetnikom livanjske grane Tandara.","Bio je oženjen Jelom Bralić. Imali su četiri sina: Matu, Juru, Jakova i Ivana."]},{"id":"5.1","parent":"5.0","name":"Mate Filipov","details":["Mate, najstariji Filipov sin, oženio se Katom Jazvić.","Imali su kćer Jelu."]},{"id":"5.1.1","parent":"5.1","name":"Jela Matina","details":["Kći Mate Filipova i Kate rođene Jazvić."]},{"id":"5.2","parent":"5.0","name":"Jure Filipov","details":["Jure, drugi Filipov sin, oženio se Mandom Matić.","Imali su sina Josipa."]},{"id":"5.2.1","parent":"5.2","name":"Josip Jurin","details":["Josip, sin Jure Filipova i Mande rođene Matić, vjenčao se 1818. godine s Cvitom Knežević.","Imali su sinove Jakova, Ivana i Antuna."]},{"id":"5.2.1.1","parent":"5.2.1","name":"Jakov Josipov","details":["Jakov, najstariji Josipov sin, oženio se Ružom Rimac.","Imali su sina Josipa."]},{"id":"5.2.1.1.1","parent":"5.2.1.1","name":"Josip Jakovljev","details":["Josip Jakovljev oženio se Anđom Gabrić.","Imali su sinove Jozu i Matu te kćeri Anu, Maru i Anđu."]},{"id":"5.2.1.1.1.1","parent":"5.2.1.1.1","name":"Jozo Josipov","details":["Jozo se ženio dva puta.","U prvom braku s Maricom Mioč imao je sina Antu Božidara.","U drugom braku s Katom Pastuh imao je sina Jakova i kćer Anu."]},{"id":"5.2.1.1.1.1.1","parent":"5.2.1.1.1.1","name":"Ante Božidar Jozin","details":["Sin Joze Josipova iz prvog braka s Maricom Mioč."]},{"id":"5.2.1.1.1.1.2","parent":"5.2.1.1.1.1","name":"Jakov Jozin","details":["Sin Joze Josipova iz drugog braka s Katom Pastuh."]},{"id":"5.2.1.1.1.1.3","parent":"5.2.1.1.1.1","name":"Ana Jozina","details":["Kći Joze Josipova iz drugog braka s Katom Pastuh."]},{"id":"5.2.1.1.1.2","parent":"5.2.1.1.1","name":"Mato Josipov","details":["Sin Josipa Jakovljeva i Anđe rođene Gabrić."]},{"id":"5.2.1.1.1.3","parent":"5.2.1.1.1","name":"Ana Josipova","details":["Kći Josipa Jakovljeva i Anđe rođene Gabrić."]},{"id":"5.2.1.1.1.4","parent":"5.2.1.1.1","name":"Mara Josipova","details":["Kći Josipa Jakovljeva i Anđe rođene Gabrić."]},{"id":"5.2.1.1.1.5","parent":"5.2.1.1.1","name":"Anđa Josipova","details":["Kći Josipa Jakovljeva i Anđe rođene Gabrić."]},{"id":"5.2.1.2","parent":"5.2.1","name":"Ivan Josipov","details":["Ivan, drugi sin Josipa i Cvite rođene Knežević, ženio se dva puta.","Prvi put oženio se 1859. godine Ružom Laštrić. Nema zapisa da su imali djece.","Drugi put oženio se Anđom Erceg. Imali su sinove Jakova i Stipu."]},{"id":"5.2.1.2.1","parent":"5.2.1.2","name":"Jakov Ivanov","details":["Jakov se 1894. godine u Livnu oženio Ružom Meštrović.","Imali su osmero djece: Josipa, Stipu, Ivu, Matka, Maru, Jozu, Milku i Anđu."]},{"id":"5.2.1.2.1.1","parent":"5.2.1.2.1","name":"Josip Jakovljev","details":["Najstarije navedeno dijete Jakova Ivanova i Ruže rođene Meštrović."]},{"id":"5.2.1.2.1.2","parent":"5.2.1.2.1","name":"Stipo Jakovljev","details":["Sin Jakova Ivanova i Ruže rođene Meštrović."]},{"id":"5.2.1.2.1.3","parent":"5.2.1.2.1","name":"Ivo Jakovljev","details":["Sin Jakova Ivanova i Ruže rođene Meštrović."]},{"id":"5.2.1.2.1.4","parent":"5.2.1.2.1","name":"Matko Jakovljev","details":["Matko, najmlađi Jakovljev sin, oženio se Anicom Župčić.","Imali su Krešimira i Davorku."]},{"id":"5.2.1.2.1.4.1","parent":"5.2.1.2.1.4","name":"Krešimir Matkov","details":["Krešimir se oženio Biserkom Kučak.","Imali su Igora i Gordanu."]},{"id":"5.2.1.2.1.4.1.1","parent":"5.2.1.2.1.4.1","name":"Igor Krešimirov","details":["Igor se oženio Edinom Hadžić.","Imali su sinove Izidora i Edgara."]},{"id":"5.2.1.2.1.4.1.1.1","parent":"5.2.1.2.1.4.1.1","name":"Izidor Igorov","details":["Sin Igora Krešimirova i Edine rođene Hadžić."]},{"id":"5.2.1.2.1.4.1.1.2","parent":"5.2.1.2.1.4.1.1","name":"Edgar Igorov","details":["Sin Igora Krešimirova i Edine rođene Hadžić."]},{"id":"5.2.1.2.1.4.1.2","parent":"5.2.1.2.1.4.1","name":"Gordana Krešimirova","details":["Kći Krešimira Matkova i Biserke rođene Kučak."]},{"id":"5.2.1.2.1.4.2","parent":"5.2.1.2.1.4","name":"Davorka Matkova","details":["Kći Matka Jakovljeva i Anice rođene Župčić."]},{"id":"5.2.1.2.1.5","parent":"5.2.1.2.1","name":"Mara Jakovljeva","details":["Kći Jakova Ivanova i Ruže rođene Meštrović."]},{"id":"5.2.1.2.1.6","parent":"5.2.1.2.1","name":"Joza Jakovljeva","details":["Kći Jakova Ivanova i Ruže rođene Meštrović."]},{"id":"5.2.1.2.1.7","parent":"5.2.1.2.1","name":"Milka Jakovljeva","details":["Kći Jakova Ivanova i Ruže rođene Meštrović."]},{"id":"5.2.1.2.1.8","parent":"5.2.1.2.1","name":"Anđa Jakovljeva","details":["Kći Jakova Ivanova i Ruže rođene Meštrović."]},{"id":"5.2.1.2.2","parent":"5.2.1.2","name":"Stipo Ivanov","details":["Stipo, mlađi sin Ivana i Anđe rođene Erceg, oženio se Anom Sučić.","Imali su sinove Ivu, Peru i Zvonimira te kćeri Ivu, Anđu i Ljubicu."]},{"id":"5.2.1.2.2.1","parent":"5.2.1.2.2","name":"Ivo Stipin","details":["Sin Stipe Ivanova i Ane rođene Sučić."]},{"id":"5.2.1.2.2.2","parent":"5.2.1.2.2","name":"Pero Stipin","details":["Sin Stipe Ivanova i Ane rođene Sučić."]},{"id":"5.2.1.2.2.3","parent":"5.2.1.2.2","name":"Zvonimir Stipin","details":["Zvonimir, najmlađi Stipin sin, oženio se 1930. godine u Beogradu Adelom Szepesi.","Imali su Vladimira i Anetu."]},{"id":"5.2.1.2.2.3.1","parent":"5.2.1.2.2.3","name":"Vladimir Zvonimirov","details":["Vladimir se 1965. godine u Berlinu oženio Ingrid Schmarsch.","Imali su Milana-Aleksandra i Andreu."]},{"id":"5.2.1.2.2.3.1.1","parent":"5.2.1.2.2.3.1","name":"Milan-Aleksandar Vladimirov","details":["Sin Vladimira Zvonimirova i Ingrid rođene Schmarsch."]},{"id":"5.2.1.2.2.3.1.2","parent":"5.2.1.2.2.3.1","name":"Andrea Vladimirova","details":["Kći Vladimira Zvonimirova i Ingrid rođene Schmarsch."]},{"id":"5.2.1.2.2.3.2","parent":"5.2.1.2.2.3","name":"Aneta Zvonimirova","details":["Kći Zvonimira Stipina i Adele rođene Szepesi."]},{"id":"5.2.1.2.2.4","parent":"5.2.1.2.2","name":"Iva Stipina","details":["Kći Stipe Ivanova i Ane rođene Sučić."]},{"id":"5.2.1.2.2.5","parent":"5.2.1.2.2","name":"Anđa Stipina","details":["Kći Stipe Ivanova i Ane rođene Sučić."]},{"id":"5.2.1.2.2.6","parent":"5.2.1.2.2","name":"Ljubica Stipina","details":["Kći Stipe Ivanova i Ane rođene Sučić."]},{"id":"5.2.1.3","parent":"5.2.1","name":"Antun Josipov","details":["Najmlađi navedeni sin Josipa Jurina i Cvite rođene Knežević."]},{"id":"5.3","parent":"5.0","name":"Jakov Filipov","details":["Jakov, treći Filipov sin, ženio se dva puta.","Iz prvog braka s Lucom rođenom Kuprešanin imao je kćeri Josipu i Peru.","Iz drugog braka s Katom rođenom Perić imao je kćer Katu."]},{"id":"5.3.1","parent":"5.3","name":"Josipa Jakovljeva","details":["Kći Jakova Filipova iz prvog braka s Lucom rođenom Kuprešanin."]},{"id":"5.3.2","parent":"5.3","name":"Pera Jakovljeva","details":["Kći Jakova Filipova iz prvog braka s Lucom rođenom Kuprešanin."]},{"id":"5.3.3","parent":"5.3","name":"Kata Jakovljeva","details":["Kći Jakova Filipova iz drugog braka s Katom rođenom Perić."]},{"id":"5.4","parent":"5.0","name":"Ivan Filipov","details":["Ivan, najmlađi Filipov sin, bio je oženjen Ivom rođenom Knežević.","Imali su Agatu i Petra."]},{"id":"5.4.1","parent":"5.4","name":"Agata Ivanova","details":["Kći Ivana Filipova i Ive rođene Knežević."]},{"id":"5.4.2","parent":"5.4","name":"Petar Ivanov","details":["Petar se ženio dva puta.","Prvi put oženio se Lucom Smoljić. Nije poznato jesu li imali djece.","U drugom braku s Matijom rođenom Čelan imao je Nikolu, Agatu i Anu."]},{"id":"5.4.2.1","parent":"5.4.2","name":"Nikola Petrov","details":["Sin Petra Ivanova iz drugog braka s Matijom rođenom Čelan."]},{"id":"5.4.2.2","parent":"5.4.2","name":"Agata Petrova","details":["Kći Petra Ivanova iz drugog braka s Matijom rođenom Čelan."]},{"id":"5.4.2.3","parent":"5.4.2","name":"Ana Petrova","details":["Kći Petra Ivanova iz drugog braka s Matijom rođenom Čelan."]}];
const byId = Object.fromEntries(DATA.map(n => [n.id, n]));
const children = {};
for (const n of DATA) (children[n.parent || 'root'] ??= []).push(n);
let selected = '5.0';
let scale = 1;

function renderNode(n){
  const kids = children[n.id] || [];
  const branch = document.createElement('div');
  branch.className = 'branch' + (kids.length ? '' : ' leaf');
  branch.dataset.id = n.id;

  const wrap = document.createElement('div');
  wrap.className = 'node-wrap';

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'node' + (selected === n.id ? ' selected' : '');
  btn.dataset.id = n.id;
  btn.innerHTML = `<div class="node-code">${n.id}</div><div class="node-name">${n.name}</div><div class="node-hint">Kliknite za podatke</div>`;
  btn.addEventListener('click', () => selectNode(n.id));
  wrap.appendChild(btn);

  if (kids.length){
    const tog = document.createElement('button');
    tog.type = 'button';
    tog.className = 'toggle';
    tog.textContent = '−';
    tog.title = 'Zatvori ili otvori potomke';
    tog.setAttribute('aria-label', 'Zatvori ili otvori potomke');
    tog.addEventListener('click', e => { e.stopPropagation(); toggleBranch(branch, tog); });
    wrap.appendChild(tog);
  }

  branch.appendChild(wrap);
  if (kids.length){
    const box = document.createElement('div');
    box.className = 'children';
    kids.forEach(k => box.appendChild(renderNode(k)));
    branch.appendChild(box);
  }
  return branch;
}

function renderTree(){
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  (children.root || []).forEach(n => tree.appendChild(renderNode(n)));
  applySearch();
}

function toggleBranch(branch, tog){
  const c = branch.querySelector(':scope > .children');
  if (!c) return;
  const closed = c.classList.toggle('collapsed');
  branch.classList.toggle('collapsed-branch', closed);
  tog.textContent = closed ? '+' : '−';
}

function selectNode(id){
  selected = id;
  document.querySelectorAll('.node').forEach(x => x.classList.toggle('selected', x.dataset.id === id));
  showPanel(byId[id]);
}

function showPanel(n){
  const p = document.getElementById('panel');
  const c = document.getElementById('panelContent');
  p.classList.add('open');
  const paras = n.details.map(x => `<p>${x}</p>`).join('');
  c.innerHTML = `<div class="code">${n.id}</div><h2>${n.name}</h2>${paras}<div class="legend">Kliknite drugi okvir za prikaz nove osobe.</div>`;
}

function setInitialView(){
  document.querySelectorAll('.branch').forEach(b => {
    if (b.dataset.id === '5.0') return;
    const c = b.querySelector(':scope > .children');
    const tog = b.querySelector(':scope > .node-wrap > .toggle');
    if (!c || !tog) return;
    c.classList.add('collapsed');
    b.classList.add('collapsed-branch');
    tog.textContent = '+';
  });
}

function setAll(open){
  document.querySelectorAll('.branch').forEach(b => {
    const c = b.querySelector(':scope > .children');
    const tog = b.querySelector(':scope > .node-wrap > .toggle');
    if (!c || !tog) return;
    c.classList.toggle('collapsed', !open);
    b.classList.toggle('collapsed-branch', !open);
    tog.textContent = open ? '−' : '+';
  });
}

function openAncestors(id){
  let n = byId[id];
  while (n && n.parent){
    const parentBranch = document.querySelector(`.branch[data-id="${CSS.escape(n.parent)}"]`);
    if (parentBranch){
      const c = parentBranch.querySelector(':scope > .children');
      const tog = parentBranch.querySelector(':scope > .node-wrap > .toggle');
      if (c) c.classList.remove('collapsed');
      parentBranch.classList.remove('collapsed-branch');
      if (tog) tog.textContent = '−';
    }
    n = byId[n.parent];
  }
}

function setScale(v){
  scale = Math.max(.55, Math.min(1.45, v));
  document.documentElement.style.setProperty('--scale', scale);
  document.getElementById('zoomReset').textContent = Math.round(scale * 100) + '%';
}

function applySearch(){
  const raw = document.getElementById('search').value.trim();
  const q = raw.toLocaleLowerCase('hr');
  const matches = [];
  document.querySelectorAll('.node').forEach(btn => {
    const n = byId[btn.dataset.id];
    const txt = [n.id, n.name, ...n.details].join(' ').toLocaleLowerCase('hr');
    const hit = !q || txt.includes(q);
    btn.style.opacity = hit ? '1' : '.25';
    btn.style.filter = hit ? 'none' : 'grayscale(.65)';
    if (q && hit) matches.push(n.id);
  });
  const status = document.getElementById('searchStatus');
  if (!q){ status.textContent = ''; return; }
  status.textContent = matches.length ? `Pronađeno: ${matches.length}` : 'Nema pronađenih osoba.';
  if (matches.length === 1){
    openAncestors(matches[0]);
    selectNode(matches[0]);
    const el = document.querySelector(`.node[data-id="${CSS.escape(matches[0])}"]`);
    if (el) el.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
  }
}

document.getElementById('expandAll').onclick = () => setAll(true);
document.getElementById('collapseAll').onclick = () => setAll(false);
document.getElementById('zoomIn').onclick = () => setScale(scale + .1);
document.getElementById('zoomOut').onclick = () => setScale(scale - .1);
document.getElementById('zoomReset').onclick = () => setScale(1);
document.getElementById('search').addEventListener('input', applySearch);
document.getElementById('closePanel').onclick = () => document.getElementById('panel').classList.remove('open');
document.getElementById('printBtn').onclick = () => window.print();

renderTree();
setInitialView();
showPanel(byId[selected]);
setScale(1);
</script>
</body>
</html>
