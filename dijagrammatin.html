const DATA={"code":"4.0","label":"Mate Tandara – Ivanov (rođen oko 1740.)","detail":"Mate Tandara bio je četvrti sin Ivana Tandare. Sa suprugom Filipom Kopač imao je petero djece: sina Ivana te kćeri Matiju, Mandu, Jaku i Ceciliju. Muška loza nastavila se isključivo preko sina Ivana. Ivan se ženio dva puta. U prvom braku s Pavom Sičenica dobio je sina Antu, jedinog muškog nasljednika Matine loze. U drugom braku s Jelom Parlov dobio je kćer Ružu. Ova je grana poznata po nadimku CESAROVIĆI. O podrijetlu toga nadimka sačuvala se zanimljiva predaja. Prema njoj, neki su Matini potomci radili poljoprivredne poslove kod obitelji iz roda Lažeta. Kada su ih ukućani i susjedi upitali kakva im je bila hrana u Lažeta, odgovorili su: ‘Ko' u cesara!’ Nije posve razjašnjeno je li izgovorena riječ cesar ili sesar. Iako se oba oblika mogu pronaći na starijim nadgrobnim spomenicima i u predaji, danas se većina potomaka ove grane naziva CESAROVIĆIma.","children":[{"code":"4.1","label":"Ivan Matin (–1870.)","detail":"Ivan Matin ženio se dvaput. Prvi put se 1817. godine oženio Pavom Sičenica i s njom imao sina Antu. U drugom braku s Jelom Parlov dobio je kćer Ružu (1849.–).","children":[{"code":"4.1.1","label":"Ante Ivanov (1832.–)","detail":"Ante se 1853. vjenčao s Jozom Pušić. Imali su sinove Ivana, Juru (1858.–), Marka (1865.–) i Matu te kćeri Ivu (1862.–), Tomicu (1867.–1869.), Maru (1870.–) i Jelu (1877.–). Za Juru i Marka nema drugih zapisa osim onih o njihovu rođenju. Ili su umrli mladi ili su se nekamo odselili.","children":[{"code":"4.1.1.1","label":"Ivan Antin (1855.–1928.)","detail":"Ivan Antin oženio se Ružom Matišić i s njom imao sinove Marijana (1888.–), Jozu i Ivana te kćeri Anicu (1893.–1920.), Ivu (1895.–) i Jelu (1899.–). Za Marijana ne postoje drugi zapisi osim onoga o njegovu rođenju. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"4.1.1.1.1","label":"Jozo Ivanov (1890.–1947.)","detail":"Jozo, drugi Ivanov sin, uzeo je za ženu Ivu Bilić. Imali su sinove Marijana i Mirka (1932.–1936.), koji je umro kao malo dijete, te kćeri Jozu (1922.–) i Anu (1926.–).","children":[{"code":"4.1.1.1.1.1","label":"Marijan Jozin (1929.–1977.)","detail":"Marijan je bio oženjen i imao potomke. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"4.1.1.1.1.1.1","label":"Živi potomak – privatni podaci","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[]}]}]},{"code":"4.1.1.1.2","label":"Ivan Ivanov (1903.–1965.)","detail":"Ivan se ženio dvaput. U prvom braku s Jakom Tavra imao je potomke; njihov sin Stanko (1938.–1952.) umro je u četrnaestoj godini. U drugom braku s Anom Capia nije imao djece. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"4.1.1.1.2.1","label":"Živi potomak – privatni podaci","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"4.1.1.1.2.1.1","label":"Živi potomak – privatni podaci","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[]}]}]}]},{"code":"4.1.1.2","label":"Mate Antin (1873.–1927.)","detail":"Mate Antin oženio se Ružom Manenica. Imali su sinove Antu (1901.–1901.), Josipa (1905.–), Cvitana, ponovno Antu (1908.–) i Nikolu te kćeri Tomicu (1902.–) i Maru (1910.–). Za Josipa nema drugih zapisa osim onoga o njegovu rođenju. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"4.1.1.2.1","label":"Cvitan Matin (1906.–)","detail":"Cvitan, treći Matin sin, bio je oženjen Tomicom Pavić. Njihov sin Mate (1932.–1933.) i kći Ana (1934.–1935.) umrli su kao mala djeca. Cvitanova se loza ugasila. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[]},{"code":"4.1.1.2.2","label":"Ante Matin (1908.–)","detail":"Povijesni podatak o ovoj osobi ostaje javno dostupan. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"4.1.1.2.2.1","label":"Marijan Antin (1934.–1963.)","detail":"Marijan je uzeo za ženu Pavu Pušić. Marijan je 1963. poginuo u Njemačkoj. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"4.1.1.2.2.1.1","label":"Ante Marijanov (1961.–1991.)","detail":"Početkom devedesetih godina uključio se u obranu Hrvatske od agresije bivše Jugoslavenske narodne armije i srpskih paravojnih skupina. U Domovinskom ratu sudjelovao je od kolovoza 1991. kao pripadnik 105. brigade Hrvatske vojske. U rujnu iste godine Ante i devetnaest drugih hrvatskih branitelja, većinom iz Bjelovara, zarobljeni su u Kusonjama kod Pakraca, mučeni i pogubljeni. Njihovi posmrtni ostaci ekshumirani su iz masovne grobnice Rakov Potok u siječnju 1992. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[]},{"code":"4.1.1.2.2.1.2","label":"Živi potomak – privatni podaci","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[]}]},{"code":"4.1.1.2.2.2","label":"Živi potomak – privatni podaci","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"4.1.1.2.2.2.1","label":"Živi potomak – privatni podaci","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[]}]},{"code":"4.1.1.2.2.3","label":"Živi potomak – privatni podaci","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"4.1.1.2.2.3.1","label":"Živi potomak – privatni podaci","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[]}]},{"code":"4.1.1.2.2.4","label":"Živi potomak – privatni podaci","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"4.1.1.2.2.4.1","label":"Živi potomak – privatni podaci","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[]}]}]},{"code":"4.1.1.2.3","label":"Nikola Matin (1911.–1980.)","detail":"Nikola je oženio Maru Brnas. Njihov sin Vinko živio je od 1947. do 2010. godine. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"4.1.1.2.3.1","label":"Vinko Nikolin (1947.–2010.)","detail":"Vinko Nikolin živio je od 1947. do 2010. godine. Bio je oženjen i imao potomke. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[]}]}]}]}]}]};
const PEOPLE=[];
const UI={"codeLabel":"Oznaka","noDetails":"Za ovu osobu nema dodatnog opisa.","notFound":"Nema rezultata za: ","locale":"hr"};

const svg = document.getElementById("treeSvg");
const viewport = document.getElementById("viewport");
const linksLayer = document.getElementById("links");
const nodesLayer = document.getElementById("nodes");
const details = document.getElementById("details");
const searchResults = document.getElementById("searchResults");
const resultList = document.getElementById("resultList");
const searchSummary = document.getElementById("searchSummary");
const BOX_W=300,BOX_H=64,SPOUSE_H=60,DAUGHTERS_H=42,COUPLE_GAP=2,FAMILY_GAP=5,MARRIAGE_GAP=10,FAMILY_BLOCK_H=SPOUSE_H+FAMILY_GAP+DAUGHTERS_H+MARRIAGE_GAP,X_STEP=BOX_W+92,ROW_GAP=26,MARGIN=48;
let scale=1,panX=20,panY=20,selectedCode=null,matchCode=null;
let dragging=false,dragStart=null;
let bounds={width:1000,height:900};
function walk(node,callback,parent=null,depth=0){callback(node,parent,depth);(node.children||[]).forEach(child=>walk(child,callback,node,depth+1));}
function findNode(code){let result=null;walk(DATA,node=>{if(node.code===code)result=node;});return result;}
function personById(id){return PEOPLE.find(person=>person.id===id)||null;}
function setExpandedToDepth(maxDepth){walk(DATA,(node,parent,depth)=>{node.expanded=depth<maxDepth;});}
function visibleNodes(){const result=[];function visit(node,parent=null,depth=0){result.push({node,parent,depth});if(node.expanded)(node.children||[]).forEach(child=>visit(child,node,depth+1));}visit(DATA);return result;}
function colors(code){if(code==="4.0"||code==="4.1"||code==="4.1.1")return {fill:"#174f39",text:"#fff",stroke:"#0d3425"};if(code.startsWith("4.1.1.1"))return {fill:"#e8f2fb",text:"#173a57",stroke:"#4d82aa"};return {fill:"#fff1df",text:"#553719",stroke:"#bb8144"};}
function wrapText(text,max=35){const words=String(text||"").split(/\s+/),lines=[];let line="";for(const word of words){const test=(line+" "+word).trim();if(test.length>max&&line){lines.push(line);line=word}else line=test;}if(line)lines.push(line);if(lines.length>2)lines[1]=lines.slice(1).join(" ").slice(0,max-1)+"…";return lines.slice(0,2);}
function compactNames(names,max=36){if(!names.length)return["Nema zabilježenih kćeri"];return wrapText(names.join(", "),max);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function normalizeFamilyName(value){return String(value||"").toLocaleLowerCase("hr").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]+/g," ").trim();}
function lifeLabel(person,node=null){if(node&&node.label)return node.label;const years=person.born||person.died?` (★ ${person.born||"nepoznato"} – ✝ ${person.died||"nepoznato"})`:"";return person.name+years;}
function buildFamilyMeta(){const meta={};walk(DATA,node=>{let spouses=PEOPLE.filter(person=>person.hostCode===node.code&&/-S\d+$/.test(person.id));const main=personById(node.code);if(!spouses.length&&main&&main.spouses&&main.spouses.length)spouses=main.spouses.map((name,index)=>({id:node.code+"-S"+(index+1),name,hostCode:node.code,relation:"supruga",born:"",died:""}));if(!spouses.length)return;const directChildren=(node.children||[]).map(child=>({person:personById(child.code)||{id:child.code,name:child.label,hostCode:child.code,relation:"sin",mother:"",born:"",died:""},node:child}));const extraChildren=PEOPLE.filter(person=>person.hostCode===node.code&&/-K\d+$/.test(person.id)).map(person=>({person,node:null}));const allChildren=[...directChildren,...extraChildren];meta[node.code]=spouses.map((spouse,index)=>{const spouseKey=normalizeFamilyName(spouse.name);let children=allChildren.filter(item=>normalizeFamilyName(item.person.mother)===spouseKey);if(spouses.length===1)children=allChildren;const sons=children.filter(item=>/^sin\b/i.test(item.person.relation||"")).map(item=>lifeLabel(item.person,item.node));const daughters=children.filter(item=>/^kći\b/i.test(item.person.relation||"")).map(item=>lifeLabel(item.person,item.node));return{spouse:spouse.name,total:sons.length+daughters.length,sons,daughters,order:index+1};});});return meta;}
const FAMILY_META={};
function familyHeight(node){const families=FAMILY_META[node.code]||[];if(!families.length)return BOX_H;return BOX_H+COUPLE_GAP+families.length*(SPOUSE_H+FAMILY_GAP+DAUGHTERS_H)+(families.length-1)*MARRIAGE_GAP;}
function layoutVisible(){const visible=visibleNodes();let y=MARGIN;for(const item of visible){item.x=MARGIN+item.depth*X_STEP;item.y=y;y+=familyHeight(item.node)+ROW_GAP;}const maxDepth=Math.max(...visible.map(item=>item.depth),0);bounds.width=MARGIN*2+maxDepth*X_STEP+BOX_W;bounds.height=y+MARGIN;return visible;}
function render(){const visible=layoutVisible(),pos=new Map(visible.map(item=>[item.node.code,item]));linksLayer.innerHTML=visible.map(item=>{if(!item.parent||!pos.has(item.parent.code))return"";const parent=pos.get(item.parent.code),x1=parent.x+BOX_W,y1=parent.y+BOX_H/2,x2=item.x,y2=item.y+BOX_H/2,elbow=x1+(x2-x1)/2;return`<path class="connector" d="M${x1},${y1} H${elbow} V${y2} H${x2}"/>`;}).join("");
let markup="";for(const item of visible){const node=item.node,color=colors(node.code),lines=wrapText(node.label),hasChildren=(node.children||[]).length>0,indicator=hasChildren?(node.expanded?"−":"+"):"",classes=["node"],families=FAMILY_META[node.code]||[];if(node.code===selectedCode)classes.push("selected");if(node.code===matchCode)classes.push("match");const state=hasChildren?(node.expanded?"prošireno":"sažeto"):"bez potomaka";markup+=`<g class="${classes.join(" ")}" data-code="${esc(node.code)}" transform="translate(${item.x},${item.y})" role="button" tabindex="0" aria-label="${esc((node.code)+" "+node.label+", "+state)}"><rect width="${BOX_W}" height="${BOX_H}" rx="9" fill="${color.fill}" stroke="${color.stroke}"></rect><text class="code" x="13" y="19" fill="${color.text}">${esc(node.code)}</text>${lines.map((line,i)=>`<text class="label" x="13" y="${40+i*16}" fill="${color.text}">${esc(line)}</text>`).join("")}${hasChildren?`<circle cx="${BOX_W-18}" cy="18" r="11" fill="rgba(255,255,255,.72)" stroke="${color.stroke}"></circle><text class="hint" x="${BOX_W-18}" y="22" text-anchor="middle" fill="${color.stroke}">${indicator}</text>`:""}</g>`;families.forEach((family,index)=>{const fy=item.y+BOX_H+COUPLE_GAP+index*FAMILY_BLOCK_H,spouseLines=wrapText("Supruga: "+family.spouse,38),daughterLines=compactNames(family.daughters,39),marriageLabel=families.length>1?`${index+1}. brak`:"Bračni par";markup+=`<path class="marriage-line" d="M${item.x+BOX_W/2},${item.y+BOX_H} V${fy}"/><g class="family-action spouse-node" data-family-code="${esc(node.code)}" data-family-index="${index}" transform="translate(${item.x},${fy})" role="button" tabindex="0" aria-label="${esc(marriageLabel+". Supruga "+family.spouse+". Ukupno djece "+family.total+", sinova "+family.sons.length+", kćeri "+family.daughters.length+".")}"><rect width="${BOX_W}" height="${SPOUSE_H}" rx="7"></rect><text class="family-meta marriage-label" x="11" y="14">${esc(marriageLabel)}</text>${spouseLines.map((line,lineIndex)=>`<text class="${lineIndex===0?"family-title":"family-meta"}" x="11" y="${27+lineIndex*12}">${esc(line)}</text>`).join("")}<text class="family-meta" x="11" y="52">Djeca ${family.total} · S ${family.sons.length} · K ${family.daughters.length}</text></g><path class="daughter-line" d="M${item.x+BOX_W/2},${fy+SPOUSE_H} V${fy+SPOUSE_H+FAMILY_GAP}"/><g class="family-action daughter-node" data-daughter-code="${esc(node.code)}" data-daughter-index="${index}" transform="translate(${item.x},${fy+SPOUSE_H+FAMILY_GAP})" role="button" tabindex="0" aria-label="${esc("Kćeri bračnog para "+node.label+" i "+family.spouse+": "+family.daughters.length)}"><rect width="${BOX_W}" height="${DAUGHTERS_H}" rx="8"></rect><text class="daughter-title" x="11" y="15">Kćeri (${family.daughters.length})</text>${daughterLines.map((line,lineIndex)=>`<text class="daughter-meta" x="11" y="${29+lineIndex*12}">${esc(line)}</text>`).join("")}</g>`;});}
nodesLayer.innerHTML=markup;nodesLayer.querySelectorAll(".node").forEach(group=>{const activate=()=>{const node=findNode(group.dataset.code);selectedCode=node.code;showDetails(node);if((node.children||[]).length)node.expanded=!node.expanded;render();requestAnimationFrame(fitTree);};group.addEventListener("click",event=>{event.stopPropagation();activate();});group.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();event.stopPropagation();activate();}});});nodesLayer.querySelectorAll(".spouse-node").forEach(group=>{const activate=()=>showMarriageDetails(group.dataset.familyCode,Number(group.dataset.familyIndex));group.addEventListener("click",event=>{event.stopPropagation();activate();});group.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();event.stopPropagation();activate();}});});nodesLayer.querySelectorAll(".daughter-node").forEach(group=>{const activate=()=>showDaughtersDetails(group.dataset.daughterCode,Number(group.dataset.daughterIndex));group.addEventListener("click",event=>{event.stopPropagation();activate();});group.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();event.stopPropagation();activate();}});});applyTransform();}
function buildPersonText(person,node=null){const lines=[];if(person.relation)lines.push("Odnos: "+person.relation+".");if(person.born||person.died)lines.push("Godine: "+(person.born?("★ "+person.born):"★ nepoznato")+" – "+(person.died?("✝ "+person.died):"✝ nepoznato")+".");if(person.father)lines.push("Otac: "+person.father+".");if(person.mother)lines.push("Majka: "+person.mother+".");if(person.spouses&&person.spouses.length)lines.push((person.spouses.length>1?"Supružnici: ":"Supružnik/ca: ")+person.spouses.join(", ")+".");if(person.status)lines.push("Status: "+person.status+".");const note=String(person.note||"").trim();if(note)lines.push(note);const detail=node&&node.detail?String(node.detail).trim():"";const canonical=value=>String(value||"").toLocaleLowerCase("hr").replace(/\s+/g," ").trim();if(detail&&canonical(detail)!==canonical(note))lines.push(detail);return lines.join("\n")||UI.noDetails;}
function showPersonDetails(person){const node=findNode(person.hostCode===person.id?person.id:person.id)||findNode(person.hostCode);document.getElementById("detailTitle").textContent=person.name;document.getElementById("detailCode").textContent=UI.codeLabel+" "+person.id;document.getElementById("detailText").textContent=buildPersonText(person,person.id===person.hostCode?node:null);details.classList.add("open");}
function showDetails(node){const person=personById(node.code);if(person)showPersonDetails(person);else{document.getElementById("detailTitle").textContent=node.label;document.getElementById("detailCode").textContent=UI.codeLabel+' '+node.code;document.getElementById("detailText").textContent=node.detail||UI.noDetails;details.classList.add("open");}}
function showMarriageDetails(code,index){const node=findNode(code),family=(FAMILY_META[code]||[])[index];if(!node||!family)return;document.getElementById("detailTitle").textContent="Supruga: "+family.spouse;document.getElementById("detailCode").textContent="Bračni par · obiteljski zapis "+code;const sons=family.sons.length?family.sons.join("\n• "):"nema zabilježenih";const daughters=family.daughters.length?family.daughters.join("\n• "):"nema zabilježenih";document.getElementById("detailText").textContent="Nositelj prezimena: "+node.label+"\nSupruga: "+family.spouse+"\nUkupno djece: "+family.total+"\n\nSinovi ("+family.sons.length+"):\n• "+sons+"\n\nKćeri ("+family.daughters.length+"):\n• "+daughters;details.classList.add("open");}
function showDaughtersDetails(code,index){const node=findNode(code),family=(FAMILY_META[code]||[])[index];if(!node||!family)return;document.getElementById("detailTitle").textContent="Kćeri bračnog para";document.getElementById("detailCode").textContent=node.label+" + "+family.spouse;document.getElementById("detailText").textContent="Ukupno djece: "+family.total+"\nBroj kćeri: "+family.daughters.length+"\n\n"+(family.daughters.length?"• "+family.daughters.join("\n• "):"Nema zabilježenih kćeri u ovom braku.");details.classList.add("open");}
function applyTransform(){viewport.setAttribute("transform",`translate(${panX},${panY}) scale(${scale})`);}
function fitTree(){const rect=svg.getBoundingClientRect();scale=Math.min((rect.width-50)/bounds.width,(rect.height-50)/bounds.height,1.15);panX=(rect.width-bounds.width*scale)/2;panY=(rect.height-bounds.height*scale)/2;applyTransform();}
function zoomAt(factor,cx,cy){const old=scale;scale=Math.max(.14,Math.min(3,scale*factor));panX=cx-(cx-panX)*(scale/old);panY=cy-(cy-panY)*(scale/old);applyTransform();}
function expandAncestors(code){const parts=code.split(".");DATA.expanded=true;for(let i=2;i<parts.length;i++){const ancestor=parts.slice(0,i).join("."),node=findNode(ancestor);if(node)node.expanded=true;}}
function normalizeText(value){return String(value||"").toLocaleLowerCase(UI.locale).replace(/đ/g,"d").replace(/dj/g,"d").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
function directNames(person){return [person.name,...(person.aliases||[])].map(normalizeText).filter(Boolean);}
function searchableText(person){return normalizeText([person.id,person.name,(person.aliases||[]).join(" "),person.born,person.died,person.father,person.mother,(person.spouses||[]).join(" "),person.relation,person.status,person.note].join(" "));}
function describePerson(person){const parts=[];if(person.relation)parts.push(person.relation);if(person.father||person.mother)parts.push("Otac: "+(person.father||"nepoznato")+" · Majka: "+(person.mother||"nepoznato"));if(person.born||person.died)parts.push((person.born||"?")+" – "+(person.died||"?"));if(person.status)parts.push(person.status);return parts.join(" · ");}
function scorePerson(person,q,tokens){const names=directNames(person),allTokens=new Set(searchableText(person).split(/\s+/).filter(Boolean)),code=normalizeText(person.id),nameTokens=new Set(names.join(" ").split(/\s+/).filter(Boolean));if(code===q)return 1000;if(!tokens.every(token=>allTokens.has(token)))return -1;const alphaTokens=tokens.filter(token=>/[a-z]/.test(token));if(alphaTokens.length&&!alphaTokens.some(token=>nameTokens.has(token)))return -1;let score=0;if(names.includes(q))score+=900;if(names.some(name=>name.startsWith(q)))score+=500;score+=tokens.filter(token=>nameTokens.has(token)).length*80;const yearTokens=new Set(normalizeText(person.born+" "+person.died).split(/\s+/).filter(Boolean));score+=tokens.filter(token=>yearTokens.has(token)).length*35;return score;}
function centerHost(code){
  expandAncestors(code);selectedCode=code;matchCode=code;render();
  requestAnimationFrame(()=>{
const target = Array.from(
  nodesLayer.querySelectorAll('[data-code]')
).find(function (node) {
  return node.getAttribute('data-code') === String(code);
 
});   if(!target)return;
   
    const currentRect=target.getBoundingClientRect();
    const desiredWidth=svg.clientWidth<700?190:250;
    if(currentRect.width>0){scale=Math.max(.16,Math.min(3,scale*desiredWidth/currentRect.width));}
    applyTransform();
    requestAnimationFrame(()=>{
      const nodeRect=target.getBoundingClientRect(),svgRect=svg.getBoundingClientRect(),rootMatrix=svg.getScreenCTM();
      const unitX=rootMatrix?Math.max(.001,Math.hypot(rootMatrix.a,rootMatrix.b)):1;
      const unitY=rootMatrix?Math.max(.001,Math.hypot(rootMatrix.c,rootMatrix.d)):1;
      panX+=(svgRect.left+svgRect.width/2-(nodeRect.left+nodeRect.width/2))/unitX;
      panY+=(svgRect.top+svgRect.height/2-(nodeRect.top+nodeRect.height/2))/unitY;
      applyTransform();
      target.classList.remove('tandara-search-focus');
      void target.getBBox();
      target.classList.add('tandara-search-focus');
      window.setTimeout(()=>target.classList.remove('tandara-search-focus'),2400);
    });
  });
}
function selectPerson(person){centerHost(person.hostCode);showPersonDetails(person);searchResults.classList.remove("open");}
function renderSearchResults(matches,q){resultList.innerHTML="";searchSummary.textContent=matches.length===1?"Pronađena je 1 osoba za: "+q:"Pronađeno osoba: "+matches.length+". Odaberite odgovarajuću oznaku.";matches.forEach(person=>{const button=document.createElement("button");button.type="button";button.className="result-item";button.innerHTML='<span class="result-code">'+esc(person.id)+'</span><span class="result-name">'+esc(person.name)+'</span><span class="result-meta">'+esc(describePerson(person))+'</span>';button.onclick=()=>selectPerson(person);resultList.appendChild(button);});searchResults.classList.add("open");}
function search(){const raw=document.getElementById("search").value.trim(),q=normalizeText(raw);if(!q)return;const tokens=q.split(/\s+/).filter(Boolean).filter(token=>token!==normalizeText("Tandara"));if(!tokens.length){alert(UI.notFound+raw);return;}let matches=PEOPLE.map(person=>({person,score:scorePerson(person,q,tokens)})).filter(item=>item.score>=0).sort((a,b)=>b.score-a.score||a.person.id.localeCompare(b.person.id,UI.locale)).map(item=>item.person);const exact=matches.filter(person=>normalizeText(person.id)===q||directNames(person).includes(q));if(exact.length)matches=exact;if(!matches.length){alert(UI.notFound+raw);return;}if(matches.length===1){selectPerson(matches[0]);return;}renderSearchResults(matches,raw);}
document.getElementById("expandAll").onclick=()=>{walk(DATA,n=>n.expanded=true);render();fitTree();};
document.getElementById("collapse").onclick=()=>{walk(DATA,n=>n.expanded=false);DATA.expanded=true;render();fitTree();};
document.getElementById("threeLevels").onclick=()=>{setExpandedToDepth(3);render();fitTree();};
document.getElementById("fit").onclick=fitTree;document.getElementById("zoomIn").onclick=()=>zoomAt(1.22,svg.clientWidth/2,svg.clientHeight/2);document.getElementById("zoomOut").onclick=()=>zoomAt(.82,svg.clientWidth/2,svg.clientHeight/2);document.getElementById("findBtn").onclick=search;document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")search();});document.getElementById("closeDetails").onclick=()=>details.classList.remove("open");document.getElementById("closeResults").onclick=()=>searchResults.classList.remove("open");document.addEventListener("keydown",e=>{if(e.key==="Escape"){details.classList.remove("open");searchResults.classList.remove("open");}});
svg.addEventListener("wheel",e=>{e.preventDefault();const rect=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:.89,e.clientX-rect.left,e.clientY-rect.top);},{passive:false});
svg.addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest(".node, .family-action"))return;dragging=true;svg.classList.add("dragging");svg.setPointerCapture(e.pointerId);dragStart={x:e.clientX,y:e.clientY,panX,panY};});
svg.addEventListener("pointermove",e=>{if(!dragging)return;panX=dragStart.panX+(e.clientX-dragStart.x);panY=dragStart.panY+(e.clientY-dragStart.y);applyTransform();});
svg.addEventListener("pointerup",()=>{dragging=false;svg.classList.remove("dragging");});svg.addEventListener("pointercancel",()=>{dragging=false;svg.classList.remove("dragging");});const fullscreenButton=document.getElementById("fullscreenDiagram"),fullscreenLabel=document.getElementById("fullscreenLabel");
async function toggleFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();}else{await document.exitFullscreen();}}catch(error){/* Preglednik može onemogućiti cijeli ekran. */}}
if(document.fullscreenEnabled){fullscreenButton.onclick=toggleFullscreen;}else{fullscreenButton.disabled=true;fullscreenButton.title="Cijeli ekran nije podržan u ovom pregledniku";}
document.addEventListener("fullscreenchange",()=>{const active=Boolean(document.fullscreenElement);fullscreenLabel.textContent=active?"Izađi iz cijelog ekrana":"Cijeli ekran";fullscreenButton.setAttribute("aria-label",active?"Izađi iz prikaza preko cijelog ekrana":"Prikaži dijagram preko cijelog ekrana");syncHeaderHeight();requestAnimationFrame(fitTree);});
document.getElementById("printDiagram").onclick=()=>window.print();
function expandEmbeddedDiagramArea(){
  if(window.self===window.top)return;
  try{
    const frame=window.frameElement,parentDoc=window.parent.document,parentWin=window.parent;
    if(!frame)return;
    const layout=parentDoc.querySelector(".layout");
    const contentPage=frame.closest(".content-page")||parentDoc.querySelector(".content-page");
    const card=frame.closest(".content-card")||parentDoc.querySelector(".content-card");
    const wrap=frame.parentElement;
    if(layout){layout.style.maxWidth="none";layout.style.width="100%";layout.style.margin="0";layout.style.gap="0";layout.style.padding="0";}
    if(contentPage){contentPage.style.width="100%";contentPage.style.maxWidth="none";contentPage.style.minWidth="0";contentPage.style.padding="0";contentPage.style.justifyContent="stretch";}
    let leftPad=0,rightPad=0;
    if(card){const cardStyle=parentWin.getComputedStyle(card);leftPad=parseFloat(cardStyle.paddingLeft)||0;rightPad=parseFloat(cardStyle.paddingRight)||0;card.style.width="100%";card.style.maxWidth="none";card.style.margin="0";card.style.borderRadius="0";}
    if(wrap){wrap.style.maxWidth="none";wrap.style.width=`calc(100% + ${leftPad+rightPad}px)`;wrap.style.marginLeft=`-${leftPad}px`;wrap.style.marginRight=`-${rightPad}px`;wrap.style.marginTop="30px";wrap.style.marginBottom="0";}
    frame.style.display="block";frame.style.width="100%";frame.style.maxWidth="none";frame.style.margin="0";frame.style.borderLeft="0";frame.style.borderRight="0";frame.style.borderRadius="0";
  }catch(error){/* Samostalni prikaz ostaje funkcionalan. */}
}
function syncHeaderHeight(){const header=document.querySelector("header");if(header)document.documentElement.style.setProperty("--header-height",header.offsetHeight+"px");}
window.addEventListener("resize",()=>{syncHeaderHeight();expandEmbeddedDiagramArea();requestAnimationFrame(fitTree);});
expandEmbeddedDiagramArea();syncHeaderHeight();setExpandedToDepth(1);render();requestAnimationFrame(fitTree);

</script>
