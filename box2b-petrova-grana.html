<script>
const DATA={"code":"2.0","detail":"Petar Tandara je bio Ivanov drugi sin. Umro je 1817. godine u osamdeset i trećoj godini života, pa se procjenjuje da je rođen c. 1734. godine. Petar je bio oženjen Jelom r. Budić. Imali su sinove Grgu, Jakova (1773.), Martina, Marijana (1781.-), Miju, Tadiju i Marka (1787.-), te kćeri Mandu (1777.-) i Jelu (-1824.). Sinovi Jakov (1773.-), Marijan (1781.-), Tadija i Marko (1787.-), ne pojavljuju se na Popisu duša iz 1806. godine, a Tadija je izostavljen s popisa iz 1819. godine, pa se može pretpostaviti da više nisu bili među živima ili je netko od njih odselio iz Ričica.","children":[{"code":"2.1","detail":"Grgo, najstariji Petrov sin, oženio je Ružu r. Pušić. Imali su sina Šimuna i kćer Ivu (1798.-).","children":[{"code":"2.1.1","detail":"Šimun je bio oženjen Jelom r. Budimir s kojom je imao sina Matu (1826.-), te kćeri Ivu (1831.-), Matiju (1837.-) i Martu (1845.-). O sinu Mati postoje samo podaci o godini rođenja, pa se ne može utvrditi njegov daljnji životni put niti okolnosti koje su dovele do toga da o njemu nema sačuvanih zapisa. Nakon sina Mate Šimunova je loza izumrla.","children":[],"label":"Šimun Grgin (★ 1800 – ✝ 1874)"}],"label":"Grgo Petrov (★ 1770 – ✝ nepoznato)"},{"code":"2.2","detail":"Martin, treći Petrov sin, oženio se Ružom r. Lekić. Imali su sinove Ivana, Juru (1811.-), Miju, Grgu, Filipa (1821.-) i Josipa (1824.-), te kćeri Matiju i Anu (1828.-). Za Juru, Filipa i Josipa nisu pronađeni drugi zapisi osim onih o njihovu krštenju, pa nije poznato jesu li umrli mladi ili su se odselili. Mijini sinovi nisu ostavili muške potomke, pa su obiteljsku lozu nastavili samo Martinovi sinovi Ivan i Grgo.","children":[{"code":"2.2.1","detail":"Ivan, najstariji Martinov sin, oženio se 1826. Anticom r. Lažeta. Ivan i Antica imali su tri sina: Marijana (1828.-1828.), Tomu i Juru (1840.-), te kćeri Ružu (1834.-), Ivu, Jozu (1839.-1839.) i Matiju (1841.-). O Juri nisu pronađeni drugi podaci osim zapisa o njegovu rođenju. Toma je bio jedini nasljednik Ivanove loze i začetnik loze pod nadimkom Tromići.","children":[{"code":"2.2.1.1","detail":"Toma je bio oženjen Tomicom r. Kovač. Imali su sinove Ivana (1866.-), Matu (1870.-), Juru i ponovno Ivana (1879.-1879.). Jedini Tomin nasljednik bio je sin Jure . Tomina loza u Zavelimu bila je poznata pod nadimkom Tromići , nastalim prema predaji o njihovoj visini i sporom, tromom hodu.","children":[{"code":"2.2.1.1.1","detail":"Treći Tomin sin i jedini nasljednik uzeo je za ženu Ivu r. Lažeta. Imali su sinove Tomu (1909.-1914.) i Ivana (1911.-1915.), zatim Pia, Dominika i Matu, te kćer Matiju (1908.-). Lozu su nastavili sinovi Pio, Dominik i Mate.","children":[{"code":"2.2.1.1.1.1","detail":"Pio, treći Jurin sin, uzeo je za suprugu Tereziju r. Budimir s kojom je dobio sinove Ivana, Juru i Jozu, te kćer Maru (1937.-).","children":[{"code":"2.2.1.1.1.1.1","detail":"Ivan je bio oženjen Marijanom r. Petter s kojom je dobio sina Dinu i kćer Romanu. Obitelj danas živi u Zagrebu.","children":[{"code":"2.2.1.1.1.1.1.1","detail":"Dino je oženio Matildu r. Klepikapić s kojom ima kćeri Hedvigu (1991.-), Leonardu (1995.-) i Luciju (1999.-). Nema muških potomaka. Obitelj živi u Zagrebu.","children":[],"label":"Dino Ivanov (★ 1964 – ✝ nepoznato)"}],"label":"Ivan Piin (★ 1935 – ✝ 2025)"},{"code":"2.2.1.1.1.1.2","detail":"Jure je bio oženjen Milom r. Škorić s kojom je dobio sina Tomislava (1972.-) i kćeri Mariju (1968.-), Angelu (1971.-) i Nediljku (1972.-). Tomislav se nije ženio. Obitelj danas živi u Splitu.","children":[],"label":"Jure Piin (★ 1943 – ✝ 2004)"},{"code":"2.2.1.1.1.1.3","detail":"Jozo je oženio Mirjanu r. Generalić s kojom ima sina Domagoja (1978.-) i kćeri Terezu (1973.-) i Zrinku (1975.-). Obitelj živi u Splitu.","children":[],"label":"Jozo Piin (★ 1949 – ✝ nepoznato)"}],"label":"Pio Jurin (★ 1916 – ✝ 1990)"},{"code":"2.2.1.1.1.2","detail":"Četvrti Jurin sin oženio je Maru r. Knezović i s njom dobio sinove Antu (1948.-), Barišu (1950.-), Nikolu (1953.-), Pia (1954.-), Svetu (1958.-) i Ivana (1963.-), te kćer Olgu (1965.-). Ante, Nikola, Pio i Sveto nemaju mušku djecu. Za Barišu nema podataka o ženidbi. Jedino su Ivanovi sinovi nasljednici Dominikove loze.","children":[{"code":"2.2.1.1.1.2.1","detail":"Ante je bio oženjen Dubravkom r. Pencinger s kojom je dobio kćeri Anu Mariju (1978.-) i Ozanu (1982.-). Obitelj živi u Križevcima.","children":[],"label":"Ante Dominikov (★ 1948 – ✝ nepoznato)"},{"code":"2.2.1.1.1.2.2","detail":"Bariša Dominikov je oženjen Nadom (prezime nije poznato) i s njom nema djece.","children":[],"label":"Bariša Dominikov (★ 1950 – ✝ nepoznato)"},{"code":"2.2.1.1.1.2.3","detail":"Nikola je oženio Nadu r. Jurčević, s kojom je dobio kćeri Marijanu (1974.–), Ivu (1975.–), Brigitu (1979.–) i Anitu (1982.–). Nakon povratka, Nikola ponovno živi u Tandarama u Zavelimu.","children":[],"label":"Nikola Dominikov (★ 1953 – ✝ nepoznato)"},{"code":"2.2.1.1.1.2.4","detail":"Pio se oženio Ljubinom r. Krinulović s kojom je dobio kćeri Tinu i Piu. Obitelj živi u Beču, u Austriji.","children":[],"label":"Pio Dominikov (★ 1954 – ✝ nepoznato)"},{"code":"2.2.1.1.1.2.5","detail":"Sveto se dvaput ženio. U prvom braku s Petrom r. Lukić dobio je kćer Danielu (1982.-). U drugom braku s Verom r. Rakin dobio je kćer Eni (1997.-).","children":[],"label":"Sveto Dominikov (★ 1957 – ✝ nepoznato)"},{"code":"2.2.1.1.1.2.6","detail":"Ivan Dominikov je oženio Mirjanu Tandara s kojom ima sinove Dominika (1990.-) i Davida. Obitelj živi u selu Tandare u Zavelimu.","children":[],"label":"Ivan Dominikov (★ 1963 – ✝ nepoznato)"}],"label":"Dominik Jurin (★ 1919 – ✝ 1987)"},{"code":"2.2.1.1.1.3","detail":"Mate, peti Jurin sin, oženio je Maru r. Budić s kojom je dobio sinove Tomislava i Miju (1955.-1960.), te kćer Matiju (1952.-).","children":[{"code":"2.2.1.1.1.3.1","detail":"Oženio je Božicu r. Golubiček s kojom ima sina Matu i kćer Martinu (1978.-). Obitelj se preselila u Zagreb.","children":[{"code":"2.2.1.1.1.3.1.1","detail":"Oženio je Ivanu r. Trošelj s kojom je dobio kćer Tenu (2006.-). Obitelj danas živi u Zagrebu.","children":[],"label":"Mate Tomislavov (★ 1980 – ✝ nepoznato)"}],"label":"Tomislav Matin (★ 1947 – ✝ 2014)"}],"label":"Mate Jurin (★ 1922 – ✝ 1963)"}],"label":"Jure Tomin (★ 1874 – ✝ 1931)"}],"label":"Toma Ivanov (★ 1830 – ✝ nepoznato)"}],"label":"Ivan Martinov (★ 1807 – ✝ 1877)"},{"code":"2.2.2","detail":"Treći Martinov sin i njegova žena Matija r. Parlov imali su osmero djece: dva sina, Martina (1850.-) i Miju (1851.-1851.), te kćeri Luciju (1836.-1836.), Mandu (1838.-1838.), Božu (1839.-), Jozu (1845.-), Mariju (1852.-) i Matiju (1856.-). Mijo je umro nakon rođenja, a o Martinu nema drugih zapisa osim onoga o njegovu rođenju. Ne zna se je li umro ili se odselio. Nakon Martina ugasila se Mijina loza.","children":[],"label":"Mijo Martinov (★ 1814 – ✝ nepoznato)"},{"code":"2.2.3","detail":"Grgo Martinov se ženio dvaput. Iz prvog braka s Rosom r. Budimir imao je sina Lovru i kćer Jaku (1845.-). U drugom braku s Jakom rođ. Knežević, Grgo je imao sinove Matu (1853.-1856.) i Miju, te kćeri Matiju (1850.-), Jozu (1861.-1878.) i Veroniku (1866.-).","children":[{"code":"2.2.3.1","detail":"Lovro se oženio Ivom r. Parlov, s kojom je dobio sinove Antu, Ivana (1876.-) i Marijana, te kćeri prvu Luciju (1864.-1876.), Ivu (1884.-1908.) i drugu Luciju (-1877.). Ante i Marijan bili su jedini nasljednici loze. Njihovi su potomci imali trideset troje djece. U Matičnoj knjizi umrlih župe Ričice zapisano je da su Lovrinu kćer Lucu u trinaestoj godini života „ubile stine“.","children":[{"code":"2.2.3.1.1","detail":"Ante Lovrin bio je oženjen Tomicom r. Lukić i s njom je imao sinove Ivana, Marijana, prvoga Matu (1906.-1907.), drugoga Matu (1910.-) i Nikolu (1915.-1981.), te kćeri Martu (1901.-), Ivu (1905.-1911.) i Matiju (1908.-). Nasljednici loze bili su Ivan, Marijan, Mate i Nikola.","children":[{"code":"2.2.3.1.1.1","detail":"Najstariji Antin sin oženio se Marom r. Mršić. Imali su sinove Lovru, Mirka, Matu, Antu Vladu i Nikolu (1941.-), te kćer Tomicu (1930.-). Ivan je odselio u Slatinu, a Ivanovi potomci danas žive u Predavcu kod Bjelovara, Slatini, Obrovcu, Zagrebu i Njemačkoj.","children":[{"code":"2.2.3.1.1.1.1","detail":"Lovre kao najstariji Ivanov sin oženio je Roziku r. Peška s kojom je dobio dvije kćeri, Šteficu (1955.-) i Anu (1967.-). Obitelj živi u Slatini.","children":[],"label":"Lovre Ivanov (★ 1925 – ✝ nepoznato)"},{"code":"2.2.3.1.1.1.2","detail":"Mirko je oženio Danicu r. Lukić s kojom je dobio sinove Ivana i Veselka, te kćer Mirjanu (1957.-). Obitelj živi u Predavcu kraj Bjelovara.","children":[{"code":"2.2.3.1.1.1.2.1","detail":"Stariji Mirkov sin Ivan oženio je Nadu r. Kegalj i s njom dobio sinove Roberta i Kristijana. Obitelj živi u Predavcu kraj Bjelovara.","children":[],"label":"Ivan Mirkov (★ 1961 – ✝ nepoznato)"},{"code":"2.2.3.1.1.1.2.2","detail":"Mlađi Mirkov sin Veselko oženio je Martinu r. Hohmann i s njom ima sina Mirka i kćer Janinu. Obitelj živi u Predavcu.","children":[],"label":"Veselko Mirkov (★ 1964 – ✝ nepoznato)"}],"label":"Mirko Ivanov (★ 1928 – ✝ nepoznato)"},{"code":"2.2.3.1.1.1.3","detail":"Treći Ivanov sin oženio se Marijom Srebrnjak, s kojom je imao samo kćer Sandru (1967.-).","children":[],"label":"Mate Ivanov (★ 1932 – ✝ 1970)"},{"code":"2.2.3.1.1.1.4","detail":"Četvrti Ivanov sin, Ante Vlade, ženio se dva puta. U prvom braku s Karinom r. Mesch dobio je sinove Johana i Franza, te kćer Veroniku. U drugom braku s Tonkom r. Zanne nije imao djece. Obitelj se preselila u Obrovac.","children":[{"code":"2.2.3.1.1.1.4.1","detail":"Johan i njegova supruga Katarina r. Koniks imaju sina Gerda i kćer Maditu. Obitelj živi u Njemačkoj.","children":[],"label":"Johan Ante Vladin (★ 1960 – ✝ nepoznato)"},{"code":"2.2.3.1.1.1.4.2","detail":"Franz je oženio Honolore r. Genesen s kojom ima sina Marvina. Obitelj živi u Njemačkoj.","children":[],"label":"Franz Ante Vladin (★ 1966 – ✝ nepoznato)"}],"label":"Ante Vlade, Ivanov (★ 1934 – ✝ nepoznato)"}],"label":"Ivan Antin (★ 1896 – ✝ nepoznato)"},{"code":"2.2.3.1.1.2","detail":"Marijan Antin bio je u braku s Milicom r. Mikulić i imao je sinove Franu (1927.-1945.), koji je poginuo u Beču, i Antu (1929.-1929.), te kćeri Mariju (1930.-) i Stanu (1932.-1933.). Marijan je umro od upale pluća u trideset i petoj godini života. Marijanovi sinovi nisu imali potomaka, pa se njegova loza ugasila.","children":[],"label":"Marijan Antin (★ 1898 – ✝ 1933)"},{"code":"2.2.3.1.1.3","detail":"Mate, Antin sin, bio je oženjen Marom r. Knežević. Imali su sinove Antu Brunu i Franu, te kćeri Anu (1935.-), Dinku (1945.-) i Olgu (1952.-).","children":[{"code":"2.2.3.1.1.3.1","detail":"Doktor Bruno rođen je 7. listopada 1937. u Ričicama. Godine 1968. oženio se Vanjom r. Brkljača i s njom dobio sina Zvonimira, te kćeri Zrinku i Tomislavu.\n\nDr. Ante Bruno bio je hrvatski liječnik, narodni zastupnik u Saboru SR Hrvatske i sudionik Hrvatskog proljeća. Na izborima 1969. godine izabran je za zastupnika, a nakon sloma Hrvatskog proljeća oduzet mu je zastupnički imunitet.\n\nZbog svojega političkog djelovanja bio je uhićen i osuđen na dvije godine i četiri mjeseca strogog zatvora, koje je odslužio u Staroj Gradiški.","children":[{"code":"2.2.3.1.1.3.1.1","detail":"Zvonimir Brunin je oženio Anetu r. Gacek s kojom ima sina Oskara. Obitelj živi u Supetru na Braču.","children":[],"label":"Zvonimir, Ante Brune (★ 1973 – ✝ nepoznato)"}],"label":"Ante Bruno Matin (★ 1937 – ✝ 1989)"},{"code":"2.2.3.1.1.3.2","detail":"Mlađi Matin sin Frane oženio se Matijom r. Topalušić. Imali su sinove Matu i Antu (1976.-), te kćer Elzu (1978.). Žive u Ričicama.","children":[{"code":"2.2.3.1.1.3.2.1","detail":"Mate se oženio Anom Marijom r. Vlahović s kojom ima sinove Antu i Franu, te kćer Leonardu. Obitelj živi u Ričicama.","children":[],"label":"Mate Franin (★ 1973 – ✝ nepoznato)"}],"label":"Frane Matin (★ 1947 – ✝ nepoznato)"}],"label":"Mate Antin (★ 1910 – ✝ 1991)"},{"code":"2.2.3.1.1.4","detail":"Nikola Antin bio je oženjen Tomicom r. Budimir s kojom je imao sinove Antu (1950.-1950.), Dragu, Jerka i Ivana (1955.-1955.), te kćeri Matiju (1944.-), Branku (1947.-) i Mariju (1948.-). Jerko je bio oženjen Stankom Racetin, s kojom je imao kćer Anu (1985.-). Drago je jedini nasljednik loze i njegovi sinovi danas žive u Ričicama.","children":[{"code":"2.2.3.1.1.4.1","detail":"Drago sa suprugom Zdenkom r. Budimir dobio je dva sina, Nikolu (1976.- ) i Ivicu (1978.-). Sin Nikola Tandara je svećenik monfortanac u Poljskoj. Obitelj živi u Ričicama.","children":[{"code":"2.2.3.1.1.4.1.1","detail":"Ivica sa suprugom Jelenom r. Perić ima sina Nikolu i kćer Lauru. Žive u Ričicama.","children":[],"label":"Ivica Dragin (★ 1978 – ✝ nepoznato)"}],"label":"Drago Nikolin (★ 1952 – ✝ nepoznato)"},{"code":"2.2.3.1.1.4.2","detail":"Treći Nikolin sin oženio je Stanku r. Racetin s kojom ima kćer Anu (1985.- ). Muških potomaka nema. Obitelj živi u Ričicama.","children":[],"label":"Jerko Nikolin (★ 1953 – ✝ nepoznato)"}],"label":"Nikola Antin (★ 1915 – ✝ 1981)"}],"label":"Ante Lovrin (★ 1871 – ✝ 1933)"},{"code":"2.2.3.1.2","detail":"Marijan je oženio Lucu r. Parlov s kojom je dobio sinove Miju, Marina, Petra i Ivana (1924.-1925.), te kćeri Matiju (1907.- ), Anu (1910.- ), Ivu (1918.-2005.) i Tomicu (1921.- ). Ivan je umro nedugo nakon rođenja.","children":[{"code":"2.2.3.1.2.1","detail":"Najstariji Marijanov sin Mijo bio je u braku sa Slavkom r. Sablić s kojom je dobio devetero djece: sinove Vinka, Ivana (1932.-1932.), Milana, Marijana i ponovno Ivana (1950.-1952.), te kćeri Milu-Ivu (1933.- ), Anicu (1935.- ), Nadu (1940.- ) i Macu (1947.- ). Samo su sinovi Vinko, Milan i Marijan nastavili Mijinu lozu. Vinkovi i Milanovi potomci danas žive u Ričicama, Splitu, Zagrebu, Austriji i Njemačkoj.","children":[{"code":"2.2.3.1.2.1.1","detail":"Vinko je oženio Maru Dragicu r. Budimir s kojom je dobio sinove Milenka (1955.-1956.) i Svetka, te kćeri Dragicu (1957.-) i Milosavu (1959.- ).","children":[{"code":"2.2.3.1.2.1.1.1","detail":"Svetko je oženio Nevenku r. Tavra s kojom je dobio sina Kristijana.","children":[],"label":"Svetko Vinkov (★ 1960 – ✝ nepoznato)"}],"label":"Vinko Mijin (★ 1930 – ✝ nepoznato)"},{"code":"2.2.3.1.2.1.2","detail":"Milan Mijin je oženio Stanu r. Tandara s kojom je dobio tri sina: Nediljka, Željka i Tihomira, te kćer Slavicu (1965.- ).","children":[{"code":"2.2.3.1.2.1.2.1","detail":"Nediljko je oženio Vesnu r. Mandić s kojom je dobio sina Milana, te kćeri Anu Mariju i Elizabetu.","children":[],"label":"Nediljko Milanov (★ 1962 – ✝ nepoznato)"},{"code":"2.2.3.1.2.1.2.2","detail":"Željko je oženio Valeriju r. Glavota s kojom je imao tri kćeri: Mihaelu, Mariju i Stanu. Muških potomaka nije imao.","children":[],"label":"Željko Milanov (★ 1967 – ✝ 2020)"},{"code":"2.2.3.1.2.1.2.3","detail":"Tihomir je oženio Anicu r. Miloš s kojom je dobio sina Milana i kćer Ivanu.","children":[],"label":"Tihomir Milanov (★ 1969 – ✝ nepoznato)"}],"label":"Milan Mijin (★ 1938 – ✝ nepoznato)"},{"code":"2.2.3.1.2.1.3","detail":"Marijan je oženio Milenku r. Budimir i s njom ima sina Marija i kćer Silvanu (1965.- ).","children":[{"code":"2.2.3.1.2.1.3.1","detail":"Mario je oženio Jasminku r. Ilić i nema muških potomaka koji bi nastavili lozu.","children":[],"label":"Mario Marijanov (★ 1974 – ✝ nepoznato)"}],"label":"Marijan Mijin (★ 1942 – ✝ nepoznato)"}],"label":"Mijo Marijanov (★ 1908 – ✝ nepoznato)"},{"code":"2.2.3.1.2.2","detail":"Marin je oženio Matiju r. Žuljić s kojom je dobio sinove Marijana (1941.-1943.), Alojza, Luku (1948.-1948.), Vicu i Blaža, te kćeri Dragicu (1938.-), Nevenku (1944.- ) i Anku (1954.- ). Marinovi potomci danas žive u Ričicama, Splitu, Zagrebu i Njemačkoj.","children":[{"code":"2.2.3.1.2.2.1","detail":"Alojz je oženio Dragicu r. Jurčević s kojom ima sina Roberta (1970.- ) i kćer Zrinku (1971.- ).","children":[{"code":"2.2.3.1.2.2.1.1","detail":"Robert je oženio Sabinu r. Patzak s kojom ima sina Marca Marina i kćeri Carolinu Victoriu i Lauru Nadine.","children":[],"label":"Robert Alojzov"}],"label":"Alojz Marinov (★ 1946 – ✝ nepoznato)"},{"code":"2.2.3.1.2.2.2","detail":"Vice Marinov je oženjen Ružicom r. Barnjak s kojom nema djece. Vicu navodim kao zaslužnog pojedinca za pokretanje ovog projekta.","children":[],"label":"Vice Marinov (★ 1949 – ✝ nepoznato)"},{"code":"2.2.3.1.2.2.3","detail":"Blaž je oženio Zoranu r. Čariju s kojom je dobio tri sina: Marija (1977.- ), Antu (1980.- ) i Vicu (1983.- ). Vice se nije ženio.","children":[{"code":"2.2.3.1.2.2.3.1","detail":"Mario je oženio Josipu r. Artić s kojom ima sina Lovru i kćer Tonku.","children":[],"label":"Mario Blažev (★ 1977 – ✝ nepoznato)"},{"code":"2.2.3.1.2.2.3.2","detail":"Ante je oženio Tanju r. Koren s kojom ima sina Petra. Obitelj živi u Ričicama.","children":[],"label":"Ante Blažev (★ 1980 – ✝ nepoznato)"}],"label":"Blaž Marinov (★ 1953 – ✝ nepoznato)"}],"label":"Marin Marijanov (★ 1912 – ✝ 1989)"},{"code":"2.2.3.1.2.3","detail":"Petar je oženio Zorku r. Pavić s kojom je dobio sina Antu (1942.-1943.), te kćeri Milu (1947.-), Mariju (1950.-), Ankicu (1952.-), Miru (1954.-), Zorku (1955.-), Rosu (1958.-) i Nadu (1960.-1962.). Petar nije imao nasljednika loze.","children":[],"label":"Petar Marijanov (★ 1915 – ✝ nepoznato)"}],"label":"Marijan Lovrin (★ 1881 – ✝ 1939) - nadimak potomaka: LOVRIĆI"}],"label":"Lovro Grgin (★ 1842 – ✝ 1922)"},{"code":"2.2.3.2","detail":"Treći Grgin sin Mijo oženio se Ivom Tandara, s kojom je dobio sedmero djece: sinove Martina (1886.-1905.), prvoga Nikolu (1889.-), Matu (1892.-) i drugoga Nikolu (1902.-), te kćeri Ivu (1883.-), prvu Maru (1886.-1891.) i drugu Maru (1894.-). Martin je umro u dobi od 19 godina, a prvi Nikola i Mate umrli su kao mala djeca. O drugom Nikoli nema drugih podataka osim zapisa o njegovu rođenju. Ni za jednoga Mijina sina nema podataka da se ženio ili imao djecu, pa se njegova obiteljska grana time ugasila.","children":[],"label":"Mijo Grgin (★ 1856 – ✝ 1933)"}],"label":"Grgo Martinov (★ 1818 – ✝ nepoznato)"}],"label":"Martin Petrov (★ 1775 – ✝ 1844)"},{"code":"2.3","detail":"Mijo Petrov, peti Petrov sin, koji se oženio Ružom nepoznatog prezimena, imao je samo kćer Matiju (1810.– ). Mijo nije imao nasljednika loze.\n\nGodine 1819. obitelj Martina Tandare, Lovrina djeda, bila je u Zavelimu. Na tom su popisu navedeni Martinovi sinovi Ivan, Mijo i Grgo. Kad je 1835. godine izrađivan austrijski katastar, Martin Tandara pok. Petra upisan je kao posjednik nekretnina u Ričicama. Većina ričićkih plemena imala je u to vrijeme nekretnine u Ričicama, Zavelimu, Podbiloj i Viru. Navedena sela imala su zajedničku župu u Ričicama. Mnoge obitelji unutar jednog roda selile su se s jednog lokaliteta na drugi, čak i u samim Ričicama. Broj stanovnika je naglo rastao i tražili su se novi prostori za život. U tom kontekstu možemo razumjeti i prihvatiti činjenicu da je neka obitelj, ili njezin dio, u jednom popisu bila u Ričicama, a u sljedećeg u Zavelimu ili obrnuto. Međutim, pouzdano se zna da se Grgo s djecom iz Zavelima vratio u Ričice i ondje nastavio život sa svojom obitelji.","children":[],"label":"Mijo Petrov (★ nepoznato – ✝ nepoznato)"}],"label":"Petar Tandara (★ 1734 – ✝ 1817)"};

function collectResults(rawQuery){const results=[];walk(DATA,node=>{const context=PERSON_SEARCH_CONTEXT[node.code]||{},aliases=(PERSON_SEARCH_ALIASES[node.code]||[]).join(' '),primary=node.code+' '+node.label,personContext=[context.father,context.mother,aliases].join(' '),primaryScore=score(rawQuery,primary,personContext);if(Number.isFinite(primaryScore)){results.push({type:'node',node,hostCode:node.code,score:primaryScore,matchKind:'person'});}else{const detailScore=fuzzyFieldScore(rawQuery,node.detail||'');if(Number.isFinite(detailScore)&&detailScore<=1.35)results.push({type:'node',node,hostCode:node.code,score:detailScore+7,matchKind:'detail'});}});VIRTUAL_PEOPLE.forEach((person,index)=>{const primary=[person.label,person.name,person.rawName,person.qualifier].join(' '),secondary=[person.father,person.mother,person.gender,person.hostCode].join(' '),value=score(rawQuery,primary,secondary);if(Number.isFinite(value))results.push({type:'virtual',person,index,hostCode:person.hostCode,score:value+.35,matchKind:'person'});});Object.entries(FAMILY_META).forEach(([hostCode,families])=>families.forEach((family,index)=>{const node=findNode(hostCode),value=score(rawQuery,family.spouse,[node?.label,family.sons.join(' '),family.daughters.join(' ')].join(' '));if(Number.isFinite(value))results.push({type:'spouse',family,index,node,hostCode,score:value+.45,matchKind:'spouse'});}));const strongVirtualHosts=new Set(results.filter(result=>result.type==='virtual'&&result.score<=4).map(result=>result.hostCode));const filtered=results.filter(result=>!(result.type==='node'&&result.matchKind==='detail'&&strongVirtualHosts.has(result.hostCode)));const unique=new Map();for(const result of filtered){const label=result.type==='virtual'?result.person?.label:result.type==='spouse'?result.family?.spouse:result.node?.label;const key=[result.type,result.hostCode,normalize(label)].join('|');const previous=unique.get(key);if(!previous||result.score<previous.score)unique.set(key,result);}const order function centerNode(code){
  requestAnimationFrame(()=>{
    const escapedCode=String(code).replace(/"/g,'\"');
    const target=nodesLayer.querySelector('[data-code="'+escapedCode+'"]');
    if(!target)return;
    const currentRect=target.getBoundingClientRect();
    const desiredWidth=svg.clientWidth<700?190:250;
    if(currentRect.width>0){scale=Math.max(.16,Math.min(3,scale*desiredWidth/currentRect.width));}
    applyTransform();
    requestAnimationFrame(()=>{
      const nodeRect=target.getBoundingClientRect(),svgRect=svg.getBoundingClientRect(),rootMatrix=svg.getScreenCTM();
      const unitX=rootMatrix?Math.max(.001,Math.hypot(rootMatrix.a,rootMatrix.b)):1;
      const unitY=rootMatrix?Math.max(.001,Math.hypot(rootMatrix.c,rootMatrix.d)):1;
      panX+=(svgRect.left+svgRect.width/2-(nodeRect.left+nodeRect.width/2))/unitX;
      panY+=(svgRect.top+svgRect.height/2-(nodeRect.top+nodeRect.height/2))/unitY;
      applyTransform();
      target.classList.remove('tandara-search-focus');
      void target.getBBox();
      target.classList.add('tandara-search-focus');
      window.setTimeout(()=>target.classList.remove('tandara-search-focus'),2400);
    });
  });
}

const fullscreenButton=document.getElementById('fullscreenDiagram'),fullscreenLabel=document.getElementById('fullscreenLabel');
async function toggleFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();}else{await document.exitFullscreen();}}catch(error){announce('Preglednik nije dopustio prikaz preko cijelog ekrana.');}}
if(document.fullscreenEnabled){fullscreenButton.onclick=toggleFullscreen;}else{fullscreenButton.disabled=true;fullscreenButton.title='Cijeli ekran nije podržan u ovom pregledniku';}
document.addEventListener('fullscreenchange',()=>{const active=Boolean(document.fullscreenElement);fullscreenLabel.textContent=active?'Izađi iz cijelog ekrana':'Cijeli ekran';fullscreenButton.setAttribute('aria-label',active?'Izađi iz prikaza preko cijelog ekrana':'Prikaži dijagram preko cijelog ekrana');syncHeaderHeight();requestAnimationFrame(fitTree);announce(active?'Uključen je prikaz preko cijelog ekrana.':'Isključen je prikaz preko cijelog ekrana.');});
document.getElementById('printDiagram').onclick=()=>{announce('Otvoren je pregled za ispis dijagrama.');window.print();};
document.getElementById('findBtn').onclick=search;
searchInput.addEventListener('keydown',event=>{if(event.key==='Enter')search();if(event.key==='Escape')closeSearchResults();});
document.getElementById('searchResultsClose').onclick=()=>{closeSearchResults();searchInput.focus();};
window.addEventListener('resize',positionSearchResults);document.addEventListener('scroll',positionSearchResults,true);document.querySelector('.toolbar-scroll')?.addEventListener('scroll',positionSearchResults,{passive:true});
document.addEventListener('click',event=>{if(!event.target.closest('.search-wrap'))closeSearchResults();});
document.getElementById('closeDetails').onclick=()=>{details.classList.remove('open');announce('Detalji su zatvoreni.');};
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeSearchResults();details.classList.remove('open');}});
svg.addEventListener('wheel',event=>{event.preventDefault();const rect=svg.getBoundingClientRect();zoomAt(event.deltaY<0?1.12:.89,event.clientX-rect.left,event.clientY-rect.top);},{passive:false});
function pointerPoint(event){const rect=svg.getBoundingClientRect();return{x:event.clientX-rect.left,y:event.clientY-rect.top};}
svg.addEventListener('pointerdown',event=>{if(event.target.closest?.('.node,.family-action'))return;svg.setPointerCapture(event.pointerId);pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,panX,panY};svg.classList.add('dragging');}else if(pointers.size===2){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y);pinchStart={distance,scale,panX,panY,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};dragStart=null;}});
svg.addEventListener('pointermove',event=>{if(!pointers.has(event.pointerId))return;pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1&&dragStart){const p=[...pointers.values()][0];panX=dragStart.panX+(p.x-dragStart.x);panY=dragStart.panY+(p.y-dragStart.y);applyTransform();}else if(pointers.size===2&&pinchStart){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,newScale=Math.max(.12,Math.min(3.5,pinchStart.scale*(distance/pinchStart.distance))),ratio=newScale/pinchStart.scale;scale=newScale;panX=cx-(pinchStart.cx-pinchStart.panX)*ratio;panY=cy-(pinchStart.cy-pinchStart.panY)*ratio;applyTransform();}});
function endPointer(event){pointers.delete(event.pointerId);if(pointers.size<2)pinchStart=null;if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,panX,panY};}else if(!pointers.size){dragStart=null;svg.classList.remove('dragging');}}
svg.addEventListener('pointerup',endPointer);svg.addEventListener('pointercancel',endPointer);
function expandEmbeddedDiagramArea(){
 if(window.self===window.top)return;
 try{
  const frame=window.frameElement,parentDoc=window.parent.document,parentWin=window.parent;
  if(!frame)return;
  const layout=parentDoc.querySelector('.layout');
  const contentPage=frame.closest('.content-page')||parentDoc.querySelector('.content-page');
  const card=frame.closest('.content-card')||parentDoc.querySelector('.content-card');
  const wrap=frame.parentElement;
  if(layout){layout.style.maxWidth='none';layout.style.width='100%';layout.style.margin='0';layout.style.gap='0';layout.style.padding='0';}
  if(contentPage){contentPage.style.width='100%';contentPage.style.maxWidth='none';contentPage.style.minWidth='0';contentPage.style.padding='0';contentPage.style.justifyContent='stretch';}
  let leftPad=0,rightPad=0;
  if(card){
   const cardStyle=parentWin.getComputedStyle(card);
   leftPad=parseFloat(cardStyle.paddingLeft)||0;rightPad=parseFloat(cardStyle.paddingRight)||0;
   card.style.width='100%';card.style.maxWidth='none';card.style.margin='0';card.style.borderRadius='0';
  }
  if(wrap){wrap.style.maxWidth='none';wrap.style.width=`calc(100% + ${leftPad+rightPad}px)`;wrap.style.marginLeft=`-${leftPad}px`;wrap.style.marginRight=`-${rightPad}px`;wrap.style.marginTop='30px';wrap.style.marginBottom='0';}
  frame.style.display='block';frame.style.width='100%';frame.style.maxWidth='none';frame.style.margin='0';frame.style.borderLeft='0';frame.style.borderRight='0';frame.style.borderRadius='0';
 }catch(error){/* Samostalni prikaz ostaje potpuno funkcionalan. */}
}
function syncHeaderHeight(){const header=document.querySelector('header');if(header)document.documentElement.style.setProperty('--header-height',header.offsetHeight+'px');}
window.addEventListener('resize',()=>{syncHeaderHeight();expandEmbeddedDiagramArea();requestAnimationFrame(fitTree);});
expandEmbeddedDiagramArea();syncHeaderHeight();setExpandedToDepth(1);render();requestAnimationFrame(fitTree);
</script>
</body>
