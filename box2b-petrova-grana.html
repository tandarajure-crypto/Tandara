<script>
const DATA={"code":"2.0","detail":"Petar Tandara je bio Ivanov drugi sin. Umro je 1817. godine u osamdeset i trećoj godini života, pa se procjenjuje da je rođen oko 1734. godine. Petar je bio oženjen Jelom r. Budić. Imali su sinove Grgu, Jakova (1773.), Martina, Marijana (1781.–), Miju, Tadiju i Marka (1787.–), te kćeri Mandu (1777.–) i Jelu (–1824.). Sinovi Jakov (1773.–), Marijan (1781.–), Tadija i Marko (1787.–), ne pojavljuju se na Popisu duša iz 1806. godine, a Tadija je izostavljen s popisa iz 1819. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"2.1","detail":"Grgo, najstariji Petrov sin, oženio je Ružu r. Pušić. Imali su sina Šimuna i kćer Ivu (1798.–).","children":[{"code":"2.1.1","detail":"Šimun je bio oženjen Jelom r. Budimir s kojom je imao sina Matu (1826.–), te kćeri Ivu (1831.–), Matiju (1837.–) i Martu (1845.–). O sinu Mati postoje samo podaci o godini rođenja, pa se ne može utvrditi njegov daljnji životni put niti okolnosti koje su dovele do toga da o njemu nema sačuvanih zapisa. Nakon sina Mate Šimunova je loza izumrla.","children":[],"label":"Šimun Grgin (★ 1800. – ✝ 1874.)"}],"label":"Grgo Petrov (★ 1770. – ✝ nepoznato)"},{"code":"2.2","detail":"Martin, treći Petrov sin, oženio se Ružom r. Lekić. Imali su sinove Ivana, Juru (1811.–), Miju, Grgu, Filipa (1821.–) i Josipa (1824.–), te kćeri Matiju i Anu (1828.–). Za Juru, Filipa i Josipa nisu pronađeni drugi zapisi osim onih o njihovu krštenju, pa nije poznato jesu li umrli mladi ili su se odselili. Mijini sinovi nisu ostavili muške potomke, pa su obiteljsku lozu nastavili samo Martinovi sinovi Ivan i Grgo.","children":[{"code":"2.2.1","detail":"Ivan, najstariji Martinov sin, oženio se 1826. Anticom r. Lažeta. Ivan i Antica imali su tri sina: Marijana (1828.–1828.), Tomu i Juru (1840.–), te kćeri Ružu (1834.–), Ivu, Jozu (1839.–1839.) i Matiju (1841.–). O Juri nisu pronađeni drugi podaci osim zapisa o njegovu rođenju. Toma je bio jedini nasljednik Ivanove loze i začetnik loze pod nadimkom TROMIĆI.","children":[{"code":"2.2.1.1","detail":"Toma je bio oženjen Tomicom r. Kovač. Imali su sinove Ivana (1866.–), Matu (1870.–), Juru i ponovno Ivana (1879.–1879.). Jedini Tomin nasljednik bio je sin Jure. Tomina loza u Zavelimu bila je poznata pod nadimkom TROMIĆI, nastalim prema predaji o njihovoj visini i sporom, tromom hodu.","children":[{"code":"2.2.1.1.1","detail":"Treći Tomin sin i jedini nasljednik uzeo je za ženu Ivu r. Lažeta. Imali su sinove Tomu (1909.–1914.) i Ivana (1911.–1915.), zatim Pia, Dominika i Matu, te kćer Matiju (1908.–). Lozu su nastavili sinovi Pio, Dominik i Mate.","children":[{"code":"2.2.1.1.1.1","detail":"Pio je oženio Tereziju Budimir i imao potomke. Njihovi sinovi Ivan (1935.–2025.), Jure (1943.–2004.) i Jozo (1949.–2019.) preminuli su. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"2.2.1.1.1.1.1","detail":"Ivan Piin živio je od 1935. do 2025. godine. Bio je oženjen i imao potomke. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"2.2.1.1.1.1.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Ivan Piin (★ 1935. – ✝ 2025.)"},{"code":"2.2.1.1.1.1.2","detail":"Jure Piin oženio je Milu Škorić. Njihov sin Tomislav nije se ženio. Podaci o ostalim vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[],"label":"Jure Piin (★ 1943. – ✝ 2004.)"},{"code":"2.2.1.1.1.1.3","detail":"Jozo Piin živio je od 1949. do 2019. godine i umro je u Splitu. Bio je oženjen i imao potomke. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[],"label":"Jozo Piin (★ 1949. – ✝ 2019.)"}],"label":"Pio Jurin (★ 1916. – ✝ 1990.)"},{"code":"2.2.1.1.1.2","detail":"Četvrti Jurin sin Dominik bio je oženjen Marom r. Knezović. Njegova se loza nastavila preko potomaka. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"2.2.1.1.1.2.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"},{"code":"2.2.1.1.1.2.2","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"},{"code":"2.2.1.1.1.2.3","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"},{"code":"2.2.1.1.1.2.4","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"},{"code":"2.2.1.1.1.2.5","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"},{"code":"2.2.1.1.1.2.6","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Dominik Jurin (★ 1919. – ✝ 1987.)"},{"code":"2.2.1.1.1.3","detail":"Mate, peti Jurin sin, oženio je Maru r. Budić. Imali su sinove Tomislava i Miju (1955.–1960.). Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"2.2.1.1.1.3.1","detail":"Tomislav Matin živio je od 1947. do 2014. godine. Bio je oženjen i imao potomke. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"2.2.1.1.1.3.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Tomislav Matin (★ 1947. – ✝ 2014.)"}],"label":"Mate Jurin (★ 1922. – ✝ 1963.)"}],"label":"Jure Tomin (★ 1874. – ✝ 1931.)"}],"label":"Toma Ivanov (★ 1830. – ✝ nepoznato)"}],"label":"Ivan Martinov (★ 1807. – ✝ 1877.)"},{"code":"2.2.2","detail":"Treći Martinov sin i njegova žena Matija r. Parlov imali su osmero djece: dva sina, Martina (1850.–) i Miju (1851.–1851.), te kćeri Luciju (1836.–1836.), Mandu (1838.–1838.), Božu (1839.–), Jozu (1845.–), Mariju (1852.–) i Matiju (1856.–). Mijo je umro nakon rođenja, a o Martinu nema drugih zapisa osim onoga o njegovu rođenju. Nakon Martina ugasila se Mijina loza. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[],"label":"Mijo Martinov (★ 1814. – ✝ nepoznato)"},{"code":"2.2.3","detail":"Grgo Martinov se ženio dvaput. Iz prvog braka s Rosom r. Budimir imao je sina Lovru i kćer Jaku (1845.–). U drugom braku s Jakom rođ. Knežević, Grgo je imao sinove Matu (1853.–1856.) i Miju, te kćeri Matiju (1850.–), Jozu (1861.–1878.) i Veroniku (1866.–).","children":[{"code":"2.2.3.1","detail":"Lovro se oženio Ivom r. Parlov, s kojom je dobio sinove Antu, Ivana (1876.–) i Marijana, te kćeri prvu Luciju (1864.–1876.), Ivu (1884.–1908.) i drugu Luciju (–1877.). Ante i Marijan bili su jedini nasljednici loze. Njihovi su potomci imali trideset troje djece. U Matičnoj knjizi umrlih župe Ričice zapisano je da su Lovrinu kćer Lucu u trinaestoj godini života „ubile stine“.","children":[{"code":"2.2.3.1.1","detail":"Ante Lovrin bio je oženjen Tomicom r. Lukić i s njom je imao sinove Ivana, Marijana, prvoga Matu (1906.–1907.), drugoga Matu (1910.–) i Nikolu (1915.–1981.), te kćeri Martu (1901.–), Ivu (1905.–1911.) i Matiju (1908.–). Nasljednici loze bili su Ivan, Marijan, Mate i Nikola.","children":[{"code":"2.2.3.1.1.1","detail":"Ivan je oženio Maru Mršić i imao potomke. Njihov sin Mate (1932.–1970.) preminuo je. Ivan se odselio u Slatinu. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"2.2.3.1.1.1.1","detail":"Povijesni podatak o ovoj osobi ostaje javno dostupan. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[],"label":"Lovre Ivanov (★ 1925. – ✝ nepoznato)"},{"code":"2.2.3.1.1.1.2","detail":"Povijesni podatak o ovoj osobi ostaje javno dostupan. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"2.2.3.1.1.1.2.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"},{"code":"2.2.3.1.1.1.2.2","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Mirko Ivanov (★ 1928. – ✝ nepoznato)"},{"code":"2.2.3.1.1.1.3","detail":"Mate Ivanov živio je od 1932. do 1970. godine. Bio je oženjen i imao potomke. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[],"label":"Mate Ivanov (★ 1932. – ✝ 1970.)"},{"code":"2.2.3.1.1.1.4","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"2.2.3.1.1.1.4.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"},{"code":"2.2.3.1.1.1.4.2","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Živi potomak – privatni podaci"}],"label":"Ivan Antin (★ 1896. – ✝ nepoznato)"},{"code":"2.2.3.1.1.2","detail":"Marijan Antin bio je u braku s Milicom r. Mikulić i imao je sinove Franu (1927.–1945.), koji je poginuo u Beču, i Antu (1929.–1929.), te kćeri Mariju (1930.–) i Stanu (1932.–1933.). Marijan je umro od upale pluća u trideset i petoj godini života. Marijanovi sinovi nisu imali potomaka, pa se njegova loza ugasila.","children":[],"label":"Marijan Antin (★ 1898. – ✝ 1933.)"},{"code":"2.2.3.1.1.3","detail":"Mate je oženio Maru Knežević i function wrapText(text,max=36){const words=String(text||'').split(/\s+/),lines=[];let line='';for(const word of words){const test=(line+' '+word).trim();if(test.length>max&&line){lines.push(line);line=word;}else line=test;}if(line)lines.push(line);if(lines.length>2)lines[1]=lines.slice(1).join(' ').slice(0,max-1)+'…';return lines.slice(0,2);}

function showMarriageDetails(code,index){const node=findNode(code),family=(FAMILY_META[code]||[])[index];if(!node||!family)return;document.getElementById('detailTitle').textContent='Supruga: '+family.spouse;document.getElementById('detailCode').textContent='Bračni par · obiteljski zapis '+code;const sons=family.sons.length?family.sons.join('\n• '):'nema zabilježenih';const daughters=family.daughters.length?family.daughters.join('\n• '):'nema zabilježenih';document.getElementById('detailText').textContent='Nositelj prezimena: '+node.label+'\nSupruga: '+family.spouse+'\nUkupno djece: '+family.total+'\n\nSinovi ('+family.sons.length+'):\n• '+sons+'\n\nKćeri ('+family.daughters.length+'):\n• '+daughters;details.classList.add('open');announce('Otvoreni podaci o bračnom paru '+node.label+' i '+family.spouse);}
function showDaughtersDetails(code,index){const node=findNode(code),family=(FAMILY_META[code]||[])[index];if(!node||!family)return;document.getElementById('detailTitle').textContent='Kćeri bračnog para';document.getElementById('detailCode').textContent=node.label+' + '+family.spouse;document.getElementById('detailText').textContent='Ukupno djece: '+family.total+'\nBroj kćeri: '+family.daughters.length+'\n\n'+(family.daughters.length?'• '+family.daughters.join('\n• '):'Nema zabilježenih kćeri u ovom braku.');details.classList.add('open');announce('Otvoren je popis kćeri bračnog para.');}
function applyTransform(){viewport.setAttribute('transform',`translate(${panX},${panY}) scale(${scale})`);}
function fitTree(){const rect=svg.getBoundingClientRect();if(!rect.width||!rect.height)return;scale=Math.max(.12,Math.min((rect.width-42)/bounds.width,(rect.height-42)/bounds.height,1.15));panX=(rect.width-bounds.width*scale)/2;panY=(rect.height-bounds.height*scale)/2;applyTransform();announce('Dijagram je uklopljen u zaslon.');}
function zoomAt(factor,cx,cy){const old=scale;scale=Math.max(.12,Math.min(3.5,scale*factor));panX=cx-(cx-panX)*(scale/old);panY=cy-(cy-panY)*(scale/old);applyTransform();}
function expandAncestors(code){const parts=code.split('.');DATA.expanded=true;for(let i=2;i<parts.length;i++){const node=findNode(parts.slice(0,i).join('.'));if(node)node.expanded=true;}}
function normalize(value){return String(value||'').toLocaleLowerCase('hr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/dž/g,'d').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');}
function phonetic(value){return normalize(value).replace(/dj/g,'d').replace(/ije/g,'e').replace(/je/g,'e');}
function croatianStem(value){let word=phonetic(value);if(word.length<4)return word;const suffixes=['ovima','evima','inima','ovoga','evoga','inoga','ovome','evome','inome','ovomu','evomu','inomu','ovom','evom','inom','ovog','evog','inog','ovoj','evoj','inoj','ovim','evim','inim','ova','eva','ina','ovo','evo','ino','ove','eve','ine','ovu','evu','inu','ovi','evi','ini','ov','ev','in','ama','ima','ome','emu','oga','ega','om','em','oj','a','e','i','u'];for(const suffix of suffixes){if(word.endsWith(suffix)&&word.length-suffix.length>=3)return word.slice(0,-suffix.length);}return word;}
function editDistance(left,right){const a=phonetic(left),b=phonetic(right);if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;const prev=Array.from({length:b.length+1},(_,i)=>i),curr=new Array(b.length+1);for(let i=1;i<=a.length;i++){curr[0]=i;for(let j=1;j<=b.length;j++){const cost=a[i-1]===b[j-1]?0:1;curr[j]=Math.min(curr[j-1]+1,prev[j]+1,prev[j-1]+cost);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])curr[j]=Math.min(curr[j],prev[j-2]+1);}for(let j=0;j<=b.length;j++)prev[j]=curr[j];}return prev[b.length];}
function tokenSimilarity(queryToken,fieldToken){const q=normalize(queryToken),f=normalize(fieldToken);if(!q||!f)return Infinity;if(q===f)return 0;const qp=phonetic(q),fp=phonetic(f);if(qp===fp)return .15;if(q.length>=3&&(f.startsWith(q)||q.startsWith(f)))return .35;const shorter=Math.min(qp.length,fp.length),longer=Math.max(qp.length,fp.length);if(shorter>=4&&shorter/longer>=.6&&(fp.includes(qp)||qp.includes(fp)))return .5;const qs=croatianStem(q),fs=croatianStem(f);if(qs.length>=3&&qs===fs)return .6;const distance=editDistance(qp,fp),longest=Math.max(qp.length,fp.length),allowed=longest>=8?2:longest>=4?1:0;if(distance<=allowed)return .75+distance*.35;if(longest>=5&&distance/longest<=.24)return 1.65;return Infinity;}
function fuzzyFieldScore(query,field){const q=normalize(query),f=normalize(field);if(!q||!f)return Infinity;if(q===f)return 0;if(f.startsWith(q))return .2;if(f.includes(q))return .35;const qp=phonetic(q),fp=phonetic(f);if(qp===fp)return .25;if(fp.includes(qp))return .5;const queryTokens=q.split(' ').filter(Boolean),fieldTokens=f.split(' ').filter(Boolean);if(!queryTokens.length||!fieldTokens.length)return Infinity;let total=0;for(const queryToken of queryTokens){let best=Infinity;for(const fieldToken of fieldTokens)best=Math.min(best,tokenSimilarity(queryToken,fieldToken));if(!Number.isFinite(best))return Infinity;total+=best;}return 1+total/queryTokens.length+Math.max(0,fieldTokens.length-queryTokens.length)*.015;}
function tokensMatch(query,field){return Number.isFinite(fuzzyFieldScore(query,field));}
function score(query,primary,secondary=''){const primaryScore=fuzzyFieldScore(query,primary);if(Number.isFinite(primaryScore))return primaryScore;const combinedScore=fuzzyFieldScore(query,[primary,secondary].filter(Boolean).join(' '));return Number.isFinite(combinedScore)?combinedScore+.5:Infinity;}
function matchQuality(value){if(value<=.3)return'Točno podudaranje';if(value<=1.2)return'Vrlo slično';if(value<=2.2)return'Približno podudaranje';return'Moguće podudaranje';}
function compareCodes(a,b){const left=a.split('.').map(Number),right=b.split('.').map(Number);for(let i=0;i<Math.max(left.length,right.length);i++){const d=(left[i]||0)-(right[i]||0);if(d)return d;}return 0;}
function collectResults(rawQuery){const results=[];walk(DATA,node=>{const context=PERSON_SEARCH_CONTEXT[node.code]||{},aliases=(PERSON_SEARCH_ALIASES[node.code]||[]).join(' '),primary=node.code+' '+node.label,personContext=[context.father,context.mother,aliases].join(' '),primaryScore=score(rawQuery,primary,personContext);if(Number.isFinite(primaryScore)){results.push({type:'node',node,hostCode:node.code,score:primaryScore,matchKind:'person'});}else{const detailScore=fuzzyFieldScore(rawQuery,node.detail||'');if(Number.isFinite(detailScore)&&detailScore<=1.35)results.push({type:'node',node,hostCode:node.code,score:detailScore+7,matchKind:'detail'});}});VIRTUAL_PEOPLE.forEach((person,index)=>{const primary=[person.label,person.name,person.rawName,person.qualifier].join(' '),secondary=[person.father,person.mother,person.gender,person.hostCode].join(' '),value=score(rawQuery,primary,secondary);if(Number.isFinite(value))results.push({type:'virtual',person,index,hostCode:person.hostCode,score:value+.35,matchKind:'person'});});Object.entries(FAMILY_META).forEach(([hostCode,families])=>families.forEach((family,index)=>{const node=findNode(hostCode),value=score(rawQuery,family.spouse,[node?.label,family.sons.join(' '),family.daughters.join(' ')].join(' '));if(Number.isFinite(value))results.push({type:'spouse',family,index,node,hostCode,score:value+.45,matchKind:'spouse'});}));const strongVirtualHosts=new Set(results.filter(result=>result.type==='virtual'&&result.score<=4).map(result=>result.hostCode));const filtered=results.filter(result=>!(result.type==='node'&&result.matchKind==='detail'&&strongVirtualHosts.has(result.hostCode)));const unique=new Map();for(const result of filtered){const label=result.type==='virtual'?result.person?.label:result.type==='spouse'?result.family?.spouse:result.node?.label;const key=[result.type,result.hostCode,normalize(label)].join('|');const previous=unique.get(key);if(!previous||result.score<previous.score)unique.set(key,result);}const ordered=[...unique.values()].sort((a,b)=>a.score-b.score||compareCodes(a.hostCode,b.hostCode)||String(a.person?.label||a.family?.spouse||a.node?.label).localeCompare(String(b.person?.label||b.family?.spouse||b.node?.label),'hr'));if(!ordered.length)return[];const best=ordered[0].score,wordCount=normalize(rawQuery).split(' ').filter(Boolean).length,cutoff=best<=.75?(wordCount>=2?2.25:1.8):best<=2.1?best+.9:best+1.2;return ordered.filter(result=>result.score<=cutoff).slice(0,30);}
function closeSearchResults(){document.getElementById('searchResults').hidden=true;document.getElementById('searchResultItems').innerHTML='';searchInput.setAttribute('aria-expanded','false');}
function centerNode(code){
  requestAnimationFrame(()=>{
const target = Array.from(
  nodesLayer.querySelectorAll('[data-code]')
).find(function (node) {
  return node.getAttribute('data-code') === String(code);
});
   
   if(!target)return;
   
    const currentRect=target.getBoundingClientRect();
    const desiredWidth=svg.clientWidth<700?190:250;
    if(currentRect.width>0){scale=Math.max(.16,Math.min(3,scale*desiredWidth/currentRect.width));}
    applyTransform();
    requestAnimationFrame(()=>{
      const nodeRect=target.getBoundingClientRect(),svgRect=svg.getBoundingClientRect(),rootMatrix=svg.getScreenCTM();
      const unitX=rootMatrix?Math.max(.001,Math.hypot(rootMatrix.a,rootMatrix.b)):1;
      const unitY=rootMatrix?Math.max(.001,Math.hypot(rootMatrix.c,rootMatrix.d)):1;
      panX+=(svgRect.left+svgRect.width/2-(nodeRect.left+nodeRect.width/2))/unitX;
      panY+=(svgRect.top+svgRect.height/2-(nodeRect.top+nodeRect.height/2))/unitY;
      applyTransform();
      target.classList.remove('tandara-search-focus');
      void target.getBBox();
      target.classList.add('tandara-search-focus');
      window.setTimeout(()=>target.classList.remove('tandara-search-focus'),2400);
    });
  });
}
function focusNode(node){closeSearchResults();expandAncestors(node.code);selectedCode=node.code;matchCode=node.code;render();showDetails(node);centerNode(node.code);}
function focusVirtual(person){closeSearchResults();const node=findNode(person.hostCode);if(!node)return;expandAncestors(node.code);selectedCode=node.code;matchCode=node.code;render();document.getElementById('detailTitle').textContent=person.label+(person.qualifier?' ('+person.qualifier+')':'');document.getElementById('detailCode').textContent='Obiteljski zapis '+person.hostCode;document.getElementById('detailText').textContent='Otac: '+(person.father||'nepoznato')+'. Majka: '+(person.mother||'nepoznato')+'.\n\nOva osoba spomenuta je u proširenom opisu obitelji, ali nema zaseban numerirani okvir. U nastavku je otvoren cijeli obiteljski opis:\n\n'+(node.detail||'');details.classList.add('open');centerNode(node.code);announce('Pronađena osoba '+person.label);}
function focusSpouse(result){closeSearchResults();const node=findNode(result.hostCode);if(!node)return;expandAncestors(node.code);selectedCode=node.code;matchCode=node.code;render();showMarriageDetails(result.hostCode,result.index);centerNode(node.code);announce('Pronađena supruga '+result.family.spouse);}
function positionSearchResults(){const panel=document.getElementById('searchResults');if(panel.hidden)return;const margin=10,width=Math.min(550,window.innerWidth-margin*2),rect=searchInput.getBoundingClientRect();let left=Math.max(margin,Math.min(rect.right-width,window.innerWidth-width-margin)),top=rect.bottom+8,maxHeight=Math.min(420,window.innerHeight-top-margin);if(maxHeight<180&&rect.top>210){top=margin;maxHeight=Math.max(180,rect.top-margin);}panel.style.left=left+'px';panel.style.top=top+'px';panel.style.width=width+'px';panel.style.maxHeight=maxHeight+'px';}
function showSearchResults(results,query){activeSearchResults=results;const panel=document.getElementById('searchResults'),items=document.getElementById('searchResultItems'),title=document.getElementById('searchResultsTitle');title.textContent=results.length?'Odaberite rezultat · pronađeno '+results.length:'Nema rezultata';items.innerHTML=results.length?results.map((result,index)=>{const quality=`<span class="search-result-quality">${esc(matchQuality(result.score))}</span>`;if(result.type==='virtual'){const p=result.person;return`<button class="search-result-item" type="button" data-result-index="${index}"><span class="search-result-label">${esc(p.label)}${p.qualifier?' ('+esc(p.qualifier)+')':''}</span><span class="search-result-parents">Otac: ${esc(p.father||'nepoznato')} · Majka: ${esc(p.mother||'nepoznato')}</span><span class="search-result-family">${esc(p.gender||'član obitelji')} bez zasebnog okvira · zapis ${esc(p.hostCode)}</span>${quality}</button>`;}if(result.type==='spouse'){return`<button class="search-result-item" type="button" data-result-index="${index}"><span class="search-result-label">${esc(result.family.spouse)}</span><span class="search-result-parents">Supruga: ${esc(result.node?.label||'nositelj prezimena')}</span><span class="search-result-family">Djeca ${result.family.total} · sinovi ${result.family.sons.length} · kćeri ${result.family.daughters.length} · zapis ${esc(result.hostCode)}</span>${quality}</button>`;}const c=PERSON_SEARCH_CONTEXT[result.node.code]||{};return`<button class="search-result-item" type="button" data-result-index="${index}"><span class="search-result-label">${esc(result.node.label)}</span>${c.father||c.mother?`<span class="search-result-parents">Otac: ${esc(c.father||'nepoznato')} · Majka: ${esc(c.mother||'nepoznato')}</span>`:''}<span class="search-result-meta">Šifra ${esc(result.node.code)}</span>${quality}</button>`;}).join(''):`<div class="search-result-item"><span class="search-result-meta">Nije pronađeno: ${esc(query)}. Pokušajte upisati dio imena ili prezimena.</span></div>`;panel.hidden=false;searchInput.setAttribute('aria-expanded','true');positionSearchResults();items.querySelectorAll('button[data-result-index]').forEach(button=>button.addEventListener('click',()=>{const result=activeSearchResults[Number(button.dataset.resultIndex)];if(result?.type==='virtual')focusVirtual(result.person);else if(result?.type==='spouse')focusSpouse(result);else if(result?.node)focusNode(result.node);}));announce(results.length?'Pronađeno rezultata: '+results.length+'. Odaberite osobu.':'Nema rezultata za '+query);}
function search(){const raw=searchInput.value.trim();closeSearchResults();if(!raw)return;const query=raw.split(/\s+/).filter(part=>normalize(part)!=='tandara').join(' ');if(!query){showSearchResults([],raw);return;}const exact=findNode(query);if(exact){focusNode(exact);return;}showSearchResults(collectResults(query),raw);}

async function toggleFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();}else{await document.exitFullscreen();}}catch(error){announce('Preglednik nije dopustio prikaz preko cijelog ekrana.');}}

function pointerPoint(event){const rect=svg.getBoundingClientRect();return{x:event.clientX-rect.left,y:event.clientY-rect.top};}
svg.addEventListener('pointerdown',event=>{if(event.target.closest?.('.node,.family-action'))return;svg.setPointerCapture(event.pointerId);pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,panX,panY};svg.classList.add('dragging');}else if(pointers.size===2){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y);pinchStart={distance,scale,panX,panY,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};dragStart=null;}});
svg.addEventListener('pointermove',event=>{if(!pointers.has(event.pointerId))return;pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1&&dragStart){const p=[...pointers.values()][0];panX=dragStart.panX+(p.x-dragStart.x);panY=dragStart.panY+(p.y-dragStart.y);applyTransform();}else if(pointers.size===2&&pinchStart){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,newScale=Math.max(.12,Math.min(3.5,pinchStart.scale*(distance/pinchStart.distance))),ratio=newScale/pinchStart.scale;scale=newScale;panX=cx-(pinchStart.cx-pinchStart.panX)*ratio;panY=cy-(pinchStart.cy-pinchStart.panY)*ratio;applyTransform();}});
function endPointer(event){pointers.delete(event.pointerId);if(pointers.size<2)pinchStart=null;if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,panX,panY};}else if(!pointers.size){dragStart=null;svg.classList.remove('dragging');}}
svg.addEventListener('pointerup',endPointer);svg.addEventListener('pointercancel',endPointer);
function expandEmbeddedDiagramArea(){
 if(window.self===window.top)return;
 try{
  const frame=window.frameElement,parentDoc=window.parent.document,parentWin=window.parent;
  if(!frame)return;
  const layout=parentDoc.querySelector('.layout');
  const contentPage=frame.closest('.content-page')||parentDoc.querySelector('.content-page');
  const card=frame.closest('.content-card')||parentDoc.querySelector('.content-card');
  const wrap=frame.parentElement;
  if(layout){layout.style.maxWidth='none';layout.style.width='100%';layout.style.margin='0';layout.style.gap='0';layout.style.padding='0';}
  if(contentPage){contentPage.style.width='100%';contentPage.style.maxWidth='none';contentPage.style.minWidth='0';contentPage.style.padding='0';contentPage.style.justifyContent='stretch';}
  let leftPad=0,rightPad=0;
  if(card){
   const cardStyle=parentWin.getComputedStyle(card);
   leftPad=parseFloat(cardStyle.paddingLeft)||0;rightPad=parseFloat(cardStyle.paddingRight)||0;
   card.style.width='100%';card.style.maxWidth='none';card.style.margin='0';card.style.borderRadius='0';
  }
  if(wrap){wrap.style.maxWidth='none';wrap.style.width=`calc(100% + ${leftPad+rightPad}px)`;wrap.style.marginLeft=`-${leftPad}px`;wrap.style.marginRight=`-${rightPad}px`;wrap.style.marginTop='30px';wrap.style.marginBottom='0';}
  frame.style.display='block';frame.style.width='100%';frame.style.maxWidth='none';frame.style.margin='0';frame.style.borderLeft='0';frame.style.borderRight='0';frame.style.borderRadius='0';
 }catch(error){/* Samostalni prikaz ostaje potpuno funkcionalan. */}
}
