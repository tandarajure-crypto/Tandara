<script>
const DATA={"code":"2.0","detail":"Petar Tandara was Ivan’s second son. He died in 1817 at the age of eighty-three, so it is estimated that he was born around 1734. Petar was married to Jela, née Budić. They had seven sons—Grgo, Jakov (1773–), Martin, Marijan (1781–), Mijo, Tadija and Marko (1787–)—and two daughters, Manda (1777–) and Jela (–1824). The sons Jakov (1773–), Marijan (1781–), Tadija and Marko (1787–) do not appear in the 1806 Register of Souls, and Tadija is also absent from the 1819 register. It may therefore be assumed that they were no longer alive or that one of them had moved away from Ričice.","children":[{"code":"2.1","detail":"Grgo, Petar’s eldest son, married Ruža, née Pušić. They had a son, Šimun, and a daughter, Iva (1798–).","children":[{"code":"2.1.1","detail":"Šimun was married to Jela, née Budimir, with whom he had a son, Mate (1826–), and three daughters: Iva (1831–), Matija (1837–) and Marta (1845–). Only Mate’s year of birth is known, so his later life and the circumstances explaining the absence of further records cannot be established. Šimun’s family line ended after his son Mate.","children":[],"label":"Šimun, son of Grgo (★ 1800 – ✝ 1874)"}],"label":"Grgo, son of Petar (★ 1770 – ✝ unknown)"},{"code":"2.2","detail":"Martin, Petar’s third son, married Ruža, née Lekić. They had six sons—Ivan, Jure (1811–), Mijo, Grgo, Filip (1821–) and Josip (1824–)—and two daughters, Matija and Ana (1828–). No records of Jure, Filip or Josip have been found apart from their baptismal entries, so it is not known whether they died young or moved away. Martin’s son Mijo left no male descendants, so the family line was continued only by Martin’s sons Ivan and Grgo.","children":[{"code":"2.2.1","detail":"Ivan, Martin’s eldest son, married Antica, née Lažeta, in 1826. Ivan and Antica had three sons—Marijan (1828–1828), Toma and Jure (1840–)—and four daughters: Ruža (1834–), Iva, Joza (1839–1839) and Matija (1841–). No information about Jure has been found apart from the record of his birth. Toma was the only successor to Ivan’s line and the founder of the branch known by the nickname TROMIĆI.","children":[{"code":"2.2.1.1","detail":"Toma was married to Tomica, née Kovač. They had four sons: Ivan (1866–), Mate (1870–), Jure and another son also named Ivan (1879–1879). Toma’s only successor was his son Jure. Toma’s line in Zavelim was known by the nickname TROMIĆI, which, according to family tradition, referred to their tall stature and slow, heavy gait.","children":[{"code":"2.2.1.1.1","detail":"Toma’s third son and only successor, Jure, married Iva, née Lažeta. They had five sons—Toma (1909–1914), Ivan (1911–1915), Pio, Dominik and Mate—and a daughter, Matija (1908–). The line was continued by the sons Pio, Dominik and Mate.","children":[{"code":"2.2.1.1.1.1","detail":"Pio married Terezija Budimir and had descendants. Their sons Ivan (1935–2025), Jure (1943–2004) and Jozo (1949–2019) are deceased. Information about likely living family members is kept in the private archive.","children":[{"code":"2.2.1.1.1.1.1","detail":"Ivan, son of Pio, lived from 1935 to 2025. He was married and had descendants. Information about likely living family members is kept in the private archive.","children":[{"code":"2.2.1.1.1.1.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Ivan, son of Pio (★ 1935 – ✝ 2025)"},{"code":"2.2.1.1.1.1.2","detail":"Jure, son of Pio, married Mila Škorić. Their son Tomislav did not marry. Information about other family members who are likely still living is kept in the private archive.","children":[],"label":"Jure, son of Pio (★ 1943 – ✝ 2004)"},{"code":"2.2.1.1.1.1.3","detail":"Jozo, son of Pio, lived from 1949 to 2019 and died in Split. He was married and had descendants. Information about likely living family members is kept in the private archive.","children":[],"label":"Jozo, son of Pio (★ 1949 – ✝ 2019)"}],"label":"Pio, son of Jure (★ 1916 – ✝ 1990)"},{"code":"2.2.1.1.1.2","detail":"Dominik, Jure’s fourth son, married Mara, née Knezović. His line continued through his descendants. Information about likely living family members is kept in the private archive.","children":[{"code":"2.2.1.1.1.2.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"},{"code":"2.2.1.1.1.2.2","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"},{"code":"2.2.1.1.1.2.3","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"},{"code":"2.2.1.1.1.2.4","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"},{"code":"2.2.1.1.1.2.5","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"},{"code":"2.2.1.1.1.2.6","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Dominik, son of Jure (★ 1919 – ✝ 1987)"},{"code":"2.2.1.1.1.3","detail":"Mate, Jure’s fifth son, married Mara, née Budić. They had two sons, Tomislav and Mijo (1955–1960). Information about likely living family members is kept in the private archive.","children":[{"code":"2.2.1.1.1.3.1","detail":"Tomislav Matin lived from 1947 to 2014. He was married and had descendants. Information about likely living family members is kept in the private archive.","children":[{"code":"2.2.1.1.1.3.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Tomislav, son of Mate (★ 1947 – ✝ 2014)"}],"label":"Mate, son of Jure (★ 1922 – ✝ 1963)"}],"label":"Jure, son of Toma (★ 1874 – ✝ 1931)"}],"label":"Toma, son of Ivan (★ 1830 – ✝ unknown)"}],"label":"Ivan, son of Martin (★ 1807 – ✝ 1877)"},{"code":"2.2.2","detail":"Martin’s third son and his wife Matija, née Parlov, had eight children: two sons, Martin (1850–) and Mijo (1851–1851), and six daughters—Lucija (1836–1836), Manda (1838–1838), Boža (1839–), Joza (1845–), Marija (1852–) and Matija (1856–). Mijo died shortly after birth, while no records of Martin have been found apart from the record of his birth. It is not known whether he died or moved away. Mijo’s line ended after Martin.","children":[],"label":"Mijo, son of Martin (★ 1814 – ✝ unknown)"},{"code":"2.2.3","detail":"Grgo, son of Martin, married twice. From his first marriage to Rosa, née Budimir, he had a son, Lovro, and a daughter, Jaka (1845–). In his second marriage to Jaka, née Knežević, Grgo had two sons, Mate (1853–1856) and Mijo, and three daughters: Matija (1850–), Joza (1861–1878) and Veronika (1866–).","children":[{"code":"2.2.3.1","detail":"Lovro married Iva, née Parlov. They had three sons—Ante, Ivan (1876–) and Marijan—and three daughters: the first Lucija (1864–1876), Iva (1884–1908) and the second Lucija (–1877). Ante and Marijan were the only successors to the line. Their descendants had thirty-three children. The death register of the Ričice parish records that Lovro’s daughter Luca was “killed by rocks” at the age of thirteen.","children":[{"code":"2.2.3.1.1","detail":"Ante was married to Tomica, née Lukić. They had five sons—Ivan, Marijan, the first Mate (1906–1907), the second Mate (1910–) and Nikola (1915–1981)—and three daughters: Marta (1901–), Iva (1905–1911) and Matija (1908–). The successors to the line were Ivan, Marijan, Mate and Nikola.","children":[{"code":"2.2.3.1.1.1","detail":"Ivan married Mara Mršić and had descendants. Their son Mate (1932–1970) is deceased. Ivan moved to Slatina. Information about likely living family members is kept in the private archive.","children":[{"code":"2.2.3.1.1.1.1","detail":"The historical record for this person remains publicly available. Information about likely living family members has been moved to the private archive.","children":[],"label":"Lovre, son of Ivan (★ 1925 – ✝ unknown)"},{"code":"2.2.3.1.1.1.2","detail":"The historical record for this person remains publicly available. Information about likely living family members has been moved to the private archive.","children":[{"code":"2.2.3.1.1.1.2.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"},{"code":"2.2.3.1.1.1.2.2","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Mirko, son of Ivan (★ 1928 – ✝ unknown)"},{"code":"2.2.3.1.1.1.3","detail":"Mate, son of Ivan, lived from 1932 to 1970. He was married and had descendants. Information about likely living family members is kept in the private archive.","children":[],"label":"Mate, son of Ivan (★ 1932 – ✝ 1970)"},{"code":"2.2.3.1.1.1.4","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[{"code":"2.2.3.1.1.1.4.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"},{"code":"2.2.3.1.1.1.4.2","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Living descendant – private data"}],"label":"Ivan, son of Ante (★ 1896 – ✝ unknown)"},{"code":"2.2.3.1.1.2","detail":"Marijan was married to Milica, née Mikulić. They had two sons, Frane (1927–1945), who was killed in Vienna, and Ante (1929–1929), as well as two daughters, Marija (1930–) and Stana (1932–1933). Marijan died of pneumonia at the age of thirty-five. His sons had no descendants, so his line ended.","children":[],"label":"Marijan, son of Ante (★ 1898 – ✝ 1933)"},{"code":"2.2.3.1.1.3","detail":"Mate married Mara Knežević and had descendants. Their son Ante Bruno lived from 1937 to 1989. Information about likely living family members is kept in the private archive.","children":[{"code":"2.2.3.1.1.3.1","detail":"Dr Ante Bruno Tandara was born on 7 October 1937 in Ričice. He married in 1968, and information about likely living members of his family is kept in the private archive. He was a Croatian physician, a member of the Parliament of the Socialist Republic of Croatia and a participant in the Croatian Spring. He was elected to Parliament in 1969, and after the suppression of the Croatian Spring, his parliamentary immunity was revoked. Because of his political activities, he was arrested and sentenced to two years and four months of strict imprisonment, which he served in Stara Gradiška.","children":[{"code":"2.2.3.1.1.3.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Ante Bruno, son of Mate (★ 1937 – ✝ 1989)"},{"code":"2.2.3.1.1.3.2","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[{"code":"2.2.3.1.1.3.2.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"l       panY+=(svgRect.top+svgRect.height/2-(nodeRect.top+nodeRect.height/2))/unitY;
      applyTransform();
      target.classList.remove('tandara-search-focus');
      void target.getBBox();
      target.classList.add('tandara-search-focus');
      window.setTimeout(()=>target.classList.remove('tandara-search-focus'),2400);
    });
  });
}
function focusNode(node){closeSearchResults();expandAncestors(node.code);selectedCode=node.code;matchCode=node.code;render();showDetails(node);centerNode(node.code);}
function focusVirtual(person){closeSearchResults();const node=findNode(person.hostCode);if(!node)return;expandAncestors(node.code);selectedCode=node.code;matchCode=node.code;render();document.getElementById('detailTitle').textContent=person.label+(person.qualifier?' ('+person.qualifier+')':'');document.getElementById('detailCode').textContent='Family record '+person.hostCode;document.getElementById('detailText').textContent='Father: '+(person.father||'unknown')+'. Mother: '+(person.mother||'unknown')+'.\n\nThis person is mentioned in the expanded family description but does not have a separate numbered box. The complete family description is shown below:\n\n'+(node.detail||'');details.classList.add('open');centerNode(node.code);announce('Found person '+person.label);}
function focusSpouse(result){closeSearchResults();const node=findNode(result.hostCode);if(!node)return;expandAncestors(node.code);selectedCode=node.code;matchCode=node.code;render();showMarriageDetails(result.hostCode,result.index);centerNode(node.code);announce('Found spouse '+result.family.spouse);}
function positionSearchResults(){const panel=document.getElementById('searchResults');if(panel.hidden)return;const margin=10,width=Math.min(550,window.innerWidth-margin*2),rect=searchInput.getBoundingClientRect();let left=Math.max(margin,Math.min(rect.right-width,window.innerWidth-width-margin)),top=rect.bottom+8,maxHeight=Math.min(420,window.innerHeight-top-margin);if(maxHeight<180&&rect.top>210){top=margin;maxHeight=Math.max(180,rect.top-margin);}panel.style.left=left+'px';panel.style.top=top+'px';panel.style.width=width+'px';panel.style.maxHeight=maxHeight+'px';}
function showSearchResults(results,query){activeSearchResults=results;const panel=document.getElementById('searchResults'),items=document.getElementById('searchResultItems'),title=document.getElementById('searchResultsTitle');title.textContent=results.length?'Choose a result · found '+results.length:'No results';items.innerHTML=results.length?results.map((result,index)=>{const quality=`<span class="search-result-quality">${esc(matchQuality(result.score))}</span>`;if(result.type==='virtual'){const p=result.person;return`<button class="search-result-item" type="button" data-result-index="${index}"><span class="search-result-label">${esc(p.label)}${p.qualifier?' ('+esc(p.qualifier)+')':''}</span><span class="search-result-parents">Father: ${esc(p.father||'unknown')} · Mother: ${esc(p.mother||'unknown')}</span><span class="search-result-family">${esc(p.gender||'family member')} without a separate box · record ${esc(p.hostCode)}</span>${quality}</button>`;}if(result.type==='spouse'){return`<button class="search-result-item" type="button" data-result-index="${index}"><span class="search-result-label">${esc(result.family.spouse)}</span><span class="search-result-parents">Spouse: ${esc(result.node?.label||'surname bearer')}</span><span class="search-result-family">Children ${result.family.total} · sons ${result.family.sons.length} · daughters ${result.family.daughters.length} · record ${esc(result.hostCode)}</span>${quality}</button>`;}const c=PERSON_SEARCH_CONTEXT[result.node.code]||{};return`<button class="search-result-item" type="button" data-result-index="${index}"><span class="search-result-label">${esc(result.node.label)}</span>${c.father||c.mother?`<span class="search-result-parents">Father: ${esc(c.father||'unknown')} · Mother: ${esc(c.mother||'unknown')}</span>`:''}<span class="search-result-meta">Code ${esc(result.node.code)}</span>${quality}</button>`;}).join(''):`<div class="search-result-item"><span class="search-result-meta">Not found: ${esc(query)}. Try entering part of the first name or surname.</span></div>`;panel.hidden=false;searchInput.setAttribute('aria-expanded','true');positionSearchResults();items.querySelectorAll('button[data-result-index]').forEach(button=>button.addEventListener('click',()=>{const result=activeSearchResults[Number(button.dataset.resultIndex)];if(result?.type==='virtual')focusVirtual(result.person);else if(result?.type==='spouse')focusSpouse(result);else if(result?.node)focusNode(result.node);}));announce(results.length?'Results found: '+results.length+'. Choose a person.':'No results for '+query);}
function search(){const raw=searchInput.value.trim();closeSearchResults();if(!raw)return;const query=raw.split(/\s+/).filter(part=>normalize(part)!=='tandara').join(' ');if(!query){showSearchResults([],raw);return;}const exact=findNode(query);if(exact){focusNode(exact);return;}showSearchResults(collectResults(query),raw);}
document.getElementById('expandAll').onclick=()=>{walk(DATA,node=>node.expanded=true);render();fitTree();announce('The complete Petar’s branch is displayed.');};
document.getElementById('collapse').onclick=()=>{walk(DATA,node=>node.expanded=false);DATA.expanded=true;render();fitTree();announce('The diagram has been collapsed.');};

const fullscreenButton=document.getElementById('fullscreenDiagram'),fullscreenLabel=document.getElementById('fullscreenLabel');

svg.addEventListener('wheel',event=>{event.preventDefault();const rect=svg.getBoundingClientRect();zoomAt(event.deltaY<0?1.12:.89,event.clientX-rect.left,event.clientY-rect.top);},{passive:false});
function pointerPoint(event){const rect=svg.getBoundingClientRect();return{x:event.clientX-rect.left,y:event.clientY-rect.top};}
svg.addEventListener('pointerdown',event=>{if(event.target.closest?.('.node,.family-action'))return;svg.setPointerCapture(event.pointerId);pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,panX,panY};svg.classList.add('dragging');}else if(pointers.size===2){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y);pinchStart={distance,scale,panX,panY,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};dragStart=null;}});
svg.addEventListener('pointermove',event=>{if(!pointers.has(event.pointerId))return;pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1&&dragStart){const p=[...pointers.values()][0];panX=dragStart.panX+(p.x-dragStart.x);panY=dragStart.panY+(p.y-dragStart.y);applyTransform();}else if(pointers.size===2&&pinchStart){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,newScale=Math.max(.12,Math.min(3.5,pinchStart.scale*(distance/pinchStart.distance))),ratio=newScale/pinchStart.scale;scale=newScale;panX=cx-(pinchStart.cx-pinchStart.panX)*ratio;panY=cy-(pinchStart.cy-pinchStart.panY)*ratio;applyTransform();}});
function endPointer(event){pointers.delete(event.pointerId);if(pointers.size<2)pinchStart=null;if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,panX,panY};}else if(!pointers.size){dragStart=null;svg.classList.remove('dragging');}}
svg.addEventListener('pointerup',endPointer);svg.addEventListener('pointercancel',endPointer);
function expandEmbeddedDiagramArea(){
 if(window.self===window.top)return;
 try{
  const frame=window.frameElement,parentDoc=window.parent.document,parentWin=window.parent;
  if(!frame)return;
  const layout=parentDoc.querySelector('.layout');
  const contentPage=frame.closest('.content-page')||parentDoc.querySelector('.content-page');
  const card=frame.closest('.content-card')||parentDoc.querySelector('.content-card');
  const wrap=frame.parentElement;
  if(layout){layout.style.maxWidth='none';layout.style.width='100%';layout.style.margin='0';layout.style.gap='0';layout.style.padding='0';}
  if(contentPage){contentPage.style.width='100%';contentPage.style.maxWidth='none';contentPage.style.minWidth='0';contentPage.style.padding='0';contentPage.style.justifyContent='stretch';}
  let leftPad=0,rightPad=0;
  if(card){
   const cardStyle=parentWin.getComputedStyle(card);
   leftPad=parseFloat(cardStyle.paddingLeft)||0;rightPad=parseFloat(cardStyle.paddingRight)||0;
   card.style.width='100%';card.style.maxWidth='none';card.style.margin='0';card.style.borderRadius='0';
  }
  if(wrap){wrap.style.maxWidth='none';wrap.style.width=`calc(100% + ${leftPad+rightPad}px)`;wrap.style.marginLeft=`-${leftPad}px`;wrap.style.marginRight=`-${rightPad}px`;wrap.style.marginTop='30px';wrap.style.marginBottom='0';}
  frame.style.display='block';frame.style.width='100%';frame.style.maxWidth='none';frame.style.margin='0';frame.style.borderLeft='0';frame.style.borderRight='0';frame.style.borderRadius='0';
 }catch(error){/* The standalone view remains fully functional. */}
}

window.addEventListener('resize',()=>{syncHeaderHeight();expandEmbeddedDiagramArea();requestAnimationFrame(fitTree);});
expandEmbeddedDiagramArea();syncHeaderHeight();setExpandedToDepth(1);render();requestAnimationFrame(fitTree);
