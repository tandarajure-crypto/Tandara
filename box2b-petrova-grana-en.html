<script>
const DATA = {"code":"2.0","label":"Petar Tandara (★ 1734 – ✝ 1817)","detail":"","section":"Second branch of the first Tandara family","page":"box2b-en.html","children":[{"code":"2.1","label":"Grgo, son of Petar (★ 1770)","detail":"Grgo, Petar’s eldest son, married Ruža Pušić. They had a son, Šimun, and a daughter, Iva.","section":"Second branch of the first Tandara family","page":"box3b-en.html","children":[{"code":"2.1.1","label":"Šimun, son of Grgo (★ 1800 – ✝ 1874)","detail":"Šimun was married to Jela Budimir, with whom he had a son, Mate, and three daughters: Iva, Matija and Marta. Only Mate’s year of birth is known, so it is not possible to establish the course of his later life or the circumstances that explain why no further records about him have survived.","section":"Second branch of the first Tandara family","page":null,"children":[]}]},{"code":"2.2","label":"Martin, son of Petar (★ 1775 – ✝ 1844)","detail":"Martin, Petar’s third son, married Ruža Lekić. They had six sons—Ivan, Jure, Mijo, Grgo, Filip and Josip—and two daughters, Matija and Ana. No records of Jure, Filip or Josip have been found apart from their baptismal entries, so it is not known whether they died young or moved away. Only Ivan and Grgo continued the family line.","section":"Second branch of the first Tandara family","page":"box3c-en.html","children":[{"code":"2.2.1","label":"Ivan, son of Martin (★ 1807 – ✝ 1877)","detail":"Ivan, Martin’s eldest son, married Antica Lažeta in 1826. Ivan and Antica had three sons—Marijan, Toma and Jure—and four daughters: Ruža, Iva, Joza and Matija. Marijan died as a young child. No information about Jure has been found apart from the record of his birth. Toma was the only son to continue Ivan’s line and became the founder of the Tromići branch.","section":"Second branch of the first Tandara family","page":null,"children":[{"code":"2.2.1.1","label":"Toma, son of Ivan (★ 1830)","detail":"Toma was married to Tomica Kovač. They had four sons: Ivan, Mate, Jure and another son also named Ivan, who died as a child. Toma’s only son who continued the family line was Jure . Toma’s line in Zavelim was known by the nickname Tromići , which, according to family tradition, referred to their tall stature and slow, heavy gait.","section":"TROMIĆI","page":null,"children":[{"code":"2.2.1.1.1","label":"Jure, son of Toma (★ 1874 – ✝ 1931)","detail":"Toma’s third son and only successor to the family line, Jure, married Iva Lažeta. They had five sons—Toma and Ivan, who both died as young children, followed by Pio, Dominik and Mate—and a daughter named Matija.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.1","label":"Pio, son of Jure (★ 1916 – ✝ 1990)","detail":"Pio, Jure’s third son, married Terezija Budimir. They had three sons—Ivan, Jure and Jozo—and a daughter named Mara.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.1.1","label":"Ivan, son of Pio (★ 1935 – ✝ 2025)","detail":"Ivan married Marijana Petter. They had a son, Dino, and a daughter, Romana. The family now lives in Zagreb.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.1.1.1","label":"Dino, son of Ivan","detail":"Dino married Matilda Klepikapić. They have three daughters: Hedviga, Leonarda and Lucija. He has no male descendants. The family lives in Zagreb.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]}]},{"code":"2.2.1.1.1.1.2","label":"Jure, son of Pio (★ 1943 – ✝ 2004)","detail":"Jure was married to Mila Škorić. They had a son, Tomislav, and three daughters: Marija, Angela and Nediljka. Tomislav never married. The family now lives in Split.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.1.3","label":"Jozo, son of Pio (★ 1949)","detail":"Jozo married Mirjana Generalić. They have a son, Domagoj, and two daughters, Tereza and Zrinka. The family lives in Split.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]}]},{"code":"2.2.1.1.1.2","label":"Dominik, son of Jure (★ 1919 – ✝ 1987)","detail":"Dominik, Jure’s fourth son, married Mara Knezović. They had six sons—Ante, Bariša, Nikola, Pio, Sveto and Ivan—and a daughter named Olga. Ante, Nikola, Pio and Sveto have no sons. No information about Bariša’s marriage is available. Only Ivan and his sons continued Dominik’s line.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.2.1","label":"Ante, son of Dominik (★ 1948)","detail":"Ante married Dubravka Pencinger. They had two daughters, Ana Marija and Ozana. The family lives in Križevci.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.2.2","label":"Bariša, son of Dominik (★ 1950)","detail":"No further information about Bariša is currently available.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.2.3","label":"Nikola, son of Dominik (★ 1953)","detail":"Nikola married Nada Jurčević. They had four daughters: Marijana, Iva, Brigita and Anita. Nikola returned to the village of Tandare in Zavelim.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.2.4","label":"Pio, son of Dominik (★ 1954)","detail":"Pio married Ljubina Krinulović. They had two daughters, Tina and Pia. The family lives in Vienna, Austria.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.2.5","label":"Sveto, son of Dominik (★ 1957)","detail":"Sveto married twice. In his first marriage to Petra Lukić, he had a daughter named Daniela. In his second marriage to Vera Rakin, he had a daughter named Eni.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.2.6","label":"Ivan, son of Dominik (★ 1963)","detail":"Ivan married Mirjana Tandara. They have two sons, Dominik and David. The family lives in the village of Tandare in Zavelim.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]}]},{"code":"2.2.1.1.1.3","label":"Mate, son of Jure (★ 1922 – ✝ 1963)","detail":"Mate, Jure’s fifth son, married Mara Budić. They had a son named Tomislav, two other sons who died at the age of five, and a daughter named Matija.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.3.1","label":"Tomislav, son of Mate (★ 1947 – ✝ 2014)","detail":"Tomislav married Božica Golubiček. They have a son, Mate, and a daughter, Martina.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.3.1.1","label":"Mate, son of Tomislav (★ 1980)","detail":"Mate married Ivana Trošelj. They had a daughter named Tena. The descendants of Mate, son of Jure, now live in Zagreb.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]}]}]}]}]}]},{"code":"2.2.2","label":"Mijo, son of Martin (★ 1814)","detail":"Martin’s third son, Mijo, and his wife Matija, née Parlov, had eight children: two sons, Martin and Mijo, the latter of whom died as a young child, and six daughters—Luca, Manda, Boža, Joza, Marija and Matija. No records of Martin have been found apart from the record of his birth. It is not known whether he died or moved away. After Martin, Mijo’s line died out.","section":"Second branch of the first Tandara family","page":null,"children":[]},{"code":"2.2.3","label":"Grgo, son of Martin (★ 1818)","detail":"Grgo married twice. From his first marriage to Rosa, née Budimir, he had a son, Lovro, and a daughter, Jaka. In his second marriage to Jaka, née Knežević, Grgo had two sons, Mate, who died as a young child, and Mijo, as well as three daughters: Matija, Joza and Veronika.","section":"Second branch of the first Tandara family","page":null,"children":[{"code":"2.2.3.1","label":"Lovro, son of Grgo (★ 1842 – ✝ 1922)","detail":"Lovro married Iva Parlov. They had two sons, Ante and Marijan, and three daughters: Lucija, who died as a child, Iva, and another daughter also named Lucija. Ante and Marijan were the only sons who continued the family line. Their sons had a total of thirty-three children. The Ričice parish death register records that Lovro’s daughter Luca was “killed by stones” at the age of thirteen.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1","label":"Ante, son of Lovro (★ 1871 – ✝ 1933)","detail":"Ante was married to Tomica Lukić. They had five sons—Ivan, Marijan, the first Mate, who died as a child, the second Mate, and Nikola—and three daughters: Marta, Iva and Matija. Ivan, Marijan, the second Mate and Nikola continued the family line.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.1","label":"Ivan, son of Ante (★ 1896)","detail":"Ivan, Ante’s eldest son, married Mara Mršić. They had five sons—Lovro, Mirko, Mate, Ante Vlade and Nikola—and a daughter named Tomica. Ivan moved to Slatina, and his descendants now live in Predavac near Bjelovar, Slatina, Obrovac, Zagreb and Germany.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.1.1","label":"Lovro, son of Ivan (★ 1925)","detail":"Lovro was Ivan’s eldest son. He and his wife Rozika Peška had two daughters, Štefica and Ana.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]},{"code":"2.2.3.1.1.1.2","label":"Mirko, son of Ivan (★ 1928)","detail":"Mirko married Danica Lukić. They had two sons, Ivan and Veselko, and a daughter named Mirjana. The family lives in Predavac near Bjelovar.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.1.2.1","label":"Ivan, son of Mirko (★ 1961)","detail":"Ivan, Mirko’s elder son, married Nada Kegalj and they had two sons, Robert and Kristijan. The family lives in Predavac near Bjelovar.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]},{"code":"2.2.3.1.1.1.2.2","label":"Veselko, son of Mirko (★ 1964)","detail":"Veselko, Mirko’s younger son, married Martina Hohmann. They have a son, Mirko, and a daughter, Janina. The family lives in Predavac.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]}]},{"code":"2.2.3.1.1.1.3","label":"Mate, son of Ivan (★ 1932 – ✝ 1970)","detail":"Ivan’s third son married Marija Srebrnjak. They had one daughter, Sandra.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]},{"code":"2.2.3.1.1.1.4","label":"Ante Vlade, son of Ivan (★ 1934)","detail":"Ante Vlade, Ivan’s fourth son, married twice. In his first marriage to Karina Mesch, he had two sons, Johan and Franz, and a daughter named Veronika. He had no children in his second marriage to Tonka Zanne.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.1.4.1","label":"Johan, son of Ante Vlade (★ 1960)","detail":"Johan and his wife Katarina Koniks have a son, Gerd, and a daughter, Madita. The family lives in Germany.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]},{"code":"2.2.3.1.1.1.4.2","label":"Franz, son of Ante Vlade (★ 1966)","detail":"Franz married Honolore Genesen. They have a son named Marvin. The family lives in Germany.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]}]}]},{"code":"2.2.3.1.1.2","label":"Marijan, son of Ante (★ 1898 – ✝ 1933)","detail":"Ante’s second son was married to Milica, née Mikulić. They had two sons—Frane, who was killed in Vienna in 1945 at the age of eighteen, and Ante, who died as a young child— and two daughters, Marija and Stana. Marijan died of pneumonia at the age of thirty-five. His sons had no descendants, and his line therefore died out.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]},{"code":"2.2.3.1.1.3","label":"Mate, son of Ante (★ 1910 – ✝ 1991)","detail":"Mate, Ante’s fourth son, was married to Mara Knežević. They had two sons, Ante Bruno and Frane, and three daughters: Ana, Dinka and Olga.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.3.1","label":"Ante Bruno, son of Mate (★ 1937 – ✝ 1989)","detail":"Dr Bruno was born on 7 October 1937 in Ričice. In 1968, he married Vanja Brkljača. They had a son, Zvonimir, and two daughters, Zrinka and Tomislava.\n\nDr Ante Bruno Tandara (1937–1989) was a Croatian physician, a member of the Parliament of the Socialist Republic of Croatia and a participant in the Croatian Spring. He was elected to Parliament in 1969, and after the suppression of the Croatian Spring, his parliamentary immunity was revoked.\n\nBecause of his political activities, he was arrested and sentenced to two years and four months of rigorous imprisonment, which he served in Stara Gradiška.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.3.1.1","label":"Zvonimir, son of Ante Bruno (★ 1973)","detail":"Zvonimir married Aneta Gacek. They have a son named Oskar. The family lives in Supetar on the island of Brač.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]}]},{"code":"2.2.3.1.1.3.2","label":"Frane, son of Mate (★ 1947)","detail":"Frane, Mate’s younger son, married Matija Topalušić. They had two sons, Mate and Ante, and a daughter named Elza. They live in Ričice.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.3.2.1","label":"Mate, son of Frane (★ 1973)","detail":"Mate married Ana Marija Vlahović. They have two sons, Ante and Frane, and a daughter named Leonarda. The family lives in Ričice.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]}]}]},{"code":"2.2.3.1.1.4","label":"Nikola, son of Ante (★ 1919 – ✝ 1981)","detail":"Nikola, Ante’s fifth son, was married to Tomica Budimir. They had four sons—Ante, Drago, Jerko and Ivan—and three daughters: Matija, Branka and Marija. Jerko was married to Stanka Racetin, with whom he had a daughter named Ana. Drago was the only son to continue the line, and his sons now live in Ričice.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.4.1","label":"Drago, son of Nikola (★ 1952)","detail":"Drago and his wife Zdenka Budimir had two sons, Nikola and Ivica. The family lives in Ričice.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.4.1.1","label":"Ivica, son of Drago (★ 1978)","detail":"Ivica and his wife Jelena Perić have a son, Nikola, and a daughter, Laura. They live in Ričice.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]}]},{"code":"2.2.3.1.1.4.2","label":"Jerko, son of Nikola (★ 1953)","detail":"Jerko, Nikola’s third son, married Stanka Racetin. They have a daughter named Ana. He has no male descendants.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]}]}]},{"code":"2.2.3.1.2","label":"Marijan, son of Lovro (★ 1881 – ✝ 1939) — descendants known as LOVRIĆI","detail":"Marijan married Luca Parlov. They had four sons—Mijo, Marin, Petar and Ivan—and four daughters: Matija, Ana, Iva and Tomica. Ivan died shortly after birth.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":null,"children":[{"code":"2.2.3.1.2.1","label":"Mijo, son of Marijan (★ 1908)","detail":"Mijo, Marijan’s eldest son, was married to Slavka Sablić. They had nine children: five sons—Vinko, the first Ivan, who died shortly after birth, Milan, Marijan and another son also named Ivan, who died at the age of two—and four daughters: Mila-Iva, Anica, Nada and Maca. Only Vinko, Milan and Marijan continued Mijo’s line. Vinko’s and Milan’s descendants now live in Ričice, Split, Zagreb, Austria and Germany.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":null,"children":[{"code":"2.2.3.1.2.1.1","label":"Vinko, son of Mijo","detail":"Vinko married Mara Dragica Budimir. They had two sons, Milenko, who died at the age of one, and Svetko, and two daughters, Dragica and Milosava.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":null,"children":[{"code":"2.2.3.1.2.1.1.1","label":"Svetko, son of ,"children":[{"code":"2.2.3.1.2.2.1","label":"Alojz, son of Marin","detail":"Alojz married Dragica Jurčević. They have a son, Robert, and a daughter, Zrinka.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":null,"children":[{"code":"2.2.3.1.2.2.1.1","label":"Robert, son of Alojz","detail":"Robert married Sabina Patzak. They have a son, Marco Marin, and three daughters: Carolina Victoria and Laura Nadine.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":null,"children":[]}]},{"code":"2.2.3.1.2.2.2","label":"Vice, son of Marin (★ 1949)","detail":"Vice Marinov is married to Ružica Barnjak, and they have no children. Vice is acknowledged here for his important role in initiating this project.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":null,"children":[]},{"code":"2.2.3.1.2.2.3","label":"Blaž, son of Marin","detail":"Blaž married Zorana Čarija. They had three sons: Mario, Ante and Vice. Vice never married.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":null,"children":[{"code":"2.2.3.1.2.2.3.1","label":"Mario, son of Blaž","detail":"Mario married Josipa Artić. They have a son, Lovro, and a daughter, Tonka.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":null,"children":[]},{"code":"2.2.3.1.2.2.3.2","label":"Ante, son of Blaž","detail":"Ante married Tanja Koren. They have a son named Petar. The family lives in Ričice.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":null,"children":[]}]}]},{"code":"2.2.3.1.2.3","label":"Petar, son of Marijan (★ 1915)","detail":"Petar married Zorka Pavić. They had a son, Ante, who died shortly after birth, and six daughters: Mila, Marija, Ankica, Mira, Zorka and Rosa. Petar had no son to continue his line.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":null,"children":[]}]}]},{"code":"2.2.3.2","label":"Mijo, son of Grgo (★ 1856 – ✝ 1933)","detail":"Mijo, Grgo’s third son, married Iva Tandara. They had seven children: four sons—Martin, the first Nikola, Mate and the second Nikola—and three daughters: Iva, the first Mara and the second Mara. Martin died at the age of nineteen, while the first Nikola and Mate died as young children. No information about the second Nikola has been found apart from the record of his birth. There is no evidence that any of Mijo’s sons married or had children, and Mijo’s branch therefore died out.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":null,"children":[]}]}]},{"code":"2.3","label":"Mijo, son of Petar","detail":"Mijo, son of Petar, married Ruža, whose surname is unknown. They had a daughter named Matija. As he had no male descendants, his line came to an end.","section":"THE LINE OF MARIJAN, SON OF LOVRO","page":"box3d-en.html","children":[]}]};

function walk(node,cb,parent=null,depth=0){cb(node,parent,depth);(node.children||[]).forEach(ch=>walk(ch,cb,node,depth+1));}

function colors(depth){if(depth===0)return{fill:'#174f39',text:'#fff',stroke:'#0d3425'};if(depth===1)return{fill:'#e8f2fb',text:'#173a57',stroke:'#4d82aa'};return{fill:'#fff1df',text:'#553719',stroke:'#bb8144'};}

function normalizeSearchText(value){return String(value||'').toLocaleLowerCase(UI.locale).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'dj').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');}
const SEARCH_ENDINGS=['ovima','evima','icama','cima','ama','ima','icom','com','om','em','u','a','e','i','o'];
function tokenForms(word){const forms=new Set([word]);if(word.includes('dj'))forms.add(word.replace(/dj/g,'d'));for(const ending of SEARCH_ENDINGS){if(word.endsWith(ending)&&word.length-ending.length>=2){const stem=word.slice(0,-ending.length);forms.add(stem);if(stem.includes('dj'))forms.add(stem.replace(/dj/g,'d'));}}return forms;}
function tokenMatchCost(queryWord,hayWord){if(queryWord===hayWord)return 0;const queryForms=tokenForms(queryWord),hayForms=tokenForms(hayWord);let shortestCommon=Infinity;for(const form of queryForms){if(hayForms.has(form))shortestCommon=Math.min(shortestCommon,form.length);}if(Number.isFinite(shortestCommon))return shortestCommon>=3?1:2;for(const queryForm of queryForms){for(const hayForm of hayForms){const minimum=Math.min(queryForm.length,hayForm.length);if(minimum>=4&&(queryForm.startsWith(hayForm)||hayForm.startsWith(queryForm)))return 3;}}return Infinity;}
function orderedTokenScore(query,field){const hay=normalizeSearchText(field);if(!hay)return Infinity;const queryWords=query.split(' ').filter(Boolean),hayWords=hay.split(' ').filter(Boolean);if(!queryWords.length||!hayWords.length)return Infinity;let best=Infinity;function next(queryIndex,hayIndex,score){if(score>=best)return;if(queryIndex===queryWords.length){best=score;return;}for(let index=hayIndex;index<hayWords.length;index++){const cost=tokenMatchCost(queryWords[queryIndex],hayWords[index]);if(Number.isFinite(cost))next(queryIndex+1,index+1,score+cost+(index-hayIndex));}}next(0,0,0);return best;}
function fieldSearchScore(query,field){const hay=normalizeSearchText(field);if(!hay)return Infinity;if((' '+hay+' ').includes(' '+query+' '))return 0;const score=orderedTokenScore(query,hay);return Number.isFinite(score)?20+score:Infinity;}
function personSearchText(node){return String(node.label||'').replace(/\s*\([^)]*\)/,'').replace(/\s*—\s*descendants known as.*$/i,'').trim();}
function personNameScore(query,node){const hay=normalizeSearchText(personSearchText(node));if(!hay)return Infinity;if((' '+hay+' ').includes(' '+query+' '))return hay===query?-5:0;const score=orderedTokenScore(query,hay);return Number.isFinite(score)?10+score:Infinity;}
function visiblePersonScore(query,node){const direct=personNameScore(query,node);if(Number.isFinite(direct))return direct;const context=PERSON_SEARCH_CONTEXT[node.code];if(!context)return Infinity;const queryWords=query.split(' ').filter(Boolean),nameWords=normalizeSearchText(personSearchText(node)).split(' ').filter(Boolean);if(!queryWords.length||!nameWords.length||!Number.isFinite(tokenMatchCost(queryWords[0],nameWords[0])))return Infinity;const searchable=[personSearchText(node),context.father||'',context.mother||''].join(' ');const score=orderedTokenScore(query,searchable);return Number.isFinite(score)?8+score:Infinity;}
function identityPrefixScore(queryWords,identityWords){if(queryWords.length<identityWords.length)return Infinity;let score=0;for(let index=0;index<identityWords.length;index++){const cost=tokenMatchCost(queryWords[index],identityWords[index]);if(!Number.isFinite(cost))return Infinity;score+=cost;}return score;}
function virtualPersonScore(query,person){const queryWords=query.split(' ').filter(Boolean),childWords=normalizeSearchText(person.childName).split(' ').filter(Boolean),fatherWords=normalizeSearchText(person.fatherGiven).split(' ').filter(Boolean),aliasWords=normalizeSearchText(person.alias||'').split(' ').filter(Boolean);if(!queryWords.length||!childWords.length)return Infinity;if(queryWords.length===1){let best=Infinity;for(let index=0;index<childWords.length;index++){const cost=tokenMatchCost(queryWords[0],childWords[index]);if(Number.isFinite(cost))best=Math.min(best,cost+index);}return best;}const identityForms=[[...childWords,'daughter','of',...fatherWords],[...childWords,'daughter',...fatherWords],[...childWords,...fatherWords]];if(aliasWords.length)identityForms.push(aliasWords);let best=Infinity;for(const identityWords of identityForms){const identityScore=identityPrefixScore(queryWords,identityWords);if(!Number.isFinite(identityScore))continue;const remaining=queryWords.slice(identityWords.length).join(' ');if(!remaining){best=Math.min(best,identityScore);continue;}const filterScore=orderedTokenScore(remaining,[person.father,person.mother,person.qualifier||'',person.qualifierAlias||'',person.year||''].join(' '));if(Number.isFinite(filterScore))best=Math.min(best,identityScore+8+filterScore);}return best;}
function compareCodes(left,right){const a=left.split('.').map(Number),b=right.split('.').map(Number),length=Math.max(a.length,b.length);for(let index=0;index<length;index++){const difference=(a[index]||0)-(b[index]||0);if(difference)return difference;}return 0;}
function collectPersonResults(query){const results=[];walk(DATA,node=>{const score=visiblePersonScore(query,node);if(Number.isFinite(score))results.push({node,score,type:'person',hostCode:node.code});});VIRTUAL_PEOPLE.forEach((person,index)=>{const score=virtualPersonScore(query,person);if(Number.isFinite(score))results.push({person,score,type:'virtual',hostCode:person.hostCode,virtualIndex:index});});return results.sort((left,right)=>left.score-right.score||compareCodes(left.hostCode,right.hostCode)||String(left.person?.label||left.node?.label||'').localeCompare(String(right.person?.label||right.node?.label||''),'en'));}

document.getElementById('closeDetails').addEventListener('click',()=>details.classList.remove('open'));
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.node'))return;dragging=true;svg.classList.add('dragging');svg.setPointerCapture(e.pointerId);dragStart={x:e.clientX,y:e.clientY,panX,panY}});
svg.addEventListener('pointermove',e=>{if(!dragging)return;panX=dragStart.panX+(e.clientX-dragStart.x);panY=dragStart.panY+(e.clientY-dragStart.y);applyTransform()});
function endDrag(){dragging=false;svg.classList.remove('dragging')};svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',fitTree);
setExpandedToDepth(3);render();requestAnimationFrame(fitTree);
</script>
</body>
</html>
