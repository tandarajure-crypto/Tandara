<script>
const DATA = {"code":"2.0","label":"Petar Tandara (1734–1817)","detail":"","section":"Second branch of the first Tandara family","page":"box2b-en.html","children":[{"code":"2.1","label":"Grgo, son of Petar (1770– )","detail":"Grgo, Petar’s eldest son, married Ruža Pušić. They had a son, Šimun, and a daughter, Iva.","section":"Second branch of the first Tandara family","page":"box3b-en.html","children":[{"code":"2.1.1","label":"Šimun, son of Grgo (1800–1874)","detail":"Šimun was married to Jela Budimir, with whom he had a son, Mate, and three daughters: Iva, Matija and Marta. Only Mate’s year of birth is known, so it is not possible to establish the course of his later life or the circumstances that explain why no further records about him have survived.","section":"Second branch of the first Tandara family","page":null,"children":[]}]},{"code":"2.2","label":"Martin, son of Petar (1775–1844)","detail":"Martin, Petar’s third son, married Ruža Lekić. They had six sons—Ivan, Jure, Mijo, Grgo, Filip and Josip—and two daughters, Matija and Ana. No records of Jure, Filip or Josip have been found apart from their baptismal entries, so it is not known whether they died young or moved away. Only Ivan and Grgo continued the family line.","section":"Second branch of the first Tandara family","page":"box3c-en.html","children":[{"code":"2.2.1","label":"Ivan, son of Martin (1807–1877)","detail":"Ivan, Martin’s eldest son, married Antica Lažeta in 1826. Ivan and Antica had three sons—Marijan, Toma and Jure—and four daughters: Ruža, Iva, Joza and Matija. Marijan died as a young child. No information about Jure has been found apart from the record of his birth. Toma was the only son to continue Ivan’s line and became the founder of the Tromići branch.","section":"Second branch of the first Tandara family","page":null,"children":[{"code":"2.2.1.1","label":"Toma, son of Ivan (1830– )","detail":"Toma was married to Tomica Kovač. They had four sons: Ivan, Mate, Jure and another son also named Ivan, who died as a child. Toma’s only son who continued the family line was Jure . Toma’s line in Zavelim was known by the nickname Tromići , which, according to family tradition, referred to their tall stature and slow, heavy gait.","section":"TROMIĆI","page":null,"children":[{"code":"2.2.1.1.1","label":"Jure, son of Toma (1874–1931)","detail":"Toma’s third son and only successor to the family line, Jure, married Iva Lažeta. They had five sons—Toma and Ivan, who both died as young children, followed by Pio, Dominik and Mate—and a daughter named Matija.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.1","label":"Pio, son of Jure (1916–1990)","detail":"Pio, Jure’s third son, married Terezija Budimir. They had three sons—Ivan, Jure and Jozo—and a daughter named Mara.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.1.1","label":"Ivan, son of Pio (1935–2025)","detail":"Ivan married Marijana Petter. They had a son, Dino, and a daughter, Romana. The family now lives in Zagreb.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.1.1.1","label":"Dino, son of Ivan","detail":"Dino married Matilda Klepikapić. They have three daughters: Hedviga, Leonarda and Lucija. He has no male descendants. The family lives in Zagreb.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]}]},{"code":"2.2.1.1.1.1.2","label":"Jure, son of Pio (1943–2004)","detail":"Jure was married to Mila Škorić. They had a son, Tomislav, and three daughters: Marija, Angela and Nediljka. Tomislav never married. The family now lives in Split.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.1.3","label":"Jozo, son of Pio (1949– )","detail":"Jozo married Mirjana Generalić. They have a son, Domagoj, and two daughters, Tereza and Zrinka. The family lives in Split.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]}]},{"code":"2.2.1.1.1.2","label":"Dominik, son of Jure (1919–1987)","detail":"Dominik, Jure’s fourth son, married Mara Knezović. They had six sons—Ante, Bariša, Nikola, Pio, Sveto and Ivan—and a daughter named Olga. Ante, Nikola, Pio and Sveto have no sons. No information about Bariša’s marriage is available. Only Ivan and his sons continued Dominik’s line.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.2.1","label":"Ante, son of Dominik (1948– )","detail":"Ante married Dubravka Pencinger. They had two daughters, Ana Marija and Ozana. The family lives in Križevci.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.2.2","label":"Bariša, son of Dominik (1950– )","detail":"No further information about Bariša is currently available.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.2.3","label":"Nikola, son of Dominik (1953– )","detail":"Nikola married Nada Jurčević. They had four daughters: Marijana, Iva, Brigita and Anita. Nikola returned to the village of Tandare in Zavelim.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.2.4","label":"Pio, son of Dominik (1954– )","detail":"Pio married Ljubina Krinulović. They had two daughters, Tina and Pia. The family lives in Vienna, Austria.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.2.5","label":"Sveto, son of Dominik (1957– )","detail":"Sveto married twice. In his first marriage to Petra Lukić, he had a daughter named Daniela. In his second marriage to Vera Rakin, he had a daughter named Eni.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]},{"code":"2.2.1.1.1.2.6","label":"Ivan, son of Dominik (1963– )","detail":"Ivan married Mirjana Tandara. They have two sons, Dominik and David. The family lives in the village of Tandare in Zavelim.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]}]},{"code":"2.2.1.1.1.3","label":"Mate, son of Jure (1922–1963)","detail":"Mate, Jure’s fifth son, married Mara Budić. They had a son named Tomislav, two other sons who died at the age of five, and a daughter named Matija.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.3.1","label":"Tomislav, son of Mate (1947–2014)","detail":"Tomislav married Božica Golubiček. They have a son, Mate, and a daughter, Martina.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[{"code":"2.2.1.1.1.3.1.1","label":"Mate, son of Tomislav (1980– )","detail":"Mate married Ivana Trošelj. They had a daughter named Tena. The descendants of Mate, son of Jure, now live in Zagreb.","section":"THE LINE OF JURE, SON OF TOMA","page":null,"children":[]}]}]}]}]}]},{"code":"2.2.2","label":"Mijo, son of Martin (1814– )","detail":"Martin’s third son, Mijo, and his wife Matija, née Parlov, had eight children: two sons, Martin and Mijo, the latter of whom died as a young child, and six daughters—Luca, Manda, Boža, Joza, Marija and Matija. No records of Martin have been found apart from the record of his birth. It is not known whether he died or moved away. After Martin, Mijo’s line died out.","section":"Second branch of the first Tandara family","page":null,"children":[]},{"code":"2.2.3","label":"Grgo, son of Martin (1818– )","detail":"Grgo married twice. From his first marriage to Rosa, née Budimir, he had a son, Lovro, and a daughter, Jaka. In his second marriage to Jaka, née Knežević, Grgo had two sons, Mate, who died as a young child, and Mijo, as well as three daughters: Matija, Joza and Veronika.","section":"Second branch of the first Tandara family","page":null,"children":[{"code":"2.2.3.1","label":"Lovro, son of Grgo (1842–1922)","detail":"Lovro married Iva Parlov. They had two sons, Ante and Marijan, and three daughters: Lucija, who died as a child, Iva, and another daughter also named Lucija. Ante and Marijan were the only sons who continued the family line. Their sons had a total of thirty-three children. The Ričice parish death register records that Lovro’s daughter Luca was “killed by stones” at the age of thirteen.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1","label":"Ante, son of Lovro (1871–1933)","detail":"Ante was married to Tomica Lukić. They had five sons—Ivan, Marijan, the first Mate, who died as a child, the second Mate, and Nikola—and three daughters: Marta, Iva and Matija. Ivan, Marijan, the second Mate and Nikola continued the family line.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.1","label":"Ivan, son of Ante (1896– )","detail":"Ivan, Ante’s eldest son, married Mara Mršić. They had five sons—Lovro, Mirko, Mate, Ante Vlade and Nikola—and a daughter named Tomica. Ivan moved to Slatina, and his descendants now live in Predavac near Bjelovar, Slatina, Obrovac, Zagreb and Germany.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.1.1","label":"Lovro, son of Ivan (1925– )","detail":"Lovro was Ivan’s eldest son. He and his wife Rozika Peška had two daughters, Štefica and Ana.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]},{"code":"2.2.3.1.1.1.2","label":"Mirko, son of Ivan (1928– )","detail":"Mirko married Danica Lukić. They had two sons, Ivan and Veselko, and a daughter named Mirjana. The family lives in Predavac near Bjelovar.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.1.2.1","label":"Ivan, son of Mirko (1961– )","detail":"Ivan, Mirko’s elder son, married Nada Kegalj and they had two sons, Robert and Kristijan. The family lives in Predavac near Bjelovar.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]},{"code":"2.2.3.1.1.1.2.2","label":"Veselko, son of Mirko (1964– )","detail":"Veselko, Mirko’s younger son, married Martina Hohmann. They have a son, Mirko, and a daughter, Janina. The family lives in Predavac.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]}]},{"code":"2.2.3.1.1.1.3","label":"Mate, son of Ivan (1932–1970)","detail":"Ivan’s third son married Marija Srebrnjak. They had one daughter, Sandra.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]},{"code":"2.2.3.1.1.1.4","label":"Ante Vlade, son of Ivan (1934– )","detail":"Ante Vlade, Ivan’s fourth son, married twice. In his first marriage to Karina Mesch, he had two sons, Johan and Franz, and a daughter named Veronika. He had no children in his second marriage to Tonka Zanne.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.1.4.1","label":"Johan, son of Ante Vlade (1960– )","detail":"Johan and his wife Katarina Koniks have a son, Gerd, and a daughter, Madita. The family lives in Germany.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]},{"code":"2.2.3.1.1.1.4.2","label":"Franz, son of Ante Vlade (1966– )","detail":"Franz married Honolore Genesen. They have a son named Marvin. The family lives in Germany.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]}]}]},{"code":"2.2.3.1.1.2","label":"Marijan, son of Ante (1898–1933)","detail":"Ante’s second son was married to Milica, née Mikulić. They had two sons—Frane, who was killed in Vienna in 1945 at the age of eighteen, and Ante, who died as a young child— and two daughters, Marija and Stana. Marijan died of pneumonia at the age of thirty-five. His sons had no descendants, and his line therefore died out.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]},{"code":"2.2.3.1.1.3","label":"Mate, son of Ante (1910–1991)","detail":"Mate, Ante’s fourth son, was married to Mara Knežević. They had two sons, Ante Bruno and Frane, and three daughters: Ana, Dinka and Olga.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.3.1","label":"Ante Bruno, son of Mate (1937–1989)","detail":"Dr Bruno was born on 7 October 1937 in Ričice. In 1968, he married Vanja Brkljača. They had a son, Zvonimir, and two daughters, Zrinka and Tomislava.\n\nDr Ante Bruno Tandara (1937–1989) was a Croatian physician, a member of the Parliament of the Socialist Republic of Croatia and a participant in the Croatian Spring. He was elected to Parliament in 1969, and after the suppression of the Croatian Spring, his parliamentary immunity was revoked.\n\nBecause of his political activities, he was arrested and sentenced to two years and four months of rigorous imprisonment, which he served in Stara Gradiška.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.3.1.1","label":"Zvonimir, son of Ante Bruno (1973– )","detail":"Zvonimir married Aneta Gacek. They have a son named Oskar. The family lives in Supetar on the island of Brač.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]}]},{"code":"2.2.3.1.1.3.2","label":"Frane, son of Mate (1947– )","detail":"Frane, Mate’s younger son, married Matija Topalušić. They had two sons, Mate and Ante, and a daughter named Elza. They live in Ričice.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.3.2.1","label":"Mate, son of Frane (1973– )","detail":"Mate married Ana Marija Vlahović. They have two sons, Ante and Frane, and a daughter named Leonarda. The family lives in Ričice.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[]}]}]},{"code":"2.2.3.1.1.4","label":"Nikola, son of Ante (1919–1981)","detail":"Nikola, Ante’s fifth son, was married to Tomica Budimir. They had four sons—Ante, Drago, Jerko and Ivan—and three daughters: Matija, Branka and Marija. Jerko was married to Stanka Racetin, with whom he had a daughter named Ana. Drago was the only son to continue the line, and his sons now live in Ričice.","section":"THE LINE OF LOVRO, SON OF GRGO","page":null,"children":[{"code":"2.2.3.1.1.4.1","label":"Drago, son of Nikola (1952– )","detail const UI = {"lang":"en","title":"Complete Petar Branch","description":"Complete clickable interactive family-tree diagram of Petar’s branch of the Tandara family line.","back":"← Petar Branch","back_href":"box2b-en.html","other_href":"box2b.html","subtitle":"{count} numbered people · {generations} displayed generations · click a person to open the complete record","expand":"Expand all","collapse":"Collapse","three":"First 3 generations","fit":"Fit","search_ph":"Name, code, nickname or place…","find":"Find","aria":"Interactive family tree of Petar’s branch","close":"Close","code":"Code","section":"Section","open":"Open related page","no_details":"No additional description is available for this person.","not_found":"No result for: ","root_legend":"Petar Tandara","sons_legend":"Petar’s sons","desc_legend":"Descendants","help":"Mouse wheel: zoom · drag: move · click a box: details and branching","toggle_open":"Show descendants","toggle_close":"Hide descendants","lang_label":"Change language","hr_title":"Hrvatski","en_title":"English","default_section":"Second branch of the first Tandara family","locale":"en"};
const svg=document.getElementById('treeSvg');
const viewport=document.getElementById('viewport');
const linksLayer=document.getElementById('links');
const nodesLayer=document.getElementById('nodes');
const details=document.getElementById('details');
const detailPage=document.getElementById('detailPage');
const statusBox=document.getElementById('status');
const BOX_W=326,BOX_H=78,X_STEP=366,ROW_STEP=96,MARGIN=54;
let scale=1,panX=20,panY=20,selectedCode=null,matchCode=null,dragging=false,dragStart=null,bounds={width:1000,height:700};
function walk(node,cb,parent=null,depth=0){cb(node,parent,depth);(node.children||[]).forEach(ch=>walk(ch,cb,node,depth+1));}
function findNode(code){let result=null;walk(DATA,n=>{if(n.code===code)result=n});return result;}
function setExpandedToDepth(maxDepth){walk(DATA,(n,p,d)=>{n.expanded=d<maxDepth});}
function visibleChildren(node){return node.expanded?(node.children||[]):[];}
function computeLayout(){
  const positions=new Map();let leafIndex=0,maxDepth=0,maxY=0;
  function place(node,depth,parent=null){
    maxDepth=Math.max(maxDepth,depth);const children=visibleChildren(node);let y;
    if(children.length){const ys=children.map(ch=>place(ch,depth+1,node));y=(ys[0]+ys[ys.length-1])/2;}else{y=leafIndex*ROW_STEP;leafIndex++;}
    positions.set(node.code,{x:MARGIN+depth*X_STEP,y:MARGIN+y,node,parent,depth});maxY=Math.max(maxY,y);return y;
  }
  place(DATA,0,null);
  bounds.width=MARGIN*2+maxDepth*X_STEP+BOX_W;
  bounds.height=MARGIN*2+Math.max(maxY+BOX_H,BOX_H);
  return positions;
}
function colors(depth){if(depth===0)return{fill:'#174f39',text:'#fff',stroke:'#0d3425'};if(depth===1)return{fill:'#e8f2fb',text:'#173a57',stroke:'#4d82aa'};return{fill:'#fff1df',text:'#553719',stroke:'#bb8144'};}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function wrapText(text,max=38){const words=String(text).split(/\s+/),lines=[];let line='';for(const word of words){const test=(line+' '+word).trim();if(test.length>max&&line){lines.push(line);line=word}else line=test;}if(line)lines.push(line);if(lines.length>2){const rest=lines.slice(1).join(' ');lines[1]=rest.length>max?rest.slice(0,max-1)+'…':rest;}return lines.slice(0,2);}
function render(){
  const pos=computeLayout();let links='';
  for(const p of pos.values()){if(!p.parent||!pos.has(p.parent.code))continue;const parent=pos.get(p.parent.code);const x1=parent.x+BOX_W,y1=parent.y+BOX_H/2,x2=p.x,y2=p.y+BOX_H/2,mid=x1+(x2-x1)/2;links+=`<path class="connector" d="M${x1},${y1} H${mid} V${y2} H${x2}"/>`;}
  linksLayer.innerHTML=links;let markup='';
  for(const p of pos.values()){const n=p.node,c=colors(p.depth),lines=wrapText(n.label),has=(n.children||[]).length>0,indicator=has?(n.expanded?'−':'+'):'';const cls=['node'];if(n.code===selectedCode)cls.push('selected');if(n.code===matchCode)cls.push('match');const toggleLabel=n.expanded?UI.toggle_close:UI.toggle_open;
    markup+=`<g class="${cls.join(' ')}" data-code="${esc(n.code)}" transform="translate(${p.x},${p.y})" role="button" tabindex="0" aria-label="${esc(n.label)}${has?', '+toggleLabel:''}">
      <rect class="main" width="${BOX_W}" height="${BOX_H}" rx="10" fill="${c.fill}" stroke="${c.stroke}"></rect>
      <text class="code" x="14" y="20" fill="${c.text}">${esc(n.code)}</text>
      ${lines.map((line,i)=>`<text class="label" x="14" y="${46+i*18}" fill="${c.text}">${esc(line)}</text>`).join('')}
      ${has?`<circle class="toggle-circle" cx="${BOX_W-20}" cy="20" r="12" stroke="${c.stroke}"></circle><text class="toggle-symbol" x="${BOX_W-20}" y="25" text-anchor="middle" fill="${c.stroke}">${indicator}</text>`:''}
    </g>`;
  }
  nodesLayer.innerHTML=markup;
  nodesLayer.querySelectorAll('.node').forEach(g=>{
    const activate=()=>{const n=findNode(g.dataset.code);selectedCode=n.code;showDetails(n);if((n.children||[]).length)n.expanded=!n.expanded;render();};
    g.addEventListener('click',e=>{e.stopPropagation();activate()});
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}});
  });
  applyTransform();
}
function showDetails(n){document.getElementById('detailTitle').textContent=n.label;document.getElementById('detailCode').textContent=UI.code+' '+n.code;document.getElementById('detailSection').textContent=UI.section+': '+n.section;document.getElementById('detailText').textContent=n.detail||UI.no_details;if(n.page){detailPage.href=n.page;detailPage.classList.add('visible')}else{detailPage.removeAttribute('href');detailPage.classList.remove('visible')}details.classList.add('open');}
function applyTransform(){viewport.setAttribute('transform',`translate(${panX},${panY}) scale(${scale})`);}
function fitTree(){const r=svg.getBoundingClientRect();if(!r.width||!r.height)return;scale=Math.max(.12,Math.min((r.width-46)/bounds.width,(r.height-46)/bounds.height,1.15));panX=(r.width-bounds.width*scale)/2;panY=(r.height-bounds.height*scale)/2;applyTransform();}
function zoomAt(factor,cx,cy){const old=scale;scale=Math.max(.12,Math.min(3.2,scale*factor));panX=cx-(cx-panX)*(scale/old);panY=cy-(cy-panY)*(scale/old);applyTransform();}
function expandAncestors(code){const parts=code.split('.');for(let i=2;i<parts.length;i++){const n=findNode(parts.slice(0,i).join('.'));if(n)n.expanded=true;}}
function centerNode(code){requestAnimationFrame(()=>{const p=computeLayout().get(code);if(!p)return;const r=svg.getBoundingClientRect();panX=r.width/2-(p.x+BOX_W/2)*scale;panY=r.height/2-(p.y+BOX_H/2)*scale;applyTransform();});}
function flashStatus(text){statusBox.textContent=text;statusBox.classList.add('show');setTimeout(()=>statusBox.classList.remove('show'),2200);}
function searchTree(){const input=document.getElementById('search'),q=input.value.trim().toLocaleLowerCase(UI.locale);if(!q)return;let found=null;walk(DATA,n=>{const hay=(n.code+' '+n.label+' '+n.detail+' '+n.section).toLocaleLowerCase(UI.locale);if(!found&&hay.includes(q))found=n});if(!found){flashStatus(UI.not_found+input.value.trim());return;}expandAncestors(found.code);selectedCode=found.code;matchCode=found.code;render();showDetails(found);centerNode(found.code);}
document.getElementById('expandAll').addEventListener('click',()=>{walk(DATA,n=>n.expanded=true);render();fitTree()});
document.getElementById('collapse').addEventListener('click',()=>{walk(DATA,n=>n.expanded=false);DATA.expanded=true;render();fitTree()});
document.getElementById('threeLevels').addEventListener('click',()=>{setExpandedToDepth(3);render();fitTree()});
document.getElementById('fit').addEventListener('click',fitTree);
document.getElementById('zoomIn').addEventListener('click',()=>zoomAt(1.22,svg.clientWidth/2,svg.clientHeight/2));
document.getElementById('zoomOut').addEventListener('click',()=>zoomAt(.82,svg.clientWidth/2,svg.clientHeight/2));
document.getElementById('findBtn').addEventListener('click',searchTree);
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchTree()});
document.getElementById('closeDetails').addEventListener('click',()=>details.classList.remove('open'));
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.node'))return;dragging=true;svg.classList.add('dragging');svg.setPointerCapture(e.pointerId);dragStart={x:e.clientX,y:e.clientY,panX,panY}});
svg.addEventListener('pointermove',e=>{if(!dragging)return;panX=dragStart.panX+(e.clientX-dragStart.x);panY=dragStart.panY+(e.clientY-dragStart.y);applyTransform()});
function endDrag(){dragging=false;svg.classList.remove('dragging')};svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',fitTree);
setExpandedToDepth(3);render();requestAnimationFrame(fitTree);
</script>
