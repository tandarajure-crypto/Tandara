<script>
const DATA={"code":"2.0","detail":"Petar Tandara was Ivan’s second son. He died in 1817 at the age of eighty-three, so it is estimated that he was born around 1734. Petar was married to Jela, née Budić. They had seven sons—Grgo, Jakov (1773–), Martin, Marijan (1781–), Mijo, Tadija and Marko (1787–)—and two daughters, Manda (1777–) and Jela (–1824). The sons Jakov (1773–), Marijan (1781–), Tadija and Marko (1787–) do not appear in the 1806 Register of Souls, and Tadija is also absent from the 1819 register. It may therefore be assumed that they were no longer alive or that one of them had moved away from Ričice.","children":[{"code":"2.1","detail":"Grgo, Petar’s eldest son, married Ruža, née Pušić. They had a son, Šimun, and a daughter, Iva (1798–).","children":[{"code":"2.1.1","detail":"Šimun was married to Jela, née Budimir, with whom he had a son, Mate (1826–), and three daughters: Iva (1831–), Matija (1837–) and Marta (1845–). Only Mate’s year of birth is known, so his later life and the circumstances explaining the absence of further records cannot be established. Šimun’s family line ended after his son Mate.","children":[],"label":"Šimun, son of Grgo (★ 1800 – ✝ 1874)"}],"label":"Grgo, son of Petar (★ 1770 – ✝ unknown)"},{"code":"2.2","detail":"Martin, Petar’s third son, married Ruža, née Lekić. They had six sons—Ivan, Jure (1811–), Mijo, Grgo, Filip (1821–) and Josip (1824–)—and two daughters, Matija and Ana (1828–). No records of Jure, Filip or Josip have been found apart from their baptismal entries, so it is not known whether they died young or moved away. Martin’s son Mijo left no male descendants, so the family line was continued only by Martin’s sons Ivan and Grgo.","children":[{"code":"2.2.1","detail":"Ivan, Martin’s eldest son, married Antica, née Lažeta, in 1826. Ivan and Antica had three sons—Marijan (1828–1828), Toma and Jure (1840–)—and four daughters: Ruža (1834–), Iva, Joza (1839–1839) and Matija (1841–). No information about Jure has been found apart from the record of his birth. Toma was the only successor to Ivan’s line and the founder of the branch known by the nickname Tromići .","children":[{"code":"2.2.1.1","detail":"Toma was married to Tomica, née Kovač. They had four sons: Ivan (1866–), Mate (1870–), Jure and another son also named Ivan (1879–1879). Toma’s only successor was his son Jure . Toma’s line in Zavelim was known by the nickname Tromići , which, according to family tradition, referred to their tall stature and slow, heavy gait.","children":[{"code":"2.2.1.1.1","detail":"Toma’s third son and only successor, Jure, married Iva, née Lažeta. They had five sons—Toma (1909–1914), Ivan (1911–1915), Pio, Dominik and Mate—and a daughter, Matija (1908–). The line was continued by the sons Pio, Dominik and Mate.","children":[{"code":"2.2.1.1.1.1","detail":"Pio, Jure’s third son, married Terezija, née Budimir. They had three sons—Ivan, Jure and Jozo—and a daughter, Mara (1937–).","children":[{"code":"2.2.1.1.1.1.1","detail":"Ivan was married to Marijana, née Petter, with whom he had a son, Dino, and a daughter, Romana. The family now lives in Zagreb.","children":[{"code":"2.2.1.1.1.1.1.1","detail":"Dino married Matilda, née Klepikapić. They have three daughters: Hedviga (1991–), Leonarda (1995–) and Lucija (1999–). He has no male descendants. The family lives in Zagreb.","children":[],"label":"Dino, son of Ivan (★ 1964 – ✝ unknown)"}],"label":"Ivan, son of Pio (★ 1935 – ✝ 2025)"},{"code":"2.2.1.1.1.1.2","detail":"Jure was married to Mila, née Škorić. They had a son, Tomislav (1972–), and three daughters: Marija (1968–), Angela (1971–) and Nediljka (1972–). Tomislav never married. The family now lives in Split.","children":[],"label":"Jure, son of Pio (★ 1943 – ✝ 2004)"},{"code":"2.2.1.1.1.1.3","detail":"Jozo married Mirjana, née Generalić. They have a son, Domagoj (1978–), and two daughters, Tereza (1973–) and Zrinka (1975–). The family lives in Split.","children":[],"label":"Jozo, son of Pio (★ 1949 – ✝ unknown)"}],"label":"Pio, son of Jure (★ 1916 – ✝ 1990)"},{"code":"2.2.1.1.1.2","detail":"Dominik, Jure’s fourth son, married Mara, née Knezović. They had six sons—Ante (1948–), Bariša (1950–), Nikola (1953–), Pio (1954–), Sveto (1958–) and Ivan (1963–)—and a daughter, Olga (1965–). Ante, Nikola, Pio and Sveto have no sons. No information about Bariša’s marriage is available. Only Ivan’s sons continued Dominik’s line.","children":[{"code":"2.2.1.1.1.2.1","detail":"Ante was married to Dubravka, née Pencinger. They had two daughters, Ana Marija (1978–) and Ozana (1982–). The family lives in Križevci.","children":[],"label":"Ante, son of Dominik (★ 1948 – ✝ unknown)"},{"code":"2.2.1.1.1.2.2","detail":"","children":[],"label":"Bariša, son of Dominik (★ 1950 – ✝ unknown)"},{"code":"2.2.1.1.1.2.3","detail":"Nikola married Nada, née Jurčević. They had four daughters: Marijana (1974–), Iva (1975–), Brigita (1979–) and Anita (1982–). After returning, Nikola once again lives in the village of Tandare in Zavelim.","children":[],"label":"Nikola, son of Dominik (★ 1953 – ✝ unknown)"},{"code":"2.2.1.1.1.2.4","detail":"Pio married Ljubina, née Krinulović. They had two daughters, Tina and Pia. The family lives in Vienna, Austria.","children":[],"label":"Pio, son of Dominik (★ 1954 – ✝ unknown)"},{"code":"2.2.1.1.1.2.5","detail":"Sveto married twice. In his first marriage to Petra, née Lukić, he had a daughter, Daniela (1982–). In his second marriage to Vera, née Rakin, he had a daughter, Eni (1997–).","children":[],"label":"Sveto, son of Dominik (★ 1957 – ✝ unknown)"},{"code":"2.2.1.1.1.2.6","detail":"Ivan married Mirjana Tandara. They have two sons, Dominik (1990–) and David. The family lives in the village of Tandare in Zavelim.","children":[],"label":"Ivan, son of Dominik (★ 1963 – ✝ unknown)"}],"label":"Dominik, son of Jure (★ 1919 – ✝ 1987)"},{"code":"2.2.1.1.1.3","detail":"Mate, Jure’s fifth son, married Mara, née Budić. They had two sons, Tomislav and Mijo (1955–1960), and a daughter, Matija (1952–).","children":[{"code":"2.2.1.1.1.3.1","detail":"Tomislav married Božica, née Golubiček. They have a son, Mate, and a daughter, Martina (1978–). The family moved to Zagreb.","children":[{"code":"2.2.1.1.1.3.1.1","detail":"Mate married Ivana, née Trošelj. They had a daughter, Tena (2006–). The family now lives in Zagreb.","children":[],"label":"Mate, son of Tomislav (★ 1980 – ✝ unknown)"}],"label":"Tomislav, son of Mate (★ 1947 – ✝ 2014)"}],"label":"Mate, son of Jure (★ 1922 – ✝ 1963)"}],"label":"Jure, son of Toma (★ 1874 – ✝ 1931)"}],"label":"Toma, son of Ivan (★ 1830 – ✝ unknown)"}],"label":"Ivan, son of Martin (★ 1807 – ✝ 1877)"},{"code":"2.2.2","detail":"Martin’s third son and his wife Matija, née Parlov, had eight children: two sons, Martin (1850–) and Mijo (1851–1851), and six daughters—Lucija (1836–1836), Manda (1838–1838), Boža (1839–), Joza (1845–), Marija (1852–) and Matija (1856–). Mijo died shortly after birth, while no records of Martin have been found apart from the record of his birth. It is not known whether he died or moved away. Mijo’s line ended after Martin.","children":[],"label":"Mijo, son of Martin (★ 1814 – ✝ unknown)"},{"code":"2.2.3","detail":"Grgo, son of Martin, married twice. From his first marriage to Rosa, née Budimir, he had a son, Lovro, and a daughter, Jaka (1845–). In his second marriage to Jaka, née Knežević, Grgo had two sons, Mate (1853–1856) and Mijo, and three daughters: Matija (1850–), Joza (1861–1878) and Veronika (1866–).","children":[{"code":"2.2.3.1","detail":"Lovro married Iva, née Parlov. They had three sons—Ante, Ivan (1876–) and Marijan—and three daughters: the first Lucija (1864–1876), Iva (1884–1908) and the second Lucija (–1877). Ante and Marijan were the only successors to the line. Their descendants had thirty-three children. The death register of the Ričice parish records that Lovro’s daughter Luca was “killed by rocks” at the age of thirteen.","children":[{"code":"2.2.3.1.1","detail":"Ante was married to Tomica, née Lukić. They had five sons—Ivan, Marijan, the first Mate (1906–1907), the second Mate (1910–) and Nikola (1915–1981)—and three daughters: Marta (1901–), Iva (1905–1911) and Matija (1908–). The successors to the line were Ivan, Marijan, Mate and Nikola.","children":[{"code":"2.2.3.1.1.1","detail":"Ante’s eldest son, Ivan, married Mara, née Mršić. They had five sons—Lovro, Mirko, Mate, Ante Vlade and Nikola (1941–)—and a daughter, Tomica (1930–). Ivan moved to Slatina, and his descendants now live in Predavac near Bjelovar, Slatina, Obrovac, Zagreb and Germany.","children":[{"code":"2.2.3.1.1.1.1","detail":"Lovre, Ivan’s eldest son, married Rozika, née Peška. They had two daughters, Štefica (1955–) and Ana (1967–). The family lives in Slatina.","children":[],"label":"Lovre, son of Ivan (★ 1925 – ✝ unknown)"},{"code":"2.2.3.1.1.1.2","detail":"Mirko married Danica, née Lukić. They had two sons, Ivan and Veselko, and a daughter, Mirjana (1957–). The family lives in Predavac near Bjelovar.","children":[{"code":"2.2.3.1.1.1.2.1","detail":"Mirko’s elder son, Ivan, married Nada, née Kegalj. They had two sons, Robert and Kristijan. The family lives in Predavac near Bjelovar.","children":[],"label":"Ivan, son of Mirko (★ 1961 – ✝ unknown)"},{"code":"2.2.3.1.1.1.2.2","detail":"Mirko’s younger son, Veselko, married Martina, née Hohmann. They have a son, Mirko, and a daughter, Janina. The family lives in Predavac.","children":[],"label":"Veselko, son of Mirko (★ 1964 – ✝ unknown)"}],"label":"Mirko, son of Ivan (★ 1928 – ✝ unknown)"},{"code":"2.2.3.1.1.1.3","detail":"Ivan’s third son married Marija Srebrnjak. They had only one daughter, Sandra (1967–).","children":[],"label":"Mate, son of Ivan (★ 1932 – ✝ 1970)"},{"code":"2.2.3.1.1.1.4","detail":"Ivan’s fourth son, Ante Vlade, married twice. In his first marriage to Karina, née Mesch, he had two sons, Johan and Franz, and a daughter, Veronika. He had no children in his second marriage to Tonka, née Zanne. The family moved to Obrovac.","children":[{"code":"2.2.3.1.1.1.4.1","detail":"Johan and his wife Katarina, née Koniks, have a son, Gerd, and a daughter, Madita. The family lives in Germany.","children":[],"label":"Johan, son of Ante Vlade (★ 1960 – ✝ unknown)"},{"code":"2.2.3.1.1.1.4.2","detail":"Franz married Honolore, née Genesen. They have a son, Marvin. The family lives in Germany.","children":[],"label":"Franz, son of Ante Vlade (★ 1966 – ✝ unknown)"}],"label":"Ante Vlade, son of Ivan (★ 1934 – ✝ unknown)"}],"label":"Ivan, son of Ante (★ 1896 – ✝ unknown)"},{"code":"2.2.3.1.1.2","detail":"Marijan was married to Milica, née Mikulić. They had two sons, Frane (1927–1945), who was killed in Vienna, and Ante (1929–1929), as well as two daughters, Marija (1930–) and Stana (1932–1933). Marijan died of pneumonia at the age of thirty-five. His sons had no descendants, so his line ended.","children":[],"label":"Marijan, son of Ante (★ 1898 – ✝ 1933)"},{"code":"2.2.3.1.1.3","detail":"Mate, Ante’s son, was married to Mara, née Knežević. They had two sons, Ante Bruno and Frane, and three daughters: Ana (1935–), Dinka (1945–) and Olga (1952–).","children":[{"code":"2.2.3.1.1.3.1","detail":"Dr Bruno was born on 7 October 1937 in Ričice. In 1968, he married Vanja, née Brkljača. They had a son, Zvonimir, and two daughters, Zrinka and Tomislava.\n\nDr Ante Bruno was a Croatian physician, a member of the Parliament of the Socialist Republic of Croatia and a participant in the Croatian Spring. He was elected to Parliament in 1969, and after the suppression of the Croatian Spring, his parliamentary immunity was revoked.\n\nBecause of his political activities, he was arrested and sentenced to two years and four months of imprisonment under a strict regime, which he served at Stara Gradiška Prison.","children":[{"code":"2.2.3.1.1.3.1.1","detail":"Zvonimir married Aneta, née Gacek. They have a son, Oskar. The family lives in Supetar on the island of Brač.","children":[],"label":"Zvonimir, son of Ante Bruno (★ 1973 – ✝ unknown)"}],"label":"Ante Bruno, son of Mate (★ 1937 – ✝ 1989)"},{"code":"2.2.3.1.1.3.2","detail":"Mate’s younger son, Frane, married Matija, née Topalušić. They had two sons, Mate and Ante (1976–), and a daughter, Elza (1978–). They live in Ričice.","children":[{"code":"2.2.3.1.1.3.2.1","detail":"Mate married Ana Marija, née Vlahović. They have two sons, Ante and Frane, and a daughter, Leonarda. The family lives in Ričice.","children":[],"label":"Mate, son of Frane (★ 1973 – ✝ unknown)"}],"label":"Frane, son of Mate (★ 1947 – ✝ unknown)"}],"label":"Mate, son of Ante (★ 1910 – ✝ 1991)"},{"code":"2.2.3.1.1.4","detail":"Nikola was married to Tomica, née Budimir. They had four sons—Ante (1950–1950), Drago, Jerko and Ivan (1955–1955)—and three daughters: Matija (1944–), Branka (1947–) and Marija (1948–). Jerko was married to Stanka Racetin, with whom he had a daughter, Ana (1985–). Drago is the only successor to the line, and his sons now live in Ričice.","children":[{"code":"2.2.3.1.1.4.1","detail":"Drago and his wife Zdenka, née Budimir, had two sons, Nikola (1976–) and Ivica (1978–). Their son Nikola Tandara is a Montfortian priest in Poland. The family lives in Ričice.","children":[{"code":"2.2.3.1.1.4.1.1","detail":"Ivica and his wife Jelena, née Perić, have a son, Nikola, and a daughter, Laura. They live in Ričice.","children":[],"label":"Ivica, son of Drago (★ 1978 – ✝ unknown)"}],"label":"Drago, son of Nikola (★ 1952 – ✝ unknown)"},{"code":"2.2.3.1.1.4.2","detail":"Nikola’s third son, Jerko, married Stanka, née Racetin. They have a daughter, Ana (1985–). He has no male descendants. The family lives in Ričice.","children":[],"label":"Jerko, son of Nikola (★ 1953 – ✝ unknown)"}],"label":"Nikola, son of Ante (★ 1915 – ✝ 1981)"}],"label":"Ante, son of Lovro (★ 1871 – ✝ 1933)"},{"code":"2.2.3.1.2","detail":"Marijan married Luca, née Parlov. They had four sons—Mijo, Marin, Petar and Ivan (1924–1925)—and four daughters: Matija (1907–), Ana (1910–), Iva (1918–2005) and Tomica (1921–). Ivan died shortly after birth.","children":[{"code":"2.2.3.1.2.1","detail":"Marijan’s eldest son, Mijo, was married to Slavka, née Sablić. They had nine children: five sons—Vinko, Ivan (1932–1932), Milan, Marijan and another Ivan (1950–1952)—and four daughters: Mila-Iva (1933–), Anica (1935–), Nada (1940–) and Maca (1947–). Only the sons Vinko, Milan and Marijan continued Mijo’s line. The descendants of Vinko and Milan now live in Ričice, Split, Zagreb, Austria and Germany.","children":[{"code":"2.2.3.1.2.1.1","detail":"Vinko married Mara Dragica, née Budimir. They had two sons, Milenko (1955–1956) and Svetko, and two daughters, Dragica (1957–) and Milosava (1959–).","children":[{"code":"2.2.3.1.2.1.1.1","detail":"Svetko married Nevenka, née Tavra. They had a son, Kristijan.","children":[],"label":"Svetko, son of Vinko (★ 1960 – ✝ unknown)"}],"label":"Vinko, son of Mijo (★ 1930 – ✝ unknown)"},{"code":"2.2.3.1.2.1.2","detail":"Milan married Stana, née Tandara. They had three sons—Nediljko, Željko and Tihomir—and a daughter, Slavica (1965–).","children":[{"code":"2.2.3.1.2.1.2.1","detail":"Nediljko married Vesna, née Mandić. They had a son, Milan, and two daughters, Ana Marija and Elizabeta.","children":[],"label":"Nediljko, son of Milan (★ 1962 – ✝ unknown)"},{"code":"2.2.3.1.2.1.2.2","detail":"Željko married Valerija, née Glavota. They had three daughters: Mihaela, Marija and Stana. He had no male descendants.","children":[],"label":"Željko, son of Milan (★ 1967 – ✝ 2020)"},{"code":"2.2.3.1.2.1.2.3","detail":"Tihomir married Anica, née Miloš. They had a son, Milan, and a daughter, Ivana.","children":[],"label":"Tihomir, son of Milan (★ 1969 – ✝ unknown)"}],"label":"Milan, son of Mijo (★ 1938 – ✝ unknown)"},{"code":"2.2.3.1.2.1.3","detail":"Marijan married Milenka, née Budimir. They have a son, Mario, and a daughter, Silvana (1965–).","children":[{"code":"2.2.3.1.2.1.3.1","detail":"Mario married Jasminka, née Ilić. He has no male descendants to continue the family line.","children":[],"label":"Mario, son of Marijan (★ 1974 – ✝ unknown)"}],"label":"Marijan, son of Mijo (★ 1942 – ✝ unknown)"}],"label":"Mijo, son of Marijan (★ 1908 – ✝ unknown)"},{"code":"2.2.3.1.2.2","detail":"Marin married Matija, née Žuljić. They had five sons—Marijan (1941–1943), Alojz, Luka (1948–1948), Vice and Blaž—and three daughters: Dragica (1938–), Nevenka (1944–) and Anka (1954–). Marin’s descendants now live in Ričice, Split, Zagreb and Germany.","children":[{"code":"2.2.3.1.2.2.1","detail":"Alojz married Dragica, née Jurčević. They have a son, Robert (1970–), and a daughter, Zrinka (1971–).","children":[{"code":"2.2.3.1.2.2.1.1","detail":"Robert married Sabina, née Patzak. They have a son, Marco Marin, and two daughters, Carolina Victoria and Laura Nadine.","children":[],"label":"Robert, son of Alojz"}],"label":"Alojz, son of Marin (★ 1946 – ✝ unknown)"},{"code":"2.2.3.1.2.2.2","detail":"Vice is married to Ružica, née Barnjak, and they have no children. He is acknowledged here for his important role in initiating this project.","children":[],"label":"Vice, son of Marin (★ 1949 – ✝ unknown)"},{"code":"2.2.3.1.2.2.3","detail":"Blaž married Zorana, née Čarija. They had three sons: Mario (1977–), Ante (1980–) and Vice (1983–). Vice never married.","children":[{"code":"2.2.3.1.2.2.3.1","detail":"Mario married Josipa, née Artić. They have a son, Lovro, and a daughter, Tonka.","children":[],"label":"Mario, son of Blaž (★ 1977 – ✝ unknown)"},{"code":"2.2.3.1.2.2.3.2","detail":"Ante married Tanja, née Koren. They have a son, Petar. The family lives in Ričice.","children":[],"label":"Ante, son of Blaž (★ 1980 – ✝ unknown)"}],"label":"Blaž, son of Marin (★ 1953 – ✝ unknown)"}],"label":"Marin, son of Marijan (★ 1912 – ✝ 1989)"},{"code":"2.2.3.1.2.3","detail":"Petar married Zorka, née Pavić. They had a son, Ante (1942–1943), and seven daughters: Mila (1947–), Marija (1950–), Ankica (1952–), Mira (1954–), Zorka (1955–), Rosa (1958–) and Nada (1960–1962). Petar had no successor to continue his line.","children":[],"label":"Petar, son of Marijan (★ 1915 – ✝ unknown)"}],"label":"Marijan, son of Lovro (★ 1881 – ✝ 1939) – descendants’ nickname: LOVRIĆI"}],"label":"Lovro, son of Grgo (★ 1842 – ✝ 1922)"},{"code":"2.2.3.2","detail":"Grgo’s third son, Mijo, married Iva Tandara. They had seven children: four sons—Martin (1886–1905), the first Nikola (1889–), Mate (1892–) and the second Nikola (1902–)—and three daughters: Iva (1883–), the first Mara (1886–1891) and the second Mara (1894–). Martin died at the age of nineteen, while the first Nikola and Mate died as young children. No information about the second Nikola has been found apart from the record of his birth. There is no evidence that any of Mijo’s sons married or had children, so this family branch ended.","children":[],"label":"Mijo, son of Grgo (★ 1856 – ✝ 1933)"}],"label":"Grgo, son of Martin (★ 1818 – ✝ unknown)"}],"label":"Martin, son of Petar (★ 1775 – ✝ 1844)"},{"code":"2.3","detail":"Mijo, Petar’s fifth son, married Ruža, whose surname is unknown. They had only one daughter, Matija (1810–). Mijo had no successor to continue his family line.\n\nIn 1819, the family of Martin Tandara, Lovro’s grandfather, was living in Zavelim. Martin’s sons Ivan, Mijo and Grgo were listed there. When the Austrian cadastral survey was conducted in 1835, Martin Tandara, son of the late Petar, was recorded as a property owner in Ričice. At that time, most clans from Ričice owned property in Ričice, Zavelim, Podbila and Vir. These villages belonged to the same parish in Ričice. Many families within the same clan moved from one locality to another, even within Ričice itself. The population was growing rapidly and new living space was needed. In this context, it is understandable that a family, or part of a family, could be recorded in Ričice in one register and in Zavelim in the next, or vice versa. It is known with certainty, however function showMarriageDetails(code,index){const node=findNode(code),family=(FAMILY_META[code]||[])[index];if(!node||!family)return;document.getElementById('detailTitle').textContent='Spouse: '+family.spouse;document.getElementById('detailCode').textContent='Married couple · family record '+code;const sons=family.sons.length?family.sons.join('\n• '):'none recorded';const daughters=family.daughters.length?family.daughters.join('\n• '):'none recorded';document.getElementById('detailText').textContent='Surname bearer: '+node.label+'\nSpouse: '+family.spouse+'\nTotal children: '+family.total+'\n\nSons ('+family.sons.length+'):\n• '+sons+'\n\nDaughters ('+family.daughters.length+'):\n• '+daughters;details.classList.add('open');announce('Opened details for the married couple '+node.label+' i '+family.spouse);}

function applyTransform(){viewport.setAttribute('transform',`translate(${panX},${panY}) scale(${scale})`);}
function fitTree(){const rect=svg.getBoundingClientRect();if(!rect.width||!rect.height)return;scale=Math.max(.12,Math.min((rect.width-42)/bounds.width,(rect.height-42)/bounds.height,1.15));panX=(rect.width-bounds.width*scale)/2;panY=(rect.height-bounds.height*scale)/2;applyTransform();announce('The diagram has been fitted to the screen.');}
function zoomAt(factor,cx,cy){const old=scale;scale=Math.max(.12,Math.min(3.5,scale*factor));panX=cx-(cx-panX)*(scale/old);panY=cy-(cy-panY)*(scale/old);applyTransform();}
function expandAncestors(code){const parts=code.split('.');DATA.expanded=true;for(let i=2;i<parts.length;i++){const node=findNode(parts.slice(0,i).join('.'));if(node)node.expanded=true;}}
function normalize(value){return String(value||'').toLocaleLowerCase('en').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/dž/g,'d').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');}
function phonetic(value){return normalize(value).replace(/dj/g,'d').replace(/ije/g,'e').replace(/je/g,'e');}
function croatianStem(value){let word=phonetic(value);if(word.length<4)return word;const suffixes=['ingly','edly','ation','ations','ments','ment','ness','ingly','ing','ers','ies','ied','ed','es','s'];for(const suffix of suffixes){if(word.endsWith(suffix)&&word.length-suffix.length>=3)return word.slice(0,-suffix.length);}return word;}
function editDistance(left,right){const a=phonetic(left),b=phonetic(right);if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;const prev=Array.from({length:b.length+1},(_,i)=>i),curr=new Array(b.length+1);for(let i=1;i<=a.length;i++){curr[0]=i;for(let j=1;j<=b.length;j++){const cost=a[i-1]===b[j-1]?0:1;curr[j]=Math.min(curr[j-1]+1,prev[j]+1,prev[j-1]+cost);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])curr[j]=Math.min(curr[j],prev[j-2]+1);}for(let j=0;j<=b.length;j++)prev[j]=curr[j];}return prev[b.length];}
function tokenSimilarity(queryToken,fieldToken){const q=normalize(queryToken),f=normalize(fieldToken);if(!q||!f)return Infinity;if(q===f)return 0;const qp=phonetic(q),fp=phonetic(f);if(qp===fp)return .15;if(q.length>=3&&(f.startsWith(q)||q.startsWith(f)))return .35;const shorter=Math.min(qp.length,fp.length),longer=Math.max(qp.length,fp.length);if(shorter>=4&&shorter/longer>=.6&&(fp.includes(qp)||qp.includes(fp)))return .5;const qs=croatianStem(q),fs=croatianStem(f);if(qs.length>=3&&qs===fs)return .6;const distance=editDistance(qp,fp),longest=Math.max(qp.length,fp.length),allowed=longest>=8?2:longest>=4?1:0;if(distance<=allowed)return .75+distance*.35;if(longest>=5&&distance/longest<=.24)return 1.65;return Infinity;}
function fuzzyFieldScore(query,field){const q=normalize(query),f=normalize(field);if(!q||!f)return Infinity;if(q===f)return 0;if(f.startsWith(q))return .2;if(f.includes(q))return .35;const qp=phonetic(q),fp=phonetic(f);if(qp===fp)return .25;if(fp.includes(qp))return .5;const queryTokens=q.split(' ').filter(Boolean),fieldTokens=f.split(' ').filter(Boolean);if(!queryTokens.length||!fieldTokens.length)return Infinity;let total=0;for(const queryToken of queryTokens){let best=Infinity;for(const fieldToken of fieldTokens)best=Math.min(best,tokenSimilarity(queryToken,fieldToken));if(!Number.isFinite(best))return Infinity;total+=best;}return 1+total/queryTokens.length+Math.max(0,fieldTokens.length-queryTokens.length)*.015;}
function tokensMatch(query,field){return Number.isFinite(fuzzyFieldScore(query,field));}
function score(query,primary,secondary=''){const primaryScore=fuzzyFieldScore(query,primary);if(Number.isFinite(primaryScore))return primaryScore;const secondaryScore=fuzzyFieldScore(query,secondary);return Number.isFinite(secondaryScore)?secondaryScore+3.5:Infinity;}
function matchQuality(value){if(value<=.3)return'Exact match';if(value<=1.2)return'Very similar';if(value<=2.2)return'Approximate match';return'Possible match';}
function compareCodes(a,b){const left=a.split('.').map(Number),right=b.split('.').map(Number);for(let i=0;i<Math.max(left.length,right.length);i++){const d=(left[i]||0)-(right[i]||0);if(d)return d;}return 0;}
function collectResults(rawQuery){const results=[];walk(DATA,node=>{const context=PERSON_SEARCH_CONTEXT[node.code]||{},aliases=(PERSON_SEARCH_ALIASES[node.code]||[]).join(' '),primary=node.code+' '+node.label,personContext=[context.father,context.mother,aliases].join(' '),primaryScore=score(rawQuery,primary,personContext);if(Number.isFinite(primaryScore)){results.push({type:'node',node,hostCode:node.code,score:primaryScore,matchKind:'person'});}else{const detailScore=fuzzyFieldScore(rawQuery,node.detail||'');if(Number.isFinite(detailScore)&&detailScore<=1.35)results.push({type:'node',node,hostCode:node.code,score:detailScore+7,matchKind:'detail'});}});VIRTUAL_PEOPLE.forEach((person,index)=>{const primary=[person.label,person.name,person.rawName,person.qualifier].join(' '),secondary=[person.father,person.mother,person.gender,person.hostCode].join(' '),value=score(rawQuery,primary,secondary);if(Number.isFinite(value))results.push({type:'virtual',person,index,hostCode:person.hostCode,score:value+.35,matchKind:'person'});});Object.entries(FAMILY_META).forEach(([hostCode,families])=>families.forEach((family,index)=>{const node=findNode(hostCode),value=score(rawQuery,family.spouse,[node?.label,family.sons.join(' '),family.daughters.join(' ')].join(' '));if(Number.isFinite(value))results.push({type:'spouse',family,index,node,hostCode,score:value+.45,matchKind:'spouse'});}));const strongVirtualHosts=new Set(results.filter(result=>result.type==='virtual'&&result.score<=4).map(result=>result.hostCode));const filtered=results.filter(result=>!(result.type==='node'&&result.matchKind==='detail'&&strongVirtualHosts.has(result.hostCode)));const unique=new Map();for(const result of filtered){const label=result.type==='virtual'?result.person?.label:result.type==='spouse'?result.family?.spouse:result.node?.label;const key=[result.type,result.hostCode,normalize(label)].join('|');const previous=unique.get(key);if(!previous||result.score<previous.score)unique.set(key,result);}const ordered=[...unique.values()].sort((a,b)=>a.score-b.score||compareCodes(a.hostCode,b.hostCode)||String(a.person?.label||a.family?.spouse||a.node?.label).localeCompare(String(b.person?.label||b.family?.spouse||b.node?.label),'en'));if(!ordered.length)return[];const best=ordered[0].score,wordCount=normalize(rawQuery).split(' ').filter(Boolean).length,cutoff=best<=.75?(wordCount>=2?2.25:1.8):best<=2.1?best+.9:best+1.2;return ordered.filter(result=>result.score<=cutoff).slice(0,30);}
function closeSearchResults(){document.getElementById('searchResults').hidden=true;document.getElementById('searchResultItems').innerHTML='';searchInput.setAttribute('aria-expanded','false');}
function centerNode(code){requestAnimationFrame(()=>{const target=nodesLayer.querySelector(`[data-code="${code}"]`);if(!target)return;const matrix=target.getCTM(),rect=svg.getBoundingClientRect(),tx=matrix.e+BOX_W*scale/2,ty=matrix.f+BOX_H*scale/2;panX+=rect.width/2-tx;panY+=rect.height/2-ty;applyTransform();});}

function positionSearchResults(){const panel=document.getElementById('searchResults');if(panel.hidden)return;const margin=10,width=Math.min(550,window.innerWidth-margin*2),rect=searchInput.getBoundingClientRect();let left=Math.max(margin,Math.min(rect.right-width,window.innerWidth-width-margin)),top=rect.bottom+8,maxHeight=Math.min(420,window.innerHeight-top-margin);if(maxHeight<180&&rect.top>210){top=margin;maxHeight=Math.max(180,rect.top-margin);}panel.style.left=left+'px';panel.style.top=top+'px';panel.style.width=width+'px';panel.style.maxHeight=maxHeight+'px';}
function showSearchResults(results,query){activeSearchResults=results;const panel=document.getElementById('searchResults'),items=document.getElementById('searchResultItems'),title=document.getElementById('searchResultsTitle');title.textContent=results.length?'Choose a result · found '+results.length:'No results';items.innerHTML=results.length?results.map((result,index)=>{const quality=`<span class="search-result-quality">${esc(matchQuality(result.score))}</span>`;if(result.type==='virtual'){const p=result.person;return`<button class="search-result-item" type="button" data-result-index="${index}"><span class="search-result-label">${esc(p.label)}${p.qualifier?' ('+esc(p.qualifier)+')':''}</span><span class="search-result-parents">Father: ${esc(p.father||'unknown')} · Mother: ${esc(p.mother||'unknown')}</span><span class="search-result-family">${esc(p.gender||'family member')} without a separate box · record ${esc(p.hostCode)}</span>${quality}</button>`;}if(result.type==='spouse'){return`<button class="search-result-item" type="button" data-result-index="${index}"><span class="search-result-label">${esc(result.family.spouse)}</span><span class="search-result-parents">Spouse: ${esc(result.node?.label||'surname bearer')}</span><span class="search-result-family">Children ${result.family.total} · sons ${result.family.sons.length} · daughters ${result.family.daughters.length} · record ${esc(result.hostCode)}</span>${quality}</button>`;}const c=PERSON_SEARCH_CONTEXT[result.node.code]||{};return`<button class="search-result-item" type="button" data-result-index="${index}"><span class="search-result-label">${esc(result.node.label)}</span>${c.father||c.mother?`<span class="search-result-parents">Father: ${esc(c.father||'unknown')} · Mother: ${esc(c.mother||'unknown')}</span>`:''}<span class="search-result-meta">Code ${esc(result.node.code)}</span>${quality}</button>`;}).join(''):`<div class="search-result-item"><span class="search-result-meta">Not found: ${esc(query)}. Try entering part of the first name or surname.</span></div>`;panel.hidden=false;searchInput.setAttribute('aria-expanded','true');positionSearchResults();items.querySelectorAll('button[data-result-index]').forEach(button=>button.addEventListener('click',()=>{const result=activeSearchResults[Number(button.dataset.resultIndex)];if(result?.type==='virtual')focusVirtual(result.person);else if(result?.type==='spouse')focusSpouse(result);else if(result?.node)focusNode(result.node);}));announce(results.length?'Results found: '+results.length+'. Choose a person.':'No results for '+query);}

svg.addEventListener('pointerdown',event=>{if(event.target.closest?.('.node,.family-action'))return;svg.setPointerCapture(event.pointerId);pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,panX,panY};svg.classList.add('dragging');}else if(pointers.size===2){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y);pinchStart={distance,scale,panX,panY,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};dragStart=null;}});
svg.addEventListener('pointermove',event=>{if(!pointers.has(event.pointerId))return;pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1&&dragStart){const p=[...pointers.values()][0];panX=dragStart.panX+(p.x-dragStart.x);panY=dragStart.panY+(p.y-dragStart.y);applyTransform();}else if(pointers.size===2&&pinchStart){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,newScale=Math.max(.12,Math.min(3.5,pinchStart.scale*(distance/pinchStart.distance))),ratio=newScale/pinchStart.scale;scale=newScale;panX=cx-(pinchStart.cx-pinchStart.panX)*ratio;panY=cy-(pinchStart.cy-pinchStart.panY)*ratio;applyTransform();}});

function expandEmbeddedDiagramArea(){
 if(window.self===window.top)return;
 try{
  const frame=window.frameElement,parentDoc=window.parent.document,parentWin=window.parent;
  if(!frame)return;
  const layout=parentDoc.querySelector('.layout');
  const contentPage=frame.closest('.content-page')||parentDoc.querySelector('.content-page');
  const card=frame.closest('.content-card')||parentDoc.querySelector('.content-card');
  const wrap=frame.parentElement;
  if(layout){layout.style.maxWidth='none';layout.style.width='100%';layout.style.margin='0';layout.style.gap='0';layout.style.padding='0';}
  if(contentPage){contentPage.style.width='100%';contentPage.style.maxWidth='none';contentPage.style.minWidth='0';contentPage.style.padding='0';contentPage.style.justifyContent='stretch';}
  let leftPad=0,rightPad=0;
  if(card){
   const cardStyle=parentWin.getComputedStyle(card);
   leftPad=parseFloat(cardStyle.paddingLeft)||0;rightPad=parseFloat(cardStyle.paddingRight)||0;
   card.style.width='100%';card.style.maxWidth='none';card.style.margin='0';card.style.borderRadius='0';
  }
  if(wrap){wrap.style.maxWidth='none';wrap.style.width=`calc(100% + ${leftPad+rightPad}px)`;wrap.style.marginLeft=`-${leftPad}px`;wrap.style.marginRight=`-${rightPad}px`;wrap.style.marginTop='30px';wrap.style.marginBottom='0';}
  frame.style.display='block';frame.style.width='100%';frame.style.maxWidth='none';frame.style.margin='0';frame.style.borderLeft='0';frame.style.borderRight='0';frame.style.borderRadius='0';
 }catch(error){/* The standalone view remains fully functional. */}
}
