<script>
const DATA = {"code": "3.1", "label": "Ante (1769.–1849.)", "detail": "Ante, kao najstariji sin Ante Ivanova, oženio se 1801. godine Matijom Jukić. Imali su sinove Lovru, Miju i Petra, te kćeri Peru, Ružu, Anticu, Ivu i Mariju. O Petru nema drugih podataka osim zapisa o rođenju, pa se pretpostavlja da je umro mlad ili se odselio iz Zavelima. Obiteljsku lozu su nastavili sinovi Lovro i Mijo. Mijini nasljednici su dobili nadimak Tucići dok su Lovrini nasljednici preko sina Marijana dobili nadimak Lovrinovići, a preko sina Križana-Križanovići.

Prema popisu iz 1819. godine, Ante je živio u Zavelimu, a njegov brat Filip u Ričicama. Njihovi su se potomci kasnije raselili po cijeloj Hrvatskoj, Europi, SAD-u i Kanadi.", "children": [{"code": "3.1.1", "label": "Lovro Antin (1811.–1903.)", "detail": "Oženio se Matijom Sičenica. Imali su sinove Marijana i Križana.", "children": [{"code": "3.1.1.1", "label": "Marijan Lovrin (1836.–)", "detail": "Oženio se Matijom Kovač. Imali su sinove Juru, Marka, Stipana i Jozu, te kćeri Ivu, Maru i Matiju. O Stipanu nema drugih podataka osim rođenja, pa se pretpostavlja da je umro mlad ili se odselio. Marijanovi potomci, preko sinova Marka i Jure, nose nadimak Lovrinovići, nastao po Marijanovu ocu Lovri. Lovrinovići danas žive u Popovači, Sarajevu, Stobreču i Londonu.", "children": [{"code": "3.1.1.1.1", "label": "Marko Marijanov (1869.–)", "detail": "Marko je oženio Božicu Pušić. Imali su sina Mirka i kćer Ivu.", "children": [{"code": "3.1.1.1.1.1", "label": "Mirko Markov (1901.–)", "detail": "Mirko je oženio Anicu Kilić. Imali su sinove Milana i Vladimira (koji je umro u dobi od 14 godina), te kćeri Dragicu, Mariju i Nediljku. Obitelj se preselila u Popovaču.", "children": [{"code": "3.1.1.1.1.1.1", "label": "Milan Mirkov (1939.–)", "detail": "Milan je oženio Svjetlanu Trifunović. Dobili su sinove Vladimira i Dalibora. Obitelj je preselila u Sarajevo.", "children": [{"code": "3.1.1.1.1.1.1.1", "label": "Vladimir Milanov (1969.–)", "detail": "Vladimir je oženio Claire Tacher s kojom je dobio sina Alexandera Jamesa (2010.-) i kćer Sophie Elizabeth (2008.-). Obitelj je preselila u London . UK.", "children": []}, {"code": "3.1.1.1.1.1.1.2", "label": "Dalibor Milanov (1970.–)", "detail": "Dalibor je oženio Amelu Nezirović. Dobili su sina Damira i kćer Teu. Obitelj je preselila u Sarajevo.", "children": []}]}]}]}, {"code": "3.1.1.1.2", "label": "Jozo Marijanov (1882.–1944.) - nadimak Trošići", "detail": "Jozo je oženio Ivu Kovač. Dobili su sinove Marijana i Luku.", "children": [{"code": "3.1.1.1.2.1", "label": "Marijan Jozin (1910.–1984.)", "detail": "Marijan je oženio Anicu Budimir. Dobili su sinove Nikolu i Jozu (koji je umro u dobi od 6 godina), te kćeri Maru i Zorku.", "children": [{"code": "3.1.1.1.2.1.1", "label": "Nikola Marijanov (1939.–)", "detail": "Nikola je oženio Mariju Lukić. Dobili su sina Vladu, te kćeri, Anu, Marijanu i Radmilu. Obitelj je preselila u Stobreč.", "children": [{"code": "3.1.1.1.2.1.1.1", "label": "Vlade Nikolin (1970.–)", "detail": "Vlade je oženio Silvanu Ruščić. Imaju sina Franju Josipa (1995.-) i kćer Teu (2000.-). Žive u Stobreču.", "children": []}]}]}, {"code": "3.1.1.1.2.2", "label": "Luka Jozin (1912.–1987.)", "detail": "Luka je oženio Anđu Kovač. Dobili su kćeri Ivu, Maru i Zorku. Muških potomaka nije imao.", "children": []}]}]}, {"code": "3.1.1.2", "label": "Križan Lovrin (1843.–1910.)", "detail": "Oženio je Peru Budimir. Imali su 15 djece od kojih je sedmero umrlo prije desete godine. Zanimljiv je podatak da je njegov drugi sin Ilija poginuo od uboda bika. Potomci Križana, preko sinova Mate, Ante, Ivana i Jure, nose nadimak Križanovići i žive u Zagrebu, Đakovu, Kutjevu, Bektežu, Strizivojni, Vrpolju i u nekoliko europskih država.", "children": [{"code": "3.1.1.2.1", "label": "Mate Križanov (1866.–1948.)", "detail": "Najstariji sin Križana, oženio je Ivu Pirić. Imali su sinove Miju, Marijana i Jozu, te kćeri Maru i Matiju. Mijo se nikada nije oženio. Obitelj je preselila u Bektež kraj Kutjeva.", "children": [{"code": "3.1.1.2.1.1", "label": "Marijan Matin (1902.–1974.)", "detail": "Marijan je oženio Anicu Maras. Dobili su sinove Antu, Jozu, Matu i Ivana, te kćer Maru. Jozo se nije ženio. Obitelj živi u Bektežu kraj Kutjeva.", "children": [{"code": "3.1.1.2.1.1.1", "label": "Ante Marijanov (1934.–)", "detail": "Ante Marijanov je imao dva braka. U prvom braku s Elizabetom Miletić imao je sina Darka (1958.-) i kćer Gordanu. U drugom braku sa Anom Kajtar nije imao djece. Obitelj se preselila u Strizivojnu.", "children": [{"code": "3.1.1.2.1.1.1.1", "label": "Darko Antin (1958.–)", "detail": "Darko Antin je imao dva braka. U prvom braku s Angelom ima sinove Maria (1982.-) i Markusa (1987.-). U drugom braku sa Suzanom ima sina Klaus Antu (2006.-). Darko sa svojom obitelji živi u Njemačkoj.", "children": []}]}, {"code": "3.1.1.2.1.1.2", "label": "Mato Marijanov (1945.–)", "detail": "U braku s Anicom Bogdanović dobio je sina Alena (1969.-) i kćer Lauru. Obitelj je preselila u Strizivojnu.", "children": [{"code": "3.1.1.2.1.1.2.1", "label": "Alen Matin (1969.–)", "detail": "Alen je oženio Melitu Pjela s kojom je dobio sina Marina (1993.-) i kćer Enu (1996.-). Obitelj živi u Strizivojni.", "children": []}]}, {"code": "3.1.1.2.1.1.3", "label": "Ivan Marijanov (1953.–)", "detail": "Četvrti sin Marijana, oženio je Ljiljanu Cobović. Dobili su sina Marijana, te kćeri Lanu i Paulinu. Žive u Đakovu, gdje Ivan vodi vlastiti odvjetnički ured.", "children": []}]}, {"code": "3.1.1.2.1.2", "label": "Jozo Matin (1904.–1944.)", "detail": "Najmlađi sin Mate i Ive Pirić, oženio je Jaku Kilić. Dobili su sinove Miju, Jozu i Ivana, te kćer Maru. Ivan se nije ženio. Jozo je poginuo u Drugom svjetskom ratu, a Mijina obitelj danas živi u Bektežu kraj Kutjeva.", "children": [{"code": "3.1.1.2.1.2.1", "label": "Mijo Jozin (1940.–)", "detail": "Mijo je oženio Zoricu s kojom ima tri kćeri, Marijanu, Nikolinu i (ime nije poznato). Obitelj živi u Bektežu kraj Kutjeva i bavi se proizvodnjom vina. Poznata vinarska obitelj s istoimenim vinarskim brendom – Tandara.", "children": []}, {"code": "3.1.1.2.1.2.2", "label": "Jozo Jozin (1943.–)", "detail": "Jozo i supruga nepoznatog imena dobili su sina Marijana i kćer Romanu. Obitelj je preselila u Velenje, Slovenija.", "children": [{"code": "3.1.1.2.1.2.2.1", "label": "Marijan Jozin", "detail": "Marijan i supruga Marinela imaju sina Martina, te kćeri Tamaru i Petriciju. Obitelj živi u Velenju, Slovenija. Obitelj nema muških potomaka koji bi nastavili lozu.", "children": []}]}]}]}, {"code": "3.1.1.2.2", "label": "Ante Križanov (1870.–1945.)", "detail": "Treći sin Križana, oženio se Ivom Trogrlić. Imali su sina Stipana (1898.-), te kćeri Jelu i Maru. Stipan se nakon prvog svjetskog rata odselio u Srbiju; nije poznato je li imao potomke niti što se s njim kasnije dogodilo. Ako netko ima saznanja o ovoj obitelji, molio bih ga da mi se javi preko obrasca za kontakt.", "children": []}, {"code": "3.1.1.2.3", "label": "Ivan Križanov (1881.–1920.)", "detail": "Ivan je bio osmi Križanov sin. Oženio je Ružu Serdarušić s kojom je imao sinove Antu, umro u dobi od pet godina, Križana i Marijana, koji je umro kao dijete, te kćeri Maru i Anu.", "children": [{"code": "3.1.1.2.3.1", "label": "Križan Ivanov (1916.–1944.)", "detail": "U braku s Maricom Pušić imao je sina Ivana. Križan je poginuo u Zagrebu 1944. godine. Obitelj živi u Vrpolju.", "children": [{"code": "3.1.1.2.3.1.1", "label": "Ivan Križanov (1938.–2007.)", "detail": "Dvaput se ženio. Iz prvog braka s Dragicom Dragun dobio je sina Križana (1956.-). U drugom braku sa Ankom Nikolić ima kćeri Biljanu i Belinu.", "children": [{"code": "3.1.1.2.3.1.1.1", "label": "Križan Ivanov (1956.–)", "detail": "Križan i supruga Ljerka Maričić dobili su sinove Tonija i Dinka. Obitelj živi u Vrpolju.", "children": [{"code": "3.1.1.2.3.1.1.1.1", "label": "Toni Križanov (1979.–)", "detail": "Toni i Nada Jergović dobili su kćeri Veroniku i Magdalenu, te sina Filipa (2010.-). Obitelj živi u Vrpolju.", "children": []}]}]}]}]}, {"code": "3.1.1.2.4", "label": "Jure Križanov (1883.–1947.)- nadimak Đulko", "detail": "Bio je deveti sin Križana i ženio se tri puta. Rekorder po brakovima kod Tandara.

U prvom braku bio je oženjen Perom Matišić, koja je bila iz kuće poznate hrvatske glazbene obitelji Matišić. Iz tog braka dobio je sina Josipa. Pera je umrla 1919. godine od španjolske gripe koja je u narodu nazivana Grla. Drugi brak je bio s djevojkom iz obitelji Budić. Imali su sina Martina, koji je poginuo 1942. godine kod Bihaća. Treći brak bio je s Jozom Dragun, bez djece.", "children": [{"code": "3.1.1.2.4.1", "label": "Josip Jurin (1911.–1946.)", "detail": "U braku s Anicom Dragun imao je sinove Ivana i Milana, te kćeri Slavu, Maru, Nedu i Macu. Ubijen je 1946 iznad zadruge u Zavelimu. Moj djed Josip je 1946. godine tragično izgubio život u okolnostima koje su desetljećima ostale prikrivene. Ubijen je od strane prvog susjeda, koji je radi vlastite koristi angažirao svog brata da počini zločin. Nakon rata proširena je priča da su djeda ubili kamišari u povlačenju, pa je u bivšoj državi bio prikazan kao žrtva ustaša i dobio je spomenik, dok moja baka nikada nije ostvarila pripadajuću odštetu. Tek trideset godina kasnije svjedok događaja je prije smrti mojoj baki otkrio stvarne okolnosti i počinitelja. Prema toj verziji, ubojica je poginuo 1963. u Njemačkoj, a organizator ubojstva je 1990. preminuo u mukama od teške bolesti. Nažalost, nikada nije pokrenuta istraga niti je provedeno sudsko procesuiranje, pa je ova tragedija ostala bez pravnih sankcija. Važno je istaknuti da moja obitelj ima jako dobre odnose s potomcima ubojice i da među nama danas nema zle krvi.", "children": [{"code": "3.1.1.2.4.1.1", "label": "Ivan Josipov (1933.–2025.)", "detail": "Dvaput se ženio. Iz prvog braka s Matijom Pušić dobio je sinove Juru i Vladimira, te kćer Mihaelu (kršteno Milena). Iz drugog braka sa Verkom Nikolovski nije imao djece. Obitelj živi u Zagrebu.", "children": [{"code": "3.1.1.2.4.1.1.1", "label": "Jure Ivanov (1956.–)", "detail": "Jure i Ruža Kosić dobili su sinove Ivicu Julija i Marina Tina. Obitelj živi u Zagrebu.", "children": [{"code": "3.1.1.2.4.1.1.1.1", "label": "Ivica Julio Jurin (1981.–)", "detail": "Ivica Julio je oženio Anu Mikuš s kojom je dobio sina Viga (2015.- ) i kćer Kaiu (2018.- ).", "children": []}, {"code": "3.1.1.2.4.1.1.1.2", "label": "Marin Tin Jurin (1983.–)", "detail": "Marin Tin jer oženio Ivanu Keretu s kojom je dobio sinove Davida(1917.- ) i Jakova (2019.- ), te kćer Lauru (2023.- ).", "children": []}]}, {"code": "3.1.1.2.4.1.1.2", "label": "Vladimir Ivanov (1964.–)", "detail": "Vladimir je oženio Ljubicu Kosić s kojom ima sinove Filipa i Lea. Obitelj živi u Münchenu, Filip je u Berlinu, a Leo u Beču.", "children": []}]}, {"code": "3.1.1.2.4.1.2", "label": "Milan Josipov (1942.–2003.)", "detail": "Milan je oženio Slavu Budimir i s njom je dobio sinove Jozu i Ivana, te kćeri Mariju, Anku i Marinu. Obitelj živi u Posušju, Ivan je u Bielefeldu, Njemačka.", "children": [{"code": "3.1.1.2.4.1.2.1", "label": "Jozo Milanov (1967.–)", "detail": "Jozo je oženio Vesnu Matić s kojom ima sina Martina, te kćeri Slavicu i Mateu.", "children": [{"code": "3.1.1.2.4.1.2.1.1", "label": "Matea Jozina (1967.–)", "detail": "Matea Jozina je dobila sina Tomu. Toma je preuzeo naše prezime Tandara. To je prvi slučaj u Tandara da je kćer nastavila očevu lozu. Obitelj živi u Posušju.", "children": []}]}, {"code": "3.1.1.2.4.1.2.2", "label": "Ivan Milanov (1974.–)", "detail": "Ivan je oženjen Ružicom Glavaš i s njom ima sinove Davida i Milana, te kćer Nataliju. Obitelj živi u Bielefeldu, Njemačka.", "children": [{"code": "3.1.1.2.4.1.2.2.1", "label": "David Ivanov (1995.–)", "detail": "David je oženjen Lizom Wormann i s njom ima kćer Ivanu. Obitelj živi u Bielefeldu, Njemačka.", "children": []}]}]}]}]}]}]}, {"code": "3.1.2", "label": "Mijo Antin (1818.–1878.) – nadimak Tucići", "detail": "Mijo, drugi Antin sin, oženio je Mandu Martinović. Imali su devetero djece; sinove Jozu, Antu, Matu, Miju i Petra, te kćeri Ivu, Matiju, Ružu i Anticu.

O sinu Miji nema drugih podataka osim rođenja. Pretpostavlja se da je umro mlad ili se odselio u nepoznatom smjeru. Potomci preko sinova Joze, Mate i Petra nose nadimak Tucići, koji je nastao jer su članovi obitelji bili skloni ljubavnim avanturama.", "children": [{"code": "3.1.2.1", "label": "Jozo Mijin (1851.–)", "detail": "Oženio se Ivom Bilojelić. Imali su sedmero djece; sinove Antu, Jozu i Nikolu (koji je umro u dobi od šest godina), te kćeri Matiju, Jelu, Maru i Ivu. Sin Jozo se nije ženio i jedino je Ante prenio prezime na potomke.", "children": [{"code": "3.1.2.1.1", "label": "Ante Jozin (1881.–1942.)", "detail": "Oženio je Jelu Škorić. Imali su sinove Marijana, Matu, Filipa i Nikolu, te kćeri Jelu, Maru, Katu i Milu. Obiteljsku lozu su nastavili sinovi Marijan i Mijo.", "children": [{"code": "3.1.2.1.1.1", "label": "Marijan Antin (1908.–2003.) – nadimak Đika", "detail": "Marijan je oženio Ivu Čorbić. Dobili su sinove Ivana i Milana, te kćeri Maru, Dragicu, Katu i Mariju.", "children": [{"code": "3.1.2.1.1.1.1", "label": "Ivan Marijanov (1939.–2024.)", "detail": "Oženio se Anom Pušić. Dobili su sina Zdenka (1966.-) i kćer Kristinu (1968.-). Obitelj živi u Zagrebu.", "children": [{"code": "3.1.2.1.1.1.1.1", "label": "Zdenko Ivanov", "detail": "Zdenko se ženio dvaput. Iz prvog braka ima sina Tomislava, a iz drugog braka s Kristinom Topić ima kćer Anu.", "children": []}]}, {"code": "3.1.2.1.1.1.2", "label": "Milan Marijanov (1947.–)", "detail": "Dvaput se ženio. Iz prvog braka s Marijom Pušić ima sina Nedjeljka, te kćeri Dragicu, Ljubicu i Tanju. Iz drugog braka Milan nema djece.", "children": [{"code": "3.1.2.1.1.1.2.1", "label": "Nedjeljko Milanov (1966.–)", "detail": "Nedjeljko i supruga Ivana Božičević imaju kćeri Mariju i Tinu. Obitelj živi u Zagrebu.", "children": []}]}]}, {"code": "3.1.2.1.1.2", "label": "Mijo Antin (1927.–)", "detail": "Četvrti Antin sin Mijo, oženio je Mašu Gudelj s kojom je dobio sina Antu. Obitelj živi u Zagrebu.", "children": [{"code": "3.1.2.1.1.2.1", "label": "Ante Mijin (1953.–)", "detail": "Ante je oženio Renatu Nagy s kojom je dobio sina Antu. Žive u Zagrebu.", "children": [{"code": "3.1.2.1.1.2.1.1", "label": "Ante Antin (1978.–)", "detail": "Ante je oženio Valentinu Juriša s kojom je dobio sinove Antu i Luku. Žive u Zagrebu.", "children": []}]}]}]}]}, {"code": "3.1.2.2", "label": "Mate Mijin (1863.–1905.)", "detail": "Mate se ženio dva puta. U prvom braku s Tomicom Kovač imao je sina Ivana koji je umro kao dijete. U drugom braku Ivom Vlajčić imao je kćer Ivu i sinove Martina i Juru. Za Martina nema podataka da se ženio.", "children": [{"code": "3.1.2.2.1", "label": "Jure Matin (1905.–1974.) – nadimak Đuka", "detail": "Jure je oženio Matiju Škorić s kojom je dobio sinove Antu i Matu, te kćeri Milu, Stanu i Ivu.", "children": [{"code": "3.1.2.2.1.1", "label": "Ante Jurin (1933.–1999.)", "detail": "Ante je oženio Milu Đikić s kojom je dobio sinove Ivana (umro 2002.), Milana i Srećka, te kćer Matiju. Obitelj se preselila u Đakovo.", "children": [{"code": "3.1.2.2.1.1.1", "label": "Milan Antin (1958.–1995.)", "detail": "Milan je oženio Marijanu Erceg s kojom je dobio sinove Ivana i Antu. Obitelj živi u Đakovu.", "children": [{"code": "3.1.2.2.1.1.1.1", "label": "Ivan Milanov (1983.–)", "detail": "Ivan je oženio Sunčicu Kraljević s kojom je dobio sina Marina (2008.-). Obitelj živi u Đakovu.", "children": []}, {"code": "3.1.2.2.1.1.1.2", "label": "Ante Milanov (1985.–)", "detail": "Ante je oženio Anu Stipanović s kojom je dobio sina Milana (2010.-). Obitelj živi u Đakovu.", "children": []}]}, {"code": "3.1.2.2.1.1.2", "label": "Srećko Antin (1959.–)", "detail": "Srećko je oženio Jaku Jurić i s njom dobio sinove Antonia (1995.-) i Marka (1996.-). Obitelj živi u Đakovu.", "children": []}]}, {"code": "3.1.2.2.1.2", "label": "Mate Jurin (1935.–)", "detail": "Mate je oženio Danicu Malenica s kojom je dobio sina Tomislava i kćeri Mariju, Milu i Anu. Žive u Splitu, Podstrani.", "children": [{"code": bel": "Mirko Ilijin (1945.–2025.)", "detail": "Mirko je bio oženjen Katom Kovač sa kojom je dobio sinove Marinka, Ivicu i Antu, te kćeri Anku i Mariju. Obitelj živi u Zagrebu.", "children": [{"code": "3.1.2.3.3.2.1", "label": "Marinko Mirkov (1967.–)", "detail": "Marinko je oženio Jaroslavu Doležal sa kojom ima sina Petra i kćeri Kristinu i Antoniju. Žive u Zagrebu.", "children": []}, {"code": "3.1.2.3.3.2.2", "label": "Ivica Mirkov (1967.–)", "detail": "Ivica je oženio Ružu Valjak s kojom ima kćeri Helenu i Katarinu. Žive u Zagrebu.", "children": []}, {"code": "3.1.2.3.3.2.3", "label": "Ante Mirkov (1967.–)", "detail": "Ante je oženio Ružicu Čolak sa kojom ima kćeri Gabrielu, Antonelu i Paulu. Obitelj je u Zagrebu.", "children": []}]}]}]}]}]};
const svg = document.getElementById("treeSvg");
const viewport = document.getElementById("viewport");
const linksLayer = document.getElementById("links");
const nodesLayer = document.getElementById("nodes");
const details = document.getElementById("details");

const BOX_W = 286, BOX_H = 60, X_STEP = 315, ROW_STEP = 76, MARGIN = 46;
let scale = 1, panX = 20, panY = 20, selectedCode = null, matchCode = null;
let dragging = false, dragStart = null;
let bounds = {width:1000,height:800};

function walk(node, callback, parent=null, depth=0){
  callback(node,parent,depth);
  (node.children || []).forEach(child => walk(child,callback,node,depth+1));
}
function depthFromCode(code){ return 0; }
function setExpandedToDepth(maxDepth){
  walk(DATA,(node,parent,depth)=>{ node.expanded = depth < maxDepth; });
}
function visibleNodes(){
  const result=[];
  function visit(node,parent=null,depth=0){
    result.push({node,parent,depth});
    if(node.expanded) (node.children||[]).forEach(child=>visit(child,node,depth+1));
  }
  visit(DATA);
  return result;
}
function colors(code){
  if(code==="3.1") return {fill:"#174f39",text:"#fff",stroke:"#0d3425"};
  if(code.startsWith("3.1")) return {fill:"#e8f2fb",text:"#173a57",stroke:"#4d82aa"};
  return {fill:"#fff1df",text:"#553719",stroke:"#bb8144"};
}
function wrapText(text,max=34){
  const words=text.split(/\s+/); const lines=[]; let line="";
  for(const word of words){
    const test=(line+" "+word).trim();
    if(test.length>max && line){ lines.push(line); line=word; }
    else line=test;
  }
  if(line) lines.push(line);
  if(lines.length>2) lines[1]=lines.slice(1).join(" ").slice(0,max-1)+"…";
  return lines.slice(0,2);
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function render(){
  const visible=visibleNodes();
  const pos=new Map();
  visible.forEach((item,index)=>{
    pos.set(item.node.code,{x:MARGIN+item.depth*X_STEP,y:MARGIN+index*ROW_STEP});
  });
  const maxDepth=Math.max(...visible.map(v=>v.depth),0);
  bounds.width=MARGIN*2+maxDepth*X_STEP+BOX_W;
  bounds.height=MARGIN*2+visible.length*ROW_STEP;

  let links="";
  visible.forEach(({node,parent})=>{
    if(!parent || !pos.has(parent.code)) return;
    const p=pos.get(parent.code), c=pos.get(node.code);
    const x1=p.x+BOX_W, y1=p.y+BOX_H/2, x2=c.x, y2=c.y+BOX_H/2;
    const elbow=x1+(x2-x1)/2;
    links += `<path class="connector" d="M${x1},${y1} H${elbow} V${y2} H${x2}"/>`;
  });
  linksLayer.innerHTML=links;

  let nodeMarkup="";
  visible.forEach(({node})=>{
    const p=pos.get(node.code), color=colors(node.code), lines=wrapText(node.label);
    const hasChildren=(node.children||[]).length>0;
    const indicator=hasChildren ? (node.expanded ? "−" : "+") : "";
    const classes=["node"];
    if(node.code===selectedCode) classes.push("selected");
    if(node.code===matchCode) classes.push("match");
    nodeMarkup += `<g class="${classes.join(" ")}" data-code="${esc(node.code)}" transform="translate(${p.x},${p.y})">
      <rect width="${BOX_W}" height="${BOX_H}" rx="9" fill="${color.fill}" stroke="${color.stroke}"></rect>
      <text class="code" x="13" y="18" fill="${color.text}">${esc(node.code)}</text>
      ${lines.map((line,i)=>`<text class="label" x="13" y="${38+i*16}" fill="${color.text}">${esc(line)}</text>`).join("")}
      ${hasChildren?`<circle cx="${BOX_W-18}" cy="18" r="11" fill="rgba(255,255,255,.72)" stroke="${color.stroke}"></circle>
      <text class="hint" x="${BOX_W-18}" y="22" text-anchor="middle" fill="${color.stroke}">${indicator}</text>`:""}
    </g>`;
  });
  nodesLayer.innerHTML=nodeMarkup;

  nodesLayer.querySelectorAll(".node").forEach(group=>{
    group.addEventListener("click",event=>{
      event.stopPropagation();
      const code=group.dataset.code;
      const node=findNode(code);
      selectedCode=code;
      showDetails(node);
      if((node.children||[]).length){
        node.expanded=!node.expanded;
      }
      render();
    });
  });
  applyTransform();
}
function findNode(code){
  let result=null;
  walk(DATA,node=>{ if(node.code===code) result=node; });
  return result;
}
function showDetails(node){
  document.getElementById("detailTitle").textContent=node.label;
  document.getElementById("detailCode").textContent="Šifra "+node.code;
  document.getElementById("detailText").textContent=node.detail || "Za ovu osobu u izvornom HTML-u nema dodatnog opisa.";
  details.classList.add("open");
}
function applyTransform(){
  viewport.setAttribute("transform",`translate(${panX},${panY}) scale(${scale})`);
}
function fitTree(){
  const rect=svg.getBoundingClientRect();
  scale=Math.min((rect.width-50)/bounds.width,(rect.height-50)/bounds.height,1.15);
  panX=(rect.width-bounds.width*scale)/2;
  panY=(rect.height-bounds.height*scale)/2;
  applyTransform();
}
function zoomAt(factor,cx,cy){
  const old=scale;
  scale=Math.max(.12,Math.min(3,scale*factor));
  panX=cx-(cx-panX)*(scale/old);
  panY=cy-(cy-panY)*(scale/old);
  applyTransform();
}
function expandAncestors(code){
  const parts=code.split(".");
  DATA.expanded=true;
  for(let i=2;i<parts.length;i++){
    const ancestor=parts.slice(0,i).join(".");
    const node=findNode(ancestor);
    if(node) node.expanded=true;
  }
}
function search(){
  const q=document.getElementById("search").value.trim().toLocaleLowerCase("hr");
  if(!q) return;
  let found=null;
  walk(DATA,node=>{
    const hay=(node.code+" "+node.label+" "+node.detail).toLocaleLowerCase("hr");
    if(!found && hay.includes(q)) found=node;
  });
  if(!found){ alert("Nema rezultata za: "+q); return; }
  expandAncestors(found.code);
  selectedCode=found.code; matchCode=found.code;
  render(); showDetails(found);
  requestAnimationFrame(()=>{
    const target=nodesLayer.querySelector(`[data-code="${CSS.escape(found.code)}"]`);
    if(target){
      const matrix=target.getCTM(), rect=svg.getBoundingClientRect();
      const tx=matrix.e+BOX_W*scale/2, ty=matrix.f+BOX_H*scale/2;
      panX += rect.width/2-tx;
      panY += rect.height/2-ty;
      applyTransform();
    }
  });
}
document.getElementById("expandAll").onclick=()=>{walk(DATA,n=>n.expanded=true);render();fitTree()};
document.getElementById("collapse").onclick=()=>{walk(DATA,n=>n.expanded=false);DATA.expanded=true;render();fitTree()};
document.getElementById("threeLevels").onclick=()=>{setExpandedToDepth(3);render();fitTree()};
document.getElementById("fit").onclick=fitTree;
document.getElementById("zoomIn").onclick=()=>zoomAt(1.22,svg.clientWidth/2,svg.clientHeight/2);
document.getElementById("zoomOut").onclick=()=>zoomAt(.82,svg.clientWidth/2,svg.clientHeight/2);
document.getElementById("findBtn").onclick=search;
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
document.getElementById("closeDetails").onclick=()=>details.classList.remove("open");

svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const rect=svg.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.12:.89,e.clientX-rect.left,e.clientY-rect.top);
},{passive:false});
svg.addEventListener("pointerdown",e=>{
  if(e.target.closest && e.target.closest(".node")) return;
  dragging=true; svg.classList.add("dragging"); svg.setPointerCapture(e.pointerId);
  dragStart={x:e.clientX,y:e.clientY,panX,panY};
});
svg.addEventListener("pointermove",e=>{
  if(!dragging) return;
  panX=dragStart.panX+(e.clientX-dragStart.x);
  panY=dragStart.panY+(e.clientY-dragStart.y);
  applyTransform();
});
svg.addEventListener("pointerup",()=>{dragging=false;svg.classList.remove("dragging")});
window.addEventListener("resize",fitTree);

setExpandedToDepth(3);
render();
requestAnimationFrame(fitTree);
</script>
</body>
</html>
