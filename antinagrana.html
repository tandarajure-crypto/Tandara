<h1>5.3. Ante Tandara (1730 - ... ) - Ivanov</h1>

<p>
Ante Tandara, vjerojatno godinu dana mlađi od Petra, bio je sin Ivana Tandare.
Oženio se Matijom Brnas te su imali sinove Antu, Filipa i Pavla te kćeri Jaku, Lucu i Ružu.
O Pavlu nema drugih podataka osim zapisa o rođenju.
</p>

<h2>Ante Antin</h2>

<p>
Najstariji Antin sin, oženio se 1801. Matijom Jukić. Imali su sinove Lovru, Miju i Petra te kćeri Peru, Ružu, Anticu, Ivu i Mariju.
O Petru nema drugih podataka osim zapisa o rođenju.
</p>

<p>
Prema popisu stanovništva iz 1819., Ante je s osmeročlanom obitelji živio u Zavelimu, dok je njegov brat Filip živio u Ričicima.
Time su se braća Ante i Filip trajno razdvojila. Njihovi potomci kasnije su se proširili po Hrvatskoj, Europi i Kanadi.
</p>

<h3>Lovro Antin</h3>

<p>
Oženio se Matijom Sičenica. Imali su sinove Marijana i Križana.
</p>

<h4>Marijan Lovrin</h4>

<p>
Oženio se Matijom Kovač. Imali su sinove Juru, Marka, Stipana i Jozu te kćeri Ivu, Maru i Matiju.
</p>

<h4>Marko Marijanov</h4>

<p>
Oženio se Božicom Pušić. Imali su sina Mirka i kćer Ivu.
</p>

<h4>Mirko Markov</h4>

<p>
Oženio se Anicom Kliić. Imali su sinove Milana i Vladimira te kćeri Dragicu, Mariju i Nediljku.
</p>

<h4>Milan Markov</h4>

<p>
Oženio se Svjetlanom Trifunović. Imali su sinove Vladimira i Dalibora.
</p>

<p>
Vladimir Milanov živi u Londonu s obitelji. Dalibor Milanov živi u Sarajevu.
</p>

<h3>Križan Lovrin</h3>

<p>
Oženio se Perom Budimir. Imali su 15 djece, a potomci se danas zovu Križanovići i žive u više zemalja Europe.
</p>

<h3>Mate Križanov</h3>

<p>
Oženio se Ivom Pirić. Imali su sinove Miju, Marijana i Jozu.
</p>

<h3>Ivan Marijanov</h3>

<p>
Oženio se Ljiljanom Cobović. Žive u Đakovu.
</p>

<h3>Jozo Matin</h3>

<p>
Poginuo u Drugom svjetskom ratu. Njegovi potomci žive u Hrvatskoj i Sloveniji.
</p>

<h3>Ivan Križanov</h3>

<p>
Oženio se Ružom Serdarušić. Potomci žive u Vrpolju i Zagrebu.
</p>

<h3>Jure Križanov</h3>

<p>
Oženio se više puta. Potomci su razgranati u više obitelji.
</p>

<h3>Mijo Antin</h3>

<p>
Oženio se Mandom Martinović. Imali su devetero djece.
</p>

<h3>Mate Antin</h3>

<p>
Nije imao djece.
</p>
