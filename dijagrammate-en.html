<script>
const DATA={"code":"4.0","label":"Mate Tandara – son of Ivan (born c. 1740)","detail":"Mate Tandara was the fourth son of Ivan Tandara. Mate and his wife, Filipa Kopač, had five children: a son, Ivan, and daughters Matija, Manda, Jaka and Cecilija. The male line continued exclusively through their son Ivan. Ivan married twice. In his first marriage to Pava Sičenica, he had a son, Ante, the only male heir of Mate's line. In his second marriage to Jela Parlov, he had a daughter, Ruža. This branch is known by the nickname Cesarovići.\n\nAn interesting tradition has been preserved about the origin of this nickname. According to the story, some of Mate's descendants performed agricultural work for a family of the Lažeta line. When relatives and neighbours asked them what the food had been like at the Lažeta household, they replied: ‘Like at the emperor's!’ It is still unclear whether the word used was cesar or sesar. Both forms appear on older gravestones and in oral tradition, but today most descendants of this branch are known as Cesarovići.","children":[{"code":"4.1","label":"Ivan, son of Mate (–1870)","detail":"Ivan, son of Mate, married twice. In 1817 he married Pava Sičenica, with whom he had a son, Ante. In his second marriage to Jela Parlov, he had a daughter, Ruža.","children":[{"code":"4.1.1","label":"Ante, son of Ivan (1832–)","detail":"Ante married Joza Pušić in 1853. They had sons Ivan, Jure, Marko and Mate, and daughters Iva, Tomica, Mara and Jela. No records about Jure and Marko have been found other than their birth records. They either died young or moved away.","children":[{"code":"4.1.1.1","label":"Ivan, son of Ante (1855–1928)","detail":"Ivan, son of Ante, married Ruža Matišić. They had sons Marijan, Jozo and Ivan, and daughters Anica, Iva and Jela. No record about Marijan has been found other than his birth record. He either died young or moved away.","children":[{"code":"4.1.1.1.1","label":"Jozo, son of Ivan (1890–1947)","detail":"Jozo, Ivan's second son, married Iva Bilić. They had sons Marijan and Mirko, who died as a young child, and daughters Joza and Ana.","children":[{"code":"4.1.1.1.1.1","label":"Marijan, son of Jozo (1929–1977)","detail":"Marijan, son of Jozo, married Matija Mršić. They had a son, Josip, and daughters Nada, Danica, Branka, Ana, Dragica and Mirjana. Josip married Dragica Pavić. They have sons Marijan, Ante and Kristijan, and a daughter, Silvija.","children":[{"code":"4.1.1.1.1.1.1","label":"Josip, son of Marijan (1962–)","detail":"Josip married Dragica Pavić. They have sons Marijan (1991–), Ante (1996–) and Kristijan (1998–), and a daughter, Silvija (1994–). The family lives in Ričice.","children":[]}]}]},{"code":"4.1.1.1.2","label":"Ivan, son of Ivan (1903–1965)","detail":"Ivan married twice. His first wife was Jaka Tavra, with whom he had sons Frane and Stanko. Stanko died at the age of fourteen. Ivan's second marriage was to Ana Capia, and they had no children.","children":[{"code":"4.1.1.1.2.1","label":"Frane, son of Ivan (1933–)","detail":"Frane, son of Ivan, married Tomica Pavić. They had sons Stanko, Cvjetko, Miroslav, who died as a young child, and Dragomir, and daughters Marija, Roza, Miroslava and Anita. Stanko is married to Ankica Kovačević. They have daughters Tatjana and Tamara and live in Zagreb. Cvjetko and Dragomir never married. They live in Klokočevac near Bjelovar.","children":[{"code":"4.1.1.1.2.1.1","label":"Stanko, son of Frane (1956–)","detail":"Stanko married Ankica Kovačević. They have daughters Tatjana and Tamara. The family lives in Zagreb.","children":[]}]}]}]},{"code":"4.1.1.2","label":"Mate, son of Ante (1873–1927)","detail":"Mate, son of Ante, married Ruža Manenica. They had sons Ante, who died as a young child, Josip, Cvitan, another son named Ante, and Nikola, and daughters Tomica and Mara. No record about Josip has been found other than his birth record. He either died young or moved away.","children":[{"code":"4.1.1.2.1","label":"Cvitan, son of Mate (1945–)","detail":"Cvitan, Mate's third son, married Tomica Pavić. They had sons Mate, who died as a young child, and Nikola, and daughters Lucija, Ana, Ruža, Stana, Nevenka and Branka. No record about Nikola has been found other than his birth record. He either died young or moved away. Cvitan's family line became extinct.","children":[]},{"code":"4.1.1.2.2","label":"Ante, son of Mate (1908–)","detail":"Ante, son of Mate, married Ana Pavić. They had sons Marijan, Dinko, who died as a young child, Mirko, Mate and Cvitan, and daughters Ana, Mara and Tonka.","children":[{"code":"4.1.1.2.2.1","label":"Marijan, son of Ante (1934–1963)","detail":"Marijan married Pava Pušić. They raised sons Ante and Dinko, and a daughter, Neda. Marijan died in Germany in 1963. The family lives in Klokočevac.","children":[{"code":"4.1.1.2.2.1.1","label":"Ante, son of Marijan (1961–1991)","detail":"Ante married Mirjana Čeh. They had sons Marijan and Marko. In the early 1990s he joined the defence of Croatia against the aggression of the former Yugoslav People's Army and Serbian paramilitary groups.\n\nAnte served in the Croatian War of Independence from August 1991 as a member of the 105th Brigade of the Croatian Army. In September of the same year, Ante and nineteen other Croatian defenders, most of them from Bjelovar, were captured at Kusonje near Pakrac, tortured and killed. Their remains were exhumed from the Rakov Potok mass grave in January 1992.","children":[]},{"code":"4.1.1.2.2.1.2","label":"Dinko, son of Marijan (1963–)","detail":"Dinko married Dubravka Lončar. They have sons Luka and Pavao. Dinko served as an assistant minister to Tomislav Medved. The family lives in Zagreb.","children":[]}]},{"code":"4.1.1.2.2.2","label":"Mirko, son of Ante","detail":"Mirko married Anđa Parlov. They had sons Marijan and Ivica. Marijan never married. Mirko, Anđa and Marijan live in Split.","children":[{"code":"4.1.1.2.2.2.1","label":"Ivica, son of Mirko (1969–)","detail":"Ivica married Matija Bilobrk. They have a son, Ivan (1992–), and a daughter, Ivana (1985–). They live in the United States.","children":[]}]},{"code":"4.1.1.2.2.3","label":"Cvitan, son of Ante (1945–)","detail":"Cvitan married Katica Kršinić. They have a son, Marijan, and a daughter, Zrinka. Cvitan's family lives in Split.","children":[{"code":"4.1.1.2.2.3.1","label":"Marijan, son of Cvitan (1945–)","detail":"Marijan married Leida Kezele. They have sons Luka (1996–) and Lovro (1999–). The family lives in Split.","children":[]}]},{"code":"4.1.1.2.2.4","label":"Mate, son of Ante (1947–)","detail":"Mate married Zlata Mihoci. They raised a son, Dario, and a daughter, Danijela. The family lives in Split.","children":[{"code":"4.1.1.2.2.4.1","label":"Dario, son of Mate (1973–)","detail":"Dario married Ivana Tomić. They have no children. The family lives in Split.","children":[]}]}]}]}]}]}]};
const UI={"codeLabel":"Code","noDetails":"No additional description is available for this person.","notFound":"No result for: ","locale":"en"};

const svg = document.getElementById("treeSvg");
const viewport = document.getElementById("viewport");
const linksLayer = document.getElementById("links");
const nodesLayer = document.getElementById("nodes");
const details = document.getElementById("details");
const BOX_W = 300, BOX_H = 64, X_STEP = 330, ROW_STEP = 84, MARGIN = 50;
let scale = 1, panX = 20, panY = 20, selectedCode = null, matchCode = null;
let dragging = false, dragStart = null;
let bounds = {width:1000,height:900};
function walk(node, callback, parent=null, depth=0){callback(node,parent,depth);(node.children||[]).forEach(child=>walk(child,callback,node,depth+1));}
function setExpandedToDepth(maxDepth){walk(DATA,(node,parent,depth)=>{node.expanded=depth<maxDepth;});}
function visibleNodes(){const result=[];function visit(node,parent=null,depth=0){result.push({node,parent,depth});if(node.expanded)(node.children||[]).forEach(child=>visit(child,node,depth+1));}visit(DATA);return result;}
function colors(code){if(code==="4.0"||code==="4.1"||code==="4.1.1")return {fill:"#174f39",text:"#fff",stroke:"#0d3425"};if(code.startsWith("4.1.1.1"))return {fill:"#e8f2fb",text:"#173a57",stroke:"#4d82aa"};return {fill:"#fff1df",text:"#553719",stroke:"#bb8144"};}
function wrapText(text,max=35){const words=text.split(/\s+/),lines=[];let line="";for(const word of words){const test=(line+" "+word).trim();if(test.length>max&&line){lines.push(line);line=word}else line=test;}if(line)lines.push(line);if(lines.length>2)lines[1]=lines.slice(1).join(" ").slice(0,max-1)+"…";return lines.slice(0,2);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function render(){const visible=visibleNodes(),pos=new Map();visible.forEach((item,index)=>pos.set(item.node.code,{x:MARGIN+item.depth*X_STEP,y:MARGIN+index*ROW_STEP}));const maxDepth=Math.max(...visible.map(v=>v.depth),0);bounds.width=MARGIN*2+maxDepth*X_STEP+BOX_W;bounds.height=MARGIN*2+visible.length*ROW_STEP;let links="";visible.forEach(({node,parent})=>{if(!parent||!pos.has(parent.code))return;const p=pos.get(parent.code),c=pos.get(node.code),x1=p.x+BOX_W,y1=p.y+BOX_H/2,x2=c.x,y2=c.y+BOX_H/2,elbow=x1+(x2-x1)/2;links+=`<path class="connector" d="M${x1},${y1} H${elbow} V${y2} H${x2}"/>`;});linksLayer.innerHTML=links;let markup="";visible.forEach(({node})=>{const p=pos.get(node.code),color=colors(node.code),lines=wrapText(node.label),hasChildren=(node.children||[]).length>0,indicator=hasChildren?(node.expanded?"−":"+"):"",classes=["node"];if(node.code===selectedCode)classes.push("selected");if(node.code===matchCode)classes.push("match");markup+=`<g class="${classes.join(" ")}" data-code="${esc(node.code)}" transform="translate(${p.x},${p.y})"><rect width="${BOX_W}" height="${BOX_H}" rx="9" fill="${color.fill}" stroke="${color.stroke}"></rect><text class="code" x="13" y="19" fill="${color.text}">${esc(node.code)}</text>${lines.map((line,i)=>`<text class="label" x="13" y="${40+i*16}" fill="${color.text}">${esc(line)}</text>`).join("")}${hasChildren?`<circle cx="${BOX_W-18}" cy="18" r="11" fill="rgba(255,255,255,.72)" stroke="${color.stroke}"></circle><text class="hint" x="${BOX_W-18}" y="22" text-anchor="middle" fill="${color.stroke}">${indicator}</text>`:""}</g>`;});nodesLayer.innerHTML=markup;nodesLayer.querySelectorAll(".node").forEach(group=>group.addEventListener("click",event=>{event.stopPropagation();const node=findNode(group.dataset.code);selectedCode=node.code;showDetails(node);if((node.children||[]).length)node.expanded=!node.expanded;render();}));applyTransform();}
function findNode(code){let result=null;walk(DATA,node=>{if(node.code===code)result=node;});return result;}
function showDetails(node){document.getElementById("detailTitle").textContent=node.label;document.getElementById("detailCode").textContent=UI.codeLabel+" "+node.code;document.getElementById("detailText").textContent=node.detail||UI.noDetails;details.classList.add("open");}
function applyTransform(){viewport.setAttribute("transform",`translate(${panX},${panY}) scale(${scale})`);}
function fitTree(){const rect=svg.getBoundingClientRect();scale=Math.min((rect.width-50)/bounds.width,(rect.height-50)/bounds.height,1.15);panX=(rect.width-bounds.width*scale)/2;panY=(rect.height-bounds.height*scale)/2;applyTransform();}
function zoomAt(factor,cx,cy){const old=scale;scale=Math.max(.14,Math.min(3,scale*factor));panX=cx-(cx-panX)*(scale/old);panY=cy-(cy-panY)*(scale/old);applyTransform();}
function expandAncestors(code){const parts=code.split(".");DATA.expanded=true;for(let i=2;i<parts.length;i++){const ancestor=parts.slice(0,i).join("."),node=findNode(ancestor);if(node)node.expanded=true;}}
function search(){const q=document.getElementById("search").value.trim().toLocaleLowerCase(UI.locale);if(!q)return;let found=null;walk(DATA,node=>{const hay=(node.code+" "+node.label+" "+node.detail).toLocaleLowerCase(UI.locale);if(!found&&hay.includes(q))found=node;});if(!found){alert(UI.notFound+q);return;}expandAncestors(found.code);selectedCode=found.code;matchCode=found.code;render();showDetails(found);requestAnimationFrame(()=>{const target=nodesLayer.querySelector('[data-code="'+found.code.replace(/"/g,'\\"')+'"]');if(target){const matrix=target.getCTM(),rect=svg.getBoundingClientRect(),tx=matrix.e+BOX_W*scale/2,ty=matrix.f+BOX_H*scale/2;panX+=rect.width/2-tx;panY+=rect.height/2-ty;applyTransform();}});}
document.getElementById("expandAll").onclick=()=>{walk(DATA,n=>n.expanded=true);render();fitTree();};
document.getElementById("collapse").onclick=()=>{walk(DATA,n=>n.expanded=false);DATA.expanded=true;render();fitTree();};
document.getElementById("threeLevels").onclick=()=>{setExpandedToDepth(3);render();fitTree();};
document.getElementById("fit").onclick=fitTree;document.getElementById("zoomIn").onclick=()=>zoomAt(1.22,svg.clientWidth/2,svg.clientHeight/2);document.getElementById("zoomOut").onclick=()=>zoomAt(.82,svg.clientWidth/2,svg.clientHeight/2);document.getElementById("findBtn").onclick=search;document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")search();});document.getElementById("closeDetails").onclick=()=>details.classList.remove("open");
svg.addEventListener("wheel",e=>{e.preventDefault();const rect=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:.89,e.clientX-rect.left,e.clientY-rect.top);},{passive:false});
svg.addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest(".node"))return;dragging=true;svg.classList.add("dragging");svg.setPointerCapture(e.pointerId);dragStart={x:e.clientX,y:e.clientY,panX,panY};});
svg.addEventListener("pointermove",e=>{if(!dragging)return;panX=dragStart.panX+(e.clientX-dragStart.x);panY=dragStart.panY+(e.clientY-dragStart.y);applyTransform();});
svg.addEventListener("pointerup",()=>{dragging=false;svg.classList.remove("dragging");});svg.addEventListener("pointercancel",()=>{dragging=false;svg.classList.remove("dragging");});window.addEventListener("resize",fitTree);
setExpandedToDepth(3);render();requestAnimationFrame(fitTree);

</script>
