/* UI tekstovi */
const UI = {
  "codeLabel": "Šifra",
  "noDetails": "Za ovu osobu nema dodatnog opisa.",
  "notFound": "Nema rezultata za: ",
  "locale": "hr"
};

/* JEZIK — samo HR podaci */
let currentLang = "hr";
let DATA = DATA_HR;

function switchLang(lang) {
  currentLang = lang;

  if (lang === "hr") {
    UI.locale = "hr";
    document.getElementById("diagramTitle").textContent =
      "Rodoslovni dijagram Matine grane";
    document.getElementById("diagramSubtitle").textContent =
      "22 numerirane osobe · 7 naraštaja · klik na osobu otvara detalje";
    document.getElementById("treeSearch").placeholder =
      "Ime, šifra ili podatak…";
    document.getElementById("findBtn").textContent = "Pronađi";
  } else {
    UI.locale = "en";
    document.getElementById("diagramTitle").textContent =
      "Family diagram of Mate’s branch";
    document.getElementById("diagramSubtitle").textContent =
      "22 numbered persons · 7 generations · click a person to see details";
    document.getElementById("treeSearch").placeholder =
      "Name, code or keyword…";
    document.getElementById("findBtn").textContent = "Search";
  }

  selectedCode = null;
  matchCode = null;
  walk(DATA, n => n.expanded = true);
  render();
  fitTree();
}

document.getElementById("langHr").onclick = () => switchLang("hr");
document.getElementById("langEn").onclick = () => switchLang("en");

/* ENGINE */
const svg = document.getElementById("treeSvg");
const viewport = document.getElementById("viewport");
const linksLayer = document.getElementById("links");
const nodesLayer = document.getElementById("nodes");
const details = document.getElementById("details");

const BOX_W = 300, BOX_H = 64, X_STEP = 330, ROW_STEP = 84, MARGIN = 50;

let scale = 1, panX = 20, panY = 20;
let selectedCode = null, matchCode = null;
let dragging = false, dragStart = null;
let bounds = { width: 1000, height: 900 };

function walk(node, callback, parent = null, depth = 0) {
  callback(node, parent, depth);
  (node.children || []).forEach(child =>
    walk(child, callback, node, depth + 1)
  );
}

function setExpandedToDepth(maxDepth) {
  walk(DATA, (node, parent, depth) => {
    node.expanded = depth < maxDepth;
  });
}

function visibleNodes() {
  const result = [];
  function visit(node, parent = null, depth = 0) {
    result.push({ node, parent, depth });
    if (node.expanded)
      (node.children || []).forEach(child =>
        visit(child, node, depth + 1)
      );
  }
  visit(DATA);
  return result;
}

function colors(code) {
  if (code === "4.0" || code === "4.1" || code === "4.1.1")
    return { fill: "#174f39", text: "#fff", stroke: "#0d3425" };
  if (code.startsWith("4.1.1.1"))
    return { fill: "#e8f2fb", text: "#173a57", stroke: "#4d82aa" };
  return { fill: "#fff1df", text: "#553719", stroke: "#bb8144" };
}

function wrapText(text, max = 35) {
  const words = text.split(/\s+/);
  const lines = [];
  let line = "";
  for (const word of words) {
    const test = (line + " " + word).trim();
    if (test.length > max && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  if (lines.length > 2)
    lines[1] = lines.slice(1).join(" ").slice(0, max - 1) + "…";
  return lines.slice(0, 2);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[c]);
}

function render() {
  const visible = visibleNodes();
  const pos = new Map();

  visible.forEach((item, index) =>
    pos.set(item.node.code, {
      x: MARGIN + item.depth * X_STEP,
      y: MARGIN + index * ROW_STEP
    })
  );

  const maxDepth = Math.max(...visible.map(v => v.depth), 0);
  bounds.width = MARGIN * 2 + maxDepth * X_STEP + BOX_W;
  bounds.height = MARGIN * 2 + visible.length * ROW_STEP;

  let links = "";
  visible.forEach(({ node, parent }) => {
    if (!parent || !pos.has(parent.code)) return;
    const p = pos.get(parent.code);
    const c = pos.get(node.code);
    const x1 = p.x + BOX_W;
    const y1 = p.y + BOX_H / 2;
    const x2 = c.x;
    const y2 = c.y + BOX_H / 2;
    const elbow = x1 + (x2 - x1) / 2;
    links += `<path class="connector" d="M${x1},${y1} H${elbow} V${y2} H${x2}"/>`;
  });
  linksLayer.innerHTML = links;

  let markup = "";
  visible.forEach(({ node }) => {
    const p = pos.get(node.code);
    const color = colors(node.code);
    const lines = wrapText(node.label);
    const hasChildren = (node.children || []).length > 0;
    const indicator = hasChildren ? (node.expanded ? "−" : "+") : "";
    const classes = ["node"];
    if (node.code === selectedCode) classes.push("selected");
    if (node.code === matchCode) classes.push("match");

    markup += `
      <g class="${classes.join(" ")}"
         data-code="${esc(node.code)}"
         transform="translate(${p.x},${p.y})">

        <rect width="${BOX_W}" height="${BOX_H}" rx="9"
              fill="${color.fill}" stroke="${color.stroke}"></rect>

        <text class="code" x="13" y="19" fill="${color.text}">
          ${esc(node.code)}
        </text>

        ${lines.map((line, i) =>
          `<text class="label" x="13" y="${40 + i * 16}" fill="${color.text}">
             ${esc(line)}
           </text>`
        ).join("")}

        ${
          hasChildren
            ? `<circle cx="${BOX_W - 18}" cy="18" r="11"
                       fill="rgba(255,255,255,.72)"
                       stroke="${color.stroke}"></circle>
               <text class="hint" x="${BOX_W - 18}" y="22"
                     text-anchor="middle" fill="${color.stroke}">
                 ${indicator}
               </text>`
            : ""
        }
      </g>
    `;
  });
  nodesLayer.innerHTML = markup;

  nodesLayer.querySelectorAll(".node").forEach(group =>
    group.addEventListener("click", event => {
      event.stopPropagation();
      const node = findNode(group.dataset.code);
      selectedCode = node.code;
      showDetails(node);
      if ((node.children || []).length)
        node.expanded = !node.expanded;
      render();
    })
  );

  applyTransform();
}

function findNode(code) {
  let result = null;
  walk(DATA, node => {
    if (node.code === code) result = node;
  });
  return result;
}

function showDetails(node) {
  document.getElementById("detailTitle").textContent = node.label;
  document.getElementById("detailCode").textContent =
    UI.codeLabel + " " + node.code;
  document.getElementById("detailText").textContent =
    node.detail || UI.noDetails;
  details.classList.add("open");
}

function applyTransform() {
  viewport.setAttribute(
    "transform",
    `translate(${panX},${panY}) scale(${scale})`
  );
}

function fitTree() {
  const rect = svg.getBoundingClientRect();
  scale = Math.min(
    (rect.width - 50) / bounds.width,
    (rect.height - 50) / bounds.height,
    1.15
  );
  panX = (rect.width - bounds.width * scale) / 2;
  panY = (rect.height - bounds.height * scale) / 2;
  applyTransform();
}

function zoomAt(factor, cx, cy) {
  const old = scale;
  scale = Math.max(0.14, Math.min(3, scale * factor));
  panX = cx - (cx - panX) * (scale / old);
  panY = cy - (cy - panY) * (scale / old);
  applyTransform();
}

function expandAncestors(code) {
  const parts = code.split(".");
  DATA.expanded = true;
  for (let i = 2; i < parts.length; i++) {
    const ancestor = parts.slice(0, i).join(".");
    const node = findNode(ancestor);
    if (node) node.expanded = true;
  }
}

function search() {
  const q = document.getElementById("treeSearch")
    .value.trim()
    .toLocaleLowerCase(UI.locale);
  if (!q) return;

  let found = null;
  walk(DATA, node => {
    const hay = (node.code + " " + node.label + " " + node.detail)
      .toLocaleLowerCase(UI.locale);
    if (!found && hay.includes(q)) found = node;
  });

  if (!found) {
    alert(UI.notFound + q);
    return;
  }

  expandAncestors(found.code);
  selectedCode = found.code;
  matchCode = found.code;
  render();
  showDetails(found);

  requestAnimationFrame(() => {
    const target = nodesLayer.querySelector(
      '[data-code="' + found.code.replace(/"/g, '\\"') + '"]'
    );
    if (target) {
      const matrix = target.getCTM();
      const rect = svg.getBoundingClientRect();
      const tx = matrix.e + BOX_W * scale / 2;
      const ty = matrix.f + BOX_H * scale / 2;
      panX += rect.width / 2 - tx;
      panY += rect.height / 2 - ty;
      applyTransform();
    }
  });
}

/* BUTTONI */
document.getElementById("expandAll").onclick = () => {
  walk(DATA, n => (n.expanded = true));
  render();
  fitTree();
};

document.getElementById("collapse").onclick = () => {
  walk(DATA, n => (n.expanded = false));
  DATA.expanded = true;
  render();
  fitTree();
};

document.getElementById("threeLevels").onclick = () => {
  setExpandedToDepth(3);
  render();
  fitTree();
};

document.getElementById("fit").onclick = fitTree;

document.getElementById("zoomIn").onclick = () =>
  zoomAt(1.22, svg.clientWidth / 2, svg.clientHeight / 2);

document.getElementById("zoomOut").onclick = () =>
  zoomAt(0.82, svg.clientWidth / 2, svg.clientHeight / 2);

document.getElementById("findBtn").onclick = search;

document.getElementById("treeSearch").addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});

document.getElementById("closeDetails").onclick = () =>
  details.classList.remove("open");

/* PAN */
svg.addEventListener(
  "wheel",
  e => {
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    zoomAt(
      e.deltaY < 0 ? 1.12 : 0.89,
      e.clientX - rect.left,
      e.clientY - rect.top
    );
  },
  { passive: false }
);

svg.addEventListener("pointerdown", e => {
  if (e.target.closest && e.target.closest(".node")) return;
  dragging = true;
  svg.classList.add("dragging");
  svg.setPointerCapture(e.pointerId);
  dragStart = {
    x: e.clientX,
    y: e.clientY,
    panX,
    panY
  };
});

svg.addEventListener("pointermove", e => {
  if (!dragging) return;
  panX = dragStart.panX + (e.clientX - dragStart.x);
  panY = dragStart.panY + (e.clientY - dragStart.y);
  applyTransform();
});

svg.addEventListener("pointerup", () => {
  dragging = false;
  svg.classList.remove("dragging");
});

svg.addEventListener("pointercancel", () => {
  dragging = false;
  svg.classList.remove("dragging");
});

window.addEventListener("resize", fitTree);

/* INIT */
setExpandedToDepth(3);
render();
requestAnimationFrame(fitTree);
</script>
