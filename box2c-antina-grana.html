<script>
const DATA = {"code":"3.0","detail":"Ante Tandara je treći po redu sin Ivana Tandare. Ante je bio otprilike godinu dana mlađi od Petra, što se dobro uklapa u poznati redoslijed Ivanove djece. Oženio se Matijom Brnas, s kojom je imao sinove Antu, Filipa i Pavla (1777.–) te kćeri Jaku (1771.–), Lucu i Ružu. Osim zapisa o Pavlovu rođenju, nema drugih podataka o njemu, što upućuje na to da je vjerojatno umro vrlo mlad ili napustio Ričice prije nego što je ostavio trag u župnim knjigama. Antina loza ostala je čvrsto vezana uz Ričice, gdje se najjasnije razvijala tijekom 19. i 20. stoljeća. Iz ove jezgre potekao je najveći broj nositelja prezimena Tandara, pa se Antina linija smatra najrazvijenijom među Ivanovim potomcima. U kasnijim naraštajima pojedini članovi ove grane postupno su se počeli seliti – najprije u obližnja naselja, a zatim i mnogo dalje, u razne države Europske unije, kao i u Kanadu, Sjedinjene Američke Države i Australiju. Unatoč toj globalnoj raspršenosti, izvorna Antina linija ostala je čvrsto ukorijenjena u Ričicama, čuvajući kontinuitet obiteljske pripadnosti i najbogatiji pisani trag o svojim počecima.","children":[{"code":"3.1","detail":"Ante, kao najstariji sin Ante Ivanova, oženio se 1801. godine Matijom Jukić. Imali su sinove Lovru, Miju i Petra (1821.–) te kćeri Peru (1802.–), Ružu (1804.–), Anticu (1807.–), Ivu (1808.–), drugu Anticu (1814.–) i Mariju (1823.–). Obiteljsku su lozu nastavili sinovi Lovro i Mijo. Mijini su nasljednici dobili nadimak TUCIĆI, dok su Lovrini nasljednici preko sina Marijana dobili nadimak LOVRINOVIĆI, a preko sina Križana – KRIŽANOVIĆI. Prema popisu iz 1819. godine, Ante je živio u Zavelimu, a njegov brat Filip u Ričicama. Njihovi su se potomci kasnije raselili po cijeloj Hrvatskoj, Europi, SAD-u i Kanadi. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"3.1.1","detail":"Oženio se Matijom Sičenica. Imali su sinove Marijana i Križana.","children":[{"code":"3.1.1.1","detail":"Oženio se Matijom Kovač. Imali su sinove Juru (1867.–), Marka, Stipana (1873.–) i Jozu te kćeri Ivu (–1869.), Maru (1871.–1872.) i Matiju (1880.–1880.). Marijanovi potomci, preko sinova Marka i Jure, nose nadimak LOVRINOVIĆI, nastao po Marijanovu ocu Lovri. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"3.1.1.1.1","detail":"Marko je oženio Božicu Pušić. Imali su sina Mirka i kćer Ivu (1897.–).","children":[{"code":"3.1.1.1.1.1","detail":"Mirko je oženio Anicu Kilić. Njihov sin Vladimir (1948.–1962.) umro je mlad. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"3.1.1.1.1.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"3.1.1.1.1.1.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"},{"code":"3.1.1.1.1.1.1.2","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Živi potomak – privatni podaci"}],"label":"Mirko Markov (★ 1901. – ✝ nepoznato)"}],"label":"Marko Marijanov (★ 1869. – ✝ nepoznato)"},{"code":"3.1.1.1.2","detail":"Jozo je oženio Ivu Kovač. Dobili su sinove Marijana i Luku.","children":[{"code":"3.1.1.1.2.1","detail":"Marijan je oženio Anicu Budimir. Njihov sin Jozo (1942.–1948.) umro je kao dijete. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"3.1.1.1.2.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"3.1.1.1.2.1.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Živi potomak – privatni podaci"}],"label":"Marijan Jozin (★ 1910. – ✝ 1984.)"},{"code":"3.1.1.1.2.2","detail":"Luka je oženio Anđu Kovač. Nije imao muških potomaka. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[],"label":"Luka Jozin (★ 1912. – ✝ 1987.)"}],"label":"Jozo Marijanov (★ 1882. – ✝ 1944.) – nadimak TROŠIĆI"}],"label":"Marijan Lovrin (★ 1836. – ✝ nepoznato)"},{"code":"3.1.1.2","detail":"Oženio je Peru Budimir, s kojom je imao 15 djece, od toga deset sinova: Matu, Iliju (1867.–1875.), Antu, Jakova (1871.–1872.), Marijana (1873.–), Paška (–1886.), Jozu (1877.–), Ivana, Juru i Grgu (1887.–) te pet kćeri: Anicu (–1869.), Jakovicu (1868.–), drugu Anicu (1875.–1877.), Jozu (–1895.) i treću Anicu (1879.–). Sedmero Križanove djece umrlo je prije desete godine. Zanimljiv je podatak da je njegov drugi sin Ilija poginuo od uboda bika 1875. godine. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"3.1.1.2.1","detail":"Križanov najstariji sin Mate oženio je Ivu Pirić. Imali su sinove Miju (1894.–1923.), Marijana i Jozu te kćer Matiju (1898.–1906.). Mijo se nikada nije oženio. Obitelj se preselila u Bektež kraj Kutjeva. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"3.1.1.2.1.1","detail":"Marijan je oženio Anicu Maras. Njihov sin Jozo (1941.–2002.) nije se ženio. Obitelj se preselila u Bektež kraj Kutjeva. Podaci o živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"3.1.1.2.1.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"3.1.1.2.1.1.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Živi potomak – privatni podaci"},{"code":"3.1.1.2.1.1.2","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"3.1.1.2.1.1.2.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Živi potomak – privatni podaci"},{"code":"3.1.1.2.1.1.3","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Marijan Matin (★ 1902. – ✝ 1974.)"},{"code":"3.1.1.2.1.2","detail":"Najmlađi sin Mate i Ive Pirić oženio je Jaku Kilić i imao potomke. Jozo Matin poginuo je u Drugom svjetskom ratu. Podaci o živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"3.1.1.2.1.2.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"},{"code":"3.1.1.2.1.2.2","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"3.1.1.2.1.2.2.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Živi potomak – privatni podaci"}],"label":"Jozo Matin (★ 1904. – ✝ 1944.)"}],"label":"Mate Križanov (★ 1866. – ✝ 1948.)"},{"code":"3.1.1.2.2","detail":"Treći sin Križana Lovrina, Ante, oženio se Ivom Trogrlić. Imali su sina Stipana (1898.–) te kćeri Jelu i Maru. Stipan se nakon Prvoga svjetskog rata, 1918. godine, preselio u Srbiju. Nije poznato je li imao potomke niti što se s njim kasnije dogodilo.","children":[],"label":"Ante Križanov (★ 1870. – ✝ 1945.)"},{"code":"3.1.1.2.3","detail":"Ivan je bio osmi Križanov sin. Oženio je Ružu Serdarušić s kojom je imao sinove Antu (1911.–1916.), Križana i Marijana (1914.–1916.), koji je umro kao dijete, te kćeri Maru (1909.–) i Anu.","children":[{"code":"3.1.1.2.3.1","detail":"Križan je poginuo u Zagrebu 1944. godine. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"3.1.1.2.3.1.1","detail":"Ivan Križanov ženio se dvaput i imao potomke. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"3.1.1.2.3.1.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"3.1.1.2.3.1.1.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Živi potomak – privatni podaci"}],"label":"Ivan Križanov (★ 1938. – ✝ 2007.)"}],"label":"Križan Ivanov (★ 1916. – ✝ 1944.)"}],"label":"Ivan Križanov (★ 1881. – ✝ 1920.)"},{"code":"3.1.1.2.4","detail":"Bio je deveti sin Križana Lovrina i ženio se tri puta. Bio je rekorder po broju brakova među Tandarama. U prvom braku bio je oženjen Perom Matišić, koja je bila iz kuće poznate hrvatske glazbene obitelji Matišić. Iz tog braka dobio je sina Josipa. Pera je umrla 1919. godine od španjolske gripe, koju su u narodu nazivali „grla”. Drugi je brak bio s djevojkom iz obitelji Budić. Imali su sina Martina, koji je poginuo 1942. godine kod Bihaća. Treći brak bio je s Jozom Dragun, bez djece.","children":[{"code":"3.1.1.2.4.1","detail":"Josip je bio u braku s Anicom, rođ. Dragun. Obitelj je živjela u Zavelimu, gdje je Josip bio poznat kao vrijedan i pošten čovjek, duboko vezan uz svoj kraj i zajednicu. Godine 1946. Josip je tragično izgubio život u okolnostima koje su još desetljećima poslije ostale prikrivene velom tajne. Ubijen je iznad zadruge u Zavelimu, a prema naknadno otkrivenim svjedočenjima, zločin je počinio brat njihova prvog susjeda, koji je bio organizator zločina i djelovao iz osobne koristi. Također treba istaknuti da je organizator zločina nakon toga tragičnog događaja na različite načine pomagao Josipovoj obitelji, vjerojatno pokušavajući iskupiti se za počinjeno nedjelo. Budući da je moj pokojni otac Ivan osobno primao njegovu pomoć, sve do svoje smrti nije mogao prihvatiti činjenicu da je upravo njegov prvi susjed organizirao ubojstvo njegova oca, mojega djeda Josipa, niti je mogao povjerovati svjedočenju očevica toga događaja. Nakon rata proširila se priča da su Josipa ubili kamišari u povlačenju, pa je u razdoblju bivše države bio prikazivan kao žrtva ustaša. Tek nešto više od trideset godina poslije očevidac je, neposredno prije svoje smrti, otkrio stvarne okolnosti događaja i identitet počinitelja. Prema njegovu svjedočenju, izvršitelj ubojstva poginuo je 1963. godine u Njemačkoj, dok je organizator preminuo 1990. godine nakon duge i teške bolesti. Unatoč svemu, nikada nije pokrenuta istraga niti je provedeno sudsko procesuiranje, pa je ova tragedija ostala bez pravnih sankcija. Između naše obitelji i potomaka počinitelja zločina nema nikakve zle krvi. Naprotiv, njegujemo dobre i prijateljske odnose, bez tereta prošlosti te bez osjećaja krivnje ili odgovornosti za postupke naših davno preminulih predaka. Podaci o vjerojatno živim članovima obitelji premješteni su u privatni dio arhiva.","children":[{"code":"3.1.1.2.4.1.1","detail":"Ivan Josipov živio je od 1933. do 2025. godine. Dvaput se ženio i imao potomke. Podaci o vjerojatno živim članovima obitelji nalaze se u privatnom arhivu.","children":[{"code":"3.1.1.2.4.1.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[{"code":"3.1.1.2.4.1.1.1.1","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"},{"code":"3.1.1.2.4.1.1.1.2","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[],"label":"Živi potomak – privatni podaci"}],"label":"Živi potomak – privatni podaci"},{"code":"3.1.1.2.4.1.1.2","detail":"Podaci o vjerojatno živom članu dostupni su samo odobrenim korisnicima privatnog arhiva.","children":[], function zoomAt(factor,cx,cy){const old=scale;scale=Math.max(.12,Math.min(3.5,scale*factor));panX=cx-(cx-panX)*(scale/old);panY=cy-(cy-panY)*(scale/old);applyTransform();}

function normalize(value){return String(value||'').toLocaleLowerCase('hr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/dž/g,'d').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');}
function phonetic(value){return normalize(value).replace(/dj/g,'d').replace(/ije/g,'e').replace(/je/g,'e');}
function croatianStem(value){let word=phonetic(value);if(word.length<4)return word;const suffixes=['ovima','evima','inima','ovoga','evoga','inoga','ovome','evome','inome','ovomu','evomu','inomu','ovom','evom','inom','ovog','evog','inog','ovoj','evoj','inoj','ovim','evim','inim','ova','eva','ina','ovo','evo','ino','ove','eve','ine','ovu','evu','inu','ovi','evi','ini','ov','ev','in','ama','ima','ome','emu','oga','ega','om','em','oj','a','e','i','u'];for(const suffix of suffixes){if(word.endsWith(suffix)&&word.length-suffix.length>=3)return word.slice(0,-suffix.length);}return word;}
function editDistance(left,right){const a=phonetic(left),b=phonetic(right);if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;const prev=Array.from({length:b.length+1},(_,i)=>i),curr=new Array(b.length+1);for(let i=1;i<=a.length;i++){curr[0]=i;for(let j=1;j<=b.length;j++){const cost=a[i-1]===b[j-1]?0:1;curr[j]=Math.min(curr[j-1]+1,prev[j]+1,prev[j-1]+cost);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])curr[j]=Math.min(curr[j],prev[j-2]+1);}for(let j=0;j<=b.length;j++)prev[j]=curr[j];}return prev[b.length];}
function tokenSimilarity(queryToken,fieldToken){const q=normalize(queryToken),f=normalize(fieldToken);if(!q||!f)return Infinity;if(q===f)return 0;const qp=phonetic(q),fp=phonetic(f);if(qp===fp)return .15;if(q.length>=3&&(f.startsWith(q)||q.startsWith(f)))return .35;const shorter=Math.min(qp.length,fp.length),longer=Math.max(qp.length,fp.length);if(shorter>=4&&shorter/longer>=.6&&(fp.includes(qp)||qp.includes(fp)))return .5;const qs=croatianStem(q),fs=croatianStem(f);if(qs.length>=3&&qs===fs)return .6;const distance=editDistance(qp,fp),longest=Math.max(qp.length,fp.length),allowed=longest>=8?2:longest>=4?1:0;if(distance<=allowed)return .75+distance*.35;if(longest>=5&&distance/longest<=.24)return 1.65;return Infinity;}

function matchQuality(value){if(value<=.3)return'Točno podudaranje';if(value<=1.2)return'Vrlo slično';if(value<=2.2)return'Približno podudaranje';return'Moguće podudaranje';}
function compareCodes(a,b){const left=a.split('.').map(Number),right=b.split('.').map(Number);for(let i=0;i<Math.max(left.length,right.length);i++){const d=(left[i]||0)-(right[i]||0);if(d)return d;}return 0;}
function collectResults(rawQuery){const results=[];walk(DATA,node=>{const context=PERSON_SEARCH_CONTEXT[node.code]||{},aliases=(PERSON_SEARCH_ALIASES[node.code]||[]).join(' '),primary=node.code+' '+node.label,personContext=[context.father,context.mother,aliases].join(' '),primaryScore=score(rawQuery,primary,personContext);if(Number.isFinite(primaryScore)){results.push({type:'node',node,hostCode:node.code,score:primaryScore,matchKind:'person'});}else{const detailScore=fuzzyFieldScore(rawQuery,node.detail||'');if(Number.isFinite(detailScore)&&detailScore<=1.35)results.push({type:'node',node,hostCode:node.code,score:detailScore+7,matchKind:'detail'});}});VIRTUAL_PEOPLE.forEach((person,index)=>{const primary=[person.label,person.name,person.rawName,person.qualifier].join(' '),secondary=[person.father,person.mother,person.gender,person.hostCode].join(' '),value=score(rawQuery,primary,secondary);if(Number.isFinite(value))results.push({type:'virtual',person,index,hostCode:person.hostCode,score:value+.35,matchKind:'person'});});Object.entries(FAMILY_META).forEach(([hostCode,families])=>families.forEach((family,index)=>{const node=findNode(hostCode),value=score(rawQuery,family.spouse,[node?.label,family.sons.join(' '),family.daughters.join(' ')].join(' '));if(Number.isFinite(value))results.push({type:'spouse',family,index,node,hostCode,score:value+.45,matchKind:'spouse'});}));const strongVirtualHosts=new Set(results.filter(result=>result.type==='virtual'&&result.score<=4).map(result=>result.hostCode));const filtered=results.filter(result=>!(result.type==='node'&&result.matchKind==='detail'&&strongVirtualHosts.has(result.hostCode)));const unique=new Map();for(const result of filtered){const label=result.type==='virtual'?result.person?.label:result.type==='spouse'?result.family?.spouse:result.node?.label;const key=[result.type,result.hostCode,normalize(label)].join('|');const previous=unique.get(key);if(!previous||result.score<previous.score)unique.set(key,result);}const order const target = Array.from(

      const nodeRect=target.getBoundingClientRect(),svgRect=svg.getBoundingClientRect(),rootMatrix=svg.getScreenCTM();

function pointerPoint(event){const rect=svg.getBoundingClientRect();return{x:event.clientX-rect.left,y:event.clientY-rect.top};}
svg.addEventListener('pointerdown',event=>{if(event.target.closest?.('.node,.family-action'))return;svg.setPointerCapture(event.pointerId);pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,panX,panY};svg.classList.add('dragging');}else if(pointers.size===2){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y);pinchStart={distance,scale,panX,panY,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};dragStart=null;}});
svg.addEventListener('pointermove',event=>{if(!pointers.has(event.pointerId))return;pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1&&dragStart){const p=[...pointers.values()][0];panX=dragStart.panX+(p.x-dragStart.x);panY=dragStart.panY+(p.y-dragStart.y);applyTransform();}else if(pointers.size===2&&pinchStart){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,newScale=Math.max(.12,Math.min(3.5,pinchStart.scale*(distance/pinchStart.distance))),ratio=newScale/pinchStart.scale;scale=newScale;panX=cx-(pinchStart.cx-pinchStart.panX)*ratio;panY=cy-(pinchStart.cy-pinchStart.panY)*ratio;applyTransform();}});
function endPointer(event){pointers.delete(event.pointerId);if(pointers.size<2)pinchStart=null;if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,panX,panY};}else if(!pointers.size){dragStart=null;svg.classList.remove('dragging');}}
svg.addEventListener('pointerup',endPointer);svg.addEventListener('pointercancel',endPointer);
function expandEmbeddedDiagramArea(){
 if(window.self===window.top)return;
 try{
  const frame=window.frameElement,parentDoc=window.parent.document,parentWin=window.parent;
  if(!frame)return;
  const layout=parentDoc.querySelector('.layout');
  const contentPage=frame.closest('.content-page')||parentDoc.querySelector('.content-page');
  const card=frame.closest('.content-card')||parentDoc.querySelector('.content-card');
  const wrap=frame.parentElement;
  if(layout){layout.style.maxWidth='none';layout.style.width='100%';layout.style.margin='0';layout.style.gap='0';layout.style.padding='0';}
  if(contentPage){contentPage.style.width='100%';contentPage.style.maxWidth='none';contentPage.style.minWidth='0';contentPage.style.padding='0';contentPage.style.justifyContent='stretch';}
  let leftPad=0,rightPad=0;
  if(card){
   const cardStyle=parentWin.getComputedStyle(card);
   leftPad=parseFloat(cardStyle.paddingLeft)||0;rightPad=parseFloat(cardStyle.paddingRight)||0;
   card.style.width='100%';card.style.maxWidth='none';card.style.margin='0';card.style.borderRadius='0';
  }
  if(wrap){wrap.style.maxWidth='none';wrap.style.width=`calc(100% + ${leftPad+rightPad}px)`;wrap.style.marginLeft=`-${leftPad}px`;wrap.style.marginRight=`-${rightPad}px`;wrap.style.marginTop='30px';wrap.style.marginBottom='0';}
  frame.style.display='block';frame.style.width='100%';frame.style.maxWidth='none';frame.style.margin='0';frame.style.borderLeft='0';frame.style.borderRight='0';frame.style.borderRadius='0';
 }catch(error){/* Samostalni prikaz ostaje potpuno funkcionalan. */}
}
function syncHeaderHeight(){const header=document.querySelector('header');if(header)document.documentElement.style.setProperty('--header-height',header.offsetHeight+'px');}
window.addEventListener('resize',()=>{syncHeaderHeight();expandEmbeddedDiagramArea();requestAnimationFrame(fitTree);});
expandEmbeddedDiagramArea();syncHeaderHeight();setExpandedToDepth(1);render();requestAnimationFrame(fitTree);
</script>
