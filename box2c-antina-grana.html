<!doctype html>

<head>

<title>Cijela Antina grana</title>
<style>
:root{
  --green:#174f39; --paper:#fbfaf6; --ink:#22302a; --muted:#68736d;
  --blue-bg:#e8f2fb; --blue-line:#4d82aa; --orange-bg:#fff1df; --orange-line:#bb8144;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--paper)}
body{overflow:hidden}
header{
  height:92px;display:flex;align-items:center;gap:22px;padding:12px 18px;
  background:#fff;border-bottom:1px solid #dcded9;box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.title-wrap{min-width:285px}
h1{font-size:23px;margin:0 0 4px;color:var(--green)}
.subtitle{font-size:13px;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
button,input{
  border:1px solid #c9cec9;border-radius:8px;background:#fff;color:#26342e;
  padding:8px 10px;font-size:13px;
}
button{cursor:pointer}
button:hover{background:#f0f4f1}
button.primary{background:var(--green);color:#fff;border-color:var(--green)}
.search-wrap{display:flex;gap:6px;position:relative}
#search{width:240px}
.search-results{position:absolute;right:0;top:calc(100% + 7px);width:min(510px,calc(100vw - 32px));max-height:370px;overflow:auto;background:#fff;border:1px solid #c9cec9;border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.2);z-index:40}
.search-results[hidden]{display:none}
.search-results-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;background:#f5f7f5;border-bottom:1px solid #e0e3e0;color:#26342e;font-size:13px;font-weight:700;position:sticky;top:0;z-index:1}
.search-results-close{flex:0 0 auto;border:0!important;background:transparent!important;padding:2px 6px!important;font-size:18px!important;line-height:1}
.search-result-item{display:block;width:100%;margin:0;padding:10px 12px!important;text-align:left;border:0!important;border-bottom:1px solid #eceeec!important;border-radius:0!important;background:#fff!important}
.search-result-item:last-child{border-bottom:0!important}
.search-result-item:hover,.search-result-item:focus-visible{background:#f0f5f1!important}
.search-result-label{display:block;color:#174f39;font-size:13px;font-weight:700;line-height:1.35}
.search-result-meta{display:block;margin-top:4px;color:#68736d;font-size:12px;line-height:1.3}
.search-result-parents{display:block;margin-top:3px;color:#3f4d46;font-size:12px;line-height:1.35}
.search-result-family{display:block;margin-top:3px;color:#7a6551;font-size:11px;line-height:1.3}
.search-result-note{font-style:italic}
@media(max-width:900px){.search-results{position:fixed;left:12px;right:12px;top:136px;width:auto;max-height:55vh}}
#workspace{position:relative;height:calc(100% - 92px);overflow:hidden}
#treeSvg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#treeSvg.dragging{cursor:grabbing}
.connector{fill:none;stroke:#a9ada8;stroke-width:2}
.node rect{stroke-width:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.07))}
.node text{pointer-events:none}
.node .code{font-size:12px;font-weight:700;letter-spacing:.4px}
.node .label{font-size:14px;font-weight:600}
.node .hint{font-size:12px}
.node{cursor:pointer}
.node:hover rect{stroke-width:3}
.node.selected rect{stroke:#c63030!important;stroke-width:4}
.node.match rect{stroke:#be8b00!important;stroke-width:4}
#details{
  position:absolute;right:14px;top:14px;width:min(390px,calc(100% - 28px));max-height:calc(100% - 28px);
  overflow:auto;background:rgba(255,255,255,.97);border:1px solid #d3d7d2;border-radius:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.16);padding:16px;display:none
}
#details.open{display:block}
#details h2{font-size:17px;margin:0 32px 3px 0;color:var(--green)}
#details .detail-code{font-size:12px;font-weight:700;color:#6c756f;margin-bottom:12px}
#details p{font-size:14px;line-height:1.5;white-space:pre-line;margin:0}
#closeDetails{position:absolute;right:10px;top:9px;border:0;background:transparent;font-size:20px;padding:3px 7px}
.legend{
  position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.94);border:1px solid #d3d7d2;
  border-radius:10px;padding:9px 12px;font-size:12px;display:flex;gap:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)
}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:14px;height:14px;border-radius:4px;border:2px solid}
.help{position:absolute;right:15px;bottom:12px;color:#6d756f;font-size:12px;background:rgba(251,250,246,.9);padding:4px 7px;border-radius:6px}
@media(max-width:900px){
  header{height:142px;align-items:flex-start;flex-direction:column;gap:8px}
  #workspace{height:calc(100% - 142px)}
  .title-wrap{min-width:0}
  #search{width:185px}
  .legend{display:none}
}
@media print{
  header,#details,.legend,.help{display:none!important}
  body{overflow:visible}
  #workspace{height:auto}
  #treeSvg{width:100%;height:auto}
}
</style>
</head>

<script>
const DATA = {"code":"3.0","label":"Ante Tandara – Ivanov (★ c. 1735)","detail":"Ante Tandara je treći po redu sin Ivana Tandare. Ante je bio otprilike godinu dana mlađi od Petra, što se dobro uklapa u poznati redoslijed Ivanove djece. Oženio se Matijom Brnas, s kojom je imao sinove Antu, Filipa i Pavla, te kćeri Jaku, Lucu i Ružu. Osim zapisa o Pavlovu rođenju, nema drugih podataka o njemu, što upućuje na to da je vjerojatno umro vrlo mlad ili napustio Ričice prije nego što je ostavio trag u župnim knjigama.\n\nAntina loza ostala je čvrsto vezana uz Ričice, gdje se najjasnije razvijala tijekom 19. i 20. stoljeća. Iz ove jezgre potekao je najveći broj nositelja prezimena Tandara, pa se Antina linija smatra najrazvijenijom među Ivanovim potomcima. U kasnijim naraštajima pojedini članovi ove grane postupno su se počeli seliti – najprije u obližnja naselja, a zatim i mnogo dalje, u razne države Europske unije, kao i u Kanadu, Sjedinjene Američke Države i Australiju. Unatoč toj globalnoj raspršenosti, izvorna Antina linija ostala je čvrsto ukorijenjena u Ričicama, čuvajući kontinuitet obiteljske pripadnosti i najbogatiji pisani trag o svojim počecima.","children":[{"code":"3.1","label":"Ante (★ 1769 – ✝ 1849)","detail":"Ante, kao najstariji sin Ante Ivanova, oženio se 1801. godine Matijom Jukić. Imali su sinove Lovru, Miju i Petra, te kćeri Peru, Ružu, Anticu, Ivu i Mariju. O Petru nema drugih podataka osim zapisa o rođenju, pa se pretpostavlja da je umro mlad ili se odselio iz Zavelima. Obiteljsku lozu su nastavili sinovi Lovro i Mijo. Mijini nasljednici su dobili nadimak Tucići dok su Lovrini nasljednici preko sina Marijana dobili nadimak Lovrinovići, a preko sina Križana-Križanovići.\n\nPrema popisu iz 1819. godine, Ante je živio u Zavelimu, a njegov brat Filip u Ričicama. Njihovi su se potomci kasnije raselili po cijeloj Hrvatskoj, Europi, SAD-u i Kanadi.","children":[{"code":"3.1.1","label":"Lovro Antin (★ 1811 – ✝ 1903)","detail":"Oženio se Matijom Sičenica. Imali su sinove Marijana i Križana.","children":[{"code":"3.1.1.1","label":"Marijan Lovrin (★ 1836)","detail":"Oženio se Matijom Kovač. Imali su sinove Juru, Marka, Stipana i Jozu, te kćeri Ivu, Maru i Matiju. O Stipanu nema drugih podataka osim rođenja, pa se pretpostavlja da je umro mlad ili se odselio. Marijanovi potomci, preko sinova Marka i Jure, nose nadimak Lovrinovići, nastao po Marijanovu ocu Lovri. Lovrinovići danas žive u Popovači, Sarajevu, Stobreču i Londonu.","children":[{"code":"3.1.1.1.1","label":"Marko Marijanov (★ 1869)","detail":"Marko je oženio Božicu Pušić. Imali su sina Mirka i kćer Ivu.","children":[{"code":"3.1.1.1.1.1","label":"Mirko Markov (★ 1901)","detail":"Mirko je oženio Anicu Kilić. Imali su sinove Milana i Vladimira (koji je umro u dobi od 14 godina), te kćeri Dragicu, Mariju i Nediljku. Obitelj se preselila u Popovaču.","children":[{"code":"3.1.1.1.1.1.1","label":"Milan Mirkov (★ 1939)","detail":"Milan je oženio Svjetlanu Trifunović. Dobili su sinove Vladimira i Dalibora. Obitelj je preselila u Sarajevo.","children":[{"code":"3.1.1.1.1.1.1.1","label":"Vladimir Milanov (★ 1969)","detail":"Vladimir je oženio Claire Tacher s kojom je dobio sina Alexandera Jamesa (2010.-) i kćer Sophie Elizabeth (2008.-). Obitelj je preselila u London . UK.","children":[]},{"code":"3.1.1.1.1.1.1.2","label":"Dalibor Milanov (★ 1970)","detail":"Dalibor je oženio Amelu Nezirović. Dobili su sina Damira i kćer Teu. Obitelj je preselila u Sarajevo.","children":[]}]}]}]},{"code":"3.1.1.1.2","label":"Jozo Marijanov (★ 1882 – ✝ 1944) - nadimak Trošići","detail":"Jozo je oženio Ivu Kovač. Dobili su sinove Marijana i Luku.","children":[{"code":"3.1.1.1.2.1","label":"Marijan Jozin (★ 1910 – ✝ 1984)","detail":"Marijan je oženio Anicu Budimir. Dobili su sinove Nikolu i Jozu (koji je umro u dobi od 6 godina), te kćeri Maru i Zorku.","children":[{"code":"3.1.1.1.2.1.1","label":"Nikola Marijanov (★ 1939)","detail":"Nikola je oženio Mariju Lukić. Dobili su sina Vladu, te kćeri, Anu, Marijanu i Radmilu. Obitelj je preselila u Stobreč.","children":[{"code":"3.1.1.1.2.1.1.1","label":"Vlade Nikolin (★ 1970)","detail":"Vlade je oženio Silvanu Ruščić. Imaju sina Franju Josipa (1995.-) i kćer Teu (2000.-). Žive u Stobreču.","children":[]}]}]},{"code":"3.1.1.1.2.2","label":"Luka Jozin (★ 1912 – ✝ 1987)","detail":"Luka je oženio Anđu Kovač. Dobili su kćeri Ivu, Maru i Zorku. Muških potomaka nije imao.","children":[]}]}]},{"code":"3.1.1.2","label":"Križan Lovrin (★ 1843 – ✝ 1910)","detail":"Oženio je Peru Budimir. Imali su 15 djece od kojih je sedmero umrlo prije desete godine. Zanimljiv je podatak da je njegov drugi sin Ilija poginuo od uboda bika. Potomci Križana, preko sinova Mate, Ante, Ivana i Jure, nose nadimak Križanovići i žive u Zagrebu, Đakovu, Kutjevu, Bektežu, Strizivojni, Vrpolju i u nekoliko europskih država.","children":[{"code":"3.1.1.2.1","label":"Mate Križanov (★ 1866 – ✝ 1948)","detail":"Najstariji sin Križana, oženio je Ivu Pirić. Imali su sinove Miju, Marijana i Jozu, te kćeri Maru i Matiju. Mijo se nikada nije oženio. Obitelj je preselila u Bektež kraj Kutjeva.","children":[{"code":"3.1.1.2.1.1","label":"Marijan Matin (★ 1902 – ✝ 1974)","detail":"Marijan je oženio Anicu Maras. Dobili su sinove Antu, Jozu, Matu i Ivana, te kćer Maru. Jozo se nije ženio. Obitelj živi u Bektežu kraj Kutjeva.","children":[{"code":"3.1.1.2.1.1.1","label":"Ante Marijanov (★ 1934)","detail":"Ante Marijanov je imao dva braka. U prvom braku s Elizabetom Miletić imao je sina Darka (1958.-) i kćer Gordanu. U drugom braku sa Anom Kajtar nije imao djece. Obitelj se preselila u Strizivojnu.","children":[{"code":"3.1.1.2.1.1.1.1","label":"Darko Antin (★ 1958)","detail":"Darko Antin je imao dva braka. U prvom braku s Angelom ima sinove Maria (1982.-) i Markusa (1987.-). U drugom braku sa Suzanom ima sina Klaus Antu (2006.-). Darko sa svojom obitelji živi u Njemačkoj.","children":[]}]},{"code":"3.1.1.2.1.1.2","label":"Mato Marijanov (★ 1945)","detail":"U braku s Anicom Bogdanović dobio je sina Alena (1969.-) i kćer Lauru. Obitelj je preselila u Strizivojnu.","children":[{"code":"3.1.1.2.1.1.2.1","label":"Alen Matin (★ 1969)","detail":"Alen je oženio Melitu Pjela s kojom je dobio sina Marina (1993.-) i kćer Enu (1996.-). Obitelj živi u Strizivojni.","children":[]}]},{"code":"3.1.1.2.1.1.3","label":"Ivan Marijanov (★ 1953)","detail":"Četvrti sin Marijana, oženio je Ljiljanu Cobović. Dobili su sina Marijana, te kćeri Lanu i Paulinu. Žive u Đakovu, gdje Ivan vodi vlastiti odvjetnički ured.","children":[]}]},{"code":"3.1.1.2.1.2","label":"Jozo Matin (★ 1904 – ✝ 1944)","detail":"Najmlađi sin Mate i Ive Pirić, oženio je Jaku Kilić. Dobili su sinove Miju, Jozu i Ivana, te kćer Maru. Ivan se nije ženio. Jozo je poginuo u Drugom svjetskom ratu, a Mijina obitelj danas živi u Bektežu kraj Kutjeva.","children":[{"code":"3.1.1.2.1.2.1","label":"Mijo Jozin (★ 1940)","detail":"Mijo je oženio Zoricu s kojom ima tri kćeri, Marijanu, Nikolinu i (ime nije poznato). Obitelj živi u Bektežu kraj Kutjeva i bavi se proizvodnjom vina. Poznata vinarska obitelj s istoimenim vinarskim brendom – Tandara.","children":[]},{"code":"3.1.1.2.1.2.2","label":"Jozo Jozin (★ 1943)","detail":"Jozo i supruga nepoznatog imena dobili su sina Marijana i kćer Romanu. Obitelj je preselila u Velenje, Slovenija.","children":[{"code":"3.1.1.2.1.2.2.1","label":"Marijan Jozin","detail":"Marijan i supruga Marinela imaju sina Martina, te kćeri Tamaru i Petriciju. Obitelj živi u Velenju, Slovenija. Obitelj nema muških potomaka koji bi nastavili lozu.","children":[]}]}]}]},{"code":"3.1.1.2.2","label":"Ante Križanov (★ 1870 – ✝ 1945)","detail":"Treći sin Križana, oženio se Ivom Trogrlić. Imali su sina Stipana (1898.-), te kćeri Jelu i Maru. Stipan se nakon prvog svjetskog rata odselio u Srbiju; nije poznato je li imao potomke niti što se s njim kasnije dogodilo. Ako netko ima saznanja o ovoj obitelji, molio bih ga da mi se javi preko obrasca za kontakt.","children":[]},{"code":"3.1.1.2.3","label":"Ivan Križanov (★ 1881 – ✝ 1920)","detail":"Ivan je bio osmi Križanov sin. Oženio je Ružu Serdarušić s kojom je imao sinove Antu, umro u dobi od pet godina, Križana i Marijana, koji je umro kao dijete, te kćeri Maru i Anu.","children":[{"code":"3.1.1.2.3.1","label":"Križan Ivanov (★ 1916 – ✝ 1944)","detail":"U braku s Maricom Pušić imao je sina Ivana. Križan je poginuo u Zagrebu 1944. godine. Obitelj živi u Vrpolju.","children":[{"code":"3.1.1.2.3.1.1","label":"Ivan Križanov (★ 1938 – ✝ 2007)","detail":"Dvaput se ženio. Iz prvog braka s Dragicom Dragun dobio je sina Križana (1956.-). U drugom braku sa Ankom Nikolić ima kćeri Biljanu i Belinu.","children":[{"code":"3.1.1.2.3.1.1.1","label":"Križan Ivanov (★ 1956)","detail":"Križan i supruga Ljerka Maričić dobili su sinove Tonija i Dinka. Obitelj živi u Vrpolju.","children":[{"code":"3.1.1.2.3.1.1.1.1","label":"Toni Križanov (★ 1979)","detail":"Toni i Nada Jergović dobili su kćeri Veroniku i Magdalenu, te sina Filipa (2010.-). Obitelj živi u Vrpolju.","children":[]}]}]}]}]},{"code":"3.1.1.2.4","label":"Jure Križanov (★ 1883 – ✝ 1947)- nadimak Đulko","detail":"Bio je deveti sin Križana i ženio se tri puta. Rekorder po brakovima kod Tandara.\n\nU prvom braku bio je oženjen Perom Matišić, koja je bila iz kuće poznate hrvatske glazbene obitelji Matišić. Iz tog braka dobio je sina Josipa. Pera je umrla 1919. godine od španjolske gripe koja je u narodu nazivana Grla. Drugi brak je bio s djevojkom iz obitelji Budić. Imali su sina Martina, koji je poginuo 1942. godine kod Bihaća. Treći brak bio je s Jozom Dragun, bez djece.","children":[{"code":"3.1.1.2.4.1","label":"Josip Jurin (★ 1911 – ✝ 1946)","detail":"U braku s Anicom Dragun imao je sinove Ivana i Milana, te kćeri Slavu, Maru, Nedu i Macu. Ubijen je 1946 iznad zadruge u Zavelimu. Moj djed Josip je 1946. godine tragično izgubio život u okolnostima koje su desetljećima ostale prikrivene. Ubijen je od strane prvog susjeda, koji je radi vlastite koristi angažirao svog brata da počini zločin. Nakon rata proširena je priča da su djeda ubili kamišari u povlačenju, pa je u bivšoj državi bio prikazan kao žrtva ustaša i dobio je spomenik, dok moja baka nikada nije ostvarila pripadajuću odštetu. Tek trideset godina kasnije svjedok događaja je prije smrti mojoj baki otkrio stvarne okolnosti i počinitelja. Prema toj verziji, ubojica je poginuo 1963. u Njemačkoj, a organizator ubojstva je 1990. preminuo u mukama od teške bolesti. Nažalost, nikada nije pokrenuta istraga niti je provedeno sudsko procesuiranje, pa je ova tragedija ostala bez pravnih sankcija. Važno je istaknuti da moja obitelj ima jako dobre odnose s potomcima ubojice i da među nama danas nema zle krvi.","children":[{"code":"3.1.1.2.4.1.1","label":"Ivan Josipov (★ 1933 – ✝ 2025)","detail":"Dvaput se ženio. Iz prvog braka s Matijom Pušić dobio je sinove Juru i Vladimira, te kćer Mihaelu (kršteno Milena). Iz drugog braka sa Verkom Nikolovski nije imao djece. Obitelj živi u Zagrebu.","children":[{"code":"3.1.1.2.4.1.1.1","label":"Jure Ivanov (★ 1956)","detail":"Jure i Ruža Kosić dobili su sinove Ivicu Julija i Marina Tina. Obitelj živi u Zagrebu.","children":[{"code":"3.1.1.2.4.1.1.1.1","label":"Ivica Julio Jurin (★ 1981)","detail":"Ivica Julio je oženio Anu Mikuš s kojom je dobio sina Viga (2015.- ) i kćer Kaiu (2018.- ).","children":[]},{"code":"3.1.1.2.4.1.1.1.2","label":"Marin Tin Jurin (★ 1983)","detail":"Marin Tin jer oženio Ivanu Keretu s kojom je dobio sinove Davida(1917.- ) i Jakova (2019.- ), te kćer Lauru (2023.- ).","children":[]}]},{"code":"3.1.1.2.4.1.1.2","label":"Vladimir Ivanov (★ 1964)","detail":"Vladimir je oženio Ljubicu Kosić s kojom ima sinove Filipa i Lea. Obitelj živi u Münchenu, Filip je u Berlinu, a Leo u Beču.","children":[]}]},{"code":"3.1.1.2.4.1.2","label":"Milan Josipov (★ 1942 – ✝ 2003)","detail":"Milan je oženio Slavu Budimir i s njom je dobio sinove Jozu i Ivana, te kćeri Mariju, Anku i Marinu. Obitelj živi u Posušju, Ivan je u Bielefeldu, Njemačka.","children":[{"code":"3.1.1.2.4.1.2.1","label":"Jozo Milanov (★ 1967)","detail":"Jozo je oženio Vesnu Matić s kojom ima sina Martina, te kćeri Slavicu i Mateu.","children":[{"code":"3.1.1.2.4.1.2.1.1","label":"Matea Jozina (★ 1967)","detail":"Matea Jozina je dobila sina Tomu. Toma je preuzeo naše prezime Tandara. To je prvi slučaj u Tandara da je kćer nastavila očevu lozu. Obitelj živi u Posušju.","children":[]}]},{"code":"3.1.1.2.4.1.2.2","label":"Ivan Milanov (★ 1974)","detail":"Ivan je oženjen Ružicom Glavaš i s njom ima sinove Davida i Milana, te kćer Nataliju. Obitelj živi u Bielefeldu, Njemačka.","children":[{"code":"3.1.1.2.4.1.2.2.1","label":"David Ivanov (★ 1995)","detail":"David je oženjen Lizom Wormann i s njom ima kćer Ivanu. Obitelj živi u Bielefeldu, Njemačka.","children":[]}]}]}]}]}]}]},{"code":"3.1.2","label":"Mijo Antin (★ 1818 – ✝ 1878) – nadimak Tucići","detail":"Mijo, drugi Antin sin, oženio je Mandu Martinović. Imali su devetero djece; sinove Jozu, Antu, Matu, Miju i Petra, te kćeri Ivu, Matiju, Ružu i Anticu.\n\nO sinu Miji nema drugih podataka osim rođenja. Pretpostavlja se da je umro mlad ili se odselio u nepoznatom smjeru. Potomci preko sinova Joze, Mate i Petra nose nadimak Tucići, koji je nastao jer su članovi obitelji bili skloni ljubavnim avanturama.","children":[{"code":"3.1.2.1","label":"Jozo Mijin (★ 1851)","detail":"Oženio se Ivom Bilojelić. Imali su sedmero djece; sinove Antu, Jozu i Nikolu (koji je umro u dobi od šest godina), te kćeri Matiju, Jelu, Maru i Ivu. Sin Jozo se nije ženio i jedino je Ante prenio prezime na potomke.","children":[{"code":"3.1.2.1.1","label":"Ante Jozin (★ 1881 – ✝ 1942)","detail":"Oženio je Jelu Škorić. Imali su sinove Marijana, Matu, Filipa i Nikolu, te kćeri Jelu, Maru, Katu i Milu. Obiteljsku lozu su nastavili sinovi Marijan i Mijo.","children":[{"code":"3.1.2.1.1.1","label":"Marijan Antin (★ 1908 – ✝ 2003) – nadimak Đika","detail":"Marijan je oženio Ivu Čorbić. Dobili su sinove Ivana i Milana, te kćeri Maru, Dragicu, Katu i Mariju.","children":[{"code":"3.1.2.1.1.1.1","label":"Ivan Marijanov (★ 1939 – ✝ 2024)","detail":"Oženio se Anom Pušić. Dobili su sina Zdenka (1966.-) i kćer Kristinu (1968.-). Obitelj živi u Zagrebu.","children":[{"code":"3.1.2.1.1.1.1.1","label":"Zdenko Ivanov","detail":"Zdenko se ženio dvaput. Iz prvog braka ima sina Tomislava, a iz drugog braka s Kristinom Topić ima kćer Anu.","children":[]}]},{"code":"3.1.2.1.1.1.2","label":"Milan Marijanov (★ 1947)","detail":"Dvaput se ženio. Iz prvog braka s Marijom Pušić ima sina Nedjeljka, te kćeri Dragicu, Ljubicu i Tanju. Iz drugog braka Milan nema djece.","children":[{"code":"3.1.2.1.1.1.2.1","label":"Nedjeljko Milanov (★ 1966)","detail":"Nedjeljko i supruga Ivana Božičević imaju kćeri Mariju i Tinu. Obitelj živi u Zagrebu.","children":[]}]}]},{"code":"3.1.2.1.1.2","label":"Mijo Antin (★ 1927)","detail":"Četvrti Antin sin Mijo, oženio je Mašu Gudelj s kojom je dobio sina Antu. Obitelj živi u Zagrebu.","children":[{"code":"3.1.2.1.1.2.1","label":"Ante Mijin (★ 1953)","detail":"Ante je oženio Renatu Nagy s kojom je dobio sina Antu. Žive u Zagrebu.","children":[{"code":"3.1.2.1.1.2.1.1","label":"Ante Antin (★ 1978)","detail":"Ante je oženio Valentinu Juriša s kojom je dobio sinove Antu i Luku. Žive u Zagrebu.","children":[]}]}]}]}]},{"code":"3.1.2.2","label":"Mate Mijin (★ 1863 – ✝ 1905)","detail":"Mate se ženio dva puta. U prvom braku s Tomicom Kovač imao je sina Ivana koji je umro kao dijete. U drugom braku Ivom Vlajčić imao je kćer Ivu i sinove Martina i Juru. Za Martina nema podataka da se ženio.","children":[{"code":"3.1.2.2.1","label":"Jure Matin (★ 1905 – ✝ 1974) – nadimak Đuka","detail":"Jure je oženio Matiju Škorić s kojom je dobio sinove Antu i Matu, te kćeri Milu, Stanu i Ivu.","children":[{"code":"3.1.2.2.1.1","label":"Ante Jurin (★ 1933 – ✝ 1999)","detail":"Ante je oženio Milu Đikić s kojom je dobio sinove Ivana (umro 2002.), Milana i Srećka, te kćer Matiju. Obitelj se preselila u Đakovo.","children":[{"code":"3.1.2.2.1.1.1","label":"Milan Antin (★ 1958 – ✝ 1995)","detail":"Milan je oženio Marijanu Erceg s kojom je dobio sinove Ivana i Antu. Obitelj živi u Đakovu.","children":[{"code":"3.1.2.2.1.1.1.1","label":"Ivan Milanov (★ 1983)","detail":"Ivan je oženio Sunčicu Kraljević s kojom je dobio sina Marina (2008.-). Obitelj živi u Đakovu.","children":[]},{"code":"3.1.2.2.1.1.1.2","label":"Ante Milanov (★ 1985)","detail":"Ante je oženio Anu Stipanović s kojom je dobio sina Milana (2010.-). Obitelj živi u Đakovu.","children":[]}]},{"code":"3.1.2.2.1.1.2","label":"Srećko Antin (★ 1959)","detail":"Srećko je oženio Jaku Jurić i s njom dobio sinove Antonia (1995.-) i Marka (1996.-). Obitelj živi u Đakovu.","children":[]}]},{"code":"3.1.2.2.1.2","label":"Mate Jurin (★ 1935)","detail":"Mate je oženio Danicu Malenica s kojom je dobio sina Tomislava i kćeri Mariju, Milu i Anu. Žive u Splitu, Podstrani.","children":[{"code":"3.1.2.2.1.2.1","label":"Tomislav Matin (★ 1968)","detail":"Tomislav je oženio Vlatku Dolić s kojom ima sina Mateja i kćer Danielu. Žive u Splitu, Podstrani.","children":[]}]}]}]},{"code":"3.1.2.3","label":"Petar Mijin (★ 1867)","detail":"Petar je bio oženjen Matijom Tandara s kojom je dobio sinove Matu, Stipana, Antu i Iliju. Ante je preminuo u prvoj godini života.","children":[{"code":"3.1.2.3.1","label":"Mate Petrov (★ 1902 – ✝ 1991)","detail":"Mate je bio oženjen Katom Cimerman i sa njom dobio sina Ivana i kćer Ankicu. Obitelj se preselila u Kutjevo.","children":[{"code":"3.1.2.3.1.1","label":"Ivan Matin (★ 1932 – ✝ 2005)","detail":"Ivan se oženio Pavicom Kralik sa kojom ima sinove Emila i Ivana. Obitelj živi u Kutjevu.","children":[{"code":"3.1.2.3.1.1.1","label":"Emil Ivanov (★ 1963)","detail":"Emil se oženio Zoricom Nađ s kojom ima kćeri Marijanu i Nikolinu. Obitelj živi u Švicarskoj.","children":[]}]}]},{"code":"3.1.2.3.2","label":"Stipan Petrov (★ 1908 – ✝ 1989)","detail":"Stipan je oženio Jozu Malenica s kojom je dobio sina Ivana i kćer Ankicu. Obitelj se preselila u Dugo Selo.","children":[{"code":"3.1.2.3.2.1","label":"Ivan Stipanov (★ 1944)","detail":"Ivan je oženio Anu Budimir s kojom ima sina Mirka i kćeri Mirjanu, Mariju i Ankicu. Obitelj je u Dugom Selu.","children":[{"code":"3.1.2.3.2.1.1","label":"Mirko Ivanov (★ 1966)","detail":"Mirko je oženio Dragicu Čamber s kojom ima sinove Ivana i Josipa, te kćer Anu Mariju.","children":[]}]}]},{"code":"3.1.2.3.3","label":"Ilija Petrov (★ 1912 – ✝ 2006) – nadimak Grabunjaš","detail":"Ilija je bio oženjen Anicom Škorić s kojom je dobio sinove Marijana i Mirka, te kćeri Macu, Nedu i Dragicu.","children":[{"code":"3.1.2.3.3.1","label":"Marijan Ilijin (★ 1939)- nadimak Marinko","detail":"Marijan je oženio Franku Kovač s kojom je dobio sinove Nediljka i Mirča, te kćeri Ivanku, Mariju i Nedu. Obitelj živi u Đakovu.","children":[]},{"code":"3.1.2.3.3.2","label":"Mirko Ilijin (★ 1945 – ✝ 2025)","detail":"Mirko je bio oženjen Katom Kovač sa kojom je dobio sinove Marinka, Ivicu i Antu, te kćeri Anku i Mariju. Obitelj živi u Zagrebu.","children":[{"code":"3.1.2.3.3.2.1","label":"Marinko Mirkov (★ 1967)","detail":"Marinko je oženio Jaroslavu Doležal sa kojom ima sina Petra i kćeri Kristinu i Antoniju. Žive u Zagrebu.","children":[]},{"code":"3.1.2.3.3.2.2","label":"Ivica Mirkov (★ 1967)","detail":"Ivica je oženio Ružu Valjak s kojom ima kćeri Helenu i Katarinu. Žive u Zagrebu.","children":[]},{"code":"3.1.2.3.3.2.3","label":"Ante Mirkov (★ 1967)","detail":"Ante je oženio Ružicu Čolak sa kojom ima kćeri Gabrielu, Antonelu i Paulu. Obitelj je u Zagrebu.","children":[]}]}]}]}]}]},{"code":"3.2","label":"Filip Antin","detail":"Filip je bio drugi sin Ante Ivanova. Za razliku od njegova brata Ante, Filip je ostao i nastavio život u Ričicama. Bio je oženjen Matijom Parlov sa kojom je imao sinove Martina, Matu i Ivana, te kćeri Jozu, Jelu, Jurku, Anticu i Ružu. Za Ivana i Matu postoje samo podaci o rođenju pa se pretpostavlja da su mladi umrli ili su odselili iz Ričica.","children":[{"code":"3.2.1","label":"Martin Filipov (★ 1811)","detail":"Martin je bio oženjen Mandom Manenica sa kojom je imao sinove Jerku, Iliju, Ivana, Martina i ponovo drugog Ivana, te kćeri Tomicu, Luciju, drugu Luciju i Ivu. Lozu su nastavili samo sinovi Jerko i Ilija.","children":[{"code":"3.2.1.1","label":"Jerko Martinov (★ 1811)","detail":"Jerko je bio oženjen Ivom Topalušić s kojom je dobio sinove Martina, Luku i Ivana. Luka je nakon rođenja umro.","children":[{"code":"3.2.1.1.1","label":"Martin Jerkin (★ 1865)","detail":"Martin je bio oženjen Ivom Kovač s kojom je imao kćeri Matiju, Maru i Ivu.","children":[]},{"code":"3.2.1.1.2","label":"Ivan Jerkin (★ 1872)","detail":"Ivan je bio oženjen Jakom Martinović s kojom je imao sinove Matu i Martina, te kćeri Anu, Tomicu i drugu Tomicu, nakon što je prva kćer Tomica preminula u drugoj godini života. Bio je čest slučaj da su roditelji nakon prvog preminulog djeteta drugom istog spola davali ista imena.","children":[{"code":"3.2.1.1.2.1","label":"Mate Ivanov (★ 1898) – nadimak Pikići","detail":"Mate je bio oženjen Matijom Lažeta sa kojom je imao sinove Nikolu, Mirka i Marijana, te kćeri Milicu i Dragicu. Obitelj se preselila u Split.","children":[{"code":"3.2.1.1.2.1.1","label":"Nikola Matin (★ 1927 – ✝ 1990)","detail":"Nikola je bio oženjen Matijom Kilić s kojom je dobio sinove Damira i Željka, te kćeri Veru i Mariju. Obitelj je u Splitu.","children":[{"code":"3.2.1.1.2.1.1.1","label":"Damir Nikolin (★ 1960)","detail":"Damir se dva puta ženio. Iz prvog braka s Marinom Čelan ima sina Tina (1981.-) koji živi u Njemačkoj. U drugom braku sa Lucijom Modrić ima sina Lea (2003.- ) i kćeri Žanu i Doris. Obitelj je u Splitu.","children":[]},{"code":"3.2.1.1.2.1.1.2","label":"Željko Nikolin (★ 1963)","detail":"Željko je oženjen Anitom Košćak s kojom ima sinove Nikolu (1992.-) i Marka (1996.- ). Žive u Splitu.","children":[]}]},{"code":"3.2.1.1.2.1.2","label":"Mirko Matin (★ 1932 – ✝ 2005)","d elj živi u Predavcu.","children":[]},{"code":"3.2.1.2.1.1.1.4","label":"Zdravko Vinkov (★ 1960)","detail":"Zdravko je oženio Brigitu Horvatinčić s kojom ima sinove Matu (1997.-) i Brunu (1999.-), te kćeri Anitu i Petru. Obitelj živi u Predavcu.","children":[]},{"code":"3.2.1.2.1.1.1.5","label":"Vinko Vinkov (★ 1961)","detail":"Vinko je oženio Slavicu Matišić s kojom ima sina Maria (1984.-) i kćer Marinu. Obitelj živi u Predavcu.","children":[]}]},{"code":"3.2.1.2.1.1.2","label":"Milan Mijin (★ 1935)","detail":"Milan je oženio Ivu Lukić s kojom ima sinove Željka i Dragana, te kćeri Rosu i Dragicu. Obitelj živi u Predavcu.","children":[{"code":"3.2.1.2.1.1.2.1","label":"Željko Milanov (★ 1962)","detail":"Željko je oženio Slađanu nepoznatog prezimena i s njom ima sina Ivana (nepoznata godina rođenja). Obitelj živi u Predavcu.","children":[]},{"code":"3.2.1.2.1.1.2.2","label":"Dragan Milanov (★ 1965)","detail":"Dragan je oženio Zvijezdanu (nepoznatog prezimena) i s njom ima sina Gorana i kćeri Ivu i Danielu. Obitelj živi u Predavcu.","children":[{"code":"3.2.1.2.1.1.2.2.1","label":"Goran Draganov (nepoznata godina rođenja)","detail":"Goran ima sina Tina. Ostali podaci nedostaju. Ako netko može dati nedostajuće informacije, molio bih da mi se javi putem kontakt obrasca.","children":[]}]}]}]},{"code":"3.2.1.2.1.2","label":"Toma Matin (★ 1909 – ✝ 1945)-nadimak Rumići","detail":"Toma je bio oženjen Tomicom Tandara s kojom je dobio sinove Petra, Marijana, Slavka, Antu i Matu, te kćeri Milu, Dragicu, Anu i Nevenku. Marijan se nije ženio.","children":[{"code":"3.2.1.2.1.2.1","label":"Petar Tomin (★ 1925 – ✝ 1985)","detail":"Petar je bio oženjen Katom Novosel s kojom je dobio sina Ivicu.","children":[{"code":"3.2.1.2.1.2.1.1","label":"Ivica Petrov (★ 1952)","detail":"Ivica je oženio Ljubicu Kozić s kojom ima sina Hrvoja (1983.-) i kćer Sabinu Tandara Knezović . Sabina je poznata TV novinarka koja radi na Novoj TV. Obitelj živi u Zagrebu.","children":[]}]},{"code":"3.2.1.2.1.2.2 function walk(node, callback, parent=null, depth=0){
  callback(node,parent,depth);
  (node.children || []).forEach(child => walk(child,callback,node,depth+1));
}
function depthFromCode(code){ return code === "3.0" ? 0 : code.split(".").length - 1; }
function setExpandedToDepth(maxDepth){
  walk(DATA,(node,parent,depth)=>{ node.expanded = depth < maxDepth; });
}
function visibleNodes(){
  const result=[];
  function visit(node,parent=null,depth=0){
    result.push({node,parent,depth});
    if(node.expanded) (node.children||[]).forEach(child=>visit(child,node,depth+1));
  }
  visit(DATA);
  return result;
}
function colors(code){
  if(code==="3.0") return {fill:"#174f39",text:"#fff",stroke:"#0d3425"};
  if(code.startsWith("3.1")) return {fill:"#e8f2fb",text:"#173a57",stroke:"#4d82aa"};
  return {fill:"#fff1df",text:"#553719",stroke:"#bb8144"};
}
function wrapText(text,max=34){
  const words=text.split(/\s+/); const lines=[]; let line="";
  for(const word of words){
    const test=(line+" "+word).trim();
    if(test.length>max && line){ lines.push(line); line=word; }
    else line=test;
  }
  if(line) lines.push(line);
  if(lines.length>2) lines[1]=lines.slice(1).join(" ").slice(0,max-1)+"…";
  return lines.slice(0,2);
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function render(){
  const visible=visibleNodes();
  const pos=new Map();
  visible.forEach((item,index)=>{
    pos.set(item.node.code,{x:MARGIN+item.depth*X_STEP,y:MARGIN+index*ROW_STEP});
  });
  const maxDepth=Math.max(...visible.map(v=>v.depth),0);
  bounds.width=MARGIN*2+maxDepth*X_STEP+BOX_W;
  bounds.height=MARGIN*2+visible.length*ROW_STEP;

  let links="";
  visible.forEach(({node,parent})=>{
    if(!parent || !pos.has(parent.code)) return;
    const p=pos.get(parent.code), c=pos.get(node.code);
    const x1=p.x+BOX_W, y1=p.y+BOX_H/2, x2=c.x, y2=c.y+BOX_H/2;
    const elbow=x1+(x2-x1)/2;
    links += `<path class="connector" d="M${x1},${y1} H${elbow} V${y2} H${x2}"/>`;
  });
  linksLayer.innerHTML=links;

  let nodeMarkup="";
  visible.forEach(({node})=>{
    const p=pos.get(node.code), color=colors(node.code), lines=wrapText(node.label);
    const hasChildren=(node.children||[]).length>0;
    const indicator=hasChildren ? (node.expanded ? "−" : "+") : "";
    const classes=["node"];
    if(node.code===selectedCode) classes.push("selected");
    if(node.code===matchCode) classes.push("match");
    nodeMarkup += `<g class="${classes.join(" ")}" data-code="${esc(node.code)}" transform="translate(${p.x},${p.y})">
      <rect width="${BOX_W}" height="${BOX_H}" rx="9" fill="${color.fill}" stroke="${color.stroke}"></rect>
      <text class="code" x="13" y="18" fill="${color.text}">${esc(node.code)}</text>
      ${lines.map((line,i)=>`<text class="label" x="13" y="${38+i*16}" fill="${color.text}">${esc(line)}</text>`).join("")}
      ${hasChildren?`<circle cx="${BOX_W-18}" cy="18" r="11" fill="rgba(255,255,255,.72)" stroke="${color.stroke}"></circle>
      <text class="hint" x="${BOX_W-18}" y="22" text-anchor="middle" fill="${color.stroke}">${indicator}</text>`:""}
    </g>`;
  });
  nodesLayer.innerHTML=nodeMarkup;

  nodesLayer.querySelectorAll(".node").forEach(group=>{
    group.addEventListener("click",event=>{
      event.stopPropagation();
      const code=group.dataset.code;
      const node=findNode(code);
      selectedCode=code;
      showDetails(node);
      if((node.children||[]).length){
        node.expanded=!node.expanded;
      }
      render();
    });
  });
  applyTransform();
}
function findNode(code){
  let result=null;
  walk(DATA,node=>{ if(node.code===code) result=node; });
  return result;
}
function showDetails(node){
  document.getElementById("detailTitle").textContent=node.label;
  document.getElementById("detailCode").textContent="Šifra "+node.code;
  document.getElementById("detailText").textContent=node.detail || "Za ovu osobu u izvornom HTML-u nema dodatnog opisa.";
  details.classList.add("open");
}
function applyTransform(){
  viewport.setAttribute("transform",`translate(${panX},${panY}) scale(${scale})`);
}
function fitTree(){
  const rect=svg.getBoundingClientRect();
  scale=Math.min((rect.width-50)/bounds.width,(rect.height-50)/bounds.height,1.15);
  panX=(rect.width-bounds.width*scale)/2;
  panY=(rect.height-bounds.height*scale)/2;
  applyTransform();
}
function zoomAt(factor,cx,cy){
  const old=scale;
  scale=Math.max(.12,Math.min(3,scale*factor));
  panX=cx-(cx-panX)*(scale/old);
  panY=cy-(cy-panY)*(scale/old);
  applyTransform();
}
function expandAncestors(code){
  const parts=code.split(".");
  DATA.expanded=true;
  for(let i=2;i<parts.length;i++){
    const ancestor=parts.slice(0,i).join(".");
    const node=findNode(ancestor);
    if(node) node.expanded=true;
  }
}
function normalizeSearchText(value){return String(value||'').toLocaleLowerCase('hr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'dj').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');}
const SEARCH_ENDINGS=['ovima','evima','icama','cima','ama','ima','icom','com','om','em','u','a','e','i','o'];
function tokenForms(word){const forms=new Set([word]);for(const ending of SEARCH_ENDINGS){if(word.endsWith(ending)&&word.length-ending.length>=2)forms.add(word.slice(0,-ending.length));}return forms;}
function tokenMatchCost(queryWord,hayWord){if(queryWord===hayWord)return 0;const queryForms=tokenForms(queryWord),hayForms=tokenForms(hayWord);let shortest=Infinity;for(const form of queryForms){if(hayForms.has(form))shortest=Math.min(shortest,form.length);}if(Number.isFinite(shortest))return shortest>=3?1:2;for(const queryForm of queryForms){for(const hayForm of hayForms){const minLength=Math.min(queryForm.length,hayForm.length);if(minLength>=4&&(queryForm.startsWith(hayForm)||hayForm.startsWith(queryForm)))return 3;}}return Infinity;}
function unorderedTokenScore(query,field){const queryWords=query.split(' ').filter(Boolean),hayWords=normalizeSearchText(field).split(' ').filter(Boolean);if(!queryWords.length||!hayWords.length)return Infinity;const used=new Set();let total=0;for(const queryWord of queryWords){let bestIndex=-1,bestCost=Infinity;for(let index=0;index<hayWords.length;index++){if(used.has(index))continue;const cost=tokenMatchCost(queryWord,hayWords[index]);if(cost<bestCost){bestCost=cost;bestIndex=index;if(cost===0)break;}}if(bestIndex<0||!Number.isFinite(bestCost))return Infinity;used.add(bestIndex);total+=bestCost;}return total;}
function personSearchText(node){return String(node.label||'').replace(/\s*\([^)]*\)\s*$/,'').replace(/\s*[-–]\s*nadimak.*$/i,'').trim();}
function visiblePersonScore(query,node){const queryWords=query.split(' ').filter(Boolean),name=normalizeSearchText(personSearchText(node)),nameWords=name.split(' ').filter(Boolean);if(!queryWords.length||!nameWords.length||queryWords[0]!==nameWords[0])return Infinity;const context=PERSON_SEARCH_CONTEXT[node.code]||{};const field=[personSearchText(node),context.father||'',context.mother||'',(PERSON_SEARCH_ALIASES[node.code]||[]).join(' ')].join(' ');const score=unorderedTokenScore(query,field);if(!Number.isFinite(score))return Infinity;if(query===name)return -10;return score;}
function virtualPersonScore(query,person){const queryWords=query.split(' ').filter(Boolean),name=normalizeSearchText(person.label),nameWords=name.split(' ').filter(Boolean);if(!queryWords.length||!nameWords.length||queryWords[0]!==nameWords[0])return Infinity;const field=[person.label,person.rawName||'',person.father,person.mother,person.qualifier||''].join(' ');const score=unorderedTokenScore(query,field);if(!Number.isFinite(score))return Infinity;if(query===name)return -9;return score+2;}
function detailSearchScore(query,node){return unorderedTokenScore(query,[node.detail||'',node.label||''].join(' '));}
function compareCodes(left,right){const a=left.split('.').map(Number),b=right.split('.').map(Number),length=Math.max(a.length,b.length);for(let i=0;i<length;i++){const difference=(a[i]||0)-(b[i]||0);if(difference)return difference;}return 0;}
function collectPersonResults(query){const results=[];walk(DATA,node=>{const score=visiblePersonScore(query,node);if(Number.isFinite(score))results.push({type:'person',node,score,hostCode:node.code});});VIRTUAL_PEOPLE.forEach((person,index)=>{const score=virtualPersonScore(query,person);if(Number.isFinite(score))results.push({type:'virtual',person,score,hostCode:person.hostCode,index});});return results.sort((a,b)=>a.score-b.score||compareCodes(a.hostCode,b.hostCode)||String(a.person?.label||a.node?.label||'').localeCompare(String(b.person?.label||b.node?.label||''),'hr'));}
function collectDetailResults(query){const results=[];walk(DATA,node=>{const score=detailSearchScore(query,node);if(Number.isFinite(score))results.push({type:'detail',node,score,hostCode:node.code});});return results.sort((a,b)=>a.score-b.score||compareCodes(a.hostCode,b.hostCode));}

function focusSearchResult(node){closeSearchResults();expandAncestors(node.code);selectedCode=node.code;matchCode=node.code;render();showDetails(node);centerSearchNode(node.code);}
function focusVirtualPerson(person){closeSearchResults();const node=findNode(person.hostCode);if(!node)return;expandAncestors(node.code);selectedCode=node.code;matchCode=node.code;render();document.getElementById('detailTitle').textContent=person.label+(person.qualifier?' — '+person.qualifier:'');document.getElementById('detailCode').textContent='Obiteljski box '+person.hostCode;document.getElementById('detailText').textContent='Otac: '+person.father+'. Majka: '+person.mother+'. Ova je osoba navedena u obiteljskom opisu, ali nema zaseban numerirani box. Otvoren je box njezine obitelji.';details.classList.add('open');centerSearchNode(node.code);}

function showSearchResults(results,title){activeSearchResults=results;const panel=document.getElementById('searchResults'),items=document.getElementById('searchResultItems');document.getElementById('searchResultsTitle').textContent=title;items.innerHTML=results.map((result,index)=>{if(result.type==='virtual'){const person=result.person;return `<button class="search-result-item" type="button" data-result-index="${index}"><span class="search-result-label">${esc(person.label)}${person.qualifier?' — '+esc(person.qualifier):''}</span><span class="search-result-parents">Otac: ${esc(person.father)} · Majka: ${esc(person.mother)}</span><span class="search-result-family">${esc(person.gender)} bez zasebnog boxa · obiteljski box ${esc(person.hostCode)}</span></button>`;}const context=PERSON_SEARCH_CONTEXT[result.node.code];return `<button class="search-result-item" type="button" data-result-index="${index}"><span class="search-result-label">${esc(result.node.label)}</span>${context?`<span class="search-result-parents">Otac: ${esc(context.father)} · Majka: ${esc(context.mother)}</span>`:''}<span class="search-result-meta">Šifra ${esc(result.node.code)}${result.type==='detail'?' · <span class="search-result-note">pojam se spominje u opisu</span>':''}</span></button>`;}).join('');panel.hidden=false;items.querySelectorAll('.search-result-item').forEach(button=>button.addEventListener('click',()=>{const result=activeSearchResults[Number(button.dataset.resultIndex)];if(!result)return;if(result.type==='virtual')focusVirtualPerson(result.person);else focusSearchResult(result.node);}));}
function search(){const input=document.getElementById('search'),rawQ=input.value.trim();closeSearchResults();if(!rawQ)return;const exactCode=findNode(rawQ);if(exactCode){focusSearchResult(exactCode);return;}const query=normalizeSearchText(rawQ);if(!query)return;const people=collectPersonResults(query);const virtualCount=people.filter(result=>result.type==='virtual').length;if(people.length===1&&virtualCount===0){focusSearchResult(people[0].node);return;}if(people.length){showSearchResults(people,'Pronađene osobe: '+people.length);return;}const detailsFound=collectDetailResults(query);if(detailsFound.length){showSearchResults(detailsFound,'Pojam je pronađen u opisima: '+detailsFound.length);return;}alert('Nema rezultata za: '+rawQ);}
document.getElementById("expandAll").onclick=()=>{walk(DATA,n=>n.expanded=true);render();fitTree()};
document.getElementById("collapse").onclick=()=>{walk(DATA,n=>n.expanded=false);DATA.expanded=true;render();fitTree()};
document.getElementById("threeLevels").onclick=()=>{setExpandedToDepth(3);render();fitTree()};
document.getElementById("fit").onclick=fitTree;
document.getElementById("zoomIn").onclick=()=>zoomAt(1.22,svg.clientWidth/2,svg.clientHeight/2);
document.getElementById("zoomOut").onclick=()=>zoomAt(.82,svg.clientWidth/2,svg.clientHeight/2);
document.getElementById("findBtn").onclick=search;
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")search();if(e.key==="Escape")closeSearchResults()});
document.getElementById("searchResultsClose").onclick=closeSearchResults;
document.addEventListener("click",event=>{if(!event.target.closest(".search-wrap"))closeSearchResults()});
document.getElementById("closeDetails").onclick=()=>details.classList.remove("open");

svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const rect=svg.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.12:.89,e.clientX-rect.left,e.clientY-rect.top);
},{passive:false});
svg.addEventListener("pointerdown",e=>{
  if(e.target.closest && e.target.closest(".node")) return;
  dragging=true; svg.classList.add("dragging"); svg.setPointerCapture(e.pointerId);
  dragStart={x:e.clientX,y:e.clientY,panX,panY};
});
svg.addEventListener("pointermove",e=>{
  if(!dragging) return;
  panX=dragStart.panX+(e.clientX-dragStart.x);
  panY=dragStart.panY+(e.clientY-dragStart.y);
  applyTransform();
});
svg.addEventListener("pointerup",()=>{dragging=false;svg.classList.remove("dragging")});
window.addEventListener("resize",fitTree);

setExpandedToDepth(3);
render();
requestAnimationFrame(fitTree);
</script>
</body>
</html>
