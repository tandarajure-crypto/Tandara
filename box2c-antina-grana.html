<script>
const DATA = {"code":"3.0","detail":"Ante Tandara je treći po redu sin Ivana Tandare. Ante je bio otprilike godinu dana mlađi od Petra, što se dobro uklapa u poznati redoslijed Ivanove djece. Oženio se Matijom Brnas, s kojom je imao sinove Antu, Filipa i Pavla (1777.–) te kćeri Jaku (1771.–), Lucu i Ružu. Osim zapisa o Pavlovu rođenju, nema drugih podataka o njemu, što upućuje na to da je vjerojatno umro vrlo mlad ili napustio Ričice prije nego što je ostavio trag u župnim knjigama.\n\nAntina loza ostala je čvrsto vezana uz Ričice, gdje se najjasnije razvijala tijekom 19. i 20. stoljeća. Iz ove jezgre potekao je najveći broj nositelja prezimena Tandara, pa se Antina linija smatra najrazvijenijom među Ivanovim potomcima. U kasnijim naraštajima pojedini članovi ove grane postupno su se počeli seliti – najprije u obližnja naselja, a zatim i mnogo dalje, u razne države Europske unije, kao i u Kanadu, Sjedinjene Američke Države i Australiju. Unatoč toj globalnoj raspršenosti, izvorna Antina linija ostala je čvrsto ukorijenjena u Ričicama, čuvajući kontinuitet obiteljske pripadnosti i najbogatiji pisani trag o svojim počecima.","children":[{"code":"3.1","detail":"Ante, kao najstariji sin Ante Ivanova, oženio se 1801. godine Matijom Jukić. Imali su sinove Lovru, Miju i Petra (1821.–) te kćeri Peru (1802.–), Ružu (1804.–), Anticu (1807.–), Ivu (1808.–), drugu Anticu (1814.–) i Mariju (1823.–). O Petru nema drugih podataka osim zapisa o rođenju, pa se pretpostavlja da je umro mlad ili se odselio iz Zavelima. Obiteljsku su lozu nastavili sinovi Lovro i Mijo. Mijini su nasljednici dobili nadimak Tucići, dok su Lovrini nasljednici preko sina Marijana dobili nadimak Lovrinovići, a preko sina Križana – Križanovići.\n\nPrema popisu iz 1819. godine, Ante je živio u Zavelimu, a njegov brat Filip u Ričicama. Njihovi su se potomci kasnije raselili po cijeloj Hrvatskoj, Europi, SAD-u i Kanadi.","children":[{"code":"3.1.1","detail":"Oženio se Matijom Sičenica. Imali su sinove Marijana i Križana.","children":[{"code":"3.1.1.1","detail":"Oženio se Matijom Kovač. Imali su sinove Juru (1867.–), Marka, Stipana (1873.–) i Jozu te kćeri Ivu (–1869.), Maru (1871.–1872.) i Matiju (1880.–1880.). O Stipanu nema drugih podataka osim rođenja, pa se pretpostavlja da je umro mlad ili se odselio. Marijanovi potomci, preko sinova Marka i Jure, nose nadimak Lovrinovići, nastao po Marijanovu ocu Lovri. Lovrinovići danas žive u Popovači, Sarajevu, Stobreču i Londonu.","children":[{"code":"3.1.1.1.1","detail":"Marko je oženio Božicu Pušić. Imali su sina Mirka i kćer Ivu (1897.–).","children":[{"code":"3.1.1.1.1.1","detail":"Mirko je oženio Anicu Kilić. Imali su sinove Milana i Vladimira (1948.–1962.), te kćeri Dragicu (1934.–), Mariju (1936.–) i Nediljku (1938.–). Obitelj se preselila u Popovaču.","children":[{"code":"3.1.1.1.1.1.1","detail":"Milan je oženio Svjetlanu Trifunović. Dobili su sinove Vladimira i Dalibora. Obitelj se preselila u Sarajevo.","children":[{"code":"3.1.1.1.1.1.1.1","detail":"Vladimir je oženio Claire Tacher s kojom je dobio sina Alexandera Jamesa (2010.–) i kćer Sophie Elizabeth (2008.–). Obitelj se preselila u London u Ujedinjenom Kraljevstvu.","children":[],"label":"Vladimir Milanov (★ 1969 – ✝ nepoznato)"},{"code":"3.1.1.1.1.1.1.2","detail":"Dalibor je oženio Amelu Nezirović. Dobili su sina Damira i kćer Teu. Obitelj se preselila u Sarajevo.","children":[],"label":"Dalibor Milanov (★ 1970 – ✝ nepoznato)"}],"label":"Milan Mirkov (★ 1939 – ✝ nepoznato)"}],"label":"Mirko Markov (★ 1901 – ✝ nepoznato)"}],"label":"Marko Marijanov (★ 1869 – ✝ nepoznato)"},{"code":"3.1.1.1.2","detail":"Jozo je oženio Ivu Kovač. Dobili su sinove Marijana i Luku.","children":[{"code":"3.1.1.1.2.1","detail":"Marijan je oženio Anicu Budimir. Dobili su sinove Nikolu i Jozu (1942.–1948.) te kćeri Maru (1937.–) i Zorku (1942.–).","children":[{"code":"3.1.1.1.2.1.1","detail":"Nikola je oženio Mariju Lukić. Dobili su sina Vladu te kćeri Anu (1964.–), Marijanu (1965.–) i Radmilu (1967.–). Obitelj se preselila u Stobreč.","children":[{"code":"3.1.1.1.2.1.1.1","detail":"Vlade je oženio Silvanu Ruščić. Imaju sina Franju Josipa (1995.–) i kćer Teu (2000.–). Žive u Stobreču.","children":[],"label":"Vlade Nikolin (★ 1970 – ✝ nepoznato)"}],"label":"Nikola Marijanov (★ 1939 – ✝ nepoznato)"}],"label":"Marijan Jozin (★ 1910 – ✝ 1984)"},{"code":"3.1.1.1.2.2","detail":"Luka je oženio Anđu Kovač. Dobili su kćeri Ivu (1963.–), Maru (1967.–) i Zorku (1969.–). Muških potomaka nije imao.","children":[],"label":"Luka Jozin (★ 1912 – ✝ 1987)"}],"label":"Jozo Marijanov (★ 1882 – ✝ 1944) – nadimak Trošići"}],"label":"Marijan Lovrin (★ 1836 – ✝ nepoznato)"},{"code":"3.1.1.2","detail":"Oženio je Peru Budimir, s kojom je imao 15 djece, od toga deset sinova: Matu, Iliju (1867.–1875.), Antu, Jakova (1871.–1872.), Marijana (1873.–), Paška (–1886.), Jozu (1877.–), Ivana, Juru i Grgu (1887.–) te pet kćeri: Anicu (–1869.), Jakovicu (1868.–), drugu Anicu (1875.–1877.), Jozu (–1895.) i treću Anicu (1879.–). Sedmero Križanove djece umrlo je prije desete godine. Zanimljiv je podatak da je njegov drugi sin Ilija poginuo od uboda bika 1875. godine. Potomci Križana, preko sinova Mate, Ante, Ivana i Jure, nose nadimak Križanovići i žive u Zagrebu, Đakovu, Kutjevu, Bektežu, Strizivojni, Vrpolju i u nekoliko europskih država.","children":[{"code":"3.1.1.2.1","detail":"Križanov najstariji sin Mate oženio je Ivu Pirić. Imali su sinove Miju (1894.–1923.), Marijana i Jozu, te kćeri Maru (1938.–) i Matiju (1898.–1906.). Mijo se nikada nije oženio. Obitelj se preselila u Bektež kraj Kutjeva.","children":[{"code":"3.1.1.2.1.1","detail":"Marijan je oženio Anicu Maras. Dobili su sinove Antu, Jozu (1941.–2002.), Matu i Ivana te kćer Maru (1938.–). Jozo se nije ženio. Obitelj živi u Bektežu kraj Kutjeva.","children":[{"code":"3.1.1.2.1.1.1","detail":"Ante Marijanov je imao dva braka. U prvom braku s Elizabetom Miletić imao je sina Darka (1958.–) i kćer Gordanu (1960.–). U drugom braku s Anom Kajtar nije imao djece. Obitelj se preselila u Strizivojnu.","children":[{"code":"3.1.1.2.1.1.1.1","detail":"Darko Antin imao je dva braka. U prvom braku s Angelom ima sinove Marija (1982.–) i Markusa (1987.–). U drugom braku sa Suzanom ima sina Klausa Antu (2006.–). Darko sa svojom obitelji živi u Njemačkoj.","children":[],"label":"Darko Antin (★ 1958 – ✝ nepoznato)"}],"label":"Ante Marijanov (★ 1934 – ✝ nepoznato)"},{"code":"3.1.1.2.1.1.2","detail":"U braku s Anicom Bogdanović dobio je sina Alena (1969.–) i kćer Lauru (1976.–). Obitelj se preselila u Strizivojnu.","children":[{"code":"3.1.1.2.1.1.2.1","detail":"Alen je oženio Melitu Pjela, s kojom je dobio sina Marina (1993.–) i kćer Enu (1996.–). Obitelj živi u Strizivojni.","children":[],"label":"Alen Matin (★ 1969 – ✝ nepoznato)"}],"label":"Mato Marijanov (★ 1945 – ✝ nepoznato)"},{"code":"3.1.1.2.1.1.3","detail":"Marijanov četvrti sin Ivan oženio je Ljiljanu Cobović. Dobili su sina Marijana (1987.–) te kćeri Lanu (1982.–) i Paulinu (1987.–). Žive u Đakovu, gdje Ivan vodi vlastiti odvjetnički ured.","children":[],"label":"Ivan Marijanov (★ 1953 – ✝ nepoznato)"}],"label":"Marijan Matin (★ 1902 – ✝ 1974)"},{"code":"3.1.1.2.1.2","detail":"Najmlađi sin Mate i Ive Pirić oženio je Jaku Kilić. Dobili su sinove Miju, Jozu i Ivana (1945.–) te kćer Maru (1938.–). Ivan se nije ženio. Jozo Matin poginuo je u Drugom svjetskom ratu. Mijina obitelj danas živi u Bektežu kraj Kutjeva, a Jozina obitelj u Velenju u Sloveniji.","children":[{"code":"3.1.1.2.1.2.1","detail":"Mijo je oženio Zoricu, s kojom ima tri kćeri: Marijanu, Nikolinu i treću kćer čije ime nije poznato. Obitelj živi u Bektežu kraj Kutjeva i bavi se proizvodnjom vina. Riječ je o poznatoj vinarskoj obitelji s istoimenim vinskim brendom Tandara.","children":[],"label":"Mijo Jozin (★ 1940 – ✝ nepoznato)"},{"code":"3.1.1.2.1.2.2","detail":"Jozo i supruga nepoznatog imena dobili su sina Marijana i kćer Romanu. Obitelj se preselila u Velenje u Sloveniji.","children":[{"code":"3.1.1.2.1.2.2.1","detail":"Marijan Jozin i supruga Marinela imaju sina Martina te kćeri Tamaru i Petriciju. Obitelj živi u Velenju u Sloveniji.","children":[],"label":"Marijan Jozin"}],"label":"Jozo Jozin (★ 1943 – ✝ nepoznato)"}],"label":"Jozo Matin (★ 1904 – ✝ 1944)"}],"label":"Mate Križanov (★ 1866 – ✝ 1948)"},{"code":"3.1.1.2.2","detail":"Treći sin Križana Lovrina, Ante, oženio se Ivom Trogrlić. Imali su sina Stipana (1898.–) te kćeri Jelu i Maru. Stipan se 1915. godine odselio u Srbiju. Nije poznato je li imao potomke niti što se s njim kasnije dogodilo.","children":[],"label":"Ante Križanov (★ 1870 – ✝ 1945)"},{"code":"3.1.1.2.3","detail":"Ivan je bio osmi Križanov sin. Oženio je Ružu Serdarušić s kojom je imao sinove Antu (1911.–1916.), Križana i Marijana (1914.–1916.), koji je umro kao dijete, te kćeri Maru (1909.–) i Anu.","children":[{"code":"3.1.1.2.3.1","detail":"U braku s Maricom Pušić imao je sina Ivana. Križan je poginuo u Zagrebu 1944. godine. Obitelj živi u Vrpolju.","children":[{"code":"3.1.1.2.3.1.1","detail":"Ivan Križanov se dvaput ženio. Iz prvog braka s Dragicom Dragun dobio je sina Križana (1956.–). U drugom braku s Ankom Nikolić ima kćeri Biljanu (1963.–) i Belinu (1969.–).","children":[{"code":"3.1.1.2.3.1.1.1","detail":"Križan i supruga Ljerka Maričić dobili su sinove Tonija (1979.–) i Dinka (1983.–). Obitelj živi u Vrpolju.","children":[{"code":"3.1.1.2.3.1.1.1.1","detail":"Toni i supruga Nada Jergović dobili su kćeri Veroniku i Magdalenu te sina Filipa. Obitelj živi u Vrpolju.","children":[],"label":"Toni Križanov (★ 1979 – ✝ nepoznato)"}],"label":"Križan Ivanov (★ 1956 – ✝ nepoznato)"}],"label":"Ivan Križanov (★ 1938 – ✝ 2007)"}],"label":"Križan Ivanov (★ 1916 – ✝ 1944)"}],"label":"Ivan Križanov (★ 1881 – ✝ 1920)"},{"code":"3.1.1.2.4","detail":"Bio je deveti sin Križana Lovrina i ženio se tri puta. Bio je rekorder po broju brakova među Tandarama.\n\nU prvom braku bio je oženjen Perom Matišić, koja je bila iz kuće poznate hrvatske glazbene obitelji Matišić. Iz tog braka dobio je sina Josipa. Pera je umrla 1919. godine od španjolske gripe, koju su u narodu nazivali „grla”. Drugi je brak bio s djevojkom iz obitelji Budić. Imali su sina Martina, koji je poginuo 1942. godine kod Bihaća. Treći brak bio je s Jozom Dragun, bez djece.","children":[{"code":"3.1.1.2.4.1","detail":"Josip je bio u braku s Anicom, rođ. Dragun, s kojom je imao sinove Ivana i Milana te kćeri Slavu (1935.–1977.), Maru (1936.–2012.), Nedu (1939.–2025.) i Matiju (1940.–). Obitelj je živjela u Zavelimu, gdje je Josip bio poznat kao vrijedan i pošten čovjek, duboko vezan uz svoj kraj i zajednicu.\n\nGodine 1946. Josip je tragično izgubio život u okolnostima koje su još desetljećima poslije ostale prikrivene velom tajne. Ubijen je iznad zadruge u Zavelimu, a prema naknadno otkrivenim svjedočenjima, zločin je počinio brat njihova prvog susjeda, koji je bio organizator zločina i djelovao iz osobne koristi.\n\nTakođer treba istaknuti da je organizator zločina nakon toga tragičnog događaja na različite načine pomagao Josipovoj obitelji, vjerojatno pokušavajući iskupiti se za počinjeno nedjelo. Budući da je moj pokojni otac Ivan osobno primao njegovu pomoć, sve do svoje smrti nije mogao prihvatiti činjenicu da je upravo njegov prvi susjed organizirao ubojstvo njegova oca, mojega djeda Josipa, niti je mogao povjerovati svjedočenju očevica toga događaja.\n\nNakon rata proširila se priča da su Josipa ubili kamišari u povlačenju, pa je u razdoblju bivše države bio prikazivan kao žrtva ustaša. Na temelju te verzije podignut mu je i spomenik u mjestu, dok njegova supruga Anica nikada nije ostvarila pripadajuću odštetu.\n\nTek nešto više od trideset godina poslije očevidac je, neposredno prije svoje smrti, otkrio stvarne okolnosti događaja i identitet počinitelja. Prema njegovu svjedočenju, izvršitelj ubojstva poginuo je 1963. godine u Njemačkoj, dok je organizator preminuo 1990. godine nakon duge i teške bolesti.\n\nUnatoč svemu, nikada nije pokrenuta istraga niti je provedeno sudsko procesuiranje, pa je ova tragedija ostala bez pravnih sankcija.\n\nVažno je istaknuti da današnje generacije obiju obitelji žive u potpuno drukčijem vremenu i okolnostima. Između naše obitelji i potomaka počinitelja zločina nema nikakve zle krvi. Naprotiv, njegujemo dobre i prijateljske odnose, bez tereta prošlosti te bez osjećaja krivnje ili odgovornosti za postupke naših davno preminulih predaka.\n\nOvaj zapis služi isključivo kao povijesna bilješka u rodoslovlju, uz poštovanje prema istini te prema svim osobama i nasljednicima obiteljskih loza koji danas žive.","children":[{"code":"3.1.1.2.4.1.1","detail":"Dvaput se ženio. Iz prvog braka s Matijom Pušić dobio je sinove Juru i Vladimira te kćer Mihaelu (krštenu kao Milena). Iz drugog braka s Verkom Nikolovski nije imao djece. Obitelj živi u Zagrebu.","children":[{"code":"3.1.1.2.4.1.1.1","detail":"Jure i Ruža Kosić dobili su sinove Ivicu Julija i Marina Tina. Obitelj živi u Zagrebu.","children":[{"code":"3.1.1.2.4.1.1.1.1","detail":"Ivica Julio oženio je Anu Mikuš, s kojom je dobio sina Viga (2015.–) i kćer Kaiju (2018.–).","children":[],"label":"Ivica Julio Jurin (★ 1981 – ✝ nepoznato)"},{"code":"3.1.1.2.4.1.1.1.2","detail":"Marin Tin oženio je Ivanu Keretu, s kojom je dobio sinove Davida (2017.–) i Jakova (2019.–) te kćer Lauru (2023.–).","children":[],"label":"Marin Tin Jurin (★ 1983 – ✝ nepoznato)"}],"label":"Jure Ivanov (★ 1956 – ✝ nepoznato)"},{"code":"3.1.1.2.4.1.1.2","detail":"Vladimir je oženio Ljubicu Kosić s kojom ima sinove Filipa i Lea. Obitelj živi u Münchenu. Filip živi u Berlinu, a Leo u Beču.","children":[],"label":"Vladimir Ivanov (★ 1964 – ✝ nepoznato)"}],"label":"Ivan Josipov (★ 1933 – ✝ 2025)"},{"code":"3.1.1.2.4.1.2","detail":"Milan je oženio Slavu Budimir i s njom je dobio sinove Jozu i Ivana te kćeri Mariju (1965.–), Anku (1970.–) i Marinu (1973.–). Obitelj živi u Posušju. Ivan živi u Bielefeldu u Njemačkoj.","children":[{"code":"3.1.1.2.4.1.2.1","detail":"Jozo je oženio Vesnu Matić s kojom ima sina Martina te kćeri Slavicu (1997.–) i Mateu.","children":[{"code":"3.1.1.2.4.1.2.1.1","detail":"Matea Jozina dobila je sina Tomu. Toma je preuzeo naše prezime Tandara. To je prvi slučaj u obitelji Tandara da je kćer nastavila očevu lozu. Obitelj živi u Posušju.","children":[],"label":"Matea Jozina (★ 1999 – ✝ nepoznato)"}],"label":"Jozo Milanov (★ 1967 – ✝ nepoznato)"},{"code":"3.1.1.2.4.1.2.2","detail":"Ivan je oženjen Ružicom Glavaš i s njom ima sinove Davida i Milana (2003.–) te kćer Nataliju (2000.–). Obitelj živi u Bielefeldu u Njemačkoj.","children":[{"code":"3.1.1.2.4.1.2.2.1","detail":"David je oženjen Lizom Wormann i s njom ima kćer Ivanu. Obitelj živi u Bielefeldu u Njemačkoj.","children":[],"label":"David Ivanov (★ 1995 – ✝ nepoznato)"}],"label":"Ivan Milanov (★ 1974 – ✝ nepoznato)"}],"label":"Milan Josipov (★ 1942 – ✝ 2003)"},{"code":"3.1.1.2.4.1.3","detail":"Matija, zvana Maca, kći je Josipa Jurina Tandare i Anice rođ. Dragun. Udala se za Antu Budimira, s kojim je dobila sinove Jozu, Ivicu, Mirka i Marija. Obitelj živi u Splitu.","children":[],"label":"Matija (Maca) Josipova Tandara, udana Budimir (★ 1940 – ✝ nepoznato)"}],"label":"Josip Jurin (★ 1911 – ✝ 1946)"}],"label":"Jure Križanov (★ 1883 – ✝ 1947) – nadimak ĐULKO"}],"label":"Križan Lovrin (★ 1843 – ✝ 1910)"}],"label":"Lovro Antin (★ 1811 – ✝ 1903)"},{"code":"3.1.2","detail":"Mijo, drugi Antin sin, oženio je Mandu Martinović. Imali su devetero djece: sinove Jozu, Antu (1852.–), Matu, Miju (1865.–) i Petra te kćeri Ivu (1856.–), Matiju (1858.–), Ružu (1859.–) i Anticu (1861.–).\n\nO sinu Miji nema drugih podataka osim rođenja. Pretpostavlja se da je umro mlad ili se odselio u nepoznatom smjeru. Potomci preko sinova Joze, Mate i Petra nose nadimak Tucići, koji je nastao jer su članovi obitelji bili skloni ljubavnim avanturama.","children":[{"code":"3.1.2.1","detail":"Jozo se oženio Ivom Bilojelić. Imali su sedmero djece: sinove Antu, Jozu function collectResults(rawQuery){const results=[];walk(DATA,node=>{const context=PERSON_SEARCH_CONTEXT[node.code]||{},aliases=(PERSON_SEARCH_ALIASES[node.code]||[]).join(' '),primary=node.code+' '+node.label,personContext=[context.father,context.mother,aliases].join(' '),primaryScore=score(rawQuery,primary,personContext);if(Number.isFinite(primaryScore)){results.push({type:'node',node,hostCode:node.code,score:primaryScore,matchKind:'person'});}else{const detailScore=fuzzyFieldScore(rawQuery,node.detail||'');if(Number.isFinite(detailScore)&&detailScore<=1.35)results.push({type:'node',node,hostCode:node.code,score:detailScore+7,matchKind:'detail'});}});VIRTUAL_PEOPLE.forEach((person,index)=>{const primary=[person.label,person.name,person.rawName,person.qualifier].join(' '),secondary=[person.father,person.mother,person.gender,person.hostCode].join(' '),value=score(rawQuery,primary,secondary);if(Number.isFinite(value))results.push({type:'virtual',person,index,hostCode:person.hostCode,score:value+.35,matchKind:'person'});});Object.entries(FAMILY_META).forEach(([hostCode,families])=>families.forEach((family,index)=>{const node=findNode(hostCode),value=score(rawQuery,family.spouse,[node?.label,family.sons.join(' '),family.daughters.join(' ')].join(' '));if(Number.isFinite(value))results.push({type:'spouse',family,index,node,hostCode,score:value+.45,matchKind:'spouse'});}));const strongVirtualHosts=new Set(results.filter(result=>result.type==='virtual'&&result.score<=4).map(result=>result.hostCode));const filtered=results.filter(result=>!(result.type==='node'&&result.matchKind==='detail'&&strongVirtualHosts.has(result.hostCode)));const unique=new Map();for(const result of filtered){const label=result.type==='virtual'?result.person?.label:result.type==='spouse'?result.family?.spouse:result.node?.label;const key=[result.type,result.hostCode,normalize(label)].join('|');const previous=unique.get(key);if(!previous||result.score<previous.score)unique.set(key,result);}const order document.getElementById('searchResultsClose').onclick=()=>{closeSearchResults();searchInput.focus();};
window.addEventListener('resize',positionSearchResults);document.addEventListener('scroll',positionSearchResults,true);document.querySelector('.toolbar-scroll')?.addEventListener('scroll',positionSearchResults,{passive:true});
document.addEventListener('click',event=>{if(!event.target.closest('.search-wrap'))closeSearchResults();});
document.getElementById('closeDetails').onclick=()=>{details.classList.remove('open');announce('Detalji su zatvoreni.');};
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeSearchResults();details.classList.remove('open');}});
svg.addEventListener('wheel',event=>{event.preventDefault();const rect=svg.getBoundingClientRect();zoomAt(event.deltaY<0?1.12:.89,event.clientX-rect.left,event.clientY-rect.top);},{passive:false});
function pointerPoint(event){const rect=svg.getBoundingClientRect();return{x:event.clientX-rect.left,y:event.clientY-rect.top};}
svg.addEventListener('pointerdown',event=>{if(event.target.closest?.('.node,.family-action'))return;svg.setPointerCapture(event.pointerId);pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,panX,panY};svg.classList.add('dragging');}else if(pointers.size===2){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y);pinchStart={distance,scale,panX,panY,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};dragStart=null;}});
svg.addEventListener('pointermove',event=>{if(!pointers.has(event.pointerId))return;pointers.set(event.pointerId,pointerPoint(event));if(pointers.size===1&&dragStart){const p=[...pointers.values()][0];panX=dragStart.panX+(p.x-dragStart.x);panY=dragStart.panY+(p.y-dragStart.y);applyTransform();}else if(pointers.size===2&&pinchStart){const [a,b]=[...pointers.values()],distance=Math.hypot(b.x-a.x,b.y-a.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,newScale=Math.max(.12,Math.min(3.5,pinchStart.scale*(distance/pinchStart.distance))),ratio=newScale/pinchStart.scale;scale=newScale;panX=cx-(pinchStart.cx-pinchStart.panX)*ratio;panY=cy-(pinchStart.cy-pinchStart.panY)*ratio;applyTransform();}});
function endPointer(event){pointers.delete(event.pointerId);if(pointers.size<2)pinchStart=null;if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,panX,panY};}else if(!pointers.size){dragStart=null;svg.classList.remove('dragging');}}
svg.addEventListener('pointerup',endPointer);svg.addEventListener('pointercancel',endPointer);
function expandEmbeddedDiagramArea(){
 if(window.self===window.top)return;
 try{
  const frame=window.frameElement,parentDoc=window.parent.document,parentWin=window.parent;
  if(!frame)return;
  const layout=parentDoc.querySelector('.layout');
  const contentPage=frame.closest('.content-page')||parentDoc.querySelector('.content-page');
  const card=frame.closest('.content-card')||parentDoc.querySelector('.content-card');
  const wrap=frame.parentElement;
  if(layout){layout.style.maxWidth='none';layout.style.width='100%';layout.style.margin='0';layout.style.gap='0';layout.style.padding='0';}
  if(contentPage){contentPage.style.width='100%';contentPage.style.maxWidth='none';contentPage.style.minWidth='0';contentPage.style.padding='0';contentPage.style.justifyContent='stretch';}
  let leftPad=0,rightPad=0;
  if(card){
   const cardStyle=parentWin.getComputedStyle(card);
   leftPad=parseFloat(cardStyle.paddingLeft)||0;rightPad=parseFloat(cardStyle.paddingRight)||0;
   card.style.width='100%';card.style.maxWidth='none';card.style.margin='0';card.style.borderRadius='0';
  }
  if(wrap){wrap.style.maxWidth='none';wrap.style.width=`calc(100% + ${leftPad+rightPad}px)`;wrap.style.marginLeft=`-${leftPad}px`;wrap.style.marginRight=`-${rightPad}px`;wrap.style.marginTop='30px';wrap.style.marginBottom='0';}
  frame.style.display='block';frame.style.width='100%';frame.style.maxWidth='none';frame.style.margin='0';frame.style.borderLeft='0';frame.style.borderRight='0';frame.style.borderRadius='0';
 }catch(error){/* Samostalni prikaz ostaje potpuno funkcionalan. */}
}
function syncHeaderHeight(){const header=document.querySelector('header');if(header)document.documentElement.style.setProperty('--header-height',header.offsetHeight+'px');}
window.addEventListener('resize',()=>{syncHeaderHeight();expandEmbeddedDiagramArea();requestAnimationFrame(fitTree);});
expandEmbeddedDiagramArea();syncHeaderHeight();setExpandedToDepth(3);render();requestAnimationFrame(fitTree);
</script>
