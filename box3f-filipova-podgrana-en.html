<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filip’s sub-branch</title>
<style>
:root{
  --green:#174f39; --paper:#fbfaf6; --ink:#22302a; --muted:#68736d;
  --blue-bg:#e8f2fb; --blue-line:#4d82aa; --orange-bg:#fff1df; --orange-line:#bb8144;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--paper)}
body{overflow:hidden}
header{
  height:92px;display:flex;align-items:center;gap:22px;padding:12px 18px;
  background:#fff;border-bottom:1px solid #dcded9;box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.title-wrap{min-width:285px}
h1{font-size:23px;margin:0 0 4px;color:var(--green)}
.subtitle{font-size:13px;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
button,input{
  border:1px solid #c9cec9;border-radius:8px;background:#fff;color:#26342e;
  padding:8px 10px;font-size:13px;
}
button{cursor:pointer}
button:hover{background:#f0f4f1}
button.primary{background:var(--green);color:#fff;border-color:var(--green)}
.search-wrap{display:flex;gap:6px}
#search{width:240px}
#workspace{position:relative;height:calc(100% - 92px);overflow:hidden}
#treeSvg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#treeSvg.dragging{cursor:grabbing}
.connector{fill:none;stroke:#a9ada8;stroke-width:2}
.node rect{stroke-width:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.07))}
.node text{pointer-events:none}
.node .code{font-size:12px;font-weight:700;letter-spacing:.4px}
.node .label{font-size:14px;font-weight:600}
.node .hint{font-size:12px}
.node{cursor:pointer}
.node:hover rect{stroke-width:3}
.node.selected rect{stroke:#c63030!important;stroke-width:4}
.node.match rect{stroke:#be8b00!important;stroke-width:4}
#details{
  position:absolute;right:14px;top:14px;width:min(390px,calc(100% - 28px));max-height:calc(100% - 28px);
  overflow:auto;background:rgba(255,255,255,.97);border:1px solid #d3d7d2;border-radius:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.16);padding:16px;display:none
}
#details.open{display:block}
#details h2{font-size:17px;margin:0 32px 3px 0;color:var(--green)}
#details .detail-code{font-size:12px;font-weight:700;color:#6c756f;margin-bottom:12px}
#details p{font-size:14px;line-height:1.5;white-space:pre-line;margin:0}
#closeDetails{position:absolute;right:10px;top:9px;border:0;background:transparent;font-size:20px;padding:3px 7px}
.legend{
  position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.94);border:1px solid #d3d7d2;
  border-radius:10px;padding:9px 12px;font-size:12px;display:flex;gap:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)
}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:14px;height:14px;border-radius:4px;border:2px solid}
.help{position:absolute;right:15px;bottom:12px;color:#6d756f;font-size:12px;background:rgba(251,250,246,.9);padding:4px 7px;border-radius:6px}
@media(max-width:900px){
  header{height:142px;align-items:flex-start;flex-direction:column;gap:8px}
  #workspace{height:calc(100% - 142px)}
  .title-wrap{min-width:0}
  #search{width:185px}
  .legend{display:none}
}
@media print{
  header,#details,.legend,.help{display:none!important}
  body{overflow:visible}
  #workspace{height:auto}
  #treeSvg{width:100%;height:auto}
}

#zoomIn,#zoomOut{display:none!important}
</style>
</head>
<body>
<header>
  <div class="title-wrap">
    <h1>Filip’s sub-branch</h1>
    <div class="subtitle"><strong>42</strong> numbered people · <strong>8</strong> generations · click a person to open details</div>
  </div>
  <div class="toolbar">
    <button class="primary" id="expandAll">Expand</button>
    <button id="collapse">Collapse</button>
    <button id="threeLevels">Up to 3 generations</button>
    <button id="fit">Fit</button>
    <button id="zoomIn">＋</button>
    <button id="zoomOut">−</button>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Name or code">
      <button id="findBtn">Find</button>
    </div>
  </div>
</header>

<div id="workspace">
  <svg id="treeSvg" aria-label="Interactive family tree of Filip’s sub-branch">
    <g id="viewport">
      <g id="links"></g>
      <g id="nodes"></g>
    </g>
  </svg>

  <aside id="details">
    <button id="closeDetails" aria-label="Close">×</button>
    <h2 id="detailTitle"></h2>
    <div class="detail-code" id="detailCode"></div>
    <p id="detailText"></p>
  </aside>

  <div class="legend"><span><i class="swatch" style="background:#174f39;border-color:#0d3425"></i>Filip, son of Ante</span><span><i class="swatch" style="background:#dfeee7;border-color:#174f39"></i>Martin, son of Filip</span><span><i class="swatch" style="background:#e8f2fb;border-color:#4d82aa"></i>Jerko’s line</span><span><i class="swatch" style="background:#fff1df;border-color:#bb8144"></i>Ilija’s line</span></div>
  <div class="help">Mouse wheel: zoom · drag: move · click a node: details and branching</div>
</div>

<script>
const DATA = {"code":"3.2","label":"Filip, son of Ante","detail":"Filip was the second son of Ante, son of Ivan. Unlike his brother Ante, Filip remained and continued his life in Ričice. He was married to Matija Parlov, with whom he had sons Martin, Mate and Ivan, and daughters Joza, Jela, Jurka, Antica and Ruža. Only birth records are known for Ivan and Mate, so it is assumed that they died young or moved away from Ričice.","children":[{"code":"3.2.1","label":"Martin, son of Filip (1811.–)","detail":"Martin was married to Manda Manenica, with whom he had sons Jerko, Ilija, Ivan, Martin and another son also named Ivan, and daughters Tomica, Lucija, another Lucija and Iva. The line was continued only by the sons Jerko and Ilija.","children":[{"code":"3.2.1.1","label":"Jerko, son of Martin (1811.–)","detail":"Jerko was married to Iva Topalušić, with whom he had sons Martin, Luka and Ivan. Luka died after birth.","children":[{"code":"3.2.1.1.1","label":"Martin, son of Jerko (1865.–)","detail":"Martin was married to Iva Kovač, with whom he had daughters Matija, Mara and Iva.","children":[]},{"code":"3.2.1.1.2","label":"Ivan, son of Jerko (1872.–)","detail":"Ivan was married to Jaka Martinović, with whom he had sons Mate and Martin, and daughters Ana, Tomica and another daughter also named Tomica, after the first daughter Tomica died during her second year of life. It was common for parents to give a later child of the same sex the same name as a child who had died.","children":[{"code":"3.2.1.1.2.1","label":"Mate, son of Ivan (1898.–) – nickname Pikići","detail":"Mate was married to Matija Lažeta, with whom he had sons Nikola, Mirko and Marijan, and daughters Milica and Dragica. The family moved to Split.","children":[{"code":"3.2.1.1.2.1.1","label":"Nikola, son of Mate (1927.–1990.)","detail":"Nikola was married to Matija Kilić, with whom he had sons Damir and Željko, and daughters Vera and Marija. The family lives in Split.","children":[{"code":"3.2.1.1.2.1.1.1","label":"Damir, son of Nikola (1960.–)","detail":"Damir married twice. From his first marriage to Marina Čelan, he has a son, Tin (1981–), who lives in Germany. From his second marriage to Lucija Modrić, he has a son, Leo (2003–), and daughters Žana and Doris. The family lives in Split.","children":[]},{"code":"3.2.1.1.2.1.1.2","label":"Željko, son of Nikola (1963.–)","detail":"Željko is married to Anita Košćak, with whom he has sons Nikola (1992–) and Marko (1996–). They live in Split.","children":[]}]},{"code":"3.2.1.1.2.1.2","label":"Mirko, son of Mate (1932.–2005.)","detail":"Mirko was married to Anđelka Dragica Mršić, with whom he had sons Nedjeljko, Zdravko and Miroslav. The family lives in Split.","children":[{"code":"3.2.1.1.2.1.2.1","label":"Nedjeljko, son of Mirko (1957.–)","detail":"Nedjeljko is married to Danica Jaginović, with whom he has sons Mirko (1991–), Ivan (1996–) and Križan (2003–). The family lives in Split.","children":[]},{"code":"3.2.1.1.2.1.2.2","label":"Zdravko, son of Mirko (1960.–)","detail":"Zdravko is married to Dubravka Brajković, with whom he has sons Ante (1993–) and Vedran (1995–). The family lives in Split.","children":[]},{"code":"3.2.1.1.2.1.2.3","label":"Miroslav, son of Mirko (1963.–)","detail":"Miroslav is married to Ružica Krajinović, with whom he has a son, Josip (1995–), and daughters Ines and Ana. The family lives in Split.","children":[]}]},{"code":"3.2.1.1.2.1.3","label":"Marijan, son of Mate (1936.–)","detail":"Marijan married Mara Tandara, with whom he has a son, Mate, and a daughter, Snježana. The family lives in Split.","children":[{"code":"3.2.1.1.2.1.3.1","label":"Mate, son of Marijan (1961.–)","detail":"Mate married Zdravka Guć, with whom he had sons Marijan (1985–), Ivan (1987–) and Ante (1998–). The family lives in Split.","children":[]}]}]},{"code":"3.2.1.1.2.2","label":"Martin, son of Ivan (1904.–)","detail":"Martin was married to Anica Lekić, with whom he had sons Ivan, Jerko and Marijan, and daughters Mara and Matija. Marijan died during his third year of life. The family moved to Bjelovar.","children":[{"code":"3.2.1.1.2.2.1","label":"Ivan, son of Martin (1932.–1996.)","detail":"Ivan was married to Ana Radmanić, with whom he had a son, Darko. The family lives in Bjelovar.","children":[{"code":"3.2.1.1.2.2.1.1","label":"Darko, son of Ivan (1955.–)","detail":"Darko married Dragica Sabolović, with whom he had a son, Ivan (1983–), and a daughter, Monika. The family lives in Bjelovar.","children":[]}]},{"code":"3.2.1.1.2.2.2","label":"Jerko, son of Martin (1935.-)","detail":"Jerko married Ružica Seketić, with whom he had a son, Renato. The family lives in Borovo Naselje.","children":[{"code":"3.2.1.1.2.2.2.1","label":"Renato, son of Jerko (1964.-)","detail":"Renato married Tanja Lancoš, with whom he has a daughter, Lea. The family moved to Zagreb.","children":[]}]}]}]}]},{"code":"3.2.1.2","label":"Ilija, son of Martin (1843.-)","detail":"Ilija was married to Luca Tavra, with whom he had sons Mate, Ivan and Šimun, and daughters Tomica, another Tomica, Iva and Mara. Ivan died at the age of six, and Šimun died after birth.","children":[{"code":"3.2.1.2.1","label":"Mate, son of Ilija (1875.-) – nickname Rumići","detail":"Mate was married to Mara Topalušić, with whom he had sons Ivan, Božo, Mijo and Toma, and daughters Tomica, Mara and another Mara. Only their years of birth are known for Ivan and Božo, and it is not known whether they died young or moved away from Ričice.","children":[{"code":"3.2.1.2.1.1","label":"Mijo, son of Mate (1909.-1945.) – Rumići","detail":"Mijo was married to Joza Štrljić, with whom he had sons Vinko and Milan. The family moved to Predavac near Bjelovar.","children":[{"code":"3.2.1.2.1.1.1","label":"Vinko, son of Mijo (1932.-)","detail":"Vinko married twice. In his first marriage to Krsta Mršić, he had sons Mijo, Ante, Milan, Zdravko and Vinko. He had no children from his second marriage to Matija Sičenica. The family lives in Predavac near Bjelovar.","children":[{"code":"3.2.1.2.1.1.1.1","label":"Mijo, son of Vinko (1952.-)","detail":"Mijo married Jela Krezo, with whom he has sons Ivica and Zoran. Zoran never married. Mijo and his family live in Germany.","children":[{"code":"3.2.1.2.1.1.1.1.1","label":"Ivica, son of Mijo (1975.-)","detail":"Ivica married Vesna Belan, with whom he has a son, Luka (2002–), and a daughter, Mija. The family lives in Germany.","children":[]}]},{"code":"3.2.1.2.1.1.1.2","label":"Ante, son of Vinko (1954.-)","detail":"Ante married Vesna Topalušić, with whom he has daughters Kristina, Marina and Nikolina. He has no male descendants. The family lives in Germany.","children":[]},{"code":"3.2.1.2.1.1.1.3","label":"Milan, son of Vinko (1957.-)","detail":"Milan married Nediljka Matešić, with whom he has sons Kristijan (1985–), Antonio (1987–) and Dino (1991–), and a daughter, Valentina. The family lives in Predavac.","children":[]},{"code":"3.2.1.2.1.1.1.4","label":"Zdravko, son of Vinko (1960.-)","detail":"Zdravko married Brigita Horvatinčić, with whom he has sons Mate (1997–) and Bruno (1999–), and daughters Anita and Petra. The family lives in Predavac.","children":[]},{"code":"3.2.1.2.1.1.1.5","label":"Vinko, son of Vinko (1961.-)","detail":"Vinko married Slavica Matišić, with whom he has a son, Mario (1984–), and a daughter, Marina. The family lives in Predavac.","children":[]}]},{"code":"3.2.1.2.1.1.2","label":"Milan, son of Mijo (1935.-)","detail":"Milan married Iva Lukić, with whom he has sons Željko and Dragan, and daughters Rosa and Dragica. The family lives in Predavac.","children":[{"code":"3.2.1.2.1.1.2.1","label":"Željko, son of Milan (1962.-)","detail":"Željko married Slađana, whose surname is unknown, and they have a son, Ivan, whose year of birth is unknown. The family lives in Predavac.","children":[]},{"code":"3.2.1.2.1.1.2.2","label":"Dragan, son of Milan (1965.-)","detail":"Dragan married Zvijezdana, whose surname is unknown, and they have a son, Goran, and daughters Iva and Daniela. The family lives in Predavac.","children":[{"code":"3.2.1.2.1.1.2.2.1","label":"Goran, son of Dragan (year of birth unknown)","detail":"Goran has a son, Tin. Other information is missing. Anyone who can provide the missing information is kindly asked to contact me through the contact form.","children":[]}]}]}]},{"code":"3.2.1.2.1.2","label":"Toma, son of Mate (1909.-1945.) – nickname Rumići","detail":"Toma was married to Tomica Tandara, with whom he had sons Petar, Marijan, Slavko, Ante and Mate, and daughters Mila, Dragica, Ana and Nevenka. Marijan never married.","children":[{"code":"3.2.1.2.1.2.1","label":"Petar, son of Toma (1925.-1985.)","detail":"Petar was married to Kata Novosel, with whom he had a son, Ivica.","children":[{"code":"3.2.1.2.1.2.1.1","label":"Ivica, son of Petar (1952.-)","detail":"Ivica married Ljubica Kozić, with whom he has a son, Hrvoje (1983–), and a daughter, Sabina Tandara Knezović. Sabina is a well-known television journalist who works for Nova TV. The family lives in Zagreb.","children":[]}]},{"code":"3.2.1.2.1.2.2","label":"Slavko, son of Toma (1930.-2006.)","detail":"Slavko was married to Savka Vukobratović, with whom he had a son, Marko (1981–). Marko never married. The family lives in Zagreb.","children":[]},{"code":"3.2.1.2.1.2.3","label":"Ante, son of Toma (1942.-2011.)","detail":"Ante was married to Zlata Vučemil, with whom he had a son, Draženko. The family lives in Sredice near Bjelovar.","children":[{"code":"3.2.1.2.1.2.3.1","label":"Draženko, son of Ante (1967.-)","detail":"Draženko married Neda Medić, with whom he has a son, Luka (1998–), and daughters Maja and Matea. The family lives in Sredice near Bjelovar.","children":[]}]},{"code":"3.2.1.2.1.2.4","label":"Mate, son of Toma (1944.-2007.)","detail":"Mate was married to Tonka Vukičević, with whom he had a son, Željko. The family lives in Zagreb.","children":[{"code":"3.2.1.2.1.2.4.1","label":"Željko, son of Mate (1953.-)","detail":"Željko married Ankica Šitum, with whom he has sons Mario and Ivan Vanja. Željko and his family live in Canada.\n\nAlongside this textual section, there is also a graphic section that opens by clicking the clickable rectangles in the diagram on the right-hand side of the home page.","children":[]}]}]}]}]}]}]};
const svg = document.getElementById("treeSvg");
const viewport = document.getElementById("viewport");
const linksLayer = document.getElementById("links");
const nodesLayer = document.getElementById("nodes");
const details = document.getElementById("details");

const BOX_W = 286, BOX_H = 60, X_STEP = 315, ROW_STEP = 76, MARGIN = 46;
let scale = 1, panX = 20, panY = 20, selectedCode = null, matchCode = null;
let dragging = false, dragStart = null;
let bounds = {width:1000,height:800};

function walk(node, callback, parent=null, depth=0){
  callback(node,parent,depth);
  (node.children || []).forEach(child => walk(child,callback,node,depth+1));
}
function depthFromCode(code){ return code === "3.2" ? 0 : code.split(".").length - 2; }
function setExpandedToDepth(maxDepth){
  walk(DATA,(node,parent,depth)=>{ node.expanded = depth < maxDepth; });
}
function visibleNodes(){
  const result=[];
  function visit(node,parent=null,depth=0){
    result.push({node,parent,depth});
    if(node.expanded) (node.children||[]).forEach(child=>visit(child,node,depth+1));
  }
  visit(DATA);
  return result;
}
function colors(code){
  if(code==="3.2") return {fill:"#174f39",text:"#fff",stroke:"#0d3425"};
  if(code==="3.2.1") return {fill:"#dfeee7",text:"#174f39",stroke:"#174f39"};
  if(code.startsWith("3.2.1.1")) return {fill:"#e8f2fb",text:"#173a57",stroke:"#4d82aa"};
  return {fill:"#fff1df",text:"#553719",stroke:"#bb8144"};
}
function wrapText(text,max=34){
  const words=text.split(/\s+/); const lines=[]; let line="";
  for(const word of words){
    const test=(line+" "+word).trim();
    if(test.length>max && line){ lines.push(line); line=word; }
    else line=test;
  }
  if(line) lines.push(line);
  if(lines.length>2) lines[1]=lines.slice(1).join(" ").slice(0,max-1)+"…";
  return lines.slice(0,2);
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function render(){
  const visible=visibleNodes();
  const pos=new Map();
  visible.forEach((item,index)=>{
    pos.set(item.node.code,{x:MARGIN+item.depth*X_STEP,y:MARGIN+index*ROW_STEP});
  });
  const maxDepth=Math.max(...visible.map(v=>v.depth),0);
  bounds.width=MARGIN*2+maxDepth*X_STEP+BOX_W;
  bounds.height=MARGIN*2+visible.length*ROW_STEP;

  let links="";
  visible.forEach(({node,parent})=>{
    if(!parent || !pos.has(parent.code)) return;
    const p=pos.get(parent.code), c=pos.get(node.code);
    const x1=p.x+BOX_W, y1=p.y+BOX_H/2, x2=c.x, y2=c.y+BOX_H/2;
    const elbow=x1+(x2-x1)/2;
    links += `<path class="connector" d="M${x1},${y1} H${elbow} V${y2} H${x2}"/>`;
  });
  linksLayer.innerHTML=links;

  let nodeMarkup="";
  visible.forEach(({node})=>{
    const p=pos.get(node.code), color=colors(node.code), lines=wrapText(node.label);
    const hasChildren=(node.children||[]).length>0;
    const indicator=hasChildren ? (node.expanded ? "−" : "+") : "";
    const classes=["node"];
    if(node.code===selectedCode) classes.push("selected");
    if(node.code===matchCode) classes.push("match");
    nodeMarkup += `<g class="${classes.join(" ")}" data-code="${esc(node.code)}" transform="translate(${p.x},${p.y})">
      <rect width="${BOX_W}" height="${BOX_H}" rx="9" fill="${color.fill}" stroke="${color.stroke}"></rect>
      <text class="code" x="13" y="18" fill="${color.text}">${esc(node.code)}</text>
      ${lines.map((line,i)=>`<text class="label" x="13" y="${38+i*16}" fill="${color.text}">${esc(line)}</text>`).join("")}
      ${hasChildren?`<circle cx="${BOX_W-18}" cy="18" r="11" fill="rgba(255,255,255,.72)" stroke="${color.stroke}"></circle>
      <text class="hint" x="${BOX_W-18}" y="22" text-anchor="middle" fill="${color.stroke}">${indicator}</text>`:""}
    </g>`;
  });
  nodesLayer.innerHTML=nodeMarkup;

  nodesLayer.querySelectorAll(".node").forEach(group=>{
    group.addEventListener("click",event=>{
      event.stopPropagation();
      const code=group.dataset.code;
      const node=findNode(code);
      selectedCode=code;
      showDetails(node);
      if((node.children||[]).length){
        node.expanded=!node.expanded;
      }
      render();
    });
  });
  applyTransform();
}
function findNode(code){
  let result=null;
  walk(DATA,node=>{ if(node.code===code) result=node; });
  return result;
}
function showDetails(node){
  document.getElementById("detailTitle").textContent=node.label;
  document.getElementById("detailCode").textContent="Code "+node.code;
  document.getElementById("detailText").textContent=node.detail || "No additional description for this person is available in the source HTML.";
  details.classList.add("open");
}
function applyTransform(){
  viewport.setAttribute("transform",`translate(${panX},${panY}) scale(${scale})`);
}
function fitTree(){
  const rect=svg.getBoundingClientRect();
  scale=Math.min((rect.width-50)/bounds.width,(rect.height-50)/bounds.height,1.15);
  panX=(rect.width-bounds.width*scale)/2;
  panY=(rect.height-bounds.height*scale)/2;
  applyTransform();
}
function zoomAt(factor,cx,cy){
  const old=scale;
  scale=Math.max(.12,Math.min(3,scale*factor));
  panX=cx-(cx-panX)*(scale/old);
  panY=cy-(cy-panY)*(scale/old);
  applyTransform();
}
function expandAncestors(code){
  const parts=code.split(".");
  DATA.expanded=true;
  for(let i=2;i<parts.length;i++){
    const ancestor=parts.slice(0,i).join(".");
    const node=findNode(ancestor);
    if(node) node.expanded=true;
  }
}
function search(){
  const q=document.getElementById("search").value.trim().toLocaleLowerCase("en");
  if(!q) return;
  let found=null;
  walk(DATA,node=>{
    const hay=(node.code+" "+node.label+" "+node.detail).toLocaleLowerCase("en");
    if(!found && hay.includes(q)) found=node;
  });
  if(!found){ alert("No results for: "+q); return; }
  expandAncestors(found.code);
  selectedCode=found.code; matchCode=found.code;
  render(); showDetails(found);
  requestAnimationFrame(()=>{
    const target=nodesLayer.querySelector(`[data-code="${CSS.escape(found.code)}"]`);
    if(target){
      const matrix=target.getCTM(), rect=svg.getBoundingClientRect();
      const tx=matrix.e+BOX_W*scale/2, ty=matrix.f+BOX_H*scale/2;
      panX += rect.width/2-tx;
      panY += rect.height/2-ty;
      applyTransform();
    }
  });
}
document.getElementById("expandAll").onclick=()=>{walk(DATA,n=>n.expanded=true);render();fitTree()};
document.getElementById("collapse").onclick=()=>{walk(DATA,n=>n.expanded=false);DATA.expanded=true;render();fitTree()};
document.getElementById("threeLevels").onclick=()=>{setExpandedToDepth(3);render();fitTree()};
document.getElementById("fit").onclick=fitTree;
document.getElementById("zoomIn").onclick=()=>zoomAt(1.22,svg.clientWidth/2,svg.clientHeight/2);
document.getElementById("zoomOut").onclick=()=>zoomAt(.82,svg.clientWidth/2,svg.clientHeight/2);
document.getElementById("findBtn").onclick=search;
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
document.getElementById("closeDetails").onclick=()=>details.classList.remove("open");

svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const rect=svg.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.12:.89,e.clientX-rect.left,e.clientY-rect.top);
},{passive:false});
svg.addEventListener("pointerdown",e=>{
  if(e.target.closest && e.target.closest(".node")) return;
  dragging=true; svg.classList.add("dragging"); svg.setPointerCapture(e.pointerId);
  dragStart={x:e.clientX,y:e.clientY,panX,panY};
});
svg.addEventListener("pointermove",e=>{
  if(!dragging) return;
  panX=dragStart.panX+(e.clientX-dragStart.x);
  panY=dragStart.panY+(e.clientY-dragStart.y);
  applyTransform();
});
svg.addEventListener("pointerup",()=>{dragging=false;svg.classList.remove("dragging")});
window.addEventListener("resize",fitTree);

setExpandedToDepth(3);
render();
requestAnimationFrame(fitTree);
</script>
</body>
</html>
