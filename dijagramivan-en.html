"parentCodes":["3.1.1.2","3.1.1.2-SP-1"],"childCodes":["3.1.1.2.4.1","3.1.1.2.4-S1"]},{"code":"3.1.1.2.4.1","name":"Josip Jurin","qualifier":"★ 1911 – ✝ 1946","father":"Jure, son of Križan – nickname Đulko","fatherCode":"","mother":"Pera Matišić","spouses":["Anica Dragun"],"spouseCodes":["3.1.1.2.4.1-SP-1"],"relation":"surname holder in the diagram","note":"Genealogical Note on Josip and the Family Tragedy\n\nJosip was married to Anica, née Dragun, with whom he had two sons, Ivan and Milan, and four daughters, Slava (1935–1977), Mara (1936–2012), Neda (1939–2025) and Matija (1940–). The family lived in Zavelim, where Josip was known as a hardworking and honest man who was deeply attached to his home region and community.\n\nIn 1946, Josip tragically lost his life in circumstances that remained shrouded in secrecy for decades. He was killed above the cooperative building in Zavelim. According to testimony uncovered later, the crime was carried out by the brother of their immediate neighbour, while the neighbour himself organised the crime and acted for personal gain.\n\nIt should also be noted that, after this tragic event, the organiser of the crime helped Josip's family in various ways, probably in an attempt to atone for what he had done. Because my late father Ivan personally received this help, until his death he could not accept that his immediate neighbour had organised the murder of his father—my grandfather Josip—nor could he believe the eyewitness account of the event.\n\nAfter the war, a story spread that Josip had been killed by retreating ‘kamišari’, and during the period of the former state he was portrayed as a victim of the Ustaše. A memorial was erected to him in the village on the basis of that account, while his wife Anica never received the compensation to which she was entitled.\n\nOnly a little more than thirty years later, shortly before his death, did an eyewitness reveal the true circumstances of the event and the identity of the perpetrator.
