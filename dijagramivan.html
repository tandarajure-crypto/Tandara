P-1"],"relation":"nositelj prezimena u dijagramu","note":"Mijo Petrov, peti Petrov sin, koji se oženio Ružom nepoznatog prezimena, imao je samo kćer Matiju (1810.–). Mijo nije imao nasljednika loze.\n\nGodine 1819. obitelj Martina Tandare, Lovrina djeda, bila je u Zavelimu. Na tom su popisu navedeni Martinovi sinovi Ivan, Mijo i Grgo. Kad je 1835. godine izrađivan austrijski katastar, Martin Tandara pok. Petra upisan je kao posjednik nekretnina u Ričicama. Većina ričićkih plemena imala je u to vrijeme nekretnine u Ričicama, Zavelimu, Podbiloj i Viru. Navedena sela imala su zajedničku župu u Ričicama. Mnoge obitelji unutar jednog roda selile su se s jednog lokaliteta na drugi, čak i u samim Ričicama. Broj stanovnika je naglo rastao i tražili su se novi prostori za život. U tom kontekstu možemo razumjeti i prihvatiti činjenicu da je neka obitelj, ili njezin dio, u jednom popisu bila u Ričicama, a u sljedećem u Zavelimu ili obrnuto. Međutim, pouzdano se zna da se Grgo s djecom iz Zavelima vratio u Ričice i ondje nastavio život sa svojom obitelji.","kind":"node","hostCode":"2.3","branch":"Petrova grana","source":"box3d.html","inferred":[],"maritalStatus":"oženjen/udana","years":["1810","1819"],"parentCodes":["2.0"],"childCodes":["2.3-K1"]},{"code":"2.3-SP-1","name":"Ruža (prezime nije poznato)","qualifier":"","father":"","fatherCode":"","mother":"","spouses":[],"spouseCodes":["2.3"],"relation":"supruga nositelja zapisa 2.3","note":"Ukupno djece: 1.","kind":"spouse","hostCode":"2.3","branch":"Petrova grana","source":"box3d.html","inferred":[],"maritalStatus":"oženjen/udana","years":[],"parentCodes":[],"childCodes":["2.3-K1"]},{"code":"2.3-K1","name":"Matija Mijina","qualifier":"1810–","father":"Mijo Petrov","fatherCode":"","mother":"Ruža (prezŽivi potomak – privatni podaci)","spouses":[],"spouseCodes":[],"relation":"kći","note":"Osoba je evidentirana u proširenom obiteljskom zapisu.","kind":"virtual","hostCode":"2.3","branch":"Petrova grana","source":"box3d.html","inferr ovrin","fatherCode":"","mother":"Pera Budimir","spouses":["Pera Matišić","nepoznato ime rođ. Budić","Joza rođ. Dragun"],"spouseCodes":["3.1.1.2.4-SP-1","3.1.1.2.4-SP-2","3.1.1.2.4-SP-3"],"relation":"nositelj prezimena u dijagramu","note":"Bio je deveti sin Križana Lovrina i ženio se tri puta. Bio je rekorder po broju brakova među Tandarama.\n\nU prvom braku bio je oženjen Perom Matišić, koja je bila iz kuće poznate hrvatske glazbene obitelji Matišić. Iz tog braka dobio je sina Josipa. Pera je umrla 1919. godine od španjolske gripe, koju su u narodu nazivali „grla”. Drugi je brak bio s djevojkom iz obitelji Budić. Imali su sina Martina, koji je poginuo 1942. godine kod Bihaća. Treći brak bio je s Jozom Dragun, bez djece.","kind":"node","hostCode":"3.1.1.2.4","branch":"Antina grana","source":"box3e.html","inferred":[],"maritalStatus":"oženjen/udana","years":["1919","1942"],"parentCodes":["3.1.1.2","3.1.1.2-SP-1"],"childCodes":["3.1.1.2.4.1","3.1.1.2.4-S1"]},{"code":"3.1.1.2.4.1","name":"Josip Jurin","qualifier":"★ 1911 – ✝ 1946","father":"Jure Križanov","fatherCode":"","mother":"Pera Matišić","spouses":["Anica Dragun"],"spouseCodes":["3.1.1.2.4.1-SP-1"],"relation":"nositelj prezimena u dijagramu","note":"Josip je bio u braku s Anicom, rođ. Dragun, s kojom je imao sinove Živi potomak – privatni podaci i Milana te kćeri Slavu (1935.–1977.), Maru (1936.–2012.), Nedu (1939.–2025.) i Matiju (1940.–). Obitelj je živjela u Zavelimu, gdje je Josip bio poznat kao vrijedan i pošten čovjek, duboko vezan uz svoj kraj i zajednicu.\n\nGodine 1946. Josip je tragično izgubio život u okolnostima koje su još desetljećima poslije ostale prikrivene velom tajne. Ubijen je iznad zadruge u Zavelimu, a prema naknadno otkrivenim svjedočenjima, zločin je počinio brat njihova prvog susjeda, koji je bio organizator zločina i djelovao iz osobne koristi.\n\nTakođer treba istaknuti da je organizator zločina nakon toga tragičnog događaja na različite načine pomagao Josipovoj obitelji, vjerojatno pokušavajući iskupiti se za počinjeno nedjelo. Budući da je moj pokojni otac Ivan osobno primao njegovu pomoć, sve do svoje smrti nije mogao prihvatiti činjenicu da je upravo njegov prvi susjed organizirao ubojstvo njegova oca, mojega djeda Josipa, niti je mogao povjerovati svjedočenju očevica toga događaja.\n\nNakon rata proširila se priča da su Josipa ubili kamišari u povlačenju, pa je u razdoblju bivše države bio prikazivan kao žrtva ustaša. Na temelju te verzije podignut mu je i spomenik u mjestu, dok njegova supruga Anica nikada nije ostvarila pripadajuću odštetu.\n\nTek nešto više od trideset godina poslije očevidac je, neposredno prije svoje smrti, otkrio stvarne okolnosti događaja i identitet počinitelja. Prema njegovu svjedočenju, izvršitelj ubojstva poginuo je 1963. godine u Njemačkoj, dok je organizator preminuo 1990. godine nakon duge i teške bolesti.\n\nUnatoč svemu, nikada nije pokrenuta istraga niti je provedeno sudsko procesuiranje, pa je ova tragedija ostala bez pravnih sankcija.\n\nVažno je istaknuti da današnje generacije obiju obitelji žive u potpuno drukčijem vremenu i okolnostima. Između naše obitelji i potomaka počinitelja zločina nema nikakve zle krvi. Naprotiv, njegujemo dobre i prijateljske odnose, bez tereta prošlosti te bez osjećaja krivnje ili odgovornosti za postupke naših davno preminulih predaka.\n\nOvaj zapis služi isključivo kao povijesna bilješka u rodoslovlju, uz poštovanje prema istini te prema svim osobama i nasljednicima obiteljskih loza koji danas žive.","kind":"node","hostCode":"3.1.1.2.4.1","branch":"Antina grana","source":"box3e.html","inferred":[],"maritalStatus":"oženjen/udana","years":["1911","1946"],"parentCodes":["3.1.1.2.4-SP-1","3.1.1.2.4"],"childCodes":["3.1.1.2.4.1.1","3.1.1.2.4.1.2","3.1.1.2.4.1-S1","3.1.1.2.4.1-K1","3.1.1.2.4.1-K2","3.1.1.2.4.1-K3","3.1.1.2.4.1-K4","3.1.1.2.4.1-K5"]},{"code":"3.1.1.2.4.1.1","name":"Ivan Josipov","qualifier":"★ 1933 – ✝ 2025","father":"Josip Jurin","fatherCode":"","mother":"Anica Dra
