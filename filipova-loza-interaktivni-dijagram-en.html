const UI = {"lang":"en","title":"Filip’s complete branch","description":"Complete clickable interactive family tree of Filip’s Livno branch of the Tandara family.","back":"← Filip’s branch","back_href":"filipovagrana-en.html#filip-diagram","other_href":"filipovagrana.html#filipov-dijagram","subtitle":"{count} numbered people · {generations} displayed generations · click a person to open the full record","expand":"Expand all","collapse":"Collapse","three":"First 3 generations","fit":"Fit","search_ph":"Name, number, spouse or place…","find":"Find","aria":"Interactive family tree of Filip’s branch","close":"Close","code":"Number","section":"Section","open":"Open the related page","no_details":"No additional description is available for this person.","not_found":"No results for: ","root_legend":"Filip Tandara","sons_legend":"Filip’s sons","desc_legend":"Descendants","help":"Mouse wheel: zoom · drag: move · click a box: details and branching","toggle_open":"Show descendants","toggle_close":"Hide descendants","lang_label":"Change language","hr_title":"Hrvatski","en_title":"English","default_section":"The fifth branch of the Tandara family – Filip’s Livno line","locale":"en"};
const svg=document.getElementById('treeSvg');
const viewport=document.getElementById('viewport');
const linksLayer=document.getElementById('links');
const nodesLayer=document.getElementById('nodes');
const details=document.getElementById('details');
const detailPage=document.getElementById('detailPage');
const statusBox=document.getElementById('status');
const BOX_W=326,BOX_H=78,X_STEP=366,ROW_STEP=96,MARGIN=54;
let scale=1,panX=20,panY=20,selectedCode=null,matchCode=null,dragging=false,dragStart=null,bounds={width:1000,height:700};
function walk(node,cb,parent=null,depth=0){cb(node,parent,depth);(node.children||[]).forEach(ch=>walk(ch,cb,node,depth+1));}
function findNode(code){let result=null;walk(DATA,n=>{if(n.code===code)result=n});return result;}
function setExpandedToDepth(maxDepth){walk(DATA,(n,p,d)=>{n.expanded=d<maxDepth});}
function visibleChildren(node){return node.expanded?(node.children||[]):[];}
function computeLayout(){
  const positions=new Map();let leafIndex=0,maxDepth=0,maxY=0;
  function place(node,depth,parent=null){
    maxDepth=Math.max(maxDepth,depth);const children=visibleChildren(node);let y;
    if(children.length){const ys=children.map(ch=>place(ch,depth+1,node));y=(ys[0]+ys[ys.length-1])/2;}else{y=leafIndex*ROW_STEP;leafIndex++;}
    positions.set(node.code,{x:MARGIN+depth*X_STEP,y:MARGIN+y,node,parent,depth});maxY=Math.max(maxY,y);return y;
  }
  place(DATA,0,null);
  bounds.width=MARGIN*2+maxDepth*X_STEP+BOX_W;
  bounds.height=MARGIN*2+Math.max(maxY+BOX_H,BOX_H);
  return positions;
}
function colors(depth){if(depth===0)return{fill:'#174f39',text:'#fff',stroke:'#0d3425'};if(depth===1)return{fill:'#e8f2fb',text:'#173a57',stroke:'#4d82aa'};return{fill:'#fff1df',text:'#553719',stroke:'#bb8144'};}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function wrapText(text,max=38){const words=String(text).split(/\s+/),lines=[];let line='';for(const word of words){const test=(line+' '+word).trim();if(test.length>max&&line){lines.push(line);line=word}else line=test;}if(line)lines.push(line);if(lines.length>2){const rest=lines.slice(1).join(' ');lines[1]=rest.length>max?rest.slice(0,max-1)+'…':rest;}return lines.slice(0,2);}
function render(){
  const pos=computeLayout();let links='';
  for(const p of pos.values()){if(!p.parent||!pos.has(p.parent.code))continue;const parent=pos.get(p.parent.code);const x1=parent.x+BOX_W,y1=parent.y+BOX_H/2,x2=p.x,y2=p.y+BOX_H/2,mid=x1+(x2-x1)/2;links+=`<path class="connector" d="M${x1},${y1} H${mid} V${y2} H${x2}"/>`;}
  linksLayer.innerHTML=links;let markup='';
  for(const p of pos.values()){const n=p.node,c=colors(p.depth),lines=wrapText(n.label),has=(n.children||[]).length>0,indicator=has?(n.expanded?'−':'+'):'';const cls=['node'];if(n.code===selectedCode)cls.push('selected');if(n.code===matchCode)cls.push('match');const toggleLabel=n.expanded?UI.toggle_close:UI.toggle_open;
    markup+=`<g class="${cls.join(' ')}" data-code="${esc(n.code)}" transform="translate(${p.x},${p.y})" role="button" tabindex="0" aria-label="${esc(n.label)}${has?', '+toggleLabel:''}">
      <rect class="main" width="${BOX_W}" height="${BOX_H}" rx="10" fill="${c.fill}" stroke="${c.stroke}"></rect>
      <text class="code" x="14" y="20" fill="${c.text}">${esc(n.code)}</text>
      ${lines.map((line,i)=>`<text class="label" x="14" y="${46+i*18}" fill="${c.text}">${esc(line)}</text>`).join('')}
      ${has?`<circle class="toggle-circle" cx="${BOX_W-20}" cy="20" r="12" stroke="${c.stroke}"></circle><text class="toggle-symbol" x="${BOX_W-20}" y="25" text-anchor="middle" fill="${c.stroke}">${indicator}</text>`:''}
    </g>`;
  }
  nodesLayer.innerHTML=markup;const loading=document.getElementById('treeLoading');if(loading)loading.remove();
  nodesLayer.querySelectorAll('.node').forEach(g=>{
    const activate=()=>{const n=findNode(g.dataset.code);selectedCode=n.code;showDetails(n);if((n.children||[]).length)n.expanded=!n.expanded;render();};
    g.addEventListener('click',e=>{e.stopPropagation();activate()});
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}});
  });
  applyTransform();
}
function showDetails(n){document.getElementById('detailTitle').textContent=n.label;document.getElementById('detailCode').textContent=UI.code+' '+n.code;document.getElementById('detailSection').textContent=UI.section+': '+n.section;document.getElementById('detailText').textContent=n.detail||UI.no_details;if(n.page){detailPage.href=n.page;detailPage.classList.add('visible')}else{detailPage.removeAttribute('href');detailPage.classList.remove('visible')}details.classList.add('open');}
function applyTransform(){viewport.setAttribute('transform',`translate(${panX},${panY}) scale(${scale})`);}
function fitTree(){const r=svg.getBoundingClientRect();if(!r.width||!r.height)return;scale=Math.max(.12,Math.min((r.width-46)/bounds.width,(r.height-46)/bounds.height,1.15));panX=(r.width-bounds.width*scale)/2;panY=(r.height-bounds.height*scale)/2;applyTransform();}
function zoomAt(factor,cx,cy){const old=scale;scale=Math.max(.12,Math.min(3.2,scale*factor));panX=cx-(cx-panX)*(scale/old);panY=cy-(cy-panY)*(scale/old);applyTransform();}
function expandAncestors(code){const parts=code.split('.');for(let i=2;i<parts.length;i++){const n=findNode(parts.slice(0,i).join('.'));if(n)n.expanded=true;}}
function centerNode(code){requestAnimationFrame(()=>{const p=computeLayout().get(code);if(!p)return;const r=svg.getBoundingClientRect();panX=r.width/2-(p.x+BOX_W/2)*scale;panY=r.height/2-(p.y+BOX_H/2)*scale;applyTransform();});}
function flashStatus(text){statusBox.textContent=text;statusBox.classList.add('show');setTimeout(()=>statusBox.classList.remove('show'),2200);}
function searchTree(){const input=document.getElementById('search'),q=input.value.trim().toLocaleLowerCase(UI.locale);if(!q)return;let found=null;walk(DATA,n=>{const hay=(n.code+' '+n.label+' '+n.detail+' '+n.section).toLocaleLowerCase(UI.locale);if(!found&&hay.includes(q))found=n});if(!found){flashStatus(UI.not_found+input.value.trim());return;}expandAncestors(found.code);selectedCode=found.code;matchCode=found.code;render();showDetails(found);centerNode(found.code);}
document.getElementById('expandAll').addEventListener('click',()=>{walk(DATA,n=>n.expanded=true);render();fitTree()});
document.getElementById('collapse').addEventListener('click',()=>{walk(DATA,n=>n.expanded=false);DATA.expanded=true;render();fitTree()});
document.getElementById('threeLevels').addEventListener('click',()=>{setExpandedToDepth(3);render();fitTree()});
document.getElementById('fit').addEventListener('click',fitTree);
document.getElementById('zoomIn').addEventListener('click',()=>zoomAt(1.22,svg.clientWidth/2,svg.clientHeight/2));
document.getElementById('zoomOut').addEventListener('click',()=>zoomAt(.82,svg.clientWidth/2,svg.clientHeight/2));
document.getElementById('findBtn').addEventListener('click',searchTree);
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchTree()});
document.getElementById('closeDetails').addEventListener('click',()=>details.classList.remove('open'));
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.node'))return;dragging=true;svg.classList.add('dragging');svg.setPointerCapture(e.pointerId);dragStart={x:e.clientX,y:e.clientY,panX,panY}});
svg.addEventListener('pointermove',e=>{if(!dragging)return;panX=dragStart.panX+(e.clientX-dragStart.x);panY=dragStart.panY+(e.clientY-dragStart.y);applyTransform()});
function endDrag(){dragging=false;svg.classList.remove('dragging')};svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',fitTree);
setExpandedToDepth(3);render();requestAnimationFrame(fitTree);
</script>
