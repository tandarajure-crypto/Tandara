<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complete Antina Branch</title>
<style>
:root{
  --green:#174f39; --paper:#fbfaf6; --ink:#22302a; --muted:#68736d;
  --blue-bg:#e8f2fb; --blue-line:#4d82aa; --orange-bg:#fff1df; --orange-line:#bb8144;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--paper)}
body{overflow:hidden}
header{
  height:92px;display:flex;align-items:center;gap:22px;padding:12px 18px;
  background:#fff;border-bottom:1px solid #dcded9;box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.title-wrap{min-width:285px}
h1{font-size:23px;margin:0 0 4px;color:var(--green)}
.subtitle{font-size:13px;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
button,input{
  border:1px solid #c9cec9;border-radius:8px;background:#fff;color:#26342e;
  padding:8px 10px;font-size:13px;
}
button{cursor:pointer}
button:hover{background:#f0f4f1}
button.primary{background:var(--green);color:#fff;border-color:var(--green)}
.search-wrap{display:flex;gap:6px}
#search{width:240px}
#workspace{position:relative;height:calc(100% - 92px);overflow:hidden}
#treeSvg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#treeSvg.dragging{cursor:grabbing}
.connector{fill:none;stroke:#a9ada8;stroke-width:2}
.node rect{stroke-width:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.07))}
.node text{pointer-events:none}
.node .code{font-size:12px;font-weight:700;letter-spacing:.4px}
.node .label{font-size:14px;font-weight:600}
.node .hint{font-size:12px}
.node{cursor:pointer}
.node:hover rect{stroke-width:3}
.node.selected rect{stroke:#c63030!important;stroke-width:4}
.node.match rect{stroke:#be8b00!important;stroke-width:4}
#details{
  position:absolute;right:14px;top:14px;width:min(390px,calc(100% - 28px));max-height:calc(100% - 28px);
  overflow:auto;background:rgba(255,255,255,.97);border:1px solid #d3d7d2;border-radius:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.16);padding:16px;display:none
}
#details.open{display:block}
#details h2{font-size:17px;margin:0 32px 3px 0;color:var(--green)}
#details .detail-code{font-size:12px;font-weight:700;color:#6c756f;margin-bottom:12px}
#details p{font-size:14px;line-height:1.5;white-space:pre-line;margin:0}
#closeDetails{position:absolute;right:10px;top:9px;border:0;background:transparent;font-size:20px;padding:3px 7px}
.legend{
  position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.94);border:1px solid #d3d7d2;
  border-radius:10px;padding:9px 12px;font-size:12px;display:flex;gap:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)
}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:14px;height:14px;border-radius:4px;border:2px solid}
.help{position:absolute;right:15px;bottom:12px;color:#6d756f;font-size:12px;background:rgba(251,250,246,.9);padding:4px 7px;border-radius:6px}
@media(max-width:900px){
  header{height:142px;align-items:flex-start;flex-direction:column;gap:8px}
  #workspace{height:calc(100% - 142px)}
  .title-wrap{min-width:0}
  #search{width:185px}
  .legend{display:none}
}
@media print{
  header,#details,.legend,.help{display:none!important}
  body{overflow:visible}
  #workspace{height:auto}
  #treeSvg{width:100%;height:auto}
}
</style>
</head>
<body>
<header>
  <div class="title-wrap">
    <h1>Complete Antina Branch</h1>

    <button class="primary" id="expandAll">Expand all</button>
    <button id="collapse">Collapse</button>

      <input id="search" type="search" placeholder="Name, code, nickname or place…">
      <button id="findBtn">Find</button>
    </div>
  </div>
</header>

<div id="workspace">

  <aside id="details">

  <div class="legend"><span><i class="swatch" style="background:#174f39;border-color:#0d3425"></i>Ante Ivanov</span><span><i class="swatch" style="background:#e8f2fb;border-color:#4d82aa"></i>First son Ante</span><span><i class="swatch" style="background:#fff1df;border-color:#bb8144"></i>Second son Filip</span></div>
  <div class="help">Mouse wheel: zoom · drag: move · click a node: details and branching</div>
</div>

<script>
const DATA = {"code":"3.0","label":"Ante Tandara – Ivanov (born c. 1735)","detail":"Ante Tandara was the third son of Ivan Tandara. Ante was approximately one year younger than Petar, which fits well with the known order of Ivan's children. He married Matija Brnas, with whom he had sons Ante, Filip and Pavle, and daughters Jaka, Luca and Ruža. Apart from the record of Pavle's birth, no other information about him is known, suggesting that he probably died very young or left Ričice before leaving any trace in the parish registers.\n\nAnte's family line remained closely connected to Ričice, where it developed most clearly during the 19th and 20th centuries. This branch produced the largest number of bearers of the Tandara surname, and Ante's line is therefore considered the most developed among Ivan's descendants. In later generations, individual members of this branch gradually began to move away—first to nearby settlements and later much farther, to various European Union countries, as well as Canada, the United States and Australia. Despite this worldwide dispersion, the original Ante line remained firmly rooted in Ričice, preserving continuity of family identity and the richest written record of its beginnings.","children":[{"code":"3.1","label":"Ante (1769.–1849.)","detail":"Ante, the eldest son of Ante Ivanov, married Matija Jukić in 1801. They had sons Lovro, Mijo and Petar, and daughters Pera, Ruža, Antica, Iva and Marija. No information about Petar is known apart from his birth record, so it is assumed that he died young or moved away from Zavelim. The family line was continued by the sons Lovro and Mijo. Mijo's descendants received the nickname Tucići, while Lovro's descendants through his son Marijan became known as Lovrinovići, and through his son Križan as Križanovići.\n\nAccording to the 1819 census, Ante lived in Zavelim, while his brother Filip lived in Ričice. Their descendants later spread throughout Croatia, Europe, the United States and Canada.","children":[{"code":"3.1.1","label":"Lovro Antin (1811.–1903.)","detail":"He married Matija Sičenica. They had sons Marijan and Križan.","children":[{"code":"3.1.1.1","label":"Marijan Lovrin (1836.–)","detail":"He married Matija Kovač. They had sons Jure, Marko, Stipan and Jozo, and daughters Iva, Mara and Matija. No information about Stipan is known apart from his birth, so it is assumed that he died young or moved away. Marijan's descendants, through his sons Marko and Jure, bear the nickname Lovrinovići, derived from Marijan's father Lovro. Today, the Lovrinovići live in Popovača, Sarajevo, Stobreč and London.","children":[{"code":"3.1.1.1.1","label":"Marko Marijanov (1869.–)","detail":"Marko married Božica Pušić. They had a son, Mirko, and a daughter, Iva.","children":[{"code":"3.1.1.1.1.1","label":"Mirko Markov (1901.–)","detail":"Mirko married Anica Kilić. They had sons Milan and Vladimir, who died at the age of 14, and daughters Dragica, Marija and Nediljka. The family moved to Popovača.","children":[{"code":"3.1.1.1.1.1.1","label":"Milan Mirkov (1939.–)","detail":"Milan married Svjetlana Trifunović. They had sons Vladimir and Dalibor. The family moved to Sarajevo.","children":[{"code":"3.1.1.1.1.1.1.1","label":"Vladimir Milanov (1969.–)","detail":"Vladimir married Claire Tacher, with whom he had a son, Alexander James (2010–), and a daughter, Sophie Elizabeth (2008–). The family moved to London, UK.","children":[]},{"code":"3.1.1.1.1.1.1.2","label":"Dalibor Milanov (1970.–)","detail":"Dalibor married Amela Nezirović. They had a son, Damir, and a daughter, Tea. The family moved to Sarajevo.","children":[]}]}]}]},{"code":"3.1.1.1.2","label":"Jozo Marijanov (1882.–1944.) – nickname Trošići","detail":"Jozo married Iva Kovač. They had sons Marijan and Luka.","children":[{"code":"3.1.1.1.2.1","label":"Marijan Jozin (1910.–1984.)","detail":"Marijan married Anica Budimir. They had sons Nikola and Jozo, who died at the age of six, and daughters Mara and Zorka.","children":[{"code":"3.1.1.1.2.1.1","label":"Nikola Marijanov (1939.–)","detail":"Nikola married Marija Lukić. They had a son, Vlade, and daughters Ana, Marijana and Radmila. The family moved to Stobreč.","children":[{"code":"3.1.1.1.2.1.1.1","label":"Vlade Nikolin (1970.–)","detail":"Vlade married Silvana Ruščić. They have a son, Franjo Josip (1995–), and a daughter, Tea (2000–). They live in Stobreč.","children":[]}]}]},{"code":"3.1.1.1.2.2","label":"Luka Jozin (1912.–1987.)","detail":"Luka married Anđa Kovač. They had daughters Iva, Mara and Zorka. He had no male descendants.","children":[]}]}]},{"code":"3.1.1.2","label":"Križan Lovrin (1843.–1910.)","detail":"He married Pera Budimir. They had 15 children, seven of whom died before the age of ten. An interesting fact is that his second son, Ilija, died after being gored by a bull. Križan's descendants, through his sons Mate, Ante, Ivan and Jure, bear the nickname Križanovići and live in Zagreb, Đakovo, Kutjevo, Bektež, Strizivojna, Vrpolje and several European countries.","children":[{"code":"3.1.1.2.1","label":"Mate Križanov (1866.–1948.)","detail":"The eldest son of Križan married Iva Pirić. They had sons Mijo, Marijan and Jozo, and daughters Mara and Matija. Mijo never married. The family moved to Bektež near Kutjevo.","children":[{"code":"3.1.1.2.1.1","label":"Marijan Matin (1902.–1974.)","detail":"Marijan married Anica Maras. They had sons Ante, Jozo, Mato and Ivan, and a daughter, Mara. Jozo never married. The family lives in Bektež near Kutjevo.","children":[{"code":"3.1.1.2.1.1.1","label":"Ante Marijanov (1934.–)","detail":"Ante Marijanov married twice. In his first marriage to Elizabeta Miletić, he had a son, Darko (1958–), and a daughter, Gordana. He had no children from his second marriage to Ana Kajtar. The family moved to Strizivojna.","children":[{"code":"3.1.1.2.1.1.1.1","label":"Darko Antin (1958.–)","detail":"Darko Antin married twice. From his first marriage to Angela, he has sons Mario (1982–) and Markus (1987–). From his second marriage to Suzana, he has a son, Klaus Ante (2006–). Darko and his family live in Germany.","children":[]}]},{"code":"3.1.1.2.1.1.2","label":"Mato Marijanov (1945.–)","detail":"In his marriage to Anica Bogdanović, he had a son, Alen (1969–), and a daughter, Laura. The family moved to Strizivojna.","children":[{"code":"3.1.1.2.1.1.2.1","label":"Alen Matin (1969.–)","detail":"Alen married Melita Pjela, with whom he had a son, Marin (1993–), and a daughter, Ena (1996–). The family lives in Strizivojna.","children":[]}]},{"code":"3.1.1.2.1.1.3","label":"Ivan Marijanov (1953.–)","detail":"As Marijan's fourth son, Ivan married Ljiljana Cobović. They had a son, Marijan, and daughters Lana and Paulina. They live in Đakovo, where Ivan runs his own law office.","children":[]}]},{"code":"3.1.1.2.1.2","label":"Jozo Matin (1904.–1944.)","detail":"The youngest son of Mate and Iva Pirić married Jaka Kilić. They had sons Mijo, Jozo and Ivan, and a daughter, Mara. Ivan never married. Jozo was killed in the Second World War, and Mijo's family now lives in Bektež near Kutjevo.","children":[{"code":"3.1.1.2.1.2.1","label":"Mijo Jozin (1940.–)","detail":"Mijo married Zorica, with whom he has three daughters: Marijana, Nikolina and a third daughter whose name is unknown. The family lives in Bektež near Kutjevo and produces wine. They are a well-known winemaking family with a wine brand bearing the same name—Tandara.","children":[]},{"code":"3.1.1.2.1.2.2","label":"Jozo Jozin (1943.–)","detail":"Jozo and his wife, whose name is unknown, had a son, Marijan, and a daughter, Romana. The family moved to Velenje, Slovenia.","children":[{"code":"3.1.1.2.1.2.2.1","label":"Marijan Jozin","detail":"Marijan and his wife Marinela have a son, Martin, and daughters Tamara and Petricija. The family lives in Velenje, Slovenia. The family has no male descendants to continue the line.","children":[]}]}]}]},{"code":"3.1.1.2.2","label":"Ante Križanov (1870.–1945.)","detail":"Križan's third son married Iva Trogrlić. They had a son, Stipan (1898–), and daughters Jela and Mara. After the First World War, Stipan moved to Serbia; it is not known whether he had descendants or what later happened to him. Anyone with information about this family is kindly asked to contact me through the contact form.","children":[]},{"code":"3.1.1.2.3","label":"Ivan Križanov (1881.–1920.)","detail":"Ivan was Križan's eighth son. He married Ruža Serdarušić, with whom he had sons Ante, who died at the age of five, Križan and Marijan, who died as a child, and daughters Mara and Ana.","children":[{"code":"3.1.1.2.3.1","label":"Križan Ivanov (1916.–1944.)","detail":"In his marriage to Marica Pušić, he had a son, Ivan. Križan was killed in Zagreb in 1944. The family lives in Vrpolje.","children":[{"code":"3.1.1.2.3.1.1","label":"Ivan Križanov (1938.–2007.)","detail":"He married twice. From his first marriage to Dragica Dragun, he had a son, Križan (1956–). From his second marriage to Anka Nikolić, he has daughters Biljana and Belina.","children":[{"code":"3.1.1.2.3.1.1.1","label":"Križan Ivanov (1956.–)","detail":"Križan and his wife Ljerka Maričić had sons Toni and Dinko. The family lives in Vrpolje.","children":[{"code":"3.1.1.2.3.1.1.1.1","label":"Toni Križanov (1979.–)","detail":"Toni and Nada Jergović had daughters Veronika and Magdalena, and a son, Filip (2010–). The family lives in Vrpolje.","children":[]}]}]}]}]},{"code":"3.1.1.2.4","label":"Jure Križanov (1883.–1947.) – nickname Đulko","detail":"He was Križan's ninth son and married three times, a record number of marriages among the Tandara family.\n\nHis first wife was Pera Matišić, who came from the family of the well-known Croatian musical family Matišić. They had a son, Josip. Pera died in 1919 from the Spanish flu, popularly known as Grla. His second marriage was to a woman from the Budić family. They had a son, Martin, who was killed near Bihać in 1942. His third marriage was to Joza Dragun, and they had no children.","children":[{"code":"3.1.1.2.4.1","label":"Josip Jurin (1911.–1946.)","detail":"In his marriage to Anica Dragun, he had sons Ivan and Milan, and daughters Slava, Mara, Neda and Maca. He was killed in 1946 above the cooperative in Zavelim. My grandfather Josip tragically lost his life in 1946 in circumstances that remained concealed for decades. He was killed by his closest neighbour, who, for personal gain, engaged his own brother to commit the crime. After the war, a story spread that my grandfather had been killed by retreating members of an armed group, and in the former state he was portrayed as a victim of the Ustaše and was given a memorial, while my grandmother never received the compensation to which she was entitled. Only thirty years later, shortly before his death, a witness revealed the true circumstances and the perpetrator to my grandmother. According to that account, the killer died in Germany in 1963, while the person who organised the murder died in agony from a serious illness in 1990. Unfortunately, no investigation or court proceedings were ever initiated, so this tragedy remained without legal consequences. It is important to emphasise that my family has very good relations with the killer's descendants and that there is no hostility between us today.","children":[{"code":"3.1.1.2.4.1.1","label":"Ivan Josipov (1933.–2025.)","detail":"He married twice. From his first marriage to Matija Pušić, he had sons Jure and Vladimir, and a daughter, Mihaela, baptised as Milena. He had no children from his second marriage to Verka Nikolovski. The family lives in Zagreb.","children":[{"code":"3.1.1.2.4.1.1.1","label":"Jure Ivanov (1956.–)","detail":"Jure and Ruža Kosić had sons Ivica Julio and Marin Tin. The family lives in Zagreb.","children":[{"code":"3.1.1.2.4.1.1.1.1","label":"Ivica Julio Jurin (1981.–)","detail":"Ivica Julio married Ana Mikuš, with whom he had a son, Vigo (2015–), and a daughter, Kaia (2018–).","children":[]},{"code":"3.1.1.2.4.1.1.1.2","label":"Marin Tin Jurin (1983.–)","detail":"Marin Tin married Ivana Kereta, with whom he had sons David (1917–) and Jakov (2019–), and a daughter, Laura (2023–).","children":[]}]},{"code":"3.1.1.2.4.1.1.2","label":"Vladimir Ivanov (1964.–)","detail":"Vladimir married Ljubica Kosić, with whom he has sons Filip and Leo. The family lives in Munich; Filip lives in Berlin and Leo in Vienna.","children":[]}]},{"code":"3.1.1.2.4.1.2","label":"Milan Josipov (1942.–2003.)","detail":"Milan married Slava Budimir, with whom he had sons Jozo and Ivan, and daughters Marija, Anka and Marina. The family lives in Posušje, while Ivan lives in Bielefeld, Germany.","children":[{"code":"3.1.1.2.4.1.2.1","label":"Jozo Milanov (1967.–)","detail":"Jozo married Vesna Matić, with whom he has a son, Martin, and daughters Slavica and Matea.","children":[{"code":"3.1.1.2.4.1.2.1.1","label":"Matea Jozina (1967.–)","detail":"Matea Jozina had a son, Toma. Toma took our surname, Tandara. This is the first case in the Tandara family in which a daughter continued her father's family line. The family lives in Posušje.","children":[]}]},{"code":"3.1.1.2.4.1.2.2","label":"Ivan Milanov (1974.–)","detail":"Ivan is married to Ružica Glavaš, with whom he has sons David and Milan, and a daughter, Natalija. The family lives in Bielefeld, Germany.","children":[{"code":"3.1.1.2.4.1.2.2.1","label":"David Ivanov (1995.–)","detail":"David is married to Liza Wormann, with whom he has a daughter, Ivana. The family lives in Bielefeld, Germany.","children":[]}]}]}]}]}]}]},{"code":"3.1.2","label":"Mijo Antin (1818.–1878.) – nickname Tucići","detail":"Mijo, Ante's second son, married Manda Martinović. They had nine children: sons Jozo, Ante, Mate, Mijo and Petar, and daughters Iva, Matija, Ruža and Antica.\n\nNo information about the son Mijo is known apart from his birth. It is assumed that he died young or moved away to an unknown destination. Descendants through the sons Jozo, Mate and Petar bear the nickname Tucići, which originated because members of the family were known for romantic adventures.","children":[{"code":"3.1.2.1","label":"Jozo Mijin (1851.–)","detail":"He married Iva Bilojelić. They had seven children: sons Ante, Jozo and Nikola, who died at the age of six, and daughters Matija, Jela, Mara and Iva. The son Jozo never married, and only Ante passed the surname on to descendants.","children":[{"code":"3.1.2.1.1","label":"Ante Jozin (1881.–1942.)","detail":"He married Jela Škorić. They had sons Marijan, Mate, Filip and Nikola, and daughters Jela, Mara, Kata and Mila. The family line was continued by the sons Marijan and Mijo.","children":[{"code":"3.1.2.1.1.1","label":"Marijan Antin (1908.–2003.) – nickname Đika","detail":"Marijan married Iva Čorbić. They had sons Ivan and Milan, and daughters Mara, Dragica, Kata and Marija.","children":[{"code":"3.1.2.1.1.1.1","label":"Ivan Marijanov (1939.–2024.)","detail":"He married Ana Pušić. They had a son, Zdenko (1966–), and a daughter, Kristina (1968–). The family lives in Zagreb.","children":[{"code":"3.1.2.1.1.1.1.1","label":"Zdenko Ivanov","detail":"Zdenko married twice. He has a son, Tomislav, from his first marriage and a daughter, Ana, from his second marriage to Kristina Topić.","children":[]}]},{"code":"3.1.2.1.1.1.2","label":"Milan Marijanov (1947.–)","detail":"He married twice. From his first marriage to Marija Pušić, he has a son, Nedjeljko, and daughters Dragica, Ljubica and Tanja. Milan has no children from his second marriage.","children":[{"code":"3.1.2.1.1.1.2.1","label":"Nedjeljko Milanov (1966.–)","detail":"Nedjeljko and his wife Ivana Božičević have daughters Marija and Tina. The family lives in Zagreb.","children":[]}]}]},{"code":"3.1.2.1.1.2","label":"Mijo Antin (1927.–)","detail":"Mijo, Ante's fourth son, married Maša Gudelj, with whom he had a son, Ante. The family lives in Zagreb.","children":[{"code":"3.1.2.1.1.2.1","label":"Ante Mijin (1953.–)","detail":"Ante married Renata Nagy, with whom he had a son, Ante. They live in Zagreb.","children":[{"code":"3.1.2.1.1.2.1.1","label":"Ante Antin (1978.–)","detail":"Ante married Valentina Juriša, with whom he had sons Ante and Luka. They live in Zagreb.","children":[]}]}]}]}]},{"code":"3.1.2.2","label":"Mate Mijin (1863.–1905.)","detail":"Mate married twice. In his first marriage to Tomica Kovač, he had a son, Ivan, who died as a child. In his second marriage to Iva Vlajčić, he had a daughter, Iva, and sons Martin and Jure. There is no information indicating that Martin married.","children":[{"code":"3.1.2.2.1","label":"Jure Matin (1905.–1974.) – nickname Đuka","detail":"Jure married Matija Škorić, with whom he had sons Ante and Mate, and daughters Mila, Stana and Iva.","children":[{"code":"3.1.2.2.1.1","label":"Ante Jurin (1933.–1999.)","detail":"Ante married Mila Đikić, with whom he had sons Ivan, who died in 2002, Milan and Srećko, and a daughter, Matija. The family moved to Đakovo.","children":[{"code":"3.1.2.2.1.1.1","label":"Milan Antin (1958.–1995.)","detail":"Milan married Marijana Erceg, with whom he had sons Ivan and Ante. The family lives in Đakovo.","children":[{"code":"3.1.2.2.1.1.1.1","label":"Ivan Milanov (1983.–)","detail":"Ivan married Sunčica Kraljević, with whom he had a son, Marin (2008–). The family lives in Đakovo.","children":[]},{"code":"3.1.2.2.1.1.1.2","label":"Ante Milanov (1985.–)","detail":"Ante married Ana Stipanović, with whom he had a son, Milan (2010–). The family lives in Đakovo.","children":[]}]},{"code":"3.1.2.2.1.1.2","label":"Srećko Antin (1959.–)","detail":"Srećko married Jaka Jurić, with whom he had sons Antonio (1995–) and Marko (1996–). The family lives in Đakovo.","children":[]}]},{"code":"3.1.2.2.1.2","label":"Mate Jurin (1935.–)","detail":"Mate married Danica Malenica, with whom he had a son, Tomislav, and daughters Marija, Mila and Ana. They live in Split, in Podstrana.","children":[{"code":"3.1.2.2.1.2.1","label":"Tomislav Matin (1968.–)","detail":"Tomis const svg = document.getElementById("treeSvg");
const viewport = document.getElementById("viewport");
const linksLayer = document.getElementById("links");
const nodesLayer = document.getElementById("nodes");
const details = document.getElementById("details");

const BOX_W = 286, BOX_H = 60, X_STEP = 315, ROW_STEP = 76, MARGIN = 46;
let scale = 1, panX = 20, panY = 20, selectedCode = null, matchCode = null;
let dragging = false, dragStart = null;
let bounds = {width:1000,height:800};

function walk(node, callback, parent=null, depth=0){
  callback(node,parent,depth);
  (node.children || []).forEach(child => walk(child,callback,node,depth+1));
}
function depthFromCode(code){ return code === "3.0" ? 0 : code.split(".").length - 1; }
function setExpandedToDepth(maxDepth){
  walk(DATA,(node,parent,depth)=>{ node.expanded = depth < maxDepth; });
}
function visibleNodes(){
  const result=[];
  function visit(node,parent=null,depth=0){
    result.push({node,parent,depth});
    if(node.expanded) (node.children||[]).forEach(child=>visit(child,node,depth+1));
  }
  visit(DATA);
  return result;
}
function colors(code){
  if(code==="3.0") return {fill:"#174f39",text:"#fff",stroke:"#0d3425"};
  if(code.startsWith("3.1")) return {fill:"#e8f2fb",text:"#173a57",stroke:"#4d82aa"};
  return {fill:"#fff1df",text:"#553719",stroke:"#bb8144"};
}
function wrapText(text,max=34){
  const words=text.split(/\s+/); const lines=[]; let line="";
  for(const word of words){
    const test=(line+" "+word).trim();
    if(test.length>max && line){ lines.push(line); line=word; }
    else line=test;
  }
  if(line) lines.push(line);
  if(lines.length>2) lines[1]=lines.slice(1).join(" ").slice(0,max-1)+"…";
  return lines.slice(0,2);
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function render(){
  const visible=visibleNodes();
  const pos=new Map();
  visible.forEach((item,index)=>{
    pos.set(item.node.code,{x:MARGIN+item.depth*X_STEP,y:MARGIN+index*ROW_STEP});
  });
  const maxDepth=Math.max(...visible.map(v=>v.depth),0);
  bounds.width=MARGIN*2+maxDepth*X_STEP+BOX_W;
  bounds.height=MARGIN*2+visible.length*ROW_STEP;

  let links="";
  visible.forEach(({node,parent})=>{
    if(!parent || !pos.has(parent.code)) return;
    const p=pos.get(parent.code), c=pos.get(node.code);
    const x1=p.x+BOX_W, y1=p.y+BOX_H/2, x2=c.x, y2=c.y+BOX_H/2;
    const elbow=x1+(x2-x1)/2;
    links += `<path class="connector" d="M${x1},${y1} H${elbow} V${y2} H${x2}"/>`;
  });
  linksLayer.innerHTML=links;

  let nodeMarkup="";
  visible.forEach(({node})=>{
    const p=pos.get(node.code), color=colors(node.code), lines=wrapText(node.label);
    const hasChildren=(node.children||[]).length>0;
    const indicator=hasChildren ? (node.expanded ? "−" : "+") : "";
    const classes=["node"];
    if(node.code===selectedCode) classes.push("selected");
    if(node.code===matchCode) classes.push("match");
    nodeMarkup += `<g class="${classes.join(" ")}" data-code="${esc(node.code)}" transform="translate(${p.x},${p.y})">
      <rect width="${BOX_W}" height="${BOX_H}" rx="9" fill="${color.fill}" stroke="${color.stroke}"></rect>
      <text class="code" x="13" y="18" fill="${color.text}">${esc(node.code)}</text>
      ${lines.map((line,i)=>`<text class="label" x="13" y="${38+i*16}" fill="${color.text}">${esc(line)}</text>`).join("")}
      ${hasChildren?`<circle cx="${BOX_W-18}" cy="18" r="11" fill="rgba(255,255,255,.72)" stroke="${color.stroke}"></circle>
      <text class="hint" x="${BOX_W-18}" y="22" text-anchor="middle" fill="${color.stroke}">${indicator}</text>`:""}
    </g>`;
  });
  nodesLayer.innerHTML=nodeMarkup;

  nodesLayer.querySelectorAll(".node").forEach(group=>{
    group.addEventListener("click",event=>{
      event.stopPropagation();
      const code=group.dataset.code;
      const node=findNode(code);
      selectedCode=code;
      showDetails(node);
      if((node.children||[]).length){
        node.expanded=!node.expanded;
      }
      render();
    });
  });
  applyTransform();
}
function findNode(code){
  let result=null;
  walk(DATA,node=>{ if(node.code===code) result=node; });
  return result;
}
function showDetails(node){
  document.getElementById("detailTitle").textContent=node.label;
  document.getElementById("detailCode").textContent="Code "+node.code;
  document.getElementById("detailText").textContent=node.detail || "No additional description for this person is available in the source HTML.";
  details.classList.add("open");
}
function applyTransform(){
  viewport.setAttribute("transform",`translate(${panX},${panY}) scale(${scale})`);
}
function fitTree(){
  const rect=svg.getBoundingClientRect();
  scale=Math.min((rect.width-50)/bounds.width,(rect.height-50)/bounds.height,1.15);
  panX=(rect.width-bounds.width*scale)/2;
  panY=(rect.height-bounds.height*scale)/2;
  applyTransform();
}
function zoomAt(factor,cx,cy){
  const old=scale;
  scale=Math.max(.12,Math.min(3,scale*factor));
  panX=cx-(cx-panX)*(scale/old);
  panY=cy-(cy-panY)*(scale/old);
  applyTransform();
}
function expandAncestors(code){
  const parts=code.split(".");
  DATA.expanded=true;
  for(let i=2;i<parts.length;i++){
    const ancestor=parts.slice(0,i).join(".");
    const node=findNode(ancestor);
    if(node) node.expanded=true;
  }
}
function search(){
  const q=document.getElementById("search").value.trim().toLocaleLowerCase("en");
  if(!q) return;
  let found=null;
  walk(DATA,node=>{
    const hay=(node.code+" "+node.label+" "+node.detail).toLocaleLowerCase("en");
    if(!found && hay.includes(q)) found=node;
  });
  if(!found){ alert("No results for: "+q); return; }
  expandAncestors(found.code);
  selectedCode=found.code; matchCode=found.code;
  render(); showDetails(found);
  requestAnimationFrame(()=>{
    const target=nodesLayer.querySelector(`[data-code="${CSS.escape(found.code)}"]`);
    if(target){
      const matrix=target.getCTM(), rect=svg.getBoundingClientRect();
      const tx=matrix.e+BOX_W*scale/2, ty=matrix.f+BOX_H*scale/2;
      panX += rect.width/2-tx;
      panY += rect.height/2-ty;
      applyTransform();
    }
  });
}
document.getElementById("expandAll").onclick=()=>{walk(DATA,n=>n.expanded=true);render();fitTree()};
document.getElementById("collapse").onclick=()=>{walk(DATA,n=>n.expanded=false);DATA.expanded=true;render();fitTree()};
document.getElementById("threeLevels").onclick=()=>{setExpandedToDepth(3);render();fitTree()};
document.getElementById("fit").onclick=fitTree;
document.getElementById("zoomIn").onclick=()=>zoomAt(1.22,svg.clientWidth/2,svg.clientHeight/2);
document.getElementById("zoomOut").onclick=()=>zoomAt(.82,svg.clientWidth/2,svg.clientHeight/2);
document.getElementById("findBtn").onclick=search;
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
document.getElementById("closeDetails").onclick=()=>details.classList.remove("open");

svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const rect=svg.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.12:.89,e.clientX-rect.left,e.clientY-rect.top);
},{passive:false});
svg.addEventListener("pointerdown",e=>{
  if(e.target.closest && e.target.closest(".node")) return;
  dragging=true; svg.classList.add("dragging"); svg.setPointerCapture(e.pointerId);
  dragStart={x:e.clientX,y:e.clientY,panX,panY};
});
svg.addEventListener("pointermove",e=>{
  if(!dragging) return;
  panX=dragStart.panX+(e.clientX-dragStart.x);
  panY=dragStart.panY+(e.clientY-dragStart.y);
  applyTransform();
});
svg.addEventListener("pointerup",()=>{dragging=false;svg.classList.remove("dragging")});
window.addEventListener("resize",fitTree);

setExpandedToDepth(3);
render();
requestAnimationFrame(fitTree);
</script>
</body>
</html>
