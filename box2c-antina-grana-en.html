<script>
const DATA = {"code":"3.0","detail":"Ante Tandara was Ivan Tandara's third son. Ante was about a year younger than Petar, which fits well with the known birth order of Ivan's children. He married Matija Brnas, with whom he had three sons, Ante, Filip and Pavao (1777–), and three daughters, Jaka (1771–), Luca and Ruža. Apart from the record of Pavao's birth, no other information about him has been found, suggesting that he probably died at a very young age or left Ričice before leaving any trace in the parish registers.\n\nAnte's line remained firmly connected to Ričice, where it developed most clearly during the nineteenth and twentieth centuries. This family nucleus produced the largest number of people bearing the Tandara surname, and Ante's line is therefore regarded as the most extensive among Ivan's descendants. In later generations, some members of this branch gradually began to move away—first to nearby settlements and later much farther afield, to various European Union countries, as well as Canada, the United States and Australia. Despite this worldwide dispersal, the original Ante line remained deeply rooted in Ričice, preserving the continuity of family identity and the richest written record of its beginnings.","children":[{"code":"3.1","detail":"As the eldest son of Ante Ivanov, Ante married Matija Jukić in 1801. They had three sons, Lovro, Mijo and Petar (1821–), and six daughters, Pera (1802–), Ruža (1804–), Antica (1807–), Iva (1808–), a second daughter named Antica (1814–), and Marija (1823–). No information about Petar has been found apart from his birth record, so it is assumed that he died young or moved away from Zavelim. The family line was continued by the sons Lovro and Mijo. Mijo's descendants became known by the family nickname Tucići, while Lovro's descendants through his son Marijan became known as Lovrinovići, and those through his son Križan as Križanovići.\n\nAccording to the 1819 census, Ante lived in Zavelim, while his brother Filip lived in Ričice. Their descendants later spread throughout Croatia and Europe, as well as to the United States and Canada.","children":[{"code":"3.1.1","detail":"He married Matija Sičenica. They had two sons, Marijan and Križan.","children":[{"code":"3.1.1.1","detail":"He married Matija Kovač. They had four sons, Jure (1867–), Marko, Stipan (1873–) and Jozo, and three daughters, Iva (–1869), Mara (1871–1872) and Matija (1880–1880). No information about Stipan has been found apart from his birth record, so it is assumed that he died young or moved away. Marijan's descendants through his sons Marko and Jure bear the family nickname Lovrinovići, derived from the name of Marijan's father, Lovro. Today, members of the Lovrinovići family live in Popovača, Sarajevo, Stobreč and London.","children":[{"code":"3.1.1.1.1","detail":"Marko married Božica Pušić. They had a son, Mirko, and a daughter, Iva (1897–).","children":[{"code":"3.1.1.1.1.1","detail":"Mirko married Anica Kilić. They had two sons, Milan and Vladimir (1948–1962), and three daughters, Dragica (1934–), Marija (1936–) and Nediljka (1938–). The family moved to Popovača.","children":[{"code":"3.1.1.1.1.1.1","detail":"Milan married Svjetlana Trifunović. They had two sons, Vladimir and Dalibor. The family moved to Sarajevo.","children":[{"code":"3.1.1.1.1.1.1.1","detail":"Vladimir married Claire Tacher, with whom he had a son, Alexander James (2010–), and a daughter, Sophie Elizabeth (2008–). The family moved to London in the United Kingdom.","children":[],"label":"Vladimir Milanov (★ 1969 – ✝ unknown)"},{"code":"3.1.1.1.1.1.1.2","detail":"Dalibor married Amela Nezirović. They had a son, Damir, and a daughter, Tea. The family moved to Sarajevo.","children":[],"label":"Dalibor Milanov (★ 1970 – ✝ unknown)"}],"label":"Milan Mirkov (★ 1939 – ✝ unknown)"}],"label":"Mirko Markov (★ 1901 – ✝ unknown)"}],"label":"Marko Marijanov (★ 1869 – ✝ unknown)"},{"code":"3.1.1.1.2","detail":"Jozo married Iva Kovač. They had two sons, Marijan and Luka.","children":[{"code":"3.1.1.1.2.1","detail":"Marijan married Anica Budimir. They had two sons, Nikola and Jozo (1942–1948), and two daughters, Mara (1937–) and Zorka (1942–).","children":[{"code":"3.1.1.1.2.1.1","detail":"Nikola married Marija Lukić. They had a son, Vlade, and three daughters, Ana (1964–), Marijana (1965–) and Radmila (1967–). The family moved to Stobreč.","children":[{"code":"3.1.1.1.2.1.1.1","detail":"Vlade married Silvana Ruščić. They have a son, Franjo Josip (1995–), and a daughter, Tea (2000–). They live in Stobreč.","children":[],"label":"Vlade Nikolin (★ 1970 – ✝ unknown)"}],"label":"Nikola Marijanov (★ 1939 – ✝ unknown)"}],"label":"Marijan Jozin (★ 1910 – ✝ 1984)"},{"code":"3.1.1.1.2.2","detail":"Luka married Anđa Kovač. They had three daughters, Iva (1963–), Mara (1967–) and Zorka (1969–). He had no male descendants.","children":[],"label":"Luka Jozin (★ 1912 – ✝ 1987)"}],"label":"Jozo Marijanov (★ 1882 – ✝ 1944) – family nickname Trošići"}],"label":"Marijan Lovrin (★ 1836 – ✝ unknown)"},{"code":"3.1.1.2","detail":"He married Pera Budimir, with whom he had fifteen children: ten sons—Mate, Ilija (1867–1875), Ante, Jakov (1871–1872), Marijan (1873–), Paško (–1886), Jozo (1877–), Ivan, Jure and Grgo (1887–)—and five daughters: Anica (–1869), Jakovica (1868–), a second daughter named Anica (1875–1877), Joza (–1895), and a third daughter named Anica (1879–). Seven of Križan's children died before the age of ten. One notable detail is that his second son, Ilija, died after being gored by a bull in 1875. Križan's descendants through his sons Mate, Ante, Ivan and Jure bear the family nickname Križanovići and live in Zagreb, Đakovo, Kutjevo, Bektež, Strizivojna and Vrpolje, as well as in several European countries.","children":[{"code":"3.1.1.2.1","detail":"Križan's eldest son, Mate, married Iva Pirić. They had three sons, Mijo (1894–1923), Marijan and Jozo, and two daughters, Mara (1938–) and Matija (1898–1906). Mijo never married. The family moved to Bektež near Kutjevo.","children":[{"code":"3.1.1.2.1.1","detail":"Marijan married Anica Maras. They had four sons, Ante, Jozo (1941–2002), Mate and Ivan, and a daughter, Mara (1938–). Jozo never married. The family lives in Bektež near Kutjevo.","children":[{"code":"3.1.1.2.1.1.1","detail":"Ante Marijanov married twice. In his first marriage, to Elizabeta Miletić, he had a son, Darko (1958–), and a daughter, Gordana (1960–). His second marriage, to Ana Kajtar, produced no children. The family moved to Strizivojna.","children":[{"code":"3.1.1.2.1.1.1.1","detail":"Darko Antin married twice. In his first marriage, to Angela, he has two sons, Mario (1982–) and Markus (1987–). In his second marriage, to Suzana, he has a son, Klaus Ante (2006–). Darko and his family live in Germany.","children":[],"label":"Darko Antin (★ 1958 – ✝ unknown)"}],"label":"Ante Marijanov (★ 1934 – ✝ unknown)"},{"code":"3.1.1.2.1.1.2","detail":"He and his wife Anica Bogdanović had a son, Alen (1969–), and a daughter, Laura (1976–). The family moved to Strizivojna.","children":[{"code":"3.1.1.2.1.1.2.1","detail":"Alen married Melita Pjela, with whom he had a son, Marin (1993–), and a daughter, Ena (1996–). The family lives in Strizivojna.","children":[],"label":"Alen Matin (★ 1969 – ✝ unknown)"}],"label":"Mato Marijanov (★ 1945 – ✝ unknown)"},{"code":"3.1.1.2.1.1.3","detail":"Marijan's fourth son, Ivan, married Ljiljana Cobović. They had a son, Marijan (1987–), and two daughters, Lana (1982–) and Paulina (1987–). They live in Đakovo, where Ivan runs his own law office.","children":[],"label":"Ivan Marijanov (★ 1953 – ✝ unknown)"}],"label":"Marijan Matin (★ 1902 – ✝ 1974)"},{"code":"3.1.1.2.1.2","detail":"The youngest son of Mate and Iva Pirić married Jaka Kilić. They had three sons, Mijo, Jozo and Ivan (1945–), and a daughter, Mara (1938–). Ivan never married. Jozo Matin was killed during the Second World War. Mijo's family now lives in Bektež near Kutjevo, while Jozo's family lives in Velenje, Slovenia.","children":[{"code":"3.1.1.2.1.2.1","detail":"Mijo married Zorica, with whom he has three daughters: Marijana, Nikolina, and a third daughter whose name is unknown. The family lives in Bektež near Kutjevo and is engaged in wine production. It is a well-known winemaking family with a wine brand bearing the Tandara name.","children":[],"label":"Mijo Jozin (★ 1940 – ✝ unknown)"},{"code":"3.1.1.2.1.2.2","detail":"Jozo and his wife, whose name is unknown, had a son, Marijan, and a daughter, Romana. The family moved to Velenje, Slovenia.","children":[{"code":"3.1.1.2.1.2.2.1","detail":"Marijan Jozin and his wife Marinela have a son, Martin, and two daughters, Tamara and Petricija. The family lives in Velenje, Slovenia.","children":[],"label":"Marijan Jozin"}],"label":"Jozo Jozin (★ 1943 – ✝ unknown)"}],"label":"Jozo Matin (★ 1904 – ✝ 1944)"}],"label":"Mate Križanov (★ 1866 – ✝ 1948)"},{"code":"3.1.1.2.2","detail":"Ante, the third son of Križan Lovrin, married Iva Trogrlić. They had a son, Stipan (1898–), and two daughters, Jela and Mara. Stipan moved to Serbia in 1915. It is not known whether he had descendants or what later became of him.","children":[],"label":"Ante Križanov (★ 1870 – ✝ 1945)"},{"code":"3.1.1.2.3","detail":"Ivan was Križan's eighth son. He married Ruža Serdarušić, with whom he had three sons, Ante (1911–1916), Križan and Marijan (1914–1916), who died as a child, and two daughters, Mara (1909–) and Ana.","children":[{"code":"3.1.1.2.3.1","detail":"He and Marica Pušić had a son, Ivan. Križan was killed in Zagreb in 1944. The family lives in Vrpolje.","children":[{"code":"3.1.1.2.3.1.1","detail":"Ivan Križanov married twice. From his first marriage, to Dragica Dragun, he had a son, Križan (1956–). In his second marriage, to Anka Nikolić, he has two daughters, Biljana (1963–) and Belina (1969–).","children":[{"code":"3.1.1.2.3.1.1.1","detail":"Križan and his wife Ljerka Maričić had two sons, Toni (1979–) and Dinko (1983–). The family lives in Vrpolje.","children":[{"code":"3.1.1.2.3.1.1.1.1","detail":"Toni and his wife Nada Jergović had two daughters, Veronika and Magdalena, and a son, Filip. The family lives in Vrpolje.","children":[],"label":"Toni Križanov (★ 1979 – ✝ unknown)"}],"label":"Križan Ivanov (★ 1956 – ✝ unknown)"}],"label":"Ivan Križanov (★ 1938 – ✝ 2007)"}],"label":"Križan Ivanov (★ 1916 – ✝ 1944)"}],"label":"Ivan Križanov (★ 1881 – ✝ 1920)"},{"code":"3.1.1.2.4","detail":"He was the ninth son of Križan Lovrin and married three times—the highest number of marriages recorded among the Tandaras.\n\nHis first wife was Pera Matišić, who came from the family of the renowned Croatian musical family Matišić. They had a son, Josip. Pera died in 1919 during the Spanish flu epidemic, which local people called ‘grla’. His second marriage was to a woman from the Budić family. They had a son, Martin, who was killed near Bihać in 1942. His third marriage was to Joza Dragun, and they had no children.","children":[{"code":"3.1.1.2.4.1","detail":"Genealogical Note on Josip and the Family Tragedy\n\nJosip was married to Anica, née Dragun, with whom he had two sons, Ivan and Milan, and four daughters, Slava (1935–1977), Mara (1936–2012), Neda (1939–2025) and Matija (1940–). The family lived in Zavelim, where Josip was known as a hardworking and honest man who was deeply attached to his home region and community.\n\nIn 1946, Josip tragically lost his life in circumstances that remained shrouded in secrecy for decades. He was killed above the cooperative building in Zavelim. According to testimony uncovered later, the crime was carried out by the brother of their immediate neighbour, while the neighbour himself organised the crime and acted for personal gain.\n\nIt should also be noted that, after this tragic event, the organiser of the crime helped Josip's family in various ways, probably in an attempt to atone for what he had done. Because my late father Ivan personally received this help, until his death he could not accept that his immediate neighbour had organised the murder of his father—my grandfather Josip—nor could he believe the eyewitness account of the event.\n\nAfter the war, a story spread that Josip had been killed by retreating ‘kamišari’, and during the period of the former state he was portrayed as a victim of the Ustaše. A memorial was erected to him in the village on the basis of that account, while his wife Anica never received the compensation to which she was entitled.\n\nOnly a little more than thirty years later, shortly before his death, did an eyewitness reveal the true circumstances of the event and the identity of the perpetrator. According to his testimony, the man who carried out the killing died in Germany in 1963, while the organiser died in 1990 after a long and serious illness.\n\nDespite everything, no investigation was ever opened and no judicial proceedings were conducted, so this tragedy remained without legal consequences.\n\nIt is important to emphasise that the present generations of both families live in entirely different times and circumstances. There is no ill will between our family and the descendants of those involved in the crime. On the contrary, we maintain good and friendly relations, free from the burden of the past and from any sense of guilt or responsibility for the actions of our long-deceased ancestors.\n\nThis account is included solely as a historical note within the family genealogy, with respect for the truth and for all living members and descendants of the family lines concerned.","children":[{"code":"3.1.1.2.4.1.1","detail":"He married twice. From his first marriage, to Matija Pušić, he had two sons, Jure and Vladimir, and a daughter, Mihaela (baptised as Milena). His second marriage, to Verka Nikolovski, produced no children. The family lives in Zagreb.","children":[{"code":"3.1.1.2.4.1.1.1","detail":"Jure and Ruža Kosić had two sons, Ivica Julio and Marin Tin. The family lives in Zagreb.","children":[{"code":"3.1.1.2.4.1.1.1.1","detail":"Ivica Julio married Ana Mikuš, with whom he had a son, Vigo (2015–), and a daughter, Kaia (2018–).","children":[],"label":"Ivica Julio Jurin (★ 1981 – ✝ unknown)"},{"code":"3.1.1.2.4.1.1.1.2","detail":"Marin Tin married Ivana Kereta, with whom he had two sons, David (2017–) and Jakov (2019–), and a daughter, Laura (2023–).","children":[],"label":"Marin Tin Jurin (★ 1983 – ✝ unknown)"}],"label":"Jure Ivanov (★ 1956 – ✝ unknown)"},{"code":"3.1.1.2.4.1.1.2","detail":"Vladimir married Ljubica Kosić, with whom he has two sons, Filip and Leo. The family lives in Munich. Filip lives in Berlin, while Leo lives in Vienna.","children":[],"label":"Vladimir Ivanov (★ 1964 – ✝ unknown)"}],"label":"Ivan Josipov (★ 1933 – ✝ 2025)"},{"code":"3.1.1.2.4.1.2","detail":"Milan married Slava Budimir, with whom he had two sons, Jozo and Ivan, and three daughters, Marija (1965–), Anka (1970–) and Marina (1973–). The family lives in Posušje. Ivan lives in Bielefeld, Germany.","children":[{"code":"3.1.1.2.4.1.2.1","detail":"Jozo married Vesna Matić, with whom he has a son, Martin, and two daughters, Slavica (1997–) and Matea.","children":[{"code":"3.1.1.2.4.1.2.1.1","detail":"Matea Jozina had a son, Toma. Toma took our family surname, Tandara. This is the first recorded case in the Tandara family in which a daughter continued her father's family line. The family lives in Posušje.","children":[],"label":"Matea Jozina (★ 1999 – ✝ unknown)"}],"label":"Jozo Milanov (★ 1967 – ✝ unknown)"},{"code":"3.1.1.2.4.1.2.2","detail":"Ivan is married to Ružica Glavaš, and they have two sons, David and Milan (2003–), and a daughter, Natalija (2000–). The family lives in Bielefeld, Germany.","children":[{"code":"3.1.1.2.4.1.2.2.1","detail":"David is married to Liza Wormann, and they have a daughter, Ivana. The family lives in Bielefeld, Germany.","children":[],"label":"David Ivanov (★ 1995 – ✝ unknown)"}],"label":"Ivan Milanov (★ 1974 – ✝ unknown)"}],"label":"Milan Josipov (★ 1942 – ✝ 2003)"},{"code":"3.1.1.2.4.1.3","detail":"Matija, known as Maca, was the daughter of Josip Tandara, son of Jure, and Anica, née Dragun. She married Ante Budimir, with whom she had four sons: Jozo, Ivica, Mirko and Mario. The family lives in Split.","children":[],"label":"Matija (Maca), daughter of Josip Tandara, married name Budimir (★ 1940 – ✝ unknown)"}],"label":"Josip Jurin (★ 1911 – ✝ 1946)"}],"label":"Jure Križanov (★ 1883 – ✝ 1947) – family nickname ĐULKO"}],"label":"Križan Lovrin (★ 1843 – ✝ 1910)"}],"label":"Lovro Antin (★ 1811 – ✝ 1903)"},{"code":"3.1.2","detail":"Mijo, Ante's second son, married Manda Martinović. They had nine children: five sons, Jozo, Ante (1852–), Mate, Mijo (1865–) and Petar, and four daughters, Iva (1856–), Matija (1858–), Ruža (1859–) and Antica (1861–).\n\nNo information about the son Mijo has been found apart from his birth record. It is assumed that he died young or moved away to an unknown destination. The descendants through the sons Jozo, Mate and Petar bear the family nickname Tucići, which arose because members of the family were known for their romantic adventures.","children":[{"code":"3.1.2.1","detail":"Jozo married Iva Bilojelić. They had seven children: three sons, Ante, Jozo (1884–) and Nikola (1889–1895), and four daughters, Matija (1880–), Jela (1885–), Mara (1895–) and Iva (1898–). The son Jozo never married, and Ante was the only one to pass the surname on to descendants.","children":[{"code":"3.1.2.1.1","detail":"He married Jela Škorić. They had four sons, Marijan, Mate (1920–), Pilip (1926–1926) and Mijo, and four daughters, Jela (1912–), Mara (1915–1915), Kata (1922–) and Mila (1925–). The family line was continued by the sons Marijan and Mijo.","children":[{"code":"3.1.2.1.1.1","detail":"Marijan married Iva Čorbić. They had two sons, Ivan and Milan, and four daughters, Mara (1935–), Dragica (1941–), Kata (1948–) and Marija (1951–).","children":[{"code":"3.1.2.1.1.1.1","detail":"Ivan married Ana Pušić. They had a son, Zdenko (1966–), and a daughter, Kristina (1968–). The family lives in Zagreb.","children":[{"code":"3.1.2.1.1.1.1.1","detail":"Zdenko married twice. He has a son, Tomislav, from his first marriage and a daughter, Ana, from his second marriage to Kristina Topić.","children":[],"label":"Zdenko Ivanov"}],"label":"Ivan Marijanov (★ 1939 – ✝ 2024)"},{"code":"3.1.2.1.1.1.2","detail":"He married twice. From his first marriage, to Marija Pušić, he has a son, Nedjeljko, and three daughters, Dragica (1968–), Ljubica (1970–) and Tanja (1971–). Milan has no children from his second marriage.","children":[{"code":"3.1.2.1.1.1.2.1","detail":"Nedjeljko and his wife Ivana Božičević have two daughters, Marija (1996–) and Tina (1998–). The family lives in Zagreb.","children":[],"label":"Nedjeljko Milanov (★ 1966 – ✝ unknown)"}],"label":"Milan Marijanov (★ 1947 – ✝ unknown)"}],"label":"Marijan Antin (★ 1908 – ✝ 2003) – family nickname Đika"},{"code":"3.1.2.1.1.2","detail":"Mijo, Ante's fourth son, married Maša Gudelj, with whom he had a son, Ante. The family lives in Zagreb.","children":[{"code":"3.1.2.1.1.2.1","detail":"Ante married Renata Nagy, with whom he had a son, Ante. They live in Zagreb.","children":[{"code":"3.1.2.1.1.2.1.1","detail":"Ante married Valentina Juriša, with whom he had two sons, Ante and Luka. They live in Zagreb.","children":[],"label":"Ante Antin (★ 1978 – ✝ unknown)"}],"label":"Ante Mijin (★ 1953 – ✝ unknown)"}],"label":"Mijo Antin (★ 1927 – ✝ unknown)"}],"label":"Ante Jozin (★ 1881 – ✝ 1942)"}],"label":"Jozo Mijin (★ 1851 – ✝ unknown)"},{"code":"3.1.2.2","detail":"Mate married twice. In his first marriage, to Tomica Kovač, he had a son, Ivan (1888–1895). In his second marriage, to Iva Vlajčić, he had a daughter, Iva (1897–1914), and two sons, Martin (–1927) and Jure. There is no information indicating whether Martin ever married.","children":[{"code":"3.1.2.2.1","detail":"Jure married Matija Škorić, with whom he had two sons   const wrap=frame.parentElement;
  if(layout){layout.style.maxWidth='none';layout.style.width='100%';layout.style.margin='0';layout.style.gap='0';layout.style.padding='0';}
  if(contentPage){contentPage.style.width='100%';contentPage.style.maxWidth='none';contentPage.style.minWidth='0';contentPage.style.padding='0';contentPage.style.justifyContent='stretch';}
  let leftPad=0,rightPad=0;
  if(card){
   const cardStyle=parentWin.getComputedStyle(card);
   leftPad=parseFloat(cardStyle.paddingLeft)||0;rightPad=parseFloat(cardStyle.paddingRight)||0;
   card.style.width='100%';card.style.maxWidth='none';card.style.margin='0';card.style.borderRadius='0';
  }
  if(wrap){wrap.style.maxWidth='none';wrap.style.width=`calc(100% + ${leftPad+rightPad}px)`;wrap.style.marginLeft=`-${leftPad}px`;wrap.style.marginRight=`-${rightPad}px`;wrap.style.marginTop='30px';wrap.style.marginBottom='0';}
  frame.style.display='block';frame.style.width='100%';frame.style.maxWidth='none';frame.style.margin='0';frame.style.borderLeft='0';frame.style.borderRight='0';frame.style.borderRadius='0';
 }catch(error){/* The standalone view remains fully functional. */}
}
function syncHeaderHeight(){const header=document.querySelector('header');if(header)document.documentElement.style.setProperty('--header-height',header.offsetHeight+'px');}
window.addEventListener('resize',()=>{syncHeaderHeight();expandEmbeddedDiagramArea();requestAnimationFrame(fitTree);});
expandEmbeddedDiagramArea();syncHeaderHeight();setExpandedToDepth(1);render();requestAnimationFrame(fitTree);
</script>
