<script>
const DATA = {"code":"3.0","detail":"Ante Tandara was Ivan Tandara's third son. Ante was about a year younger than Petar, which fits well with the known birth order of Ivan's children. He married Matija Brnas, with whom he had three sons, Ante, Filip and Pavao (1777–), and three daughters, Jaka (1771–), Luca and Ruža. Apart from the record of Pavao's birth, no other information about him has been found, suggesting that he probably died at a very young age or left Ričice before leaving any trace in the parish registers. Ante's line remained firmly connected to Ričice, where it developed most clearly during the nineteenth and twentieth centuries. This family nucleus produced the largest number of people bearing the Tandara surname, and Ante's line is therefore regarded as the most extensive among Ivan's descendants. In later generations, some members of this branch gradually began to move away—first to nearby settlements and later much farther afield, to various European Union countries, as well as Canada, the United States and Australia. Despite this worldwide dispersal, the original Ante line remained deeply rooted in Ričice, preserving the continuity of family identity and the richest written record of its beginnings.","children":[{"code":"3.1","detail":"As the eldest son of Ante Ivanov, Ante married Matija Jukić in 1801. They had three sons, Lovro, Mijo and Petar (1821–), and six daughters, Pera (1802–), Ruža (1804–), Antica (1807–), Iva (1808–), a second daughter named Antica (1814–), and Marija (1823–). No information about Petar has been found apart from his birth record, so it is assumed that he died young or moved away from Zavelim. The family line was continued by the sons Lovro and Mijo. Mijo's descendants became known by the family nickname TUCIĆI, while Lovro's descendants through his son Marijan became known as LOVRINOVIĆI, and those through his son Križan as KRIŽANOVIĆI. According to the 1819 census, Ante lived in Zavelim, while his brother Filip lived in Ričice. Their descendants later spread throughout Croatia and Europe, as well as to the United States and Canada.","children":[{"code":"3.1.1","detail":"He married Matija Sičenica. They had two sons, Marijan and Križan.","children":[{"code":"3.1.1.1","detail":"He married Matija Kovač. They had four sons, Jure (1867–), Marko, Stipan (1873–) and Jozo, and three daughters, Iva (–1869), Mara (1871–1872) and Matija (1880–1880). No information about Stipan has been found apart from his birth record, so it is assumed that he died young or moved away. Marijan's descendants through his sons Marko and Jure bear the family nickname LOVRINOVIĆI, derived from the name of Marijan's father, Lovro. Information about likely living family members has been moved to the private archive.","children":[{"code":"3.1.1.1.1","detail":"Marko married Božica Pušić. They had a son, Mirko, and a daughter, Iva (1897–).","children":[{"code":"3.1.1.1.1.1","detail":"Mirko married Anica Kilić. Their son Vladimir (1948–1962) died young. Information about likely living family members is kept in the private archive.","children":[{"code":"3.1.1.1.1.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[{"code":"3.1.1.1.1.1.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"},{"code":"3.1.1.1.1.1.1.2","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Living descendant – private data"}],"label":"Mirko Markov (★ 1901 – ✝ unknown)"}],"label":"Marko Marijanov (★ 1869 – ✝ unknown)"},{"code":"3.1.1.1.2","detail":"Jozo married Iva Kovač. They had two sons, Marijan and Luka.","children":[{"code":"3.1.1.1.2.1","detail":"Marijan married Anica Budimir. Their son Jozo (1942–1948) died as a child. Information about likely living family members is kept in the private archive.","children":[{"code":"3.1.1.1.2.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[{"code":"3.1.1.1.2.1.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Living descendant – private data"}],"label":"Marijan Jozin (★ 1910 – ✝ 1984)"},{"code":"3.1.1.1.2.2","detail":"Luka married Anđa Kovač. He had no male descendants. Information about likely living family members is kept in the private archive.","children":[],"label":"Luka Jozin (★ 1912 – ✝ 1987)"}],"label":"Jozo Marijanov (★ 1882 – ✝ 1944) – family nickname TROŠIĆI"}],"label":"Marijan Lovrin (★ 1836 – ✝ unknown)"},{"code":"3.1.1.2","detail":"He married Pera Budimir, with whom he had fifteen children: ten sons—Mate, Ilija (1867–1875), Ante, Jakov (1871–1872), Marijan (1873–), Paško (–1886), Jozo (1877–), Ivan, Jure and Grgo (1887–)—and five daughters: Anica (–1869), Jakovica (1868–), a second daughter named Anica (1875–1877), Joza (–1895), and a third daughter named Anica (1879–). Seven of Križan's children died before the age of ten. One notable detail is that his second son, Ilija, died after being gored by a bull in 1875. Information about likely living family members has been moved to the private archive.","children":[{"code":"3.1.1.2.1","detail":"Križan's eldest son, Mate, married Iva Pirić. They had three sons—Mijo (1894–1923), Marijan and Jozo—and a daughter, Matija (1898–1906). Mijo never married. The family moved to Bektež near Kutjevo. Information about likely living family members has been moved to the private archive.","children":[{"code":"3.1.1.2.1.1","detail":"Marijan married Anica Maras. Their son Jozo (1941–2002) never married. The family moved to Bektež near Kutjevo. Information about living family members is kept in the private archive.","children":[{"code":"3.1.1.2.1.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[{"code":"3.1.1.2.1.1.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Living descendant – private data"},{"code":"3.1.1.2.1.1.2","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[{"code":"3.1.1.2.1.1.2.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Living descendant – private data"},{"code":"3.1.1.2.1.1.3","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Marijan Matin (★ 1902 – ✝ 1974)"},{"code":"3.1.1.2.1.2","detail":"The youngest son of Mate and Iva Pirić married Jaka Kilić and had descendants. Jozo Matin was killed during the Second World War. Information about living family members is kept in the private archive.","children":[{"code":"3.1.1.2.1.2.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"},{"code":"3.1.1.2.1.2.2","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[{"code":"3.1.1.2.1.2.2.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Living descendant – private data"}],"label":"Jozo Matin (★ 1904 – ✝ 1944)"}],"label":"Mate Križanov (★ 1866 – ✝ 1948)"},{"code":"3.1.1.2.2","detail":"Ante, the third son of Križan Lovrin, married Iva Trogrlić. They had a son, Stipan (1898–), and two daughters, Jela and Mara. After the First World War, in 1918, Stipan moved to Serbia. It is not known whether he had descendants or what later became of him.","children":[],"label":"Ante Križanov (★ 1870 – ✝ 1945)"},{"code":"3.1.1.2.3","detail":"Ivan was Križan's eighth son. He married Ruža Serdarušić, with whom he had three sons, Ante (1911–1916), Križan and Marijan (1914–1916), who died as a child, and two daughters, Mara (1909–) and Ana.","children":[{"code":"3.1.1.2.3.1","detail":"Križan was killed in Zagreb in 1944. Information about likely living family members has been moved to the private archive.","children":[{"code":"3.1.1.2.3.1.1","detail":"Ivan Križanov married twice and had descendants. Information about likely living family members is kept in the private archive.","children":[{"code":"3.1.1.2.3.1.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[{"code":"3.1.1.2.3.1.1.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Living descendant – private data"}],"label":"Ivan Križanov (★ 1938 – ✝ 2007)"}],"label":"Križan Ivanov (★ 1916 – ✝ 1944)"}],"label":"Ivan Križanov (★ 1881 – ✝ 1920)"},{"code":"3.1.1.2.4","detail":"He was the ninth son of Križan Lovrin and married three times—the highest number of marriages recorded among the Tandaras. His first wife was Pera Matišić, who came from the family of the renowned Croatian musical family Matišić. They had a son, Josip. Pera died in 1919 during the Spanish flu epidemic, which local people called ‘grla’. His second marriage was to a woman from the Budić family. They had a son, Martin, who was killed near Bihać in 1942. His third marriage was to Joza Dragun, and they had no children.","children":[{"code":"3.1.1.2.4.1","detail":"Josip was married to Anica, née Dragun. The family lived in Zavelim. In 1946, Josip tragically lost his life in circumstances that remained shrouded in secrecy for decades. He was killed above the cooperative building in Zavelim. According to testimony uncovered later, the crime was carried out by the brother of their immediate neighbour, while the neighbour himself organised the crime and acted for personal gain. Only a little more than thirty years later, shortly before his death, did an eyewitness reveal the true circumstances of the event and the identity of the perpetrator. According to his testimony, the man who carried out the killing died in Germany in 1963, while the organiser died in 1990 after a long and serious illness. Despite everything, no investigation was ever opened and no judicial proceedings were conducted, so this tragedy remained without legal consequences. On the contrary, we maintain good and friendly relations, free from the burden of the past and from any sense of guilt or responsibility for the actions of our long-deceased ancestors. Information about likely living family members has been moved to the private archive.","children":[{"code":"3.1.1.2.4.1.1","detail":"Ivan Josipov lived from 1933 to 2025. He married twice and had descendants. Information about likely living family members is kept in the private archive.","children":[{"code":"3.1.1.2.4.1.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[{"code":"3.1.1.2.4.1.1.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"},{"code":"3.1.1.2.4.1.1.1.2","detail":"Information about this likely living family ive sons, Jozo, Ante (1852–), Mate, Mijo (1865–) and Petar, and four daughters, Iva (1856–), Matija (1858–), Ruža (1859–) and Antica (1861–). No information about the son Mijo has been found apart from his birth record. It is assumed that he died young or moved away to an unknown destination. The descendants through the sons Jozo, Mate and Petar bear the family nickname TUCIĆI, which arose because members of the family were known for their romantic adventures.","children":[{"code":"3.1.2.1","detail":"Jozo married Iva Bilojelić. They had seven children: three sons, Ante, Jozo (1884–) and Nikola (1889–1895), and four daughters, Matija (1880–), Jela (1885–), Mara (1895–) and Iva (1898–). The son Jozo never married, and Ante was the only one to pass the surname on to descendants.","children":[{"code":"3.1.2.1.1","detail":"He married Jela Škorić. They had four sons, Marijan, Mate (1920–), Pilip (1926–1926) and Mijo, and four daughters, Jela (1912–), Mara (1915–1915), Kata (1922–) and Mila (1925–). The family line was continued by the sons Marijan and Mijo.","children":[{"code":"3.1.2.1.1.1","detail":"Marijan married Iva Čorbić and had descendants. Information about likely living family members is kept in the private archive.","children":[{"code":"3.1.2.1.1.1.1","detail":"Ivan, son of Marijan, lived from 1939 to 2024. He was married and had descendants. Information about likely living family members is kept in the private archive.","children":[{"code":"3.1.2.1.1.1.1.1","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[],"label":"Living descendant – private data"}],"label":"Ivan Marijanov (★ 1939 – ✝ 2024)"},{"code":"3.1.2.1.1.1.2","detail":"Information about this likely living family member is available only to approved users of the private archive.","children":[{"code":"3.1.2.1.1.1.2.1","detail":"Information about this likely living family member is available only to approved users of the   if(card){
   const cardStyle=parentWin.getComputedStyle(card);
   leftPad=parseFloat(cardStyle.paddingLeft)||0;rightPad=parseFloat(cardStyle.paddingRight)||0;
   card.style.width='100%';card.style.maxWidth='none';card.style.margin='0';card.style.borderRadius='0';
  }
  if(wrap){wrap.style.maxWidth='none';wrap.style.width=`calc(100% + ${leftPad+rightPad}px)`;wrap.style.marginLeft=`-${leftPad}px`;wrap.style.marginRight=`-${rightPad}px`;wrap.style.marginTop='30px';wrap.style.marginBottom='0';}
  frame.style.display='block';frame.style.width='100%';frame.style.maxWidth='none';frame.style.margin='0';frame.style.borderLeft='0';frame.style.borderRight='0';frame.style.borderRadius='0';
 }catch(error){/* The standalone view remains fully functional. */}
}
function syncHeaderHeight(){const header=document.querySelector('header');if(header)document.documentElement.style.setProperty('--header-height',header.offsetHeight+'px');}
window.addEventListener('resize',()=>{syncHeaderHeight();expandEmbeddedDiagramArea();requestAnimationFrame(fitTree);});
expandEmbeddedDiagramArea();syncHeaderHeight();setExpandedToDepth(1);render();requestAnimationFrame(fitTree);
</script>
</body>
