<article>

<h1 data-hr="Tandara – Podrijetlo prezimena"
    data-en="Tandara – Origin of the Surname"></h1>

<p class="lead"
   data-hr="Prezime Tandara jedno je od najstarijih obiteljskih prezimena Imotske krajine u južnoj Hrvatskoj. Najraniji poznati zapis datira iz 1725. godine, dok je suvremeni oblik prezimena službeno zabilježen 1762. godine. Ovaj članak prikazuje povijesni razvoj prezimena i genealogiju obitelji Tandara."
   data-en="The Tandara surname is one of the oldest family names in the Imotski region of southern Croatia. The earliest known record dates from 1725, while the modern form was recorded in 1762. This article presents the historical development and genealogy of the Tandara family.">
</p>

<p data-hr="Prezime Tandara pripada starim obiteljima Imotske krajine i predstavlja važan dio hrvatske baštine."
   data-en="The surname Tandara belongs to old families of the Imotski region and represents an important part of Croatian heritage."></p>

<p data-hr="Njegovo oblikovanje bilo je povezano s promjenama nakon osmanske vlasti i dolaska Mlečana."
   data-en="Its formation was connected to changes after Ottoman rule and the arrival of the Venetian administration."></p>

<p data-hr="Istraživanje se temelji na radu Milana Lažete."
   data-en="The research is based on the work of Milan Lažeta."></p>

<h2 data-hr="Osmansko razdoblje (do 1717.)"
    data-en="Ottoman Period (until 1717)"></h2>

<p data-hr="Tijekom osmanske vlasti nisu postojala stalna prezimena."
   data-en="During Ottoman rule, permanent surnames did not exist."></p>

<p data-hr="Bilježila su se samo imena glava kućanstava."
   data-en="Only household heads and personal names were recorded."></p>

<h2 data-hr="Prvi tragovi obitelji (1725.)"
    data-en="First Records of the Family (1725)"></h2>

<p data-hr="Godine 1725. spominje se Ivan Tandarić koji dobiva zemlju u Ričicama."
   data-en="In 1725, Ivan Tandarić is mentioned as receiving land in Ričice."></p>

<p data-hr="Zemlja je bila raspršena što ukazuje na noviji dolazak obitelji."
   data-en="The land was scattered, suggesting a recent arrival of the family."></p>

<h2 data-hr="Mletačka uprava i standardizacija"
    data-en="Venetian Administration and Standardization"></h2>

<p data-hr="Uvedene su matične knjige i stalna prezimena."
   data-en="Church registers and permanent surnames were introduced."></p>

<p data-hr="Tandarić se postupno pretvara u oblik Tandara."
   data-en="The surname Tandarić gradually evolved into Tandara."></p>

<p data-hr="1762. godine pojavljuje se prvi zapis prezimena Tandara."
   data-en="In 1762, the surname Tandara first appears in records."></p>

<h2 data-hr="Moguće podrijetlo iz Ciste (1697.)"
    data-en="Possible Origin from Cista (1697)"></h2>

<p data-hr="Godine 1697. spominje se prezime Tandar u Cisti."
   data-en="In 1697, the surname Tandar is mentioned in Cista."></p>

<p data-hr="To može ukazivati na starije korijene obitelji."
   data-en="This may indicate older roots of the family."></p>

<h2 data-hr="Razvoj u 18. stoljeću"
    data-en="Development in the 18th Century"></h2>

<p data-hr="Obitelj se razvija i postaje stabilna u Ričicama."
   data-en="The family developed and became stable in Ričice."></p>

<p data-hr="1798. godine bilježi se veliko kućanstvo Mate Tandare."
   data-en="In 1798, a large household of Mato Tandara is recorded."></p>

<h2 data-hr="Zaključak"
    data-en="Conclusion"></h2>

<p data-hr="Prezime dobiva konačni oblik u 18. stoljeću."
   data-en="The surname took its final form in the 18th century."></p>

<p data-hr="Obitelj postaje važan dio lokalne povijesti Imotske krajine."
   data-en="The family became an important part of local Imotski history."></p>

<script>
function setLang(lang){
  document.querySelectorAll("[data-hr]").forEach(el=>{
    el.textContent = el.getAttribute("data-" + lang);
  });
  localStorage.setItem("lang", lang);
}

window.onload = function(){
  setLang(localStorage.getItem("lang") || "hr");
};
</script>
