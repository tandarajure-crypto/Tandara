name: German navigation browser verification
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'scripts/german-navigation-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    paths:
      - '*.html'
      - 'scripts/german-navigation-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  german-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: false
      - name: Checkout shared assets
        uses: actions/checkout@v4
        with:
          repository: tandarajure-crypto/tandara-common
          path: tandara-common
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test all 100 German navigation clicks
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          node site/scripts/german-navigation-smoke.mjs
